workflows:
  development:
    enabled: true
    triggers:
      - file_change
      - git_commit
      - manual
    tasks:
      - name: code_quality_check
        priority: high
      - name: security_scan
        priority: high
      - name: test_execution
        priority: medium
      - name: build_validation
        priority: medium
  deployment:
    enabled: true
    triggers:
      - git_push
      - tag_creation
      - manual
    tasks:
      - name: pre_deployment_checks
        priority: critical
      - name: build_application
        priority: high
      - name: run_tests
        priority: high
      - name: deploy_application
        priority: critical
  monitoring:
    enabled: true
    triggers:
      - schedule
      - threshold_breach
      - manual
    tasks:
      - name: health_check
        priority: high
      - name: performance_analysis
        priority: medium
      - name: security_audit
        priority: high
      - name: report_generation
        priority: low
automation:
  file_watching:
    enabled: true
    patterns:
      - src/**/*.{js,ts,jsx,tsx}
      - libs/**/*.{js,ts}
      - "*.config.{js,ts}"
    ignore:
      - node_modules/**
      - dist/**
      - build/**
  task_scheduling:
    enabled: true
    concurrent_limit: 5
    retry_attempts: 3
    timeout_minutes: 30
developer_experience:
  notifications:
    enabled: true
    channels:
      - console
      - desktop
    levels:
      - error
      - warning
      - success
  productivity_tracking:
    enabled: true
    metrics:
      - task_completion
      - automation_savings
      - error_reduction
