name: 🚀 CODAI Essential Services CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/id/**'
      - 'apps/gateway/**' 
      - 'apps/hub/**'
      - 'apps/memorai/**'
      - 'apps/bancai/**'
      - 'packages/memorai-mcp/**'
      - 'packages/cbd/**'
      - 'packages/shared-ui/**'
      - 'packages/api-utils/**'
      - 'contracts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/id/**'
      - 'apps/gateway/**'
      - 'apps/hub/**'
      - 'apps/memorai/**'
      - 'apps/bancai/**'
      - 'packages/memorai-mcp/**'
      - 'packages/cbd/**'
      - 'packages/shared-ui/**'
      - 'packages/api-utils/**'
      - 'contracts/**'

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8.15.6'
  CI_TIMEOUT: 10m

jobs:
  # Phase 1: Pre-checks and Setup (0-1 min)
  setup:
    name: 🔧 Setup and Validation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      has-changes: ${{ steps.changes.outputs.has-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed services
        id: changes
        run: |
          # Detect which services have changes
          services=()
          if git diff --name-only HEAD~1 | grep -q "apps/id/"; then services+=("identity"); fi
          if git diff --name-only HEAD~1 | grep -q "apps/gateway/"; then services+=("gateway"); fi
          if git diff --name-only HEAD~1 | grep -q "apps/hub/"; then services+=("hub"); fi
          if git diff --name-only HEAD~1 | grep -q "apps/memorai/"; then services+=("memorai"); fi
          if git diff --name-only HEAD~1 | grep -q "apps/bancai/"; then services+=("bancai"); fi
          if git diff --name-only HEAD~1 | grep -q "packages/memorai-mcp/"; then services+=("memorai-mcp"); fi
          if git diff --name-only HEAD~1 | grep -q "packages/cbd/"; then services+=("cbd"); fi
          
          # Always include shared packages if changed
          if git diff --name-only HEAD~1 | grep -q "packages/shared-ui/\|packages/api-utils/"; then
            services+=("identity" "gateway" "hub" "memorai" "bancai")
          fi
          
          # Remove duplicates and create matrix
          services=($(echo "${services[@]}" | tr ' ' '\n' | sort -u | tr '\n' ' '))
          
          if [ ${#services[@]} -eq 0 ]; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            echo "matrix={\"service\":[]}" >> $GITHUB_OUTPUT
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
            matrix=$(printf '%s\n' "${services[@]}" | jq -R . | jq -s .)
            echo "matrix={\"service\":$matrix}" >> $GITHUB_OUTPUT
          fi

  # Phase 2: Parallel Quality Checks (1-3 min)
  quality-checks:
    name: 📋 Quality Checks
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.has-changes == 'true'
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type checking
        run: |
          case "${{ matrix.service }}" in
            "identity") pnpm typecheck --filter id ;;
            "gateway") pnpm typecheck --filter gateway ;;
            "hub") pnpm typecheck --filter hub ;;
            "memorai") pnpm typecheck --filter memorai ;;
            "bancai") pnpm typecheck --filter bancai ;;
            "memorai-mcp") pnpm typecheck --filter '@codai/memorai-mcp' ;;
            "cbd") pnpm typecheck --filter '@codai/cbd' ;;
          esac

      - name: Lint
        run: |
          case "${{ matrix.service }}" in
            "identity") pnpm lint --filter id ;;
            "gateway") pnpm lint --filter gateway ;;
            "hub") pnpm lint --filter hub ;;
            "memorai") pnpm lint --filter memorai ;;
            "bancai") pnpm lint --filter bancai ;;
            "memorai-mcp") pnpm lint --filter '@codai/memorai-mcp' ;;
            "cbd") pnpm lint --filter '@codai/cbd' ;;
          esac

      - name: Contract validation
        run: |
          # Validate OpenAPI contracts
          if [ -f "contracts/${{ matrix.service }}.yaml" ]; then
            npx @apidevtools/swagger-parser validate "contracts/${{ matrix.service }}.yaml"
          fi

  # Phase 3: Security Scanning (2-4 min)
  security:
    name: 🔒 Security Scans
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.has-changes == 'true'
    timeout-minutes: 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate
        continue-on-error: true

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/javascript
            p/typescript
            p/nodejs
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: Secret scanning
        run: |
          # Check for secrets in code
          if command -v gitleaks &> /dev/null; then
            gitleaks detect --source . --verbose
          fi
        continue-on-error: true

  # Phase 4: Testing (3-7 min)
  test:
    name: 🧪 Test Suite
    runs-on: ubuntu-latest
    needs: [setup, quality-checks]
    if: needs.setup.outputs.has-changes == 'true'
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: |
          case "${{ matrix.service }}" in
            "identity") pnpm test:unit --filter id ;;
            "gateway") pnpm test:unit --filter gateway ;;
            "hub") pnpm test:unit --filter hub ;;
            "memorai") pnpm test:unit --filter memorai ;;
            "bancai") pnpm test:unit --filter bancai ;;
            "memorai-mcp") pnpm test:unit --filter '@codai/memorai-mcp' ;;
            "cbd") pnpm test:unit --filter '@codai/cbd' ;;
          esac
        env:
          NODE_ENV: test

      - name: Integration tests
        run: |
          case "${{ matrix.service }}" in
            "identity") pnpm test:integration --filter id ;;
            "gateway") pnpm test:integration --filter gateway ;;
            "hub") pnpm test:integration --filter hub ;;
            "memorai") pnpm test:integration --filter memorai ;;
            "bancai") pnpm test:integration --filter bancai ;;
            "memorai-mcp") pnpm test:integration --filter '@codai/memorai-mcp' ;;
            "cbd") pnpm test:integration --filter '@codai/cbd' ;;
          esac
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379

      - name: Contract tests
        run: |
          # Run contract tests against OpenAPI specifications
          case "${{ matrix.service }}" in
            "identity") 
              if [ -f "contracts/identity-service.yaml" ]; then
                pnpm test:contract --filter id
              fi
              ;;
            "gateway")
              if [ -f "contracts/api-gateway.yaml" ]; then
                pnpm test:contract --filter gateway
              fi
              ;;
            "memorai-mcp")
              if [ -f "contracts/memorai-mcp.yaml" ]; then
                pnpm test:contract --filter '@codai/memorai-mcp'
              fi
              ;;
          esac

      - name: Coverage report
        run: |
          case "${{ matrix.service }}" in
            "identity") pnpm test:coverage --filter id ;;
            "gateway") pnpm test:coverage --filter gateway ;;
            "hub") pnpm test:coverage --filter hub ;;
            "memorai") pnpm test:coverage --filter memorai ;;
            "bancai") pnpm test:coverage --filter bancai ;;
            "memorai-mcp") pnpm test:coverage --filter '@codai/memorai-mcp' ;;
            "cbd") pnpm test:coverage --filter '@codai/cbd' ;;
          esac

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage

  # Phase 5: Build and Container Creation (5-8 min)
  build:
    name: 🏗️ Build & Package
    runs-on: ubuntu-latest
    needs: [setup, quality-checks, security, test]
    if: needs.setup.outputs.has-changes == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          # Build shared packages first
          pnpm build:packages
          
          # Build specific service
          case "${{ matrix.service }}" in
            "identity") pnpm build --filter id ;;
            "gateway") pnpm build --filter gateway ;;
            "hub") pnpm build --filter hub ;;
            "memorai") pnpm build --filter memorai ;;
            "bancai") pnpm build --filter bancai ;;
            "memorai-mcp") pnpm build --filter '@codai/memorai-mcp' ;;
            "cbd") pnpm build --filter '@codai/cbd' ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/codai-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # Phase 6: E2E Testing (7-10 min)
  e2e:
    name: 🎯 End-to-End Tests
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.has-changes == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request')
    timeout-minutes: 4
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: e2e_password
          POSTGRES_USER: e2e_user
          POSTGRES_DB: e2e_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7.2-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build services for E2E
        run: |
          pnpm build:packages
          pnpm build --filter id --filter gateway --filter hub --filter '@codai/memorai-mcp'

      - name: Start essential services
        run: |
          # Start core services in background
          pnpm dev --filter id &
          pnpm dev --filter gateway &
          pnpm dev --filter '@codai/memorai-mcp' &
          
          # Wait for services to be ready
          sleep 30
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://e2e_user:e2e_password@localhost:5432/e2e_db
          REDIS_URL: redis://localhost:6379
          PORT_ID: 8100
          PORT_GATEWAY: 8010
          PORT_MCP: 4950

      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          BASE_URL: http://localhost:8010
          IDENTITY_URL: http://localhost:8100
          MCP_URL: http://localhost:4950

      - name: Upload Playwright report
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Phase 7: Deployment Preparation
  prepare-deploy:
    name: 🚀 Prepare Deployment
    runs-on: ubuntu-latest
    needs: [setup, build, e2e]
    if: needs.setup.outputs.has-changes == 'true' && success() && github.ref == 'refs/heads/main'
    timeout-minutes: 1
    
    outputs:
      deployment-ready: ${{ steps.check.outputs.ready }}
      services: ${{ needs.setup.outputs.matrix }}

    steps:
      - name: Check deployment readiness
        id: check
        run: |
          echo "ready=true" >> $GITHUB_OUTPUT
          echo "✅ All checks passed - deployment ready"

  # Summary Job
  ci-summary:
    name: 📊 CI Summary
    runs-on: ubuntu-latest
    needs: [setup, quality-checks, security, test, build, e2e, prepare-deploy]
    if: always() && needs.setup.outputs.has-changes == 'true'
    
    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 CODAI Essential Services CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Setup**: ${{ needs.setup.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Quality Checks**: ${{ needs.quality-checks.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Scans**: ${{ needs.security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build**: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **E2E Tests**: ${{ needs.e2e.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.prepare-deploy.outputs.deployment-ready }}" = "true" ]; then
            echo "🎉 **Deployment Ready**: All checks passed successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Deployment Blocked**: Some checks failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changed Services" >> $GITHUB_STEP_SUMMARY
          echo '${{ needs.setup.outputs.matrix }}' | jq -r '.service[]' | while read service; do
            echo "- $service" >> $GITHUB_STEP_SUMMARY
          done

      - name: Check overall status
        run: |
          if [[ "${{ needs.quality-checks.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "❌ Pipeline failed - blocking merge"
            exit 1
          else
            echo "✅ Pipeline succeeded - ready to merge"
          fi