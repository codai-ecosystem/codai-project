# RomAI Enhanced CI/CD Pipeline
# Extends existing romai-agi-deploy.yml with launcher requirements
# Total time target: <10 minutes

name: "🚀 RomAI Launcher CI/CD Pipeline"

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/romai/**'
      - '.github/workflows/romai-launcher-pipeline.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/romai/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment regardless of tests'
        required: false
        default: 'false'
        type: boolean

env:
  WORKING_DIRECTORY: apps/romai
  NODE_VERSION: 18.x
  PYTHON_VERSION: '3.11'
  COVERAGE_THRESHOLD: 80

jobs:
  # Phase 1: Install & Setup (Target: 1-2 minutes)
  setup:
    name: "📦 Install Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-hit }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/pnpm-lock.yaml
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.9
          
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.WORKING_DIRECTORY }}/node_modules
            ~/.cache/pnpm
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
            
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: pnpm install --frozen-lockfile

  # Phase 2: Build (Target: 2-3 minutes)  
  build:
    name: "🏗️ Build Application"
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/pnpm-lock.yaml
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.9
          
      - name: Restore dependencies
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.WORKING_DIRECTORY }}/node_modules
            ~/.cache/pnpm
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          
      - name: Type check
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: pnpm run type-check
        
      - name: Build application
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: pnpm run build
        
      - name: Cache build artifacts
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.WORKING_DIRECTORY }}/.next
            ${{ env.WORKING_DIRECTORY }}/dist
          key: ${{ runner.os }}-build-${{ github.sha }}

  # Phase 3: Unit & Integration Tests (Target: 2-3 minutes)
  test-unit:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 4
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/pnpm-lock.yaml
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.9
          
      - name: Restore dependencies
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.WORKING_DIRECTORY }}/node_modules
            ~/.cache/pnpm
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          
      - name: Run unit tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: pnpm run test:unit --coverage
        
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ${{ env.WORKING_DIRECTORY }}/coverage/lcov.info
          flags: frontend
          name: romai-frontend-coverage

  test-ml-backend:
    name: "🤖 ML Backend Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.production.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install Python dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          pip install --upgrade pip
          pip install -r requirements.production.txt
          pip install pytest pytest-asyncio pytest-cov httpx
          
      - name: Run ML backend tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          python -m pytest src/tests/ -v --cov=src --cov-report=xml --cov-report=term
          
      - name: Upload ML coverage
        uses: codecov/codecov-action@v3
        with:
          file: ${{ env.WORKING_DIRECTORY }}/coverage.xml
          flags: backend
          name: romai-ml-backend-coverage

  # Phase 4: E2E Tests (Target: 3-4 minutes)
  test-e2e:
    name: "🎭 E2E Tests"
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 6
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/pnpm-lock.yaml
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.9
          
      - name: Restore dependencies
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.WORKING_DIRECTORY }}/node_modules
            ~/.cache/pnpm
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          
      - name: Restore build artifacts
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.WORKING_DIRECTORY }}/.next
            ${{ env.WORKING_DIRECTORY }}/dist
          key: ${{ runner.os }}-build-${{ github.sha }}
          
      - name: Install Playwright browsers
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: pnpm exec playwright install --with-deps chromium
        
      - name: Run E2E tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: pnpm run test:e2e
        
      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-report
          path: ${{ env.WORKING_DIRECTORY }}/playwright-report/
          retention-days: 30

  # Phase 5: Security Scanning (Target: 1-2 minutes)
  security:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    needs: [setup]
    timeout-minutes: 3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.9
          
      - name: Audit dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: pnpm audit --audit-level moderate
        
      - name: Run ESLint security rules
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: pnpm run lint --ext .ts,.tsx src/
        
      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        with:
          languages: javascript,typescript
          source-root: ${{ env.WORKING_DIRECTORY }}/src

  # Phase 6: Preview Build & Deploy (Target: 1-2 minutes)
  preview:
    name: "👀 Preview Deploy"
    runs-on: ubuntu-latest
    needs: [build, test-unit, test-ml-backend, security]
    if: github.event_name == 'pull_request'
    timeout-minutes: 4
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.9
          
      - name: Restore build artifacts
        uses: actions/cache@v3
        with:
          path: |
            ${{ env.WORKING_DIRECTORY }}/.next
            ${{ env.WORKING_DIRECTORY }}/dist
          key: ${{ runner.os }}-build-${{ github.sha }}
          
      - name: Deploy to Preview
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          echo "🚀 Preview deployment would happen here"
          echo "Preview URL: https://romai-pr-${{ github.event.number }}.preview.codai.ro"
          
      - name: Comment PR with preview
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview deployment ready!\n\n**Preview URL**: https://romai-pr-${{ github.event.number }}.preview.codai.ro\n\n**Test Results**: All checks passed ✅'
            });

  # Quality Gates Summary
  quality-gates:
    name: "🎯 Quality Gates"
    runs-on: ubuntu-latest
    needs: [build, test-unit, test-ml-backend, test-e2e, security]
    if: always()
    
    steps:
      - name: Check quality gates
        run: |
          echo "📊 Quality Gates Summary:"
          echo "✅ Build: ${{ needs.build.result }}"
          echo "✅ Unit Tests: ${{ needs.test-unit.result }}"  
          echo "✅ ML Backend Tests: ${{ needs.test-ml-backend.result }}"
          echo "✅ E2E Tests: ${{ needs.test-e2e.result }}"
          echo "✅ Security: ${{ needs.security.result }}"
          
          if [[ "${{ needs.build.result }}" != "success" || \
                "${{ needs.test-unit.result }}" != "success" || \
                "${{ needs.test-ml-backend.result }}" != "success" || \
                "${{ needs.test-e2e.result }}" != "success" || \
                "${{ needs.security.result }}" != "success" ]]; then
            echo "❌ Quality gates failed!"
            exit 1
          fi
          
          echo "🎉 All quality gates passed!"

# Pipeline timing breakdown (Target: <10 minutes)
# 1. Setup: 1-2 minutes
# 2. Build: 2-3 minutes
# 3. Unit Tests: 2-3 minutes (parallel with build)
# 4. ML Tests: 3-4 minutes (parallel with unit)
# 5. E2E Tests: 3-4 minutes (after build)
# 6. Security: 1-2 minutes (parallel)
# 7. Preview: 1-2 minutes (parallel)
# Total: ~8-9 minutes with parallelization