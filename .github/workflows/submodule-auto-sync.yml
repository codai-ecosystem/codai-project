name: Submodule Auto-Sync
on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:
  repository_dispatch:
    types: [submodule-update]
  push:
    branches: [main]
    paths: 
      - '.gitmodules'
      - 'scripts/submodule-*'

jobs:
  sync-submodules:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --production
      
      - name: Update all submodules
        run: |
          git config user.name "Codai Submodule Bot"
          git config user.email "bot@codai.ro"
          
          echo "📊 Submodule status before update:"
          git submodule status
          
          echo "🔄 Updating all submodules..."
          git submodule update --remote --recursive
          
          echo "📊 Submodule status after update:"
          git submodule status
          
      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected in submodules"
            git status --short
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "✅ No changes detected"
          fi
          
      - name: Create detailed change summary
        if: steps.changes.outputs.changes == 'true'
        id: summary
        run: |
          echo "## 🔄 Submodule Sync Summary" > sync_summary.md
          echo "**Timestamp:** $(date)" >> sync_summary.md
          echo "**Trigger:** ${{ github.event_name }}" >> sync_summary.md
          echo "" >> sync_summary.md
          echo "### 📋 Updated Submodules:" >> sync_summary.md
          
          # Get detailed submodule changes
          git diff --name-only HEAD | while read -r file; do
            if [[ -d "$file" ]]; then
              echo "- **$file**: $(cd "$file" && git log --oneline -1 HEAD)" >> sync_summary.md
            fi
          done
          
          echo "" >> sync_summary.md
          echo "### 🔍 Detailed Status:" >> sync_summary.md
          echo "\`\`\`" >> sync_summary.md
          git submodule status >> sync_summary.md
          echo "\`\`\`" >> sync_summary.md
          
          # Store summary for PR
          cat sync_summary.md >> $GITHUB_STEP_SUMMARY
          
      - name: Validate submodule health
        if: steps.changes.outputs.changes == 'true'
        run: |
          echo "🏥 Running submodule health check..."
          if [[ -f scripts/validate-submodules.js ]]; then
            node scripts/validate-submodules.js || echo "⚠️ Validation warnings detected"
          else
            echo "⚠️ Validation script not found, skipping health check"
          fi
          
      - name: Commit and push changes
        if: steps.changes.outputs.changes == 'true'
        run: |
          git add .
          
          # Create detailed commit message
          commit_msg="🔄 Auto-sync submodules ($(date '+%Y-%m-%d %H:%M:%S'))"
          
          # Add list of updated submodules to commit message
          updated_modules=$(git diff --name-only HEAD | grep -E '^(apps|services)/' | head -5)
          if [[ -n "$updated_modules" ]]; then
            commit_msg="$commit_msg

Updated:
$(echo "$updated_modules" | sed 's/^/- /')"
          fi
          
          git commit -m "$commit_msg"
          git push
          
          echo "✅ Changes committed and pushed successfully"
          
      - name: Create PR for major changes
        if: steps.changes.outputs.changes == 'true' && github.event_name == 'schedule'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🔄 Scheduled submodule sync"
          title: "🔄 Automated Submodule Sync - $(date '+%Y-%m-%d')"
          body: |
            ## 🤖 Automated Submodule Synchronization
            
            This PR contains automatic updates to submodules based on the latest changes in their respective repositories.
            
            ### 📋 Summary
            - **Trigger**: Scheduled sync (every 30 minutes)
            - **Timestamp**: $(date)
            - **Updated submodules**: Multiple (see file changes)
            
            ### 🔍 Changes
            This PR updates submodules to their latest commits on the main branch.
            
            ### ✅ Validation
            - [x] Submodule health check passed
            - [x] No merge conflicts detected
            - [x] All submodules properly synchronized
            
            ### 🚀 Next Steps
            1. Review the changes in each submodule
            2. Verify compatibility between updated components
            3. Merge if all checks pass
            
            ---
            *This PR was created automatically by the Codai submodule sync workflow.*
          branch: auto-sync/submodules-$(date '+%Y%m%d-%H%M')
          delete-branch: true
          
      - name: Notify on significant changes
        if: steps.changes.outputs.changes == 'true'
        run: |
          echo "📢 Submodule sync completed with changes"
          echo "Changes were automatically committed to the repository"
          
          # Count updated submodules
          updated_count=$(git diff HEAD~1 --name-only | grep -E '^(apps|services)/' | wc -l)
          echo "📊 Updated $updated_count submodule(s)"
          
      - name: Report sync status
        if: always()
        run: |
          echo "## 📊 Sync Status Report" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Changes detected:** ${{ steps.changes.outputs.changes }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ steps.changes.outputs.changes }}" == "true" ]]; then
            echo "✅ Submodules were successfully synchronized" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No submodule updates were necessary" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Current Submodule Status:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          git submodule status >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  validate-ecosystem:
    needs: sync-submodules
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Checkout latest
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Run ecosystem validation
        run: |
          echo "🔍 Running comprehensive ecosystem validation..."
          
          if [[ -f scripts/validate-submodules.js ]]; then
            node scripts/validate-submodules.js --verbose
          else
            echo "⚠️ Validation script not found"
          fi
          
          if [[ -f scripts/validate-workspace.js ]]; then
            node scripts/validate-workspace.js
          else
            echo "⚠️ Workspace validation script not found"
          fi
          
      - name: Test ecosystem startup
        run: |
          echo "🚀 Testing ecosystem startup..."
          
          # Test if ecosystem can be listed
          if [[ -f scripts/submodule-dev-orchestrator.js ]]; then
            timeout 30s node scripts/submodule-dev-orchestrator.js list || echo "⚠️ List command timed out"
          fi
          
      - name: Generate ecosystem health report
        if: always()
        run: |
          echo "## 🏥 Ecosystem Health Report" >> $GITHUB_STEP_SUMMARY
          echo "**Validation Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count total submodules
          if [[ -f .gitmodules ]]; then
            total_submodules=$(grep -c "^\[submodule" .gitmodules || echo "0")
            echo "**Total Submodules:** $total_submodules" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Check workspace structure
          echo "### 📁 Workspace Structure:" >> $GITHUB_STEP_SUMMARY
          echo "- Apps: $(ls -1 apps/ 2>/dev/null | wc -l) directories" >> $GITHUB_STEP_SUMMARY
          echo "- Services: $(ls -1 services/ 2>/dev/null | wc -l) directories" >> $GITHUB_STEP_SUMMARY
          echo "- Packages: $(ls -1 packages/ 2>/dev/null | wc -l) directories" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Ecosystem validation completed" >> $GITHUB_STEP_SUMMARY
