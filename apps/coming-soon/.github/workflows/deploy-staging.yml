name: 🚀 Deploy to Staging

on:
  push:
    branches: [dev, staging]
  pull_request:
    branches: [main, staging]
    types: [opened, synchronize, ready_for_review]

env:
  NODE_VERSION: '20.x'
  STAGING_URL: 'https://staging-coming-soon.codai.com'
  LIGHTHOUSE_CI_TOKEN: ${{ secrets.LIGHTHOUSE_CI_TOKEN }}

jobs:
  quality-gate:
    name: 🔍 Quality Gate
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📦 Install pnpm
        run: npm install -g pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Lint code
        run: pnpm lint

      - name: 🏗️ Type check
        run: pnpm type-check

      - name: 🧪 Run tests
        run: pnpm test --coverage

      - name: ♿ Accessibility audit
        run: pnpm audit:a11y

      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage/

      - name: 📋 Comment PR with quality metrics
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const coverage = JSON.parse(fs.readFileSync('./coverage/coverage-summary.json', 'utf8'));
            const body = `
            ## 🔍 Quality Gate Results
            
            ### Test Coverage
            - **Lines**: ${coverage.total.lines.pct}%
            - **Functions**: ${coverage.total.functions.pct}%
            - **Branches**: ${coverage.total.branches.pct}%
            - **Statements**: ${coverage.total.statements.pct}%
            
            ### Status
            ${coverage.total.lines.pct >= 80 ? '✅ Coverage meets minimum threshold (80%)' : '❌ Coverage below minimum threshold (80%)'}
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔒 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📊 Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: 🔍 Audit npm dependencies
        run: |
          npm install -g pnpm
          pnpm audit --audit-level moderate

  build-staging:
    name: 🏗️ Build Staging
    runs-on: ubuntu-latest
    needs: [quality-gate, security-scan]
    environment: staging

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📦 Install pnpm
        run: npm install -g pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🌍 Build for staging
        run: pnpm build:staging
        env:
          NEXT_PUBLIC_ENV: staging
          NEXT_PUBLIC_API_URL: ${{ secrets.STAGING_API_URL }}
          NEXT_PUBLIC_ANALYTICS_ID: ${{ secrets.STAGING_ANALYTICS_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ env.STAGING_URL }}

      - name: 📊 Analyze bundle size
        run: pnpm analyze:bundle

      - name: 💾 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: staging-build
          path: |
            .next/
            out/
            public/
          retention-days: 7

      - name: 🔍 Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.12.x
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-staging
    environment: staging
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging'

    steps:
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: staging-build

      - name: 🚀 Deploy to Vercel Staging
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--prebuilt --env staging'
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./

      - name: 📊 Post-deployment health check
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30
          curl -f ${{ env.STAGING_URL }}/api/health || exit 1
          echo "✅ Staging deployment successful!"

      - name: 📋 Update deployment status
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: context.payload.deployment.id,
              state: 'success',
              environment_url: '${{ env.STAGING_URL }}',
              description: 'Successfully deployed to staging'
            });

  e2e-tests:
    name: 🧪 E2E Tests
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 📦 Install pnpm and dependencies
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile

      - name: 🎭 Install Playwright browsers
        run: pnpm playwright install --with-deps

      - name: 🧪 Run E2E tests
        run: pnpm test:e2e:staging
        env:
          TEST_BASE_URL: ${{ env.STAGING_URL }}

      - name: 📊 Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-staging
          path: playwright-report/
          retention-days: 7

      - name: 📋 Comment test results on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');
            let testResults = '🧪 E2E tests completed';
            try {
              const results = JSON.parse(fs.readFileSync('./test-results.json', 'utf8'));
              testResults = `
              ## 🧪 E2E Test Results
              
              - **Tests Run**: ${results.totalTests}
              - **Passed**: ${results.passed} ✅
              - **Failed**: ${results.failed} ❌
              - **Skipped**: ${results.skipped} ⏭️
              
              ${results.failed > 0 ? '❌ Some tests failed. Please check the artifacts.' : '✅ All tests passed!'}
              
              📊 [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;
            } catch (error) {
              testResults = '🧪 E2E test results could not be parsed.';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: testResults
            });

  performance-audit:
    name: 📊 Performance Audit
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📊 Run Lighthouse audit
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            ${{ env.STAGING_URL }}
            ${{ env.STAGING_URL }}/en
            ${{ env.STAGING_URL }}/ro
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './.lighthouserc.json'

      - name: 📊 Web Vitals monitoring
        run: |
          npm install -g web-vitals-cli
          web-vitals-cli --url=${{ env.STAGING_URL }} --json > web-vitals-results.json

      - name: 📋 Comment performance results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            try {
              const vitals = JSON.parse(fs.readFileSync('./web-vitals-results.json', 'utf8'));
              const body = `
              ## 📊 Performance Audit Results
              
              ### Core Web Vitals
              - **LCP**: ${vitals.lcp}ms ${vitals.lcp < 2500 ? '✅' : '❌'}
              - **FID**: ${vitals.fid}ms ${vitals.fid < 100 ? '✅' : '❌'}
              - **CLS**: ${vitals.cls} ${vitals.cls < 0.1 ? '✅' : '❌'}
              
              ### Lighthouse Scores
              - **Performance**: Check artifacts for detailed scores
              - **Accessibility**: Automated audit completed
              - **Best Practices**: Standards compliance verified
              - **SEO**: Search optimization validated
              
              📊 [View Lighthouse Report](https://googlechrome.github.io/lighthouse/viewer/)
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            } catch (error) {
              console.log('Could not parse performance results');
            }