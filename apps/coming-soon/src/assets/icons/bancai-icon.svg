<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bancai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffecd2" />
      <stop offset="100%" style="stop-color:#fcb69f" />
    </linearGradient>
  </defs>
  
  <!-- Bank building outline -->
  <path d="M12 2 L2 8 L2 9 L22 9 L22 8 L12 2Z" fill="url(#bancai-gradient)" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Building columns -->
  <g stroke="url(#bancai-gradient)" stroke-width="2" fill="none">
    <line x1="5" y1="9" x2="5" y2="19"/>
    <line x1="8" y1="9" x2="8" y2="19"/>
    <line x1="12" y1="9" x2="12" y2="19"/>
    <line x1="16" y1="9" x2="16" y2="19"/>
    <line x1="19" y1="9" x2="19" y2="19"/>
  </g>
  
  <!-- Building base -->
  <rect x="2" y="19" width="20" height="3" fill="url(#bancai-gradient)" stroke="currentColor" stroke-width="2"/>
  
  <!-- Digital elements - representing AI/digital banking -->
  <g stroke="url(#bancai-gradient)" stroke-width="1.5" fill="none" opacity="0.8">
    <!-- Digital currency symbols -->
    <circle cx="7" cy="14" r="1" stroke-dasharray="2,1"/>
    <circle cx="12" cy="12" r="1" stroke-dasharray="2,1"/>
    <circle cx="17" cy="14" r="1" stroke-dasharray="2,1"/>
    
    <!-- Connection lines -->
    <path d="M8 14 L11 12" stroke-linecap="round"/>
    <path d="M13 12 L16 14" stroke-linecap="round"/>
  </g>
  
  <!-- AI indicator -->
  <circle cx="12" cy="6" r="1.5" fill="url(#bancai-gradient)" opacity="0.9"/>
  <circle cx="12" cy="6" r="0.5" fill="white"/>
</svg>