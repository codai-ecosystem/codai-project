<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="legalai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea" />
      <stop offset="100%" style="stop-color:#764ba2" />
    </linearGradient>
  </defs>
  
  <!-- Legal scale base -->
  <rect x="11" y="18" width="2" height="4" fill="url(#legalai-gradient)"/>
  <rect x="8" y="21" width="8" height="1" fill="url(#legalai-gradient)"/>
  
  <!-- Scale beam -->
  <line x1="6" y1="12" x2="18" y2="12" stroke="url(#legalai-gradient)" stroke-width="2"/>
  <circle cx="12" cy="12" r="1" fill="url(#legalai-gradient)"/>
  
  <!-- Left scale pan -->
  <path d="M6 12 L4 15 L8 15 Z" fill="none" stroke="url(#legalai-gradient)" stroke-width="2" stroke-linejoin="round"/>
  <line x1="4" y1="15" x2="8" y2="15" stroke="url(#legalai-gradient)" stroke-width="1"/>
  
  <!-- Right scale pan -->
  <path d="M18 12 L16 15 L20 15 Z" fill="none" stroke="url(#legalai-gradient)" stroke-width="2" stroke-linejoin="round"/>
  <line x1="16" y1="15" x2="20" y2="15" stroke="url(#legalai-gradient)" stroke-width="1"/>
  
  <!-- AI enhancement - digital documents -->
  <g stroke="url(#legalai-gradient)" stroke-width="1.5" fill="none" opacity="0.7">
    <rect x="5" y="2" width="6" height="8" rx="1" stroke-dasharray="2,1"/>
    <rect x="13" y="2" width="6" height="8" rx="1" stroke-dasharray="2,1"/>
    
    <!-- Document lines -->
    <line x1="6" y1="4" x2="9" y2="4" opacity="0.5"/>
    <line x1="6" y1="6" x2="10" y2="6" opacity="0.5"/>
    <line x1="6" y1="8" x2="8" y2="8" opacity="0.5"/>
    
    <line x1="14" y1="4" x2="17" y2="4" opacity="0.5"/>
    <line x1="14" y1="6" x2="18" y2="6" opacity="0.5"/>
    <line x1="14" y1="8" x2="16" y2="8" opacity="0.5"/>
  </g>
  
  <!-- AI processing indicator -->
  <circle cx="8" cy="6" r="0.5" fill="url(#legalai-gradient)" opacity="0.8"/>
  <circle cx="16" cy="6" r="0.5" fill="url(#legalai-gradient)" opacity="0.8"/>
</svg>