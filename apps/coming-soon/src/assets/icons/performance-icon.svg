<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="performance-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#89f7fe" />
      <stop offset="100%" style="stop-color:#66a6ff" />
    </linearGradient>
  </defs>
  
  <!-- Speedometer base -->
  <path d="M3 14 A9 9 0 0 1 21 14" fill="none" stroke="url(#performance-gradient)" stroke-width="2"/>
  <path d="M5 16 A7 7 0 0 1 19 16" fill="none" stroke="url(#performance-gradient)" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Performance marks -->
  <g stroke="url(#performance-gradient)" stroke-width="2" stroke-linecap="round">
    <line x1="4" y1="14" x2="5" y2="13"/>
    <line x1="6.5" y1="9.5" x2="7.5" y2="8.5"/>
    <line x1="11" y1="6" x2="12" y2="5"/>
    <line x1="12" y1="6" x2="12" y2="5"/>
    <line x1="16.5" y1="8.5" x2="17.5" y2="9.5"/>
    <line x1="19" y1="13" x2="20" y2="14"/>
  </g>
  
  <!-- Performance indicator needle -->
  <g stroke="url(#performance-gradient)" stroke-width="2" fill="url(#performance-gradient)">
    <line x1="12" y1="14" x2="16" y2="10" stroke-linecap="round"/>
    <circle cx="12" cy="14" r="1.5"/>
  </g>
  
  <!-- Digital performance metrics -->
  <g fill="url(#performance-gradient)" opacity="0.8">
    <rect x="8" y="18" width="2" height="1" rx="0.5"/>
    <rect x="11" y="18" width="2" height="1" rx="0.5"/>
    <rect x="14" y="18" width="2" height="1" rx="0.5"/>
  </g>
  
  <!-- Speed lines -->
  <g stroke="url(#performance-gradient)" stroke-width="1.5" opacity="0.6" stroke-linecap="round">
    <line x1="18" y1="11" x2="20" y2="9"/>
    <line x1="18" y1="13" x2="21" y2="11"/>
    <line x1="17" y1="15" x2="20" y2="13"/>
  </g>
</svg>