<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scalability-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea" />
      <stop offset="100%" style="stop-color:#fed6e3" />
    </linearGradient>
  </defs>
  
  <!-- Network nodes -->
  <g fill="url(#scalability-gradient)" opacity="0.8">
    <!-- Core cluster -->
    <circle cx="12" cy="12" r="2"/>
    
    <!-- Inner ring -->
    <circle cx="8" cy="8" r="1.5"/>
    <circle cx="16" cy="8" r="1.5"/>
    <circle cx="16" cy="16" r="1.5"/>
    <circle cx="8" cy="16" r="1.5"/>
    
    <!-- Outer ring -->
    <circle cx="6" cy="6" r="1"/>
    <circle cx="12" cy="4" r="1"/>
    <circle cx="18" cy="6" r="1"/>
    <circle cx="20" cy="12" r="1"/>
    <circle cx="18" cy="18" r="1"/>
    <circle cx="12" cy="20" r="1"/>
    <circle cx="6" cy="18" r="1"/>
    <circle cx="4" cy="12" r="1"/>
  </g>
  
  <!-- Connection lines -->
  <g stroke="url(#scalability-gradient)" stroke-width="1.5" opacity="0.6">
    <!-- Core to inner ring -->
    <line x1="12" y1="12" x2="8" y2="8"/>
    <line x1="12" y1="12" x2="16" y2="8"/>
    <line x1="12" y1="12" x2="16" y2="16"/>
    <line x1="12" y1="12" x2="8" y2="16"/>
    
    <!-- Inner to outer ring -->
    <line x1="8" y1="8" x2="6" y2="6"/>
    <line x1="8" y1="8" x2="12" y2="4"/>
    <line x1="16" y1="8" x2="12" y2="4"/>
    <line x1="16" y1="8" x2="18" y2="6"/>
    <line x1="16" y1="16" x2="18" y2="18"/>
    <line x1="16" y1="16" x2="20" y2="12"/>
    <line x1="8" y1="16" x2="6" y2="18"/>
    <line x1="8" y1="16" x2="4" y2="12"/>
  </g>
  
  <!-- Growth arrows -->
  <g stroke="url(#scalability-gradient)" stroke-width="2" fill="url(#scalability-gradient)">
    <path d="M2 2 L4 4 M2 4 L4 2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 2 L22 4 M20 4 L22 2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M2 20 L4 22 M2 22 L4 20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 20 L22 22 M20 22 L22 20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Expansion indicators -->
  <g stroke="url(#scalability-gradient)" stroke-width="1" opacity="0.5" stroke-dasharray="2,1">
    <circle cx="12" cy="12" r="10"/>
  </g>
</svg>