<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="security-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea" />
      <stop offset="100%" style="stop-color:#764ba2" />
    </linearGradient>
  </defs>
  
  <!-- Shield base -->
  <path d="M12 2 L4 6 L4 12 C4 16 8 20 12 22 C16 20 20 16 20 12 L20 6 Z" 
        fill="none" 
        stroke="url(#security-gradient)" 
        stroke-width="2" 
        stroke-linejoin="round"/>
  
  <!-- AI security core -->
  <circle cx="12" cy="11" r="3" fill="none" stroke="url(#security-gradient)" stroke-width="2"/>
  <circle cx="12" cy="11" r="1.5" fill="url(#security-gradient)" opacity="0.8"/>
  
  <!-- Security layers -->
  <g stroke="url(#security-gradient)" stroke-width="1" opacity="0.6" stroke-dasharray="2,1">
    <circle cx="12" cy="11" r="5"/>
    <circle cx="12" cy="11" r="7"/>
  </g>
  
  <!-- Encryption indicators -->
  <g stroke="url(#security-gradient)" stroke-width="1.5" fill="none" opacity="0.8">
    <path d="M8 8 L9 9" stroke-linecap="round"/>
    <path d="M16 8 L15 9" stroke-linecap="round"/>
    <path d="M8 14 L9 13" stroke-linecap="round"/>
    <path d="M16 14 L15 13" stroke-linecap="round"/>
    
    <!-- Lock indicators -->
    <rect x="6" y="6" width="1.5" height="1" rx="0.5"/>
    <rect x="16.5" y="6" width="1.5" height="1" rx="0.5"/>
    <rect x="6" y="15" width="1.5" height="1" rx="0.5"/>
    <rect x="16.5" y="15" width="1.5" height="1" rx="0.5"/>
  </g>
  
  <!-- Checkmark for verification -->
  <path d="M9 11 L11 13 L15 9" 
        stroke="white" 
        stroke-width="2" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>