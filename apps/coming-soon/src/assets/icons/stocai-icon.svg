<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stocai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#89f7fe" />
      <stop offset="100%" style="stop-color:#66a6ff" />
    </linearGradient>
  </defs>
  
  <!-- Chart background -->
  <rect x="2" y="4" width="20" height="16" rx="2" fill="none" stroke="url(#stocai-gradient)" stroke-width="2"/>
  
  <!-- Stock chart line -->
  <path d="M4 16 L6 14 L8 12 L10 15 L12 8 L14 10 L16 6 L18 9 L20 7" 
        fill="none" 
        stroke="url(#stocai-gradient)" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Data points -->
  <g fill="url(#stocai-gradient)">
    <circle cx="4" cy="16" r="1.5"/>
    <circle cx="8" cy="12" r="1.5"/>
    <circle cx="12" cy="8" r="1.5"/>
    <circle cx="16" cy="6" r="1.5"/>
    <circle cx="20" cy="7" r="1.5"/>
  </g>
  
  <!-- AI prediction indicators -->
  <g stroke="url(#stocai-gradient)" stroke-width="1.5" fill="none" opacity="0.7" stroke-dasharray="3,2">
    <path d="M20 7 L22 5" stroke-linecap="round"/>
    <path d="M20 7 L22 9" stroke-linecap="round"/>
  </g>
  
  <!-- Market trend arrows -->
  <g stroke="url(#stocai-gradient)" stroke-width="2" fill="url(#stocai-gradient)" opacity="0.8">
    <path d="M16 2 L18 4 L16 6" stroke-linejoin="round"/>
    <path d="M18 2 L20 4 L18 6" stroke-linejoin="round"/>
  </g>
  
  <!-- Grid lines -->
  <g stroke="url(#stocai-gradient)" stroke-width="0.5" opacity="0.3">
    <line x1="2" y1="8" x2="22" y2="8"/>
    <line x1="2" y1="12" x2="22" y2="12"/>
    <line x1="2" y1="16" x2="22" y2="16"/>
    <line x1="7" y1="4" x2="7" y2="20"/>
    <line x1="12" y1="4" x2="12" y2="20"/>
    <line x1="17" y1="4" x2="17" y2="20"/>
  </g>
</svg>