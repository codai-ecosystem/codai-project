# CODAI Gateway Service - CI/CD Pipeline
# Production-ready workflow with comprehensive testing, security scanning, and deployment

name: CODAI Gateway CI/CD

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*']
    paths:
      - 'apps/gateway/**'
      - '.github/workflows/gateway-ci-cd.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/gateway/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version to deploy'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: codai/gateway
  WORKING_DIRECTORY: apps/gateway
  NODE_VERSION: '20'
  DOCKER_BUILDKIT: 1

jobs:
  # Code Quality & Security Analysis
  code-analysis:
    name: Code Analysis & Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          npm ci --only=dev
          npm audit --audit-level=moderate

      - name: TypeScript Type Checking
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          npx tsc --noEmit --project tsconfig.json

      - name: ESLint Code Analysis
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          npx eslint . --ext .ts,.js --format @microsoft/sarif --output-file eslint-results.sarif || true

      - name: Upload ESLint Results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ env.WORKING_DIRECTORY }}/eslint-results.sarif
          wait-for-processing: true

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: ${{ env.WORKING_DIRECTORY }}

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          languages: typescript, javascript

  # Unit & Integration Tests
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: code-analysis
    strategy:
      matrix:
        node-version: ['18', '20', '21']

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test123
          POSTGRES_USER: test
          POSTGRES_DB: codai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: npm ci

      - name: Run Unit Tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test123@localhost:5432/codai_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret
        run: |
          npm test -- --coverage --detectOpenHandles --forceExit
          npm run test:integration

      - name: Upload Coverage Reports
        uses: codecov/codecov-action@v3
        with:
          file: ${{ env.WORKING_DIRECTORY }}/coverage/lcov.info
          flags: gateway-service
          name: codai-gateway-${{ matrix.node-version }}
          fail_ci_if_error: false

      - name: Store Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.node-version }}
          path: |
            ${{ env.WORKING_DIRECTORY }}/coverage/
            ${{ env.WORKING_DIRECTORY }}/test-results.xml

  # Docker Build & Security Scan
  docker-build:
    name: Docker Build & Security
    runs-on: ubuntu-latest
    needs: [code-analysis, test]
    permissions:
      contents: read
      packages: write
      security-events: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker Image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          file: ${{ env.WORKING_DIRECTORY }}/Dockerfile.production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Snyk Container Security
        uses: snyk/actions/docker@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          args: --severity-threshold=high --file=${{ env.WORKING_DIRECTORY }}/Dockerfile.production

  # End-to-End Tests
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    services:
      gateway:
        image: ${{ needs.docker-build.outputs.image-tag }}
        env:
          NODE_ENV: test
          GATEWAY_PORT: 4000
          JWT_SECRET: e2e-test-secret
        ports:
          - 4000:4000
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:4000/api/gateway/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/package-lock.json

      - name: Install E2E Dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E Tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          GATEWAY_URL: http://localhost:4000
        run: |
          npm run test:e2e
        timeout-minutes: 10

      - name: Upload E2E Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: |
            ${{ env.WORKING_DIRECTORY }}/test-results/
            ${{ env.WORKING_DIRECTORY }}/playwright-report/

  # Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Compose
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          docker-compose -f docker-compose.production.yml up -d codai-gateway postgres redis
          sleep 30

      - name: Install k6
        run: |
          sudo apt-key adv --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run Performance Tests
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          k6 run --out json=k6-results.json tests/performance/load-test.js

      - name: Upload Performance Results
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-results
          path: ${{ env.WORKING_DIRECTORY }}/k6-results.json

      - name: Cleanup
        if: always()
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: docker-compose -f docker-compose.production.yml down -v

  # Staging Deployment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-build, test, e2e-tests]
    if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: https://gateway-staging.codai.dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kubernetes CLI
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name codai-staging-cluster

      - name: Deploy to Staging
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd k8s/overlays/staging
          kustomize edit set image codai/gateway=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          kubectl apply -k .
          kubectl rollout status deployment/codai-gateway -n codai-staging --timeout=300s

      - name: Run Smoke Tests
        run: |
          kubectl wait --for=condition=ready pod -l app=codai-gateway -n codai-staging --timeout=300s
          curl -f https://gateway-staging.codai.dev/api/gateway/health

  # Production Deployment
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build, test, e2e-tests, performance-tests, deploy-staging]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://gateway.codai.dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Kubernetes CLI
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
          aws-region: us-east-1

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name codai-production-cluster

      - name: Blue-Green Deployment
        working-directory: ${{ env.WORKING_DIRECTORY }}
        env:
          IMAGE_TAG: ${{ github.event.inputs.version || github.sha }}
        run: |
          cd k8s/overlays/production
          kustomize edit set image codai/gateway=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          kubectl apply -k .
          kubectl rollout status deployment/codai-gateway -n codai-production --timeout=600s

      - name: Production Health Check
        run: |
          kubectl wait --for=condition=ready pod -l app=codai-gateway -n codai-production --timeout=300s
          curl -f https://gateway.codai.dev/api/gateway/health
          curl -f https://gateway.codai.dev/api/gateway/metrics

      - name: Notify Deployment Success
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: '🚀 CODAI Gateway successfully deployed to production!'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # Security & Compliance
  security-compliance:
    name: Security & Compliance
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OWASP ZAP Security Scan
        uses: zaproxy/action-full-scan@v0.8.0
        with:
          target: 'https://gateway-staging.codai.dev'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'

      - name: Compliance Check
        run: |
          echo "Running compliance checks..."
          # Add compliance validation scripts here
