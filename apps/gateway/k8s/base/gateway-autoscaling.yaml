apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codai-gateway-hpa
  namespace: codai-system
  labels:
    app: codai-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codai-gateway
  minReplicas: 2
  maxReplicas: 50
  metrics:
    # CPU-based scaling
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Memory-based scaling
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    # Custom metrics scaling (requests per second)
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: '100'
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 5
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: codai-gateway-vpa
  namespace: codai-system
  labels:
    app: codai-gateway
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codai-gateway
  updatePolicy:
    updateMode: 'Auto'
  resourcePolicy:
    containerPolicies:
      - containerName: gateway
        maxAllowed:
          cpu: '2000m'
          memory: '4Gi'
        minAllowed:
          cpu: '100m'
          memory: '128Mi'
        controlledResources: ['cpu', 'memory']
        controlledValues: RequestsAndLimits
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: codai-gateway-pdb
  namespace: codai-system
  labels:
    app: codai-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: codai-gateway
