apiVersion: apps/v1
kind: Deployment
metadata:
  name: codai-gateway
  namespace: codai-system
  labels:
    app: codai-gateway
    version: v1.0.0
    component: api-gateway
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app: codai-gateway
  template:
    metadata:
      labels:
        app: codai-gateway
        version: v1.0.0
        component: api-gateway
        sidecar.istio.io/inject: 'true'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '4000'
        prometheus.io/path: '/api/gateway/metrics'
        cluster-autoscaler.kubernetes.io/safe-to-evict: 'true'
    spec:
      serviceAccountName: codai-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: codai/gateway:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: codai-gateway-config
                  key: NODE_ENV
            - name: GATEWAY_PORT
              valueFrom:
                configMapKeyRef:
                  name: codai-gateway-config
                  key: GATEWAY_PORT
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: codai-gateway-config
                  key: LOG_LEVEL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: codai-gateway-secrets
                  key: jwt-secret
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: codai-gateway-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: codai-gateway-secrets
                  key: redis-url
            - name: RATE_LIMIT_WINDOW_MS
              valueFrom:
                configMapKeyRef:
                  name: codai-gateway-config
                  key: RATE_LIMIT_WINDOW_MS
            - name: RATE_LIMIT_MAX_REQUESTS
              valueFrom:
                configMapKeyRef:
                  name: codai-gateway-config
                  key: RATE_LIMIT_MAX_REQUESTS
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: codai-gateway-config
                  key: CORS_ORIGIN
            - name: SERVICE_REGISTRY
              valueFrom:
                configMapKeyRef:
                  name: codai-gateway-config
                  key: SERVICE_REGISTRY
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
              ephemeral-storage: '1Gi'
            limits:
              memory: '1Gi'
              cpu: '1000m'
              ephemeral-storage: '2Gi'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/gateway/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/gateway/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/gateway/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: cache
          emptyDir:
            sizeLimit: 500Mi
        - name: logs
          emptyDir:
            sizeLimit: 1Gi
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - codai-gateway
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: 'node-type'
          operator: 'Equal'
          value: 'general'
          effect: 'NoSchedule'
