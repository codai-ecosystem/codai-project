apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: codai-gateway-istio
  namespace: codai-system
  labels:
    app: codai-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: codai-gateway-tls
      hosts:
        - api.codai.com
        - gateway.codai.com
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - api.codai.com
        - gateway.codai.com
      tls:
        httpsRedirect: true
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: codai-gateway-vs
  namespace: codai-system
  labels:
    app: codai-gateway
spec:
  hosts:
    - api.codai.com
    - gateway.codai.com
  gateways:
    - codai-gateway-istio
  http:
    # Health check routes (no authentication required)
    - match:
        - uri:
            exact: /api/gateway/health
      route:
        - destination:
            host: codai-gateway-service
            port:
              number: 80
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 3s
        retryOn: gateway-error,connect-failure,refused-stream

    # Metrics endpoint (restricted access)
    - match:
        - uri:
            exact: /api/gateway/metrics
      route:
        - destination:
            host: codai-gateway-service
            port:
              number: 80
      timeout: 30s
      headers:
        request:
          add:
            x-forwarded-proto: https

    # Documentation routes
    - match:
        - uri:
            prefix: /docs
      route:
        - destination:
            host: codai-gateway-service
            port:
              number: 80
      timeout: 30s

    # API routes with authentication
    - match:
        - uri:
            prefix: /api/v1/
      route:
        - destination:
            host: codai-gateway-service
            port:
              number: 80
            subset: v1
      timeout: 60s
      retries:
        attempts: 3
        perTryTimeout: 20s
        retryOn: 5xx,reset,connect-failure,refused-stream
      fault:
        delay:
          percentage:
            value: 0.1
          fixedDelay: 100ms
      headers:
        request:
          add:
            x-forwarded-proto: https
            x-request-source: istio-gateway
          remove:
            - x-internal-user

    # Service discovery routes
    - match:
        - uri:
            prefix: /api/gateway/
      route:
        - destination:
            host: codai-gateway-service
            port:
              number: 80
      timeout: 30s
      retries:
        attempts: 2
        perTryTimeout: 10s

    # Default route (redirect to docs)
    - match:
        - uri:
            exact: /
      redirect:
        uri: /docs
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: codai-gateway-dr
  namespace: codai-system
  labels:
    app: codai-gateway
spec:
  host: codai-gateway-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
        connectTimeout: 30s
        tcpKeepalive:
          time: 7200s
          interval: 75s
      http:
        http1MaxPendingRequests: 50
        http2MaxRequests: 100
        maxRequestsPerConnection: 2
        maxRetries: 3
        consecutiveGatewayErrors: 5
        interval: 30s
        baseEjectionTime: 30s
        maxEjectionPercent: 50
        minHealthPercent: 30
    circuitBreaker:
      consecutiveGatewayErrors: 5
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 30
    loadBalancer:
      simple: LEAST_CONN
      consistentHash:
        httpHeaderName: 'x-user-id'
    outlierDetection:
      consecutiveGatewayErrors: 5
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
      minHealthPercent: 30
  subsets:
    - name: v1
      labels:
        version: v1.0.0
      trafficPolicy:
        portLevelSettings:
          - port:
              number: 80
            connectionPool:
              tcp:
                maxConnections: 50
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: codai-gateway-ratelimit
  namespace: codai-system
  labels:
    app: codai-gateway
spec:
  workloadSelector:
    labels:
      app: codai-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          filterChain:
            filter:
              name: 'envoy.filters.network.http_connection_manager'
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.local_ratelimit
          typed_config:
            '@type': type.googleapis.com/udpa.type.v1.TypedStruct
            type_url: type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
            value:
              stat_prefix: local_rate_limiter
              token_bucket:
                max_tokens: 1000
                tokens_per_fill: 1000
                fill_interval: 60s
              filter_enabled:
                runtime_key: local_rate_limit_enabled
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              filter_enforced:
                runtime_key: local_rate_limit_enforced
                default_value:
                  numerator: 100
                  denominator: HUNDRED
              response_headers_to_add:
                - append: false
                  header:
                    key: x-local-rate-limit
                    value: 'true'
