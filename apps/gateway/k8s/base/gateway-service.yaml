apiVersion: v1
kind: Service
metadata:
  name: codai-gateway-service
  namespace: codai-system
  labels:
    app: codai-gateway
    service: codai-gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: 'nlb'
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: 'true'
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: 'http'
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-path: '/api/gateway/health'
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: '10'
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-timeout: '5'
    service.beta.kubernetes.io/aws-load-balancer-healthy-threshold: '2'
    service.beta.kubernetes.io/aws-load-balancer-unhealthy-threshold: '2'
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 4000
      protocol: TCP
  selector:
    app: codai-gateway
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: codai-gateway-headless
  namespace: codai-system
  labels:
    app: codai-gateway
    service: codai-gateway-headless
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
  selector:
    app: codai-gateway
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codai-gateway-ingress
  namespace: codai-system
  labels:
    app: codai-gateway
  annotations:
    kubernetes.io/ingress.class: 'nginx'
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/backend-protocol: 'HTTP'
    nginx.ingress.kubernetes.io/rate-limit: '1000'
    nginx.ingress.kubernetes.io/rate-limit-window: '1m'
    nginx.ingress.kubernetes.io/enable-cors: 'true'
    nginx.ingress.kubernetes.io/cors-allow-origin: 'https://codai.com,https://app.codai.com'
    nginx.ingress.kubernetes.io/cors-allow-methods: 'GET,POST,PUT,DELETE,OPTIONS'
    nginx.ingress.kubernetes.io/cors-allow-headers: 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization'
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Request-ID: $request_id";
      more_set_headers "X-Real-IP: $remote_addr";
      more_set_headers "X-Forwarded-For: $proxy_add_x_forwarded_for";
spec:
  tls:
    - hosts:
        - api.codai.com
        - gateway.codai.com
      secretName: codai-gateway-tls
  rules:
    - host: api.codai.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codai-gateway-service
                port:
                  number: 80
    - host: gateway.codai.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codai-gateway-service
                port:
                  number: 80
