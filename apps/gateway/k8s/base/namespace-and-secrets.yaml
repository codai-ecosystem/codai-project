apiVersion: v1
kind: Namespace
metadata:
  name: codai-system
  labels:
    name: codai-system
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    istio-injection: enabled
  annotations:
    scheduler.alpha.kubernetes.io/node-selector: 'node-type=general'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codai-gateway
  namespace: codai-system
  labels:
    app: codai-gateway
    version: v1.0.0
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/codai-gateway-role
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: codai-gateway-secrets
  namespace: codai-system
  labels:
    app: codai-gateway
type: Opaque
stringData:
  jwt-secret: 'CHANGE_THIS_IN_PRODUCTION_VIA_VAULT'
  database-url: 'postgresql://codai:CHANGE_PASSWORD@codai-postgres:5432/codai'
  redis-url: 'redis://codai-redis:6379'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: codai-gateway-config
  namespace: codai-system
  labels:
    app: codai-gateway
data:
  NODE_ENV: 'production'
  GATEWAY_PORT: '4000'
  LOG_LEVEL: 'info'
  METRICS_ENABLED: 'true'
  RATE_LIMIT_WINDOW_MS: '900000'
  RATE_LIMIT_MAX_REQUESTS: '1000'
  CORS_ORIGIN: 'https://codai.com,https://app.codai.com'
  SERVICE_REGISTRY: |
    {
      "codai": {
        "name": "CODAI Service",
        "url": "http://codai-service:4001",
        "healthPath": "/health",
        "category": "core"
      },
      "admin": {
        "name": "Admin Service", 
        "url": "http://admin-service:4007",
        "healthPath": "/health",
        "category": "business"
      },
      "hub": {
        "name": "Hub Service",
        "url": "http://hub-service:4008", 
        "healthPath": "/health",
        "category": "core"
      },
      "id": {
        "name": "ID Service",
        "url": "http://id-service:4004",
        "healthPath": "/health", 
        "category": "core"
      },
      "bancai": {
        "name": "BancAI Service",
        "url": "http://bancai-service:4005",
        "healthPath": "/health",
        "category": "business"
      },
      "memorai": {
        "name": "MemorAI Service", 
        "url": "http://memorai-service:4006",
        "healthPath": "/health",
        "category": "utility"
      }
    }
