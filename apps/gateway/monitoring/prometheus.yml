# Prometheus Configuration for CODAI Gateway Service
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'codai-development'
    environment: 'dev'

rule_files:
  - 'rules/*.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # CODAI Gateway Service
  - job_name: 'codai-gateway'
    scrape_interval: 10s
    metrics_path: '/api/gateway/metrics'
    static_configs:
      - targets: ['codai-gateway:4000']
    scrape_timeout: 10s
    honor_labels: true
    params:
      format: ['prometheus']

  # Node.js Application Metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # PostgreSQL Metrics
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis Metrics
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Docker Container Metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # Prometheus Self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Grafana Metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # NGINX Metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:9113']

  # Jaeger Metrics
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']
# Remote write configuration (optional - for production)
