# PostgreSQL 16 Configuration for CODAI ID Enterprise
# High-performance settings for authentication system

# CONNECTIONS AND AUTHENTICATION
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 3

# MEMORY
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB

# WRITE AHEAD LOG
wal_level = replica
wal_buffers = 16MB
checkpoint_completion_target = 0.7
max_wal_size = 1GB
min_wal_size = 80MB

# REPLICATION
max_wal_senders = 3
max_replication_slots = 3
hot_standby = on
wal_keep_size = 256MB

# QUERY TUNING
random_page_cost = 1.1
effective_io_concurrency = 200

# ERROR REPORTING AND LOGGING
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%a.log'
log_truncate_on_rotation = on
log_rotation_age = 1d
log_rotation_size = 0
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 10MB

# RUNTIME STATISTICS
track_activities = on
track_counts = on
track_io_timing = on
track_functions = pl

# AUTOVACUUM
autovacuum = on
autovacuum_max_workers = 3

# CLIENT CONNECTION DEFAULTS
shared_preload_libraries = 'pg_stat_statements'

# SECURITY
ssl = off
password_encryption = scram-sha-256
