# MemorAI CI/CD Pipeline - Optimized for ≤10 Minutes
# Contract-first development with comprehensive testing

name: MemorAI CI/CD

on:
  push:
    branches: [main, develop]
    paths: ['apps/memorai/**']
  pull_request:
    branches: [main, develop] 
    paths: ['apps/memorai/**']
  workflow_dispatch:

env:
  SERVICE_NAME: memorai
  WORKING_DIRECTORY: apps/memorai
  REGISTRY: ghcr.io
  IMAGE_NAME: codai/memorai
  NODE_VERSION: '20'

jobs:
  # Stage 1: Fast feedback (2-3 minutes)
  fast-feedback:
    name: Fast Feedback
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js & PNPM
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
          
      - name: Install dependencies (cached)
        run: pnpm install --frozen-lockfile --prefer-frozen-lockfile
        
      - name: Lint & Format Check
        run: |
          pnpm lint --max-warnings 0
          pnpm prettier --check .
          
      - name: Type Check
        run: pnpm type-check
        
      - name: Contract Validation
        run: |
          # Validate OpenAPI contracts
          npx swagger-codegen-cli validate -i .arch/contracts/memorai-api.yaml
          # Validate JSON schemas
          npx ajv compile -s .arch/contracts/schemas/*.json

  # Stage 2: Unit & Integration Tests (3-4 minutes)
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 4
    needs: fast-feedback
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    strategy:
      matrix:
        test-type: [unit, integration]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js & PNPM
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
          
      - name: Install dependencies (cached)
        run: pnpm install --frozen-lockfile
        
      - name: Run ${{ matrix.test-type }} tests
        run: |
          if [ "${{ matrix.test-type }}" == "unit" ]; then
            pnpm test:unit --coverage --reporter=verbose
          else
            pnpm test:integration --reporter=verbose
          fi
          
      - name: Upload coverage reports
        if: matrix.test-type == 'unit'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          working-directory: ${{ env.WORKING_DIRECTORY }}
          fail_ci_if_error: false

  # Stage 3: Security & Build (2-3 minutes)
  security-build:
    name: Security & Build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: fast-feedback
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js & PNPM  
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Security audit
        run: pnpm audit --audit-level moderate
        
      - name: Build application
        run: pnpm build
        
      - name: SAST Scan (ESLint Security)
        run: pnpm lint --config .eslintrc.security.js
        
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-assets
          path: |
            ${{ env.WORKING_DIRECTORY }}/.next
            ${{ env.WORKING_DIRECTORY }}/dist
          retention-days: 1

  # Stage 4: E2E Tests (3-4 minutes)
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    needs: [test, security-build]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js & PNPM
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-assets
          path: ${{ env.WORKING_DIRECTORY }}
          
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps
        
      - name: Run E2E tests (critical path only)
        run: pnpm test:e2e --project=chromium --grep="@critical"
        
      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            ${{ env.WORKING_DIRECTORY }}/test-results
            ${{ env.WORKING_DIRECTORY }}/playwright-report
          retention-days: 7

  # Stage 5: Container Build & Deploy (2-3 minutes)
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [test, security-build, e2e]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.WORKING_DIRECTORY }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      - name: Deploy to staging
        run: |
          # Trigger deployment webhook (replace with actual deployment)
          curl -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"environment":"staging","image":"${{ steps.meta.outputs.tags }}","service":"memorai"}'

  # Performance monitoring job (parallel, doesn't block deployment)
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    continue-on-error: true # Don't fail build on performance issues
    
    steps:
      - name: Lighthouse CI
        run: |
          npx @lhci/cli@0.12.x autorun --config=lighthouse.config.js
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

# Pipeline Summary:
# Stage 1: Fast feedback (3 min) - Lint, format, type check, contract validation
# Stage 2: Tests (4 min) - Unit & integration tests with coverage
# Stage 3: Security & Build (3 min) - Security audit, SAST scan, build
# Stage 4: E2E (4 min) - Critical path E2E tests only
# Stage 5: Deploy (3 min) - Container build and staging deployment
# Total: ~8-10 minutes (within ≤10 min constraint)