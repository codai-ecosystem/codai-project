apiVersion: apps/v1
kind: Deployment
metadata:
  name: memorai-mcp-server
  labels:
    app: memorai-mcp
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: memorai-mcp
      tier: backend
  template:
    metadata:
      labels:
        app: memorai-mcp
        tier: backend
    spec:
      containers:
      - name: memorai-mcp
        image: memorai/mcp-server:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: MEMORAI_MAX_PERFORMANCE
          value: "true"
        - name: MEMORAI_ULTRA_FAST_MODE
          value: "true"
        - name: MEMORAI_FORCE_ADVANCED
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: memorai-mcp-service
  labels:
    app: memorai-mcp
spec:
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
  selector:
    app: memorai-mcp
    tier: backend
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memorai-mcp-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memorai-mcp-server
  minReplicas: 3
  maxReplicas: 100
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
