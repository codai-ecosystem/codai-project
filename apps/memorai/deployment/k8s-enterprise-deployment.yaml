apiVersion: v1
kind: ConfigMap
metadata:
  name: memorai-config
  namespace: memorai-enterprise
data:
  NODE_ENV: "production"
  MEMORAI_MAX_PERFORMANCE: "true"
  MEMORAI_ULTRA_FAST_MODE: "true"
  MEMORAI_FORCE_ADVANCED: "true"
  MEMORAI_CACHE_TTL: "300000"
  MEMORAI_MAX_CACHE_SIZE: "10000"
  DEBUG: "memorai:performance"
---
apiVersion: v1
kind: Secret
metadata:
  name: memorai-secrets
  namespace: memorai-enterprise
type: Opaque
stringData:
  AZURE_OPENAI_API_KEY: "your-azure-openai-key"
  AZURE_OPENAI_ENDPOINT: "https://your-resource.openai.azure.com"
  DATABASE_URL: "postgresql://user:pass@memorai-db:5432/memorai"
  REDIS_URL: "redis://memorai-redis:6379"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memorai-enterprise
  namespace: memorai-enterprise
  labels:
    app: memorai-mcp
    tier: enterprise
    version: v6.0.0
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 1
  selector:
    matchLabels:
      app: memorai-mcp
      tier: enterprise
  template:
    metadata:
      labels:
        app: memorai-mcp
        tier: enterprise
        version: v6.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: memorai-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
      - name: memorai-mcp
        image: ghcr.io/codai/memorai-mcp:v6.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: mcp-server
          protocol: TCP
        - containerPort: 3001
          name: metrics
          protocol: TCP
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: memorai-config
              key: NODE_ENV
        - name: MEMORAI_MAX_PERFORMANCE
          valueFrom:
            configMapKeyRef:
              name: memorai-config
              key: MEMORAI_MAX_PERFORMANCE
        - name: AZURE_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: memorai-secrets
              key: AZURE_OPENAI_API_KEY
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
            ephemeral-storage: "2Gi"
          limits:
            memory: "4Gi"
            cpu: "2000m"
            ephemeral-storage: "10Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
            httpHeaders:
            - name: User-Agent
              value: "Kubernetes-LivenessProbe"
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
            httpHeaders:
            - name: User-Agent
              value: "Kubernetes-ReadinessProbe"
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        volumeMounts:
        - name: memorai-data
          mountPath: /app/data
        - name: memorai-logs
          mountPath: /app/logs
        - name: memorai-config-volume
          mountPath: /app/config
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: memorai-data
        persistentVolumeClaim:
          claimName: memorai-data-pvc
      - name: memorai-logs
        emptyDir: {}
      - name: memorai-config-volume
        configMap:
          name: memorai-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - memorai-mcp
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: "memorai.com/dedicated"
        operator: "Equal"
        value: "enterprise"
        effect: "NoSchedule"
---
apiVersion: v1
kind: Service
metadata:
  name: memorai-service
  namespace: memorai-enterprise
  labels:
    app: memorai-mcp
    tier: enterprise
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: mcp-server
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: metrics
  selector:
    app: memorai-mcp
    tier: enterprise
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memorai-ingress
  namespace: memorai-enterprise
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - memorai-api.yourdomain.com
    secretName: memorai-tls
  rules:
  - host: memorai-api.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: memorai-service
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memorai-hpa
  namespace: memorai-enterprise
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memorai-enterprise
  minReplicas: 5
  maxReplicas: 50
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 5
        periodSeconds: 15
      selectPolicy: Max
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: memorai-pdb
  namespace: memorai-enterprise
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: memorai-mcp
      tier: enterprise
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: memorai-network-policy
  namespace: memorai-enterprise
spec:
  podSelector:
    matchLabels:
      app: memorai-mcp
      tier: enterprise
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 3001
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
