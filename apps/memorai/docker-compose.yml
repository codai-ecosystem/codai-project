version: '3.8'
services:
  memorai:
    build: .
    ports:
      - "4006:4006"
    environment:
      - NODE_ENV=production
      - MEMORAI_CBD_PATH=/app/memorai-cbd-data
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://localhost:4006
      - MEMORAI_LOG_LEVEL=info
      - MEMORAI_CACHE_SIZE=10000
      - MEMORAI_DIMENSIONS=1536
    restart: unless-stopped
    volumes:
      - memorai_cbd_data:/app/memorai-cbd-data
      - memorai_app_data:/app/data
    networks:
      - memorai_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.memorai.rule=Host(`memorai.yourdomain.com`)"
      - "traefik.http.routers.memorai.tls=true"
      - "traefik.http.routers.memorai.tls.certresolver=letsencrypt"

  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@yourdomain.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "letsencrypt:/letsencrypt"
    restart: unless-stopped
    networks:
      - memorai_network

volumes:
  memorai_cbd_data:
    driver: local
  memorai_app_data:
    driver: local
  letsencrypt:

networks:
  memorai_network:
    driver: bridge
