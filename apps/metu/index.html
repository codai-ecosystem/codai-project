<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>METU - Revolutionary Voice AI</title>
    <meta name="description"
        content="World's first truly seamless voice AI interaction with continuous listening and natural interruption handling" />

    <!-- Security headers for Electron -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src 'self'; connect-src 'self' https://*.openai.com https://*.azure.com;" />

    <!-- Preload critical resources -->
    <link rel="preload" href="/src/main.tsx" as="script" crossorigin />

    <!-- App icons and manifest -->
    <link rel="icon" type="image/svg+xml" href="/metu-icon.svg" />
    <link rel="icon" type="image/png" href="/metu-icon.png" />

    <!-- Theme and styling -->
    <style>
        /* Critical CSS for immediate load */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e3a8a 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            overflow: hidden;
        }

        #root {
            width: 100vw;
            height: 100vh;
        }

        /* Loading animation */
        .loading-container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e3a8a 100%);
        }

        .loading-logo {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #06b6d4, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .loading-text {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 2rem;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Microphone pulse animation */
        .mic-pulse {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1rem auto;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }
    </style>
</head>

<body>
    <div id="root">
        <!-- Loading screen while JavaScript loads -->
        <div class="loading-container" id="loading-screen">
            <div class="loading-logo">METU</div>
            <div class="loading-text">Initializing Revolutionary Voice AI...</div>
            <div class="mic-pulse">🎤</div>
            <div class="loading-spinner"></div>
        </div>
    </div>

    <!-- Main application script -->
    <script type="module" src="/src/main.tsx"></script>

    <!-- Hide loading screen when app loads -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Check if React app mounted after 2 seconds
            setTimeout(() => {
                const root = document.getElementById('root');
                const loadingScreen = document.getElementById('loading-screen');

                // Better detection: look for React-specific content or any non-loading content
                const hasReactContent = root && (
                    root.children.length > 1 ||
                    (root.children[0] && !root.children[0].classList.contains('loading-container'))
                );

                if (loadingScreen) {
                    if (hasReactContent) {
                        loadingScreen.style.opacity = '0';
                        loadingScreen.style.transition = 'opacity 0.5s ease-out';
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                        }, 500);
                    } else {
                        // Force hide loading screen after 5 seconds regardless
                        setTimeout(() => {
                            loadingScreen.style.opacity = '0';
                            loadingScreen.style.transition = 'opacity 0.5s ease-out';
                            setTimeout(() => {
                                loadingScreen.style.display = 'none';
                            }, 500);
                        }, 3000);
                    }
                }
            }, 2000);
        });
    </script>
</body>

</html>
