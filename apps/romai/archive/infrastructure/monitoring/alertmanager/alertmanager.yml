# AlertManager Configuration for ROMAI Enterprise
# Advanced alert routing and notification management

global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'romai-monitoring@codai.ro'
  smtp_auth_username: '${SMTP_USER}'
  smtp_auth_password: '${SMTP_PASSWORD}'
  smtp_auth_identity: '${SMTP_USER}'

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-receiver'
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 5m

    # Warning alerts - standard notification
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 30m

    # System alerts
    - match:
        service: system
      receiver: 'system-alerts'
      group_wait: 30s
      repeat_interval: 1h

    # Application alerts
    - match_re:
        service: romai-.*
      receiver: 'application-alerts'
      group_wait: 15s
      repeat_interval: 15m

    # SLA violation alerts
    - match:
        service: sla
      receiver: 'sla-alerts'
      group_wait: 5s
      repeat_interval: 1m

receivers:
  # Default receiver
  - name: 'default-receiver'
    email_configs:
      - to: 'admin@codai.ro'
        subject: '[ROMAI] {{ .GroupLabels.alertname }} - {{ .Status }}'
        body: |
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          {{ end }}

  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    email_configs:
      - to: 'critical@codai.ro,admin@codai.ro'
        subject: '[ROMAI CRITICAL] {{ .GroupLabels.alertname }}'
        body: |
          🚨 CRITICAL ALERT 🚨
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Severity: {{ .Labels.severity }}
          Time: {{ .StartsAt }}
          
          Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
          {{ end }}
          
          Please investigate immediately!
        headers:
          Priority: 'high'
    webhook_configs:
      - url: 'http://api:3000/webhooks/alerts/critical'
        send_resolved: true

  # Warning alerts
  - name: 'warning-alerts'
    email_configs:
      - to: 'warnings@codai.ro'
        subject: '[ROMAI WARNING] {{ .GroupLabels.alertname }}'
        body: |
          ⚠️ Warning Alert
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt }}
          {{ end }}

  # System alerts
  - name: 'system-alerts'
    email_configs:
      - to: 'system@codai.ro'
        subject: '[ROMAI SYSTEM] {{ .GroupLabels.alertname }}'
        body: |
          🖥️ System Alert
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Instance: {{ .Labels.instance }}
          Time: {{ .StartsAt }}
          {{ end }}

  # Application alerts
  - name: 'application-alerts'
    email_configs:
      - to: 'dev@codai.ro'
        subject: '[ROMAI APP] {{ .GroupLabels.alertname }}'
        body: |
          🔧 Application Alert
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Job: {{ .Labels.job }}
          Time: {{ .StartsAt }}
          {{ end }}
    webhook_configs:
      - url: 'http://api:3000/webhooks/alerts/application'
        send_resolved: true

  # SLA alerts - highest priority
  - name: 'sla-alerts'
    email_configs:
      - to: 'sla@codai.ro,management@codai.ro'
        subject: '[ROMAI SLA VIOLATION] {{ .GroupLabels.alertname }}'
        body: |
          📊 SLA VIOLATION ALERT
          
          {{ range .Alerts }}
          Alert: {{ .Annotations.summary }}
          Description: {{ .Annotations.description }}
          Service: {{ .Labels.service }}
          Time: {{ .StartsAt }}
          
          This requires immediate attention to maintain service level agreements.
          {{ end }}
        headers:
          Priority: 'urgent'
    webhook_configs:
      - url: 'http://api:3000/webhooks/alerts/sla'
        send_resolved: true

inhibit_rules:
  # Suppress warning if critical alert is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  # Suppress specific alerts when service is down
  - source_match:
      alertname: 'InstanceDown'
    target_match_re:
      alertname: '(HighCPU|HighMemory|DiskSpaceLow)'
    equal: ['instance']

# Notification templates
templates:
  - '/etc/alertmanager/templates/*.tmpl'
