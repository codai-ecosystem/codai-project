# ROMAI Elastalert2 Configuration
# Advanced alerting rules with ML integration and multi-channel notifications

rules_folder: /opt/elastalert/rules
run_every:
  minutes: 1

buffer_time:
  minutes: 15

es_host: elasticsearch
es_port: 9200
es_username: elastic
es_password: ${ELASTIC_PASSWORD}

writeback_index: elastalert_status
writeback_alias: elastalert_alerts

alert_time_limit:
  days: 2

# Email notification configuration
smtp_host: smtp.office365.com
smtp_port: 587
smtp_ssl: false
smtp_auth_file: /opt/elastalert/config/smtp_auth.yaml
from_addr: alerts@romai-corp.com

# Slack webhook configuration
slack_webhook_url: ${SLACK_WEBHOOK_URL}
slack_channel_override: "#alerts-critical"
slack_username_override: "ROMAI-AlertBot"

# Microsoft Teams webhook
ms_teams_webhook_url: ${TEAMS_WEBHOOK_URL}

# PagerDuty integration
pagerduty_service_key: ${PAGERDUTY_SERVICE_KEY}

# Jira integration for incident tracking
jira_server: ${JIRA_SERVER}
jira_user: ${JIRA_USER}
jira_password: ${JIRA_PASSWORD}
jira_project: ROMAI
jira_issue_type: Bug

# Logging configuration
logging:
  version: 1
  incremental: false
  disable_existing_loggers: false
  formatters:
    logline:
      format: '%(asctime)s %(levelname)+8s %(name)+20s %(message)s'
  handlers:
    console:
      class: logging.StreamHandler
      formatter: logline
      level: INFO
      stream: ext://sys.stderr
    file:
      class: logging.handlers.RotatingFileHandler
      formatter: logline
      level: INFO
      filename: /opt/elastalert/logs/elastalert.log
      maxBytes: 10485760
      backupCount: 5
  loggers:
    elastalert:
      level: INFO
      handlers: [console, file]
      propagate: false
    elasticsearch:
      level: INFO
      handlers: [console, file]
      propagate: false
    requests:
      level: WARNING
      handlers: [console, file]
      propagate: false
  root:
    level: INFO
    handlers: [console, file]

# Global alert enhancement
alert_text: |
  Alert Summary: {0}
  
  Service: {1}
  Severity: {2}
  Time: {3}
  
  Details:
  {4}
  
  Kibana Dashboard: http://kibana:5601/app/dashboards#/view/romai-log-analysis-dashboard
  Grafana Dashboard: http://grafana:3000/d/romai-system-health
  
  Investigation Guide: https://docs.romai-corp.com/incident-response
  
alert_text_args:
  - rule.name
  - service
  - severity
  - '@timestamp'
  - message

include:
  - "rules/*.yaml"
