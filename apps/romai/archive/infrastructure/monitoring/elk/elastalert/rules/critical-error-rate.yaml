# ROMAI Critical Error Rate Alert
# Detects spikes in error rates with ML integration

name: romai-critical-error-rate
type: percentage_match
index: romai-logs-*

# Query configuration
query_key: service
doc_type: _doc

# Error detection criteria
percentage: 10  # Alert if errors exceed 10% of total requests
min_events: 100  # Minimum 100 events to trigger alert

# Time window
timeframe:
  minutes: 10

# Filters
filter:
- terms:
    severity: ["error", "critical"]
- exists:
    field: service

# ML anomaly integration
ml_anomaly_detection:
  job_id: romai-error-rate-anomaly
  anomaly_threshold: 75
  integration_enabled: true

# Alert frequency limits
realert:
  minutes: 30

exponential_realert:
  hours: 2

# Enrichment and correlation
include:
  - "@timestamp"
  - service
  - severity
  - message
  - error_code
  - correlation_id
  - user_id
  - endpoint
  - response_time

# Multiple alert channels
alert:
  - "email"
  - "slack"
  - "pagerduty"

# Email configuration
email:
  - "sre-team@romai-corp.com"
  - "engineering-leads@romai-corp.com"

email_subject: "🚨 CRITICAL: Error Rate Spike in {0}"
email_subject_args:
  - service

email_body: |
  CRITICAL ALERT: Error Rate Spike Detected
  
  Service: {0}
  Error Rate: {1}%
  Time Window: {2}
  Total Errors: {3}
  
  Top Error Messages:
  {4}
  
  Correlation IDs for Investigation:
  {5}
  
  Immediate Actions Required:
  1. Check service health dashboard
  2. Review recent deployments
  3. Investigate correlation IDs
  4. Scale resources if needed
  
  Kibana Dashboard: http://kibana:5601/app/dashboards#/view/romai-log-analysis-dashboard
  Grafana Alerts: http://grafana:3000/alerting/list
  
email_body_args:
  - service
  - percentage
  - timeframe
  - num_events
  - top_count_keys
  - correlation_id

# Slack notification
slack_title: "🚨 Critical Error Rate Alert"
slack_text: |
  *Service:* {0}
  *Error Rate:* {1}%
  *Time:* {2}
  *Total Errors:* {3}
  
  <http://kibana:5601/app/dashboards#/view/romai-log-analysis-dashboard|View Dashboard>

slack_text_args:
  - service
  - percentage
  - "@timestamp"
  - num_events

# PagerDuty integration
pagerduty_client: "ROMAI Monitoring"
pagerduty_description: "Critical error rate spike in {0} service"

# Custom fields for Jira ticket creation
jira_labels:
  - "critical"
  - "error-spike"
  - "production"

jira_priority: "Highest"
jira_summary: "Critical Error Rate Spike: {0}"
jira_description: |
  h2. Critical Error Rate Alert
  
  *Service:* {0}
  *Error Rate:* {1}%
  *Detection Time:* {2}
  *Total Errors:* {3}
  
  h3. Investigation Steps:
  # Check service health metrics
  # Review recent code deployments
  # Analyze error patterns and correlation IDs
  # Implement immediate mitigation if needed
  
  h3. Links:
  * [Kibana Dashboard|http://kibana:5601/app/dashboards#/view/romai-log-analysis-dashboard]
  * [Grafana Metrics|http://grafana:3000/d/romai-system-health]
  * [Incident Runbook|https://docs.romai-corp.com/incident-response/error-spike]
