# ROMAI Security Threat Detection Alert
# Advanced security monitoring with ML-driven threat detection

name: romai-security-threats
type: frequency
index: romai-logs-*

# Frequency threshold
num_events: 5
timeframe:
  minutes: 5

# Query for security events
filter:
- bool:
    should:
      - term:
          log_type: "security"
      - term:
          log_type: "auth"
      - range:
          threat_score:
            gte: 7
      - term:
          auth_event: "login_failed"
      - term:
          blocked: true

# Group by IP for pattern detection
query_key: client_ip

# ML integration for anomaly detection
ml_anomaly_detection:
  job_id: romai-security-anomaly
  anomaly_threshold: 70
  enable_correlation: true

# Alert frequency controls
realert:
  minutes: 15

exponential_realert:
  hours: 1

# Data enrichment
include:
  - "@timestamp"
  - client_ip
  - geoip.country_name
  - geoip.city_name
  - threat_score
  - auth_event
  - user_id
  - endpoint
  - user_agent
  - attack_type
  - blocked

# Multi-channel alerting
alert:
  - "email"
  - "slack"
  - "ms_teams"

# Email notification
email:
  - "security-team@romai-corp.com"
  - "soc@romai-corp.com"

email_subject: "🔒 SECURITY ALERT: Threat Detected from {0}"
email_subject_args:
  - client_ip

email_body: |
  SECURITY THREAT DETECTED
  
  Source IP: {0}
  Location: {1}, {2}
  Threat Score: {3}/10
  Events Count: {4}
  Time Window: {5} minutes
  
  Attack Details:
  - Attack Type: {6}
  - Target Endpoints: {7}
  - Blocked Status: {8}
  - User Agents: {9}
  
  Geographic Analysis:
  {10}
  
  Immediate Actions:
  1. Verify IP reputation in threat intelligence
  2. Check for successful authentication attempts
  3. Review firewall logs for this IP
  4. Consider temporary IP blocking
  5. Investigate affected user accounts
  
  Security Dashboard: http://kibana:5601/app/dashboards#/view/romai-security-dashboard
  Threat Intelligence: http://security-tools.romai-corp.com/threat-intel
  
email_body_args:
  - client_ip
  - geoip.city_name
  - geoip.country_name
  - threat_score
  - num_events
  - timeframe.minutes
  - attack_type
  - endpoint
  - blocked
  - user_agent
  - geoip

# Slack security channel
slack_channel_override: "#security-alerts"
slack_title: "🔒 Security Threat Detection"
slack_text: |
  *Source IP:* {0}
  *Location:* {1}
  *Threat Score:* {2}/10
  *Events:* {3} in {4} minutes
  *Status:* {5}
  
  <http://kibana:5601/app/dashboards#/view/romai-security-dashboard|Security Dashboard>

slack_text_args:
  - client_ip
  - geoip.country_name
  - threat_score
  - num_events
  - timeframe.minutes
  - blocked

# Microsoft Teams notification
ms_teams_title: "Security Threat Alert"
ms_teams_text: |
  **SECURITY THREAT DETECTED**
  
  - **Source IP:** {0}
  - **Location:** {1}, {2}
  - **Threat Score:** {3}/10
  - **Events:** {4} in {5} minutes
  - **Blocked:** {6}
  
  [View Security Dashboard](http://kibana:5601/app/dashboards#/view/romai-security-dashboard)

ms_teams_text_args:
  - client_ip
  - geoip.city_name
  - geoip.country_name
  - threat_score
  - num_events
  - timeframe.minutes
  - blocked

# Automatic Jira ticket for high-severity threats
jira_labels:
  - "security"
  - "threat-detection"
  - "production"

jira_priority: "High"
jira_summary: "Security Threat from {0} - Score {1}"
jira_description: |
  h2. Security Threat Detection Alert
  
  *Source IP:* {0}
  *Geographic Location:* {1}, {2}
  *Threat Score:* {3}/10
  *Event Count:* {4} events in {5} minutes
  
  h3. Threat Analysis:
  * Attack Type: {6}
  * Blocked Status: {7}
  * Affected Endpoints: {8}
  * User Agents: {9}
  
  h3. Investigation Checklist:
  # [ ] Verify IP reputation in threat intelligence feeds
  # [ ] Check for any successful authentication attempts
  # [ ] Review firewall and WAF logs for this IP
  # [ ] Analyze user account activity if authentication involved
  # [ ] Consider IP blocking if confirmed malicious
  # [ ] Update security rules if new attack pattern identified
  
  h3. Resources:
  * [Security Dashboard|http://kibana:5601/app/dashboards#/view/romai-security-dashboard]
  * [Threat Intelligence Platform|http://security-tools.romai-corp.com/threat-intel]
  * [Security Playbook|https://docs.romai-corp.com/security/incident-response]

# Conditional alerting based on threat score
alert_on_new_data: true
use_count_query: false

# Custom Python enhancement for threat intelligence lookup
enhancement:
  - "threatintel_lookup"
  - "geolocation_enrichment"
