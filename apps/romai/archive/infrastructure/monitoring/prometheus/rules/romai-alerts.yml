# ROMAI Enterprise Alerting Rules
# Comprehensive alert definitions for production monitoring

groups:
  - name: romai-system-alerts
    rules:
      # High CPU Usage Alert
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High CPU usage detected on {{ $labels.instance }}"
          description: "CPU usage is above 80% for more than 5 minutes on {{ $labels.instance }}"

      # Critical CPU Usage Alert
      - alert: CriticalCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 95
        for: 2m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Critical CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 95% for more than 2 minutes on {{ $labels.instance }}"

      # High Memory Usage
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 85% on {{ $labels.instance }}"

      # Critical Memory Usage
      - alert: CriticalMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 95
        for: 2m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Critical memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 95% on {{ $labels.instance }}"

      # Disk Space Warning
      - alert: DiskSpaceWarning
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: system
        annotations:
          summary: "Disk space running low on {{ $labels.instance }}"
          description: "Disk usage is above 80% on {{ $labels.instance }} ({{ $labels.mountpoint }})"

      # Critical Disk Space
      - alert: CriticalDiskSpace
        expr: (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 95
        for: 1m
        labels:
          severity: critical
          service: system
        annotations:
          summary: "Critical disk space on {{ $labels.instance }}"
          description: "Disk usage is above 95% on {{ $labels.instance }} ({{ $labels.mountpoint }})"

  - name: romai-application-alerts
    rules:
      # ROMAI API Service Down
      - alert: ROMAIAPIDown
        expr: up{job="romai-api"} == 0
        for: 1m
        labels:
          severity: critical
          service: romai-api
        annotations:
          summary: "ROMAI API service is down"
          description: "ROMAI API service has been down for more than 1 minute"

      # ROMAI MCP Server Down
      - alert: ROMAIMCPDown
        expr: up{job="romai-mcp"} == 0
        for: 1m
        labels:
          severity: critical
          service: romai-mcp
        annotations:
          summary: "ROMAI MCP Server is down"
          description: "ROMAI MCP Server has been down for more than 1 minute"

      # High API Response Time
      - alert: HighAPIResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="romai-api"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
          service: romai-api
        annotations:
          summary: "High API response time"
          description: "95th percentile response time is above 2 seconds for ROMAI API"

      # Critical API Response Time
      - alert: CriticalAPIResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="romai-api"}[5m])) > 5
        for: 2m
        labels:
          severity: critical
          service: romai-api
        annotations:
          summary: "Critical API response time"
          description: "95th percentile response time is above 5 seconds for ROMAI API"

      # High Error Rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) * 100 > 5
        for: 5m
        labels:
          severity: warning
          service: romai-api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for ROMAI API"

      # Critical Error Rate
      - alert: CriticalErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) * 100 > 15
        for: 2m
        labels:
          severity: critical
          service: romai-api
        annotations:
          summary: "Critical error rate detected"
          description: "Error rate is above 15% for ROMAI API"

  - name: romai-infrastructure-alerts
    rules:
      # Container Down
      - alert: ContainerDown
        expr: absent(container_last_seen) or (time() - container_last_seen) > 60
        for: 1m
        labels:
          severity: critical
          service: docker
        annotations:
          summary: "Container {{ $labels.name }} is down"
          description: "Container {{ $labels.name }} has been down for more than 1 minute"

      # High Container CPU
      - alert: HighContainerCPU
        expr: rate(container_cpu_usage_seconds_total[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
          service: docker
        annotations:
          summary: "High CPU usage in container {{ $labels.name }}"
          description: "Container {{ $labels.name }} CPU usage is above 80%"

      # High Container Memory
      - alert: HighContainerMemory
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: docker
        annotations:
          summary: "High memory usage in container {{ $labels.name }}"
          description: "Container {{ $labels.name }} memory usage is above 85%"

      # Redis Down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          service: redis
        annotations:
          summary: "Redis service is down"
          description: "Redis has been down for more than 1 minute"

      # Database Connection Issues
      - alert: DatabaseConnectionHigh
        expr: postgres_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
          service: postgres
        annotations:
          summary: "High database connections"
          description: "PostgreSQL connection count is above 80"

  - name: romai-business-alerts
    rules:
      # Low Request Volume (potential issue)
      - alert: LowRequestVolume
        expr: rate(http_requests_total[5m]) < 0.1
        for: 10m
        labels:
          severity: warning
          service: business
        annotations:
          summary: "Unusually low request volume"
          description: "Request rate is below 0.1 requests/second for 10 minutes"

      # High MCP Session Count
      - alert: HighMCPSessions
        expr: romai_mcp_active_sessions > 100
        for: 5m
        labels:
          severity: warning
          service: romai-mcp
        annotations:
          summary: "High number of active MCP sessions"
          description: "More than 100 active MCP sessions detected"

      # Intelligence Processing Backlog
      - alert: IntelligenceProcessingBacklog
        expr: romai_intelligence_queue_size > 50
        for: 5m
        labels:
          severity: warning
          service: romai-intelligence
        annotations:
          summary: "Intelligence processing backlog detected"
          description: "Intelligence processing queue has more than 50 pending requests"

  - name: romai-sla-alerts
    rules:
      # SLA Violation - 99.9% Uptime
      - alert: SLAUptimeViolation
        expr: (1 - rate(up[24h])) * 100 > 0.1
        for: 1m
        labels:
          severity: critical
          service: sla
        annotations:
          summary: "SLA uptime violation detected"
          description: "Service uptime is below 99.9% in the last 24 hours"

      # SLA Violation - Response Time
      - alert: SLAResponseTimeViolation
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[1h])) > 1
        for: 5m
        labels:
          severity: critical
          service: sla
        annotations:
          summary: "SLA response time violation"
          description: "95th percentile response time is above 1 second (SLA violation)"
