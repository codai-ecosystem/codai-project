<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROMAI Real-time Analytics Dashboard - TypeScript</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            overflow-x: hidden;
        }

        .header {
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ff9f;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4757;
            animation: pulse 2s infinite;
        }

        .status-indicator.connected {
            background: #00ff9f;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
            padding: 2rem;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
        }

        .widget {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            height: 300px;
            display: flex;
            flex-direction: column;
        }

        .widget-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .widget-title {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .widget-count {
            background: rgba(0, 255, 159, 0.2);
            color: #00ff9f;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .widget-content {
            flex: 1;
            overflow-y: auto;
            font-size: 0.9rem;
        }

        .log-entry,
        .metric-entry,
        .performance-entry,
        .health-entry {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            border-left: 4px solid;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .log-entry {
            background: rgba(52, 152, 219, 0.2);
            border-left-color: #3498db;
        }

        .log-entry.ERROR {
            background: rgba(231, 76, 60, 0.2);
            border-left-color: #e74c3c;
        }

        .log-entry.WARN {
            background: rgba(241, 196, 15, 0.2);
            border-left-color: #f1c40f;
        }

        .metric-entry {
            background: rgba(155, 89, 182, 0.2);
            border-left-color: #9b59b6;
        }

        .performance-entry {
            background: rgba(26, 188, 156, 0.2);
            border-left-color: #1abc9c;
        }

        .health-entry {
            background: rgba(46, 204, 113, 0.2);
            border-left-color: #2ecc71;
        }

        .health-entry.unhealthy {
            background: rgba(231, 76, 60, 0.2);
            border-left-color: #e74c3c;
        }

        .entry-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .service-name {
            font-weight: 600;
            color: #00ff9f;
        }

        .timestamp {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .entry-data {
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .controls {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            display: flex;
            gap: 1rem;
        }

        .control-btn {
            background: rgba(0, 255, 159, 0.2);
            border: 1px solid #00ff9f;
            color: #00ff9f;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: #00ff9f;
            color: #000;
            transform: translateY(-2px);
        }

        .stats {
            display: flex;
            gap: 1rem;
            font-size: 0.9rem;
        }

        .stat {
            background: rgba(0, 0, 0, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 15px;
        }

        /* Scrollbar styling */
        .widget-content::-webkit-scrollbar {
            width: 6px;
        }

        .widget-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .widget-content::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 159, 0.5);
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="logo">🚀 ROMAI Real-time Analytics</div>
        <div class="connection-status">
            <div class="status-indicator" id="statusIndicator"></div>
            <span id="connectionStatus">Disconnected</span>
        </div>
        <div class="stats">
            <div class="stat">TypeScript Server</div>
            <div class="stat" id="clientsCount">Clients: 0</div>
            <div class="stat" id="messagesCount">Messages: 0</div>
        </div>
    </div>

    <div class="dashboard">
        <div class="widget">
            <div class="widget-header">
                <span class="widget-title">📋 Recent Logs</span>
                <span class="widget-count" id="logsCount">0</span>
            </div>
            <div class="widget-content" id="logsContainer"></div>
        </div>

        <div class="widget">
            <div class="widget-header">
                <span class="widget-title">📊 System Metrics</span>
                <span class="widget-count" id="metricsCount">0</span>
            </div>
            <div class="widget-content" id="metricsContainer"></div>
        </div>

        <div class="widget">
            <div class="widget-header">
                <span class="widget-title">⚡ Performance</span>
                <span class="widget-count" id="performanceCount">0</span>
            </div>
            <div class="widget-content" id="performanceContainer"></div>
        </div>

        <div class="widget">
            <div class="widget-header">
                <span class="widget-title">💚 Health Status</span>
                <span class="widget-count" id="healthCount">0</span>
            </div>
            <div class="widget-content" id="healthContainer"></div>
        </div>
    </div>

    <div class="controls">
        <button class="control-btn" onclick="toggleConnection()">🔌 Connect/Disconnect</button>
        <button class="control-btn" onclick="clearAllData()">🧹 Clear All</button>
        <button class="control-btn" onclick="exportData()">💾 Export Data</button>
    </div>

    <script>
        class RomaiDashboard {
            constructor() {
                this.ws = null;
                this.isConnected = false;
                this.reconnectAttempts = 0;
                this.maxReconnectAttempts = 5;
                this.reconnectDelay = 2000;

                this.counters = {
                    logs: 0,
                    metrics: 0,
                    performance: 0,
                    health: 0,
                    total: 0
                };

                this.data = {
                    logs: [],
                    metrics: [],
                    performance: [],
                    health: []
                };

                this.connect();
                this.updateUI();
            }

            connect() {
                try {
                    console.log('🔌 Connecting to ROMAI TypeScript server...');
                    this.ws = new WebSocket('ws://localhost:8765');

                    this.ws.onopen = () => {
                        console.log('✅ Connected to ROMAI server');
                        this.isConnected = true;
                        this.reconnectAttempts = 0;
                        this.updateConnectionStatus();

                        // Subscribe to all streams
                        this.send({
                            type: 'subscribe',
                            streams: ['logs', 'metrics', 'performance', 'health']
                        });

                        // Get server status
                        this.send({ type: 'get_status' });
                    };

                    this.ws.onmessage = (event) => {
                        try {
                            const message = JSON.parse(event.data);
                            this.handleMessage(message);
                        } catch (error) {
                            console.error('Error parsing message:', error);
                        }
                    };

                    this.ws.onclose = () => {
                        console.log('🔌 Connection closed');
                        this.isConnected = false;
                        this.updateConnectionStatus();
                        this.attemptReconnect();
                    };

                    this.ws.onerror = (error) => {
                        console.error('❌ WebSocket error:', error);
                        this.isConnected = false;
                        this.updateConnectionStatus();
                    };

                } catch (error) {
                    console.error('❌ Connection failed:', error);
                    this.attemptReconnect();
                }
            }

            send(message) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(message));
                }
            }

            handleMessage(message) {
                console.log('📨 Received:', message);

                switch (message.type) {
                    case 'connection_established':
                        this.updateClientsCount(message.client_count);
                        break;
                    case 'status':
                        this.updateClientsCount(message.connected_clients);
                        break;
                    default:
                        if (message.stream_type) {
                            this.addStreamData(message);
                        }
                }
            }

            addStreamData(data) {
                const type = data.stream_type;

                if (this.data[type]) {
                    this.data[type].unshift(data);
                    if (this.data[type].length > 100) {
                        this.data[type] = this.data[type].slice(0, 100);
                    }

                    this.counters[type]++;
                    this.counters.total++;

                    this.updateWidget(type);
                    this.updateCounters();
                }
            }

            updateWidget(type) {
                const container = document.getElementById(`${type}Container`);
                const data = this.data[type][0]; // Most recent data

                if (!container || !data) return;

                const entry = document.createElement('div');
                entry.className = `${type}-entry`;

                if (type === 'logs' && data.data.level) {
                    entry.classList.add(data.data.level);
                }

                if (type === 'health' && data.data.status === 'unhealthy') {
                    entry.classList.add('unhealthy');
                }

                entry.innerHTML = `
                    <div class="entry-header">
                        <span class="service-name">${data.service}</span>
                        <span class="timestamp">${this.formatTime(data.timestamp)}</span>
                    </div>
                    <div class="entry-data">${this.formatData(data.data)}</div>
                `;

                container.insertBefore(entry, container.firstChild);

                // Keep only recent entries
                while (container.children.length > 50) {
                    container.removeChild(container.lastChild);
                }
            }

            formatData(data) {
                return Object.entries(data)
                    .map(([key, value]) => `<strong>${key}:</strong> ${value}`)
                    .join(' • ');
            }

            formatTime(timestamp) {
                return new Date(timestamp).toLocaleTimeString();
            }

            updateConnectionStatus() {
                const indicator = document.getElementById('statusIndicator');
                const status = document.getElementById('connectionStatus');

                if (this.isConnected) {
                    indicator.classList.add('connected');
                    status.textContent = 'Connected to TypeScript Server';
                } else {
                    indicator.classList.remove('connected');
                    status.textContent = 'Disconnected';
                }
            }

            updateCounters() {
                Object.keys(this.counters).forEach(type => {
                    const element = document.getElementById(`${type}Count`);
                    if (element) {
                        element.textContent = this.counters[type];
                    }
                });

                document.getElementById('messagesCount').textContent = `Messages: ${this.counters.total}`;
            }

            updateClientsCount(count) {
                document.getElementById('clientsCount').textContent = `Clients: ${count}`;
            }

            attemptReconnect() {
                if (this.reconnectAttempts < this.maxReconnectAttempts) {
                    this.reconnectAttempts++;
                    console.log(`🔄 Attempting to reconnect (${this.reconnectAttempts}/${this.maxReconnectAttempts})...`);

                    setTimeout(() => {
                        this.connect();
                    }, this.reconnectDelay * this.reconnectAttempts);
                } else {
                    console.log('❌ Max reconnection attempts reached');
                }
            }

            updateUI() {
                setInterval(() => {
                    if (this.isConnected) {
                        this.send({ type: 'ping' });
                    }
                }, 30000); // Ping every 30 seconds
            }
        }

        // Global functions for controls
        let dashboard;

        function toggleConnection() {
            if (dashboard.isConnected) {
                dashboard.ws.close();
            } else {
                dashboard.reconnectAttempts = 0;
                dashboard.connect();
            }
        }

        function clearAllData() {
            ['logs', 'metrics', 'performance', 'health'].forEach(type => {
                const container = document.getElementById(`${type}Container`);
                if (container) {
                    container.innerHTML = '';
                }
                dashboard.data[type] = [];
                dashboard.counters[type] = 0;
            });
            dashboard.counters.total = 0;
            dashboard.updateCounters();
        }

        function exportData() {
            const exportData = {
                timestamp: new Date().toISOString(),
                server: 'TypeScript WebSocket Server',
                counters: dashboard.counters,
                data: dashboard.data
            };

            const blob = new Blob([JSON.stringify(exportData, null, 2)],
                { type: 'application/json' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = `romai-analytics-${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Initialize dashboard when page loads
        window.addEventListener('load', () => {
            dashboard = new RomaiDashboard();
        });
    </script>
</body>

</html>
