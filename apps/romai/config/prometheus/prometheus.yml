# Prometheus Configuration for RomAI AGI Production Monitoring
# ===========================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'romai-agi-monitor'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "romai_alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics
    scrape_interval: 5s

  # RomAI AGI Server monitoring
  - job_name: 'romai-agi'
    static_configs:
      - targets: ['romai-agi:6101']
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true
    params:
      format: ['prometheus']

  # RomAI Enterprise API monitoring
  - job_name: 'romai-enterprise-api'
    static_configs:
      - targets: ['romai-enterprise-api:8001']
    metrics_path: /api/v1/metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # Frontend monitoring
  - job_name: 'romai-frontend'
    static_configs:
      - targets: ['romai-frontend:6100']
    metrics_path: /api/metrics
    scrape_interval: 15s

  # Database monitoring - PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']
    scrape_interval: 15s

  # Redis monitoring
  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']
    scrape_interval: 15s

  # NGINX monitoring
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx_exporter:9113']
    scrape_interval: 15s

  # Node monitoring (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node_exporter:9100']
    scrape_interval: 15s

  # Docker container monitoring
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 10s
    metrics_path: /metrics

  # Blackbox monitoring (external endpoints)
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://romai-frontend:6100/health
        - http://romai-enterprise-api:8001/api/v1/health
        - http://romai-agi:6101/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115

  # Custom RomAI metrics
  - job_name: 'romai-custom-metrics'
    static_configs:
      - targets: ['romai-agi:6101']
    metrics_path: /api/v1/metrics/custom
    scrape_interval: 30s
    params:
      format: ['json']

# Remote write configuration for long-term storage (optional)
# remote_write:
#   - url: "https://prometheus-remote-write-endpoint.com/api/v1/write"
#     basic_auth:
#       username: "your-username"
#       password: "your-password"

# Storage configuration
storage:
  tsdb:
    retention.time: 30d
    retention.size: 50GB
    wal-compression: true