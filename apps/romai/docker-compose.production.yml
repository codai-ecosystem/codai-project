# 🐳 RomAI Enterprise Platform - Docker Compose Configuration
# Production-grade multi-service deployment for on-premise installations

version: '3.8'

services:
  # PostgreSQL Database - Production data storage
  postgres:
    image: postgres:15-alpine
    container_name: romai-postgres
    environment:
      POSTGRES_DB: romai_enterprise
      POSTGRES_USER: romai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-romai_secure_2025}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - romai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U romai -d romai_enterprise"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache - High-performance caching and session storage
  redis:
    image: redis:7-alpine
    container_name: romai-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-romai_cache_2025}
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - romai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # CBD Database - Core Business Database
  cbd-database:
    image: node:18-alpine
    container_name: romai-cbd-database
    working_dir: /app
    command: ["node", "src/start.js"]
    environment:
      PORT: 4180
      NODE_ENV: production
      CBD_LOG_LEVEL: info
      POSTGRES_URL: postgresql://romai:${POSTGRES_PASSWORD:-romai_secure_2025}@postgres:5432/romai_enterprise
      REDIS_URL: redis://:${REDIS_PASSWORD:-romai_cache_2025}@redis:6379
    volumes:
      - ./packages/cbd:/app
      - cbd_data:/app/data
    ports:
      - "4180:4180"
    networks:
      - romai-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4180/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # RomAI AGI Model Server - Core AI intelligence
  romai-agi:
    build:
      context: .
      dockerfile: apps/romai/Dockerfile.agi
    container_name: romai-agi-server
    environment:
      ROMAI_AGI_HOST: 0.0.0.0
      ROMAI_AGI_PORT: 6101
      ROMAI_LOG_LEVEL: INFO
      MODEL_CACHE_DIR: /app/cache/models
      TRANSFORMERS_CACHE: /app/cache/transformers
      HF_HOME: /app/cache/huggingface
      REDIS_URL: redis://:${REDIS_PASSWORD:-romai_cache_2025}@redis:6379
      CBD_BASE_URL: http://cbd-database:4180
    volumes:
      - agi_models:/app/cache
      - agi_logs:/app/logs
    ports:
      - "6101:6101"
    networks:
      - romai-network
    depends_on:
      cbd-database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6101/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'

  # RomAI Enterprise API - Production API gateway
  romai-enterprise-api:
    build:
      context: .
      dockerfile: apps/romai/Dockerfile.enterprise
    container_name: romai-enterprise-api
    environment:
      ROMAI_ENV: production
      ROMAI_LOG_LEVEL: info
      ROMAI_AGI_URL: http://romai-agi:6101
      CBD_BASE_URL: http://cbd-database:4180
      REDIS_URL: redis://:${REDIS_PASSWORD:-romai_cache_2025}@redis:6379
      POSTGRES_URL: postgresql://romai:${POSTGRES_PASSWORD:-romai_secure_2025}@postgres:5432/romai_enterprise
      API_SECRET_KEY: ${API_SECRET_KEY:-romai_enterprise_secret_2025}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-romai_jwt_secret_2025}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
    volumes:
      - api_logs:/app/logs
      - api_data:/app/data
    ports:
      - "8001:8001"
    networks:
      - romai-network
    depends_on:
      romai-agi:
        condition: service_healthy
      cbd-database:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # RomAI Frontend Application - User interface
  romai-frontend:
    build:
      context: ./apps/romai
      dockerfile: Dockerfile
    container_name: romai-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://romai-enterprise-api:8001
      NEXT_PUBLIC_AGI_URL: http://romai-agi:6101
    ports:
      - "6100:6100"
    networks:
      - romai-network
    depends_on:
      romai-enterprise-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6100/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Prometheus Monitoring - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: romai-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - romai-network
    restart: unless-stopped

  # Grafana Dashboards - Monitoring visualization
  grafana:
    image: grafana/grafana:latest
    container_name: romai-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-romai_admin_2025}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    networks:
      - romai-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Nginx Reverse Proxy - Load balancing and SSL termination
  nginx:
    image: nginx:alpine
    container_name: romai-nginx
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - romai-network
    depends_on:
      - romai-enterprise-api
      - romai-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

# Named volumes for persistent data
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  cbd_data:
    driver: local
  agi_models:
    driver: local
  agi_logs:
    driver: local
  api_logs:
    driver: local
  api_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_logs:
    driver: local

# Networks
networks:
  romai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
