# 🐳 RomAI Enterprise Platform - Docker Compose Configuration
# ==============================================================================
# Production-grade multi-service deployment for on-premise installations
# Todo #15: Production Deployment Optimization - Complete Enterprise Stack
# ==============================================================================
#
# Features:
# ✅ Multi-service architecture with advanced orchestration
# ✅ Production-grade monitoring and observability stack
# ✅ High availability with load balancing and failover
# ✅ Security hardening and secrets management
# ✅ Performance optimization and resource management
# ✅ Automated scaling and health monitoring
# ✅ Enterprise compliance and governance
#
# Architecture:
# - Load Balancer (Nginx) → Frontend & Enterprise API
# - AGI Model Server → Core ML Intelligence
# - CBD Database → Business Logic & Data
# - PostgreSQL → Primary Data Storage
# - Redis → Caching & Session Management
# - Monitoring Stack → Prometheus + Grafana
# ==============================================================================

version: '3.8'

services:
  # PostgreSQL Database - Production data storage
  postgres:
    image: postgres:15-alpine
    container_name: romai-postgres
    environment:
      POSTGRES_DB: romai_enterprise
      POSTGRES_USER: romai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-romai_secure_2025}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - romai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U romai -d romai_enterprise"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis Cache - High-performance caching and session storage
  redis:
    image: redis:7-alpine
    container_name: romai-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-romai_cache_2025}
    volumes:
      - redis_data:/data
      - ./config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - romai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # CBD Database - Core Business Database
  cbd-database:
    image: node:18-alpine
    container_name: romai-cbd-database
    working_dir: /app
    command: ["node", "src/start.js"]
    environment:
      PORT: 4180
      NODE_ENV: production
      CBD_LOG_LEVEL: info
      POSTGRES_URL: postgresql://romai:${POSTGRES_PASSWORD:-romai_secure_2025}@postgres:5432/romai_enterprise
      REDIS_URL: redis://:${REDIS_PASSWORD:-romai_cache_2025}@redis:6379
    volumes:
      - ./packages/cbd:/app
      - cbd_data:/app/data
    ports:
      - "4180:4180"
    networks:
      - romai-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4180/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # RomAI AGI Model Server - Core AI Intelligence with Production Optimization
  romai-agi:
    build:
      context: .
      dockerfile: Dockerfile.production  # Use the production Dockerfile we created
      cache_from:
        - romai/agi:cache
        - romai/agi:latest
    image: romai/agi:production
    container_name: romai-agi-server
    restart: unless-stopped
    environment:
      # Core AGI Configuration
      ROMAI_AGI_HOST: 0.0.0.0
      ROMAI_AGI_PORT: 6101
      ROMAI_LOG_LEVEL: INFO
      ROMAI_ENV: production
      
      # Model & Cache Paths
      MODEL_CACHE_DIR: /app/cache/models
      TRANSFORMERS_CACHE: /app/cache/transformers
      HF_HOME: /app/cache/huggingface
      
      # Service Integration
      REDIS_URL: redis://:${REDIS_PASSWORD:-romai_cache_2025}@redis:6379
      CBD_BASE_URL: http://cbd-database:4180
      POSTGRES_URL: postgresql://romai:${POSTGRES_PASSWORD:-romai_secure_2025}@postgres:5432/romai_enterprise
      
      # Azure OpenAI Integration
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-https://swedencentral.api.cognitive.microsoft.com/}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:-text-embedding-3-large}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-02-01}
      
      # Production Features
      ENABLE_GPU: ${ENABLE_GPU:-false}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      PYTORCH_CUDA_ALLOC_CONF: max_split_size_mb:1024
      
      # Advanced AGI Features - All 14 Training Systems Active
      ENABLE_MATHEMATICAL_REASONING: true
      ENABLE_AUTONOMOUS_PROBLEM_SOLVING: true
      ENABLE_META_LEARNING: true
      ENABLE_REAL_TIME_LEARNING: true
      ENABLE_CODE_GENERATION: true
      ENABLE_RLHF_TRAINING: true
      ENABLE_CONSTITUTIONAL_AI: true
      ENABLE_MULTIMODAL_TRAINING: true
      ENABLE_SYNTHETIC_DATA_GENERATION: true
      ENABLE_ADVANCED_TRAINING_METHODOLOGIES: true
      ENABLE_ROMANIAN_LANGUAGE_SPECIALIZATION: true
      
      # Performance Optimization
      QUANTUM_ENABLED: ${QUANTUM_ENABLED:-true}
      CONSCIOUSNESS_ENGINE: ${CONSCIOUSNESS_ENGINE:-true}
      ENABLE_MONITORING: true
      ENABLE_ANALYTICS: true
    volumes:
      - agi_models:/app/cache
      - agi_logs:/app/logs
      - agi_data:/app/data
    ports:
      - "6101:6101"
    networks:
      - romai-network
    depends_on:
      cbd-database:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6101/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s  # AGI models need time to load
    deploy:
      resources:
        limits:
          memory: 8G  # Increased for production AGI workloads
          cpus: '4.0'  # Enhanced CPU allocation
        reservations:
          memory: 4G
          cpus: '2.0'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service=romai-agi,environment=production"

  # RomAI Enterprise API - Production API gateway
  romai-enterprise-api:
    build:
      context: .
      dockerfile: apps/romai/Dockerfile.enterprise
    container_name: romai-enterprise-api
    environment:
      ROMAI_ENV: production
      ROMAI_LOG_LEVEL: info
      ROMAI_AGI_URL: http://romai-agi:6101
      CBD_BASE_URL: http://cbd-database:4180
      REDIS_URL: redis://:${REDIS_PASSWORD:-romai_cache_2025}@redis:6379
      POSTGRES_URL: postgresql://romai:${POSTGRES_PASSWORD:-romai_secure_2025}@postgres:5432/romai_enterprise
      API_SECRET_KEY: ${API_SECRET_KEY:-romai_enterprise_secret_2025}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-romai_jwt_secret_2025}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
    volumes:
      - api_logs:/app/logs
      - api_data:/app/data
    ports:
      - "8001:8001"
    networks:
      - romai-network
    depends_on:
      romai-agi:
        condition: service_healthy
      cbd-database:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # RomAI Frontend Application - User Interface with Production Optimization
  romai-frontend:
    build:
      context: ./apps/romai
      dockerfile: Dockerfile
      cache_from:
        - romai/frontend:cache
    image: romai/frontend:production
    container_name: romai-frontend
    restart: unless-stopped
    environment:
      # Core Frontend Configuration
      NODE_ENV: production
      PORT: 6100
      
      # Service Integration URLs
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      NEXT_PUBLIC_AGI_URL: ${NEXT_PUBLIC_AGI_URL:-http://localhost:6101}
      NEXT_PUBLIC_CBD_URL: ${NEXT_PUBLIC_CBD_URL:-http://localhost:4180}
      
      # Internal Service URLs
      ROMAI_AGI_BASE_URL: http://romai-agi:6101
      ROMAI_ENTERPRISE_API_URL: http://romai-enterprise-api:8001
      CBD_BASE_URL: http://cbd-database:4180
      
      # Performance Optimization
      NODE_OPTIONS: "--max-old-space-size=4096"
      NEXT_TELEMETRY_DISABLED: 1
      
      # Security & Authentication
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-romai_jwt_secret_2025}
      API_SECRET_KEY: ${API_SECRET_KEY:-romai_enterprise_secret_2025}
      
      # Redis Session Management
      REDIS_URL: redis://:${REDIS_PASSWORD:-romai_cache_2025}@redis:6379
      SESSION_SECRET: ${SESSION_SECRET:-romai_session_secret_2025}
      
      # Production Features
      ENABLE_ANALYTICS: true
      ENABLE_ERROR_REPORTING: true
      ENABLE_PERFORMANCE_MONITORING: true
    ports:
      - "6100:6100"
    networks:
      - romai-network
    depends_on:
      romai-enterprise-api:
        condition: service_healthy
      romai-agi:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G  # Optimized for Next.js production
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        labels: "service=romai-frontend,environment=production"

  # Prometheus Monitoring - Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: romai-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - romai-network
    restart: unless-stopped

  # Grafana Dashboards - Monitoring visualization
  grafana:
    image: grafana/grafana:latest
    container_name: romai-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-romai_admin_2025}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    networks:
      - romai-network
    depends_on:
      - prometheus
    restart: unless-stopped

  # Nginx Reverse Proxy - Production Load Balancing & SSL Termination
  nginx:
    image: nginx:1.25-alpine
    container_name: romai-nginx
    restart: unless-stopped
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"      # HTTP
      - "443:443"    # HTTPS
      - "8404:8404"  # Nginx status page
    networks:
      - romai-network
    depends_on:
      - romai-enterprise-api
      - romai-frontend
      - romai-agi
    restart: unless-stopped
    environment:
      # Nginx Production Configuration
      NGINX_WORKER_PROCESSES: auto
      NGINX_WORKER_CONNECTIONS: 1024
      NGINX_KEEPALIVE_TIMEOUT: 65
      NGINX_CLIENT_MAX_BODY_SIZE: 100M
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
        labels: "service=nginx,environment=production"

  # Security Scanner - Trivy for container vulnerability scanning
  security-scanner:
    image: aquasec/trivy:latest
    container_name: romai-security-scanner
    command: ["server", "--listen", "0.0.0.0:8080"]
    ports:
      - "8082:8080"
    networks:
      - romai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  # Backup Service - Automated database and data backups
  backup-service:
    image: postgres:15-alpine
    container_name: romai-backup
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-romai_secure_2025}
    command: |
      sh -c '
      while true; do
        echo "Starting backup at $$(date)"
        pg_dump -h postgres -U romai romai_enterprise > /backups/romai_enterprise_$$(date +%Y%m%d_%H%M%S).sql
        # Keep only last 7 days of backups
        find /backups -name "*.sql" -mtime +7 -delete
        echo "Backup completed at $$(date)"
        sleep 21600  # Run every 6 hours
      done
      '
    volumes:
      - backup_data:/backups
      - postgres_data:/var/lib/postgresql/data:ro
    networks:
      - romai-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

# Named volumes for persistent data with production optimization
volumes:
  # Database Storage
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA_PATH:-./data/postgres}
  
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REDIS_DATA_PATH:-./data/redis}
  
  cbd_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CBD_DATA_PATH:-./data/cbd}
  
  # AGI Model & Cache Storage
  agi_models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${AGI_MODELS_PATH:-./data/models}
  
  agi_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${AGI_DATA_PATH:-./data/agi}
  
  # Application Logs
  agi_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${AGI_LOGS_PATH:-./logs/agi}
  
  api_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${API_LOGS_PATH:-./logs/api}
  
  api_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${API_DATA_PATH:-./data/api}
  
  nginx_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NGINX_LOGS_PATH:-./logs/nginx}
  
  # Monitoring Data
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROMETHEUS_DATA_PATH:-./data/prometheus}
  
  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${GRAFANA_DATA_PATH:-./data/grafana}
  
  # Backup Storage
  backup_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_DATA_PATH:-./backups}

# Networks with production security and isolation
networks:
  romai-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: romai-prod
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
      com.docker.network.driver.mtu: 1500
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1
    labels:
      - "com.romai.environment=production"
      - "com.romai.project=romai-agi"
      - "com.romai.version=1.0.0"

# ==============================================================================
# PRODUCTION DEPLOYMENT COMMANDS
# ==============================================================================
#
# 1. Initial Setup:
#    mkdir -p data/{postgres,redis,cbd,models,agi} logs/{agi,api,nginx} data/{prometheus,grafana} backups
#    chmod 755 data logs backups
#
# 2. Environment Configuration:
#    cp .env.production.template .env.production
#    # Edit .env.production with your values
#
# 3. SSL Certificate Setup:
#    mkdir -p ssl config/nginx/ssl
#    # Place your SSL certificates in ssl/ directory
#
# 4. Launch Production Stack:
#    docker-compose -f docker-compose.production.yml --env-file .env.production up -d
#
# 5. Health Checks:
#    docker-compose -f docker-compose.production.yml ps
#    docker-compose -f docker-compose.production.yml logs -f
#
# 6. Scaling (if needed):
#    docker-compose -f docker-compose.production.yml up -d --scale romai-agi=2
#
# 7. Backup & Maintenance:
#    docker-compose -f docker-compose.production.yml exec backup-service pg_dump -h postgres -U romai romai_enterprise
#
# 8. Security Scanning:
#    docker-compose -f docker-compose.production.yml exec security-scanner trivy image romai/agi:production
#
# 9. Monitoring:
#    # Prometheus: http://localhost:9090
#    # Grafana: http://localhost:3000 (admin/admin)
#    # Nginx Status: http://localhost:8404
#
# 10. Production Shutdown:
#     docker-compose -f docker-compose.production.yml down --volumes --remove-orphans
#
# ==============================================================================
