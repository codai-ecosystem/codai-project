# 🚀 RomAI AGI Production Docker Compose
# Local production environment with full service stack

version: '3.8'

services:
  # =============================================================================
  # 🧠 RomAI AGI Application
  # =============================================================================
  romai-agi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_REVISION: ${BUILD_REVISION:-local}
        BUILD_DATE: ${BUILD_DATE:-2025-08-20}
    image: romai-agi:local
    container_name: romai-agi-app
    ports:
      - "6100:6100"    # Next.js Frontend
      - "8001:8001"    # Python AI API
    environment:
      - NODE_ENV=production
      - ROMAI_ENVIRONMENT=production
      - NEXT_TELEMETRY_DISABLED=1
      - CBD_API_URL=http://cbd-database:4180
      - REDIS_URL=redis://redis-cache:6379
      - DATABASE_URL=postgresql://romai:romai123@postgres-db:5432/romai_production
      - AZURE_OPENAI_ENDPOINT=https://swedencentral.api.cognitive.microsoft.com/
      - AZURE_OPENAI_API_KEY=8f9d3fd033c04f5ab6b5886c15f16a2c
      - AZURE_OPENAI_DEPLOYMENT_NAME=text-embedding-3-large
      - AZURE_OPENAI_API_VERSION=2024-02-01
    volumes:
      - romai-data:/app/data
      - romai-logs:/app/logs
      - ./python:/app/python:ro
    depends_on:
      - cbd-database
      - redis-cache
      - postgres-db
    networks:
      - romai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # =============================================================================
  # 🗄️ CBD Database (Codai Better Database)
  # =============================================================================
  cbd-database:
    build:
      context: ../../packages/cbd
      dockerfile: Dockerfile
    image: romai-cbd:local
    container_name: romai-cbd-db
    ports:
      - "4180:4180"
    environment:
      - CBD_MODE=production
      - CBD_LOG_LEVEL=info
      - CBD_PERSISTENCE=true
      - CBD_BACKUP_ENABLED=true
    volumes:
      - cbd-data:/var/lib/cbd
      - cbd-backups:/var/backups/cbd
    networks:
      - romai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4180/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # =============================================================================
  # 🚀 Redis Cache
  # =============================================================================
  redis-cache:
    image: redis:7-alpine
    container_name: romai-redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=romai_redis_2025
    command: redis-server --requirepass romai_redis_2025 --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - romai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "romai_redis_2025", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  # =============================================================================
  # 🐘 PostgreSQL Database
  # =============================================================================
  postgres-db:
    image: postgres:15-alpine
    container_name: romai-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=romai_production
      - POSTGRES_USER=romai
      - POSTGRES_PASSWORD=romai123
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - romai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U romai -d romai_production"]
      interval: 30s
      timeout: 5s
      retries: 3

  # =============================================================================
  # 📊 Monitoring Stack
  # =============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: romai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - romai-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: romai-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=romai_grafana_2025
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana:/etc/grafana/provisioning:ro
    networks:
      - romai-network
    restart: unless-stopped
    depends_on:
      - prometheus

  # =============================================================================
  # 🔍 Log Management
  # =============================================================================
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: romai-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - romai-network
    restart: unless-stopped

  kibana:
    image: kibana:8.11.0
    container_name: romai-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - romai-network
    restart: unless-stopped

  # =============================================================================
  # 🌐 Reverse Proxy
  # =============================================================================
  nginx:
    image: nginx:alpine
    container_name: romai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/ssl:/etc/ssl/certs:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - romai-agi
    networks:
      - romai-network
    restart: unless-stopped

# =============================================================================
# 📂 Named Volumes
# =============================================================================
volumes:
  romai-data:
    driver: local
  romai-logs:
    driver: local
  cbd-data:
    driver: local
  cbd-backups:
    driver: local
  redis-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  elasticsearch-data:
    driver: local
  nginx-logs:
    driver: local

# =============================================================================
# 🌐 Networks
# =============================================================================
networks:
  romai-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

# =============================================================================
# 🚀 USAGE COMMANDS
# =============================================================================
# Development: docker-compose up -d
# Production: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Logs: docker-compose logs -f romai-agi
# Health: docker-compose ps
# Cleanup: docker-compose down -v
# Rebuild: docker-compose build --no-cache romai-agi

# =============================================================================
# 📊 SERVICE PORTS
# =============================================================================
# RomAI AGI Frontend: http://localhost:3000
# RomAI AGI Python API: http://localhost:8001
# CBD Database: http://localhost:4180
# Redis Cache: localhost:6379
# PostgreSQL: localhost:5432
# Prometheus: http://localhost:9090
# Grafana: http://localhost:3001 (admin/romai_grafana_2025)
# Elasticsearch: http://localhost:9200
# Kibana: http://localhost:5601
# Nginx Proxy: http://localhost:80

# =============================================================================
# 🔒 SECURITY NOTES
# =============================================================================
# - All passwords are examples - change for production
# - Use Docker secrets for sensitive data
# - Enable SSL/TLS in production
# - Configure proper firewall rules
# - Regular security updates required
# - Monitor access logs

# =============================================================================
# 📈 PERFORMANCE OPTIMIZATIONS
# =============================================================================
# - Resource limits configured for all services
# - Health checks ensure service reliability
# - Volume mounts for persistent data
# - Network isolation for security
# - Log rotation and management
# - Monitoring and alerting ready
