# APM Server Configuration for ROMAI Advanced Logging Integration
# Version: 8.11.3
# Purpose: Application Performance Monitoring for real-time trace and metrics collection

# ================================ APM Server Configuration ================================

apm-server:
  # Host and port for APM Server
  host: "0.0.0.0:8200"
  
  # Maximum event size in bytes (default: 307200)
  max_event_size: 307200
  
  # Maximum number of events per request
  max_header_size: 1048576
  
  # Read timeout
  read_timeout: 3600s
  
  # Write timeout
  write_timeout: 30s
  
  # Shutdown timeout
  shutdown_timeout: 30s
  
  # Maximum number of connections
  max_connections: 0
  
  # Response headers
  response_headers:
    "Access-Control-Allow-Headers": "Content-Type, Content-Length, Accept-Encoding, X-CSRF-Token, Authorization, accept, origin, Cache-Control, X-Requested-With"
    "Access-Control-Allow-Methods": "POST, OPTIONS, GET"
    "Access-Control-Allow-Origin": "*"

# ================================ RUM Configuration ================================

apm-server.rum:
  enabled: true
  event_rate:
    limit: 300
    lru_size: 1000
  allow_origins: ["*"]
  library_pattern: "node_modules|bower_components|~"
  exclude_from_grouping: "^/webpack"
  source_mapping:
    enabled: true
    cache:
      expiration: 5m
    index_pattern: "apm-*-sourcemap*"

# ================================ Instrumentation Configuration ================================

apm-server.instrumentation:
  enabled: true
  environment: production
  hosts:
    - "http://elasticsearch:9200"

# ================================ Agent Configuration ================================

apm-server.agent:
  config:
    cache:
      expiration: 30s

# ================================ Sampling Configuration ================================

apm-server.sampling:
  tail:
    enabled: true
    interval: 1m
    policies:
      - sample_rate: 0.1
      - sample_rate: 0.9
        service.name: "romai-*"

# ================================ Jaeger Configuration ================================

apm-server.jaeger:
  grpc:
    enabled: true
    host: "0.0.0.0:14250"
  http:
    enabled: true
    host: "0.0.0.0:14268"

# ================================ Output Configuration ================================

output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  username: "elastic"
  password: "${ELASTIC_PASSWORD:elastic_secure_2025}"
  
  # Index lifecycle
  template.enabled: true
  template.pattern: "apm-*"
  template.settings:
    index:
      number_of_shards: 1
      number_of_replicas: 0
      codec: best_compression
      mapping.total_fields.limit: 2000
  
  # Index configuration
  indices:
    - index: "apm-%{[observer.version]}-sourcemap"
      when.contains:
        processor.event: "sourcemap"
    - index: "apm-%{[observer.version]}-error-%{+yyyy.MM.dd}"
      when.contains:
        processor.event: "error"
    - index: "apm-%{[observer.version]}-transaction-%{+yyyy.MM.dd}"
      when.contains:
        processor.event: "transaction"
    - index: "apm-%{[observer.version]}-span-%{+yyyy.MM.dd}"
      when.contains:
        processor.event: "span"
    - index: "apm-%{[observer.version]}-metric-%{+yyyy.MM.dd}"
      when.contains:
        processor.event: "metric"

# ================================ Kibana Configuration ================================

setup.kibana:
  host: "kibana:5601"
  username: "elastic"
  password: "${ELASTIC_PASSWORD:elastic_secure_2025}"

# ================================ Template Configuration ================================

setup.template:
  enabled: true
  pattern: "apm-*"
  settings:
    index:
      number_of_shards: 1
      number_of_replicas: 0
      mapping.total_fields.limit: 2000

# ================================ Dashboard Configuration ================================

setup.dashboards:
  enabled: true
  retry:
    enabled: true
    interval: 10s
    maximum: 5

# ================================ ILM Configuration ================================

setup.ilm:
  enabled: true
  rollover_alias: "apm"
  pattern: "{now/d}-000001"
  policy: "apm-rollover-30-days"

# ================================ Monitoring Configuration ================================

monitoring:
  enabled: true
  elasticsearch:
    hosts: ["elasticsearch:9200"]
    username: "elastic"
    password: "${ELASTIC_PASSWORD:elastic_secure_2025}"

# ================================ Logging Configuration ================================

logging:
  level: info
  to_files: true
  files:
    path: /usr/share/apm-server/logs
    name: apm-server.log
    keepfiles: 7
    permissions: 0644
    rotateeverybytes: 10485760 # 10MB

# ================================ Processors Configuration ================================

processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_docker_metadata: ~
  - add_kubernetes_metadata: ~

# ================================ X-Pack Configuration ================================

xpack:
  monitoring:
    enabled: true
