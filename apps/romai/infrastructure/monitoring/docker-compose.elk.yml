# ELK Stack Configuration for ROMAI Enterprise Logging
# Elasticsearch + Logstash + Kibana deployment for centralized log management

version: '3.8'

services:
  # Elasticsearch - Primary log storage and search engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: romai-elasticsearch
    restart: unless-stopped
    environment:
      # Cluster Configuration
      - cluster.name=romai-logs-cluster
      - node.name=romai-elasticsearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      
      # Security Configuration
      - xpack.security.enabled=true
      - xpack.security.enrollment.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-elastic_secure_2025}
      
      # Performance Configuration
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.monitoring.collection.enabled=true
      
      # Network Configuration
      - network.host=0.0.0.0
      - http.port=9200
      - transport.port=9300
      
      # Index Configuration
      - action.destructive_requires_name=true
      - cluster.routing.allocation.disk.threshold.enabled=true
      - cluster.routing.allocation.disk.watermark.low=85%
      - cluster.routing.allocation.disk.watermark.high=90%
      
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
      - ./elasticsearch/config:/usr/share/elasticsearch/config
      - ./elasticsearch/logs:/usr/share/elasticsearch/logs
    networks:
      - romai-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Logstash - Log processing pipeline
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.3
    container_name: romai-logstash
    restart: unless-stopped
    environment:
      - "LS_JAVA_OPTS=-Xms1g -Xmx1g"
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-elastic_secure_2025}
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
    ports:
      - "5044:5044"  # Beats input
      - "5000:5000"  # TCP input
      - "9600:9600"  # API endpoint
    volumes:
      - ./logstash/config:/usr/share/logstash/config
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/patterns:/usr/share/logstash/patterns
      - romai-logs:/var/log/romai:ro
    networks:
      - romai-logging
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/_node/stats || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Kibana - Log visualization and analysis
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.3
    container_name: romai-kibana
    restart: unless-stopped
    environment:
      # Elasticsearch Configuration
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_PASSWORD:-kibana_secure_2025}
      
      # Kibana Configuration
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5601
      
      # Security Configuration
      - XPACK_SECURITY_ENABLED=true
      - XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY=${KIBANA_ENCRYPTION_KEY:-32_character_encryption_key_here}
      
      # Monitoring Configuration
      - XPACK_MONITORING_COLLECTION_ENABLED=true
      - XPACK_MONITORING_KIBANA_COLLECTION_ENABLED=true
      
    ports:
      - "5601:5601"
    volumes:
      - ./kibana/config:/usr/share/kibana/config
      - kibana-data:/usr/share/kibana/data
    networks:
      - romai-logging
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Filebeat - Log shipper for application logs
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.3
    container_name: romai-filebeat
    restart: unless-stopped
    user: root
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-elastic_secure_2025}
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - KIBANA_HOST=http://kibana:5601
    volumes:
      - ./filebeat/config/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - romai-logs:/var/log/romai:ro
      - filebeat-data:/usr/share/filebeat/data
    networks:
      - romai-logging
    depends_on:
      - elasticsearch
      - logstash
    command: ["--strict.perms=false"]

  # Metricbeat - System and application metrics
  metricbeat:
    image: docker.elastic.co/beats/metricbeat:8.11.3
    container_name: romai-metricbeat
    restart: unless-stopped
    user: root
    environment:
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-elastic_secure_2025}
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - KIBANA_HOST=http://kibana:5601
    volumes:
      - ./metricbeat/config/metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro
      - /proc:/hostfs/proc:ro
      - /:/hostfs:ro
      - metricbeat-data:/usr/share/metricbeat/data
    networks:
      - romai-logging
    depends_on:
      - elasticsearch
    command: ["--strict.perms=false"]

  # APM Server - Application Performance Monitoring
  apm-server:
    image: docker.elastic.co/apm/apm-server:8.11.3
    container_name: romai-apm-server
    restart: unless-stopped
    environment:
      - apm-server.rum.enabled=true
      - apm-server.host=0.0.0.0:8200
      - setup.kibana.host=kibana:5601
      - output.elasticsearch.hosts=["elasticsearch:9200"]
      - output.elasticsearch.username=elastic
      - output.elasticsearch.password=${ELASTIC_PASSWORD:-elastic_secure_2025}
    ports:
      - "8200:8200"
    volumes:
      - ./apm-server/config/apm-server.yml:/usr/share/apm-server/apm-server.yml:ro
    networks:
      - romai-logging
    depends_on:
      - elasticsearch
      - kibana

  # Elastalert2 - Advanced alerting engine
  elastalert2:
    image: jertel/elastalert2:latest
    container_name: romai-elastalert2
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-elastic_secure_2025}
    volumes:
      - ./elastalert2/config:/opt/elastalert/config
      - ./elastalert2/rules:/opt/elastalert/rules
      - elastalert2-data:/opt/elastalert/data
    networks:
      - romai-logging
    depends_on:
      - elasticsearch

volumes:
  elasticsearch-data:
    driver: local
  kibana-data:
    driver: local
  filebeat-data:
    driver: local
  metricbeat-data:
    driver: local
  elastalert2-data:
    driver: local
  romai-logs:
    driver: local

networks:
  romai-logging:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16
