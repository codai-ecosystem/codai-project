# ROMAI Production Monitoring - Grafana Enterprise Dashboard Configuration
# Enterprise-grade monitoring visualization with 360° system visibility

version: '3.8'

services:
  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: romai-grafana-enterprise
    restart: unless-stopped
    ports:
      - "4094:3000"
    environment:
      # Enterprise Configuration
      - GF_ENTERPRISE_LICENSE_PATH=/etc/grafana/license.jwt
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel
      
      # Security Configuration
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-romai_admin_2025}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY:-romai_secret_key_2025_secure}
      
      # Authentication
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      
      # Database Configuration
      - GF_DATABASE_TYPE=postgres
      - GF_DATABASE_HOST=postgres-grafana:5432
      - GF_DATABASE_NAME=grafana
      - GF_DATABASE_USER=grafana
      - GF_DATABASE_PASSWORD=${POSTGRES_PASSWORD:-grafana_secure_2025}
      
      # SMTP Configuration
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=romai-monitoring@codai.ro
      - GF_SMTP_FROM_NAME=ROMAI Monitoring
      
      # Alerting Configuration
      - GF_ALERTING_ENABLED=true
      - GF_ALERTING_EXECUTE_ALERTS=true
      - GF_ALERTING_ERROR_OR_TIMEOUT=alerting
      - GF_ALERTING_NODATA_OR_NULLVALUES=no_data
      
      # Performance Configuration
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_LOG_LEVEL=info
      - GF_LOG_MODE=console,file
      
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/plugins:/var/lib/grafana/plugins
    networks:
      - romai-monitoring
    depends_on:
      - postgres-grafana
      - prometheus
      - loki

  postgres-grafana:
    image: postgres:15-alpine
    container_name: romai-postgres-grafana
    restart: unless-stopped
    environment:
      - POSTGRES_DB=grafana
      - POSTGRES_USER=grafana
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-grafana_secure_2025}
    volumes:
      - postgres-grafana-data:/var/lib/postgresql/data
    networks:
      - romai-monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: romai-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/rules:/etc/prometheus/rules
      - prometheus-data:/prometheus
    networks:
      - romai-monitoring

  node-exporter:
    image: prom/node-exporter:latest
    container_name: romai-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - romai-monitoring

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: romai-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - romai-monitoring

  loki:
    image: grafana/loki:latest
    container_name: romai-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - romai-monitoring

  promtail:
    image: grafana/promtail:latest
    container_name: romai-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yml
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - romai-monitoring

  alertmanager:
    image: prom/alertmanager:latest
    container_name: romai-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - romai-monitoring

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: romai-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
    networks:
      - romai-monitoring
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: romai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secure_2025}
    volumes:
      - redis-data:/data
    networks:
      - romai-monitoring

volumes:
  grafana-storage:
    driver: local
  postgres-grafana-data:
    driver: local
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  alertmanager-data:
    driver: local
  redis-data:
    driver: local

networks:
  romai-monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
