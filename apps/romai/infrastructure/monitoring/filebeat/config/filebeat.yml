# Filebeat Configuration for ROMAI Enterprise Log Shipping
# Comprehensive log collection from multiple sources

# General settings
filebeat.config:
  modules:
    path: ${path.config}/modules.d/*.yml
    reload.enabled: false

# Global processors
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_docker_metadata: ~
  - add_kubernetes_metadata: ~

# Input configurations
filebeat.inputs:
  # ROMAI API logs
  - type: filestream
    id: romai-api-logs
    enabled: true
    paths:
      - /var/log/romai/api/*.log
      - /var/log/romai/api/**/*.log
    fields:
      service: romai-api
      environment: production
      log_type: api
    fields_under_root: true
    encoding: utf-8
    scan_frequency: 10s
    harvester_buffer_size: 16384
    max_bytes: 10485760
    multiline.pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
    multiline.negate: true
    multiline.match: after
    json.keys_under_root: true
    json.add_error_key: true

  # ROMAI MCP Server logs
  - type: filestream
    id: romai-mcp-logs
    enabled: true
    paths:
      - /var/log/romai/mcp/*.log
      - /var/log/romai/mcp/**/*.log
    fields:
      service: romai-mcp
      environment: production
      log_type: mcp
    fields_under_root: true
    encoding: utf-8
    scan_frequency: 10s
    json.keys_under_root: true
    json.add_error_key: true

  # ROMAI Dashboard logs
  - type: filestream
    id: romai-dashboard-logs
    enabled: true
    paths:
      - /var/log/romai/dashboard/*.log
      - /var/log/romai/dashboard/**/*.log
    fields:
      service: romai-dashboard
      environment: production
      log_type: application
    fields_under_root: true
    encoding: utf-8
    scan_frequency: 10s
    json.keys_under_root: true
    json.add_error_key: true

  # System logs
  - type: filestream
    id: system-logs
    enabled: true
    paths:
      - /var/log/syslog
      - /var/log/auth.log
      - /var/log/kern.log
    fields:
      service: system
      environment: production
      log_type: system
    fields_under_root: true
    encoding: utf-8
    scan_frequency: 30s

  # Docker container logs
  - type: container
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    stream: all
    format: auto
    containers.ids:
      - '*'
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true

  # Nginx access logs
  - type: filestream
    id: nginx-access-logs
    enabled: true
    paths:
      - /var/log/nginx/access.log
      - /var/log/nginx/*access.log
    fields:
      service: nginx
      environment: production
      log_type: web_server
    fields_under_root: true
    encoding: utf-8
    scan_frequency: 10s

  # Nginx error logs
  - type: filestream
    id: nginx-error-logs
    enabled: true
    paths:
      - /var/log/nginx/error.log
      - /var/log/nginx/*error.log
    fields:
      service: nginx
      environment: production
      log_type: web_server_error
    fields_under_root: true
    encoding: utf-8
    scan_frequency: 10s

  # PostgreSQL logs
  - type: filestream
    id: postgresql-logs
    enabled: true
    paths:
      - /var/log/postgresql/*.log
      - /var/lib/postgresql/data/log/*.log
    fields:
      service: postgresql
      environment: production
      log_type: database
    fields_under_root: true
    encoding: utf-8
    scan_frequency: 30s

  # Redis logs
  - type: filestream
    id: redis-logs
    enabled: true
    paths:
      - /var/log/redis/*.log
    fields:
      service: redis
      environment: production
      log_type: cache
    fields_under_root: true
    encoding: utf-8
    scan_frequency: 30s

# Output configuration
output.logstash:
  hosts: ["logstash:5044"]
  compression_level: 3
  bulk_max_size: 2048
  flush_timeout: 30s
  worker: 2

# Alternative output to Elasticsearch (commented out)
# output.elasticsearch:
#   hosts: ["elasticsearch:9200"]
#   username: "elastic"
#   password: "${ELASTIC_PASSWORD}"
#   index: "romai-logs-%{+yyyy.MM.dd}"
#   template.enabled: true
#   template.name: "romai-logs"
#   template.pattern: "romai-logs-*"

# Logging configuration
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat.log
  keepfiles: 7
  permissions: 0644
  rotateeverybytes: 10485760

# HTTP endpoint for monitoring
http.enabled: true
http.host: 0.0.0.0
http.port: 5066

# Monitoring configuration
monitoring:
  enabled: true
  elasticsearch:
    hosts: ["elasticsearch:9200"]
    username: "elastic"
    password: "${ELASTIC_PASSWORD}"

# X-Pack features
xpack.monitoring.enabled: true

# Performance tuning
queue.mem:
  events: 4096
  flush.min_events: 512
  flush.timeout: 5s

# Security settings
ssl.verification_mode: none

# Module configurations
filebeat.modules:
  - module: system
    syslog:
      enabled: true
      var.paths: ["/var/log/syslog*"]
    auth:
      enabled: true
      var.paths: ["/var/log/auth.log*"]

  - module: nginx
    access:
      enabled: true
      var.paths: ["/var/log/nginx/access.log*"]
    error:
      enabled: true
      var.paths: ["/var/log/nginx/error.log*"]

  - module: postgresql
    log:
      enabled: true
      var.paths: ["/var/log/postgresql/*.log"]
