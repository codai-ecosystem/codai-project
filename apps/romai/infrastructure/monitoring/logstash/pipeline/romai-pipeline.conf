# Logstash Configuration for ROMAI Enterprise Log Processing
# Advanced pipeline for structured log ingestion and processing

input {
  # Beats input for Filebeat
  beats {
    port => 5044
    type => "beats"
  }
  
  # TCP input for direct application logs
  tcp {
    port => 5000
    type => "tcp"
    codec => json_lines
  }
  
  # File input for local log files
  file {
    path => "/var/log/romai/*.log"
    start_position => "beginning"
    type => "file"
    codec => json
  }
  
  # HTTP input for webhook logs
  http {
    port => 8080
    type => "http"
    codec => json
  }
  
  # Syslog input
  syslog {
    port => 514
    type => "syslog"
  }
}

filter {
  # Common fields for all logs
  mutate {
    add_field => {
      "[@metadata][index_prefix]" => "romai-logs"
      "environment" => "${ENVIRONMENT:production}"
      "cluster" => "romai-production"
    }
  }
  
  # Parse timestamp
  date {
    match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd'T'HH:mm:ss.SSSZ" ]
    target => "@timestamp"
  }
  
  # Process different log types
  if [type] == "api" {
    # API request logs
    grok {
      match => { 
        "message" => "%{COMBINEDAPACHELOG}"
      }
    }
    
    mutate {
      add_field => { "log_type" => "api_request" }
      convert => { "response_time" => "float" }
      convert => { "status_code" => "integer" }
    }
    
    # Categorize HTTP status codes
    if [status_code] >= 500 {
      mutate { add_field => { "severity" => "error" } }
    } else if [status_code] >= 400 {
      mutate { add_field => { "severity" => "warning" } }
    } else {
      mutate { add_field => { "severity" => "info" } }
    }
  }
  
  if [type] == "application" {
    # Application logs
    if [level] {
      mutate {
        lowercase => [ "level" ]
        add_field => { "log_type" => "application" }
      }
      
      # Map log levels to severity
      if [level] == "error" {
        mutate { add_field => { "severity" => "error" } }
      } else if [level] == "warn" or [level] == "warning" {
        mutate { add_field => { "severity" => "warning" } }
      } else if [level] == "info" {
        mutate { add_field => { "severity" => "info" } }
      } else if [level] == "debug" {
        mutate { add_field => { "severity" => "debug" } }
      }
    }
    
    # Extract correlation ID if present
    if [message] =~ /correlationId/ {
      grok {
        match => { "message" => "correlationId: %{UUID:correlation_id}" }
      }
    }
    
    # Extract user ID if present
    if [message] =~ /userId/ {
      grok {
        match => { "message" => "userId: %{WORD:user_id}" }
      }
    }
  }
  
  if [type] == "mcp" {
    # MCP server logs
    mutate {
      add_field => { "log_type" => "mcp_server" }
    }
    
    # Parse MCP-specific fields
    if [message] =~ /session/ {
      grok {
        match => { "message" => "session: %{WORD:session_id}" }
      }
    }
    
    if [message] =~ /intelligence/ {
      grok {
        match => { "message" => "intelligence: %{WORD:intelligence_type}" }
      }
    }
  }
  
  if [type] == "database" {
    # Database logs
    mutate {
      add_field => { "log_type" => "database" }
    }
    
    # Parse SQL queries and execution time
    if [message] =~ /query/ {
      grok {
        match => { "message" => "query: %{GREEDYDATA:sql_query} duration: %{NUMBER:query_duration:float}ms" }
      }
    }
  }
  
  if [type] == "security" {
    # Security event logs
    mutate {
      add_field => { 
        "log_type" => "security"
        "severity" => "warning"
      }
    }
    
    # Parse authentication events
    if [message] =~ /auth/ {
      grok {
        match => { "message" => "auth: %{WORD:auth_event} user: %{WORD:user_id} ip: %{IP:client_ip}" }
      }
    }
  }
  
  # Error detection and categorization
  if [message] =~ /(?i)(error|exception|fail|fatal)/ {
    mutate {
      add_field => { "contains_error" => "true" }
    }
    
    # Extract error details
    grok {
      match => { "message" => "(?i)(?<error_type>error|exception|fail|fatal)[:\s]+(?<error_details>.*)" }
      tag_on_failure => ["_grokparsefailure_error"]
    }
  }
  
  # Performance monitoring
  if [response_time] {
    if [response_time] > 2000 {
      mutate { add_field => { "performance_issue" => "slow_response" } }
    }
  }
  
  # Geolocation for IP addresses
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }
  
  # Clean up fields
  mutate {
    remove_field => [ "host", "agent", "ecs", "log", "input", "tags" ]
  }
  
  # Add processing timestamp
  ruby {
    code => "event.set('processed_at', Time.now.utc.iso8601)"
  }
}

output {
  # Output to Elasticsearch with dynamic indexing
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    
    # Dynamic index based on log type and date
    index => "%{[@metadata][index_prefix]}-%{log_type}-%{+YYYY.MM.dd}"
    
    # Template for index settings
    template_name => "romai-logs"
    template => "/usr/share/logstash/templates/romai-template.json"
    template_overwrite => true
    
    # Performance optimizations
    flush_size => 1000
    idle_flush_time => 10
  }
  
  # Debug output for development
  if [@metadata][debug] {
    stdout {
      codec => rubydebug
    }
  }
  
  # Error logs to separate index
  if [severity] == "error" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      user => "elastic"
      password => "${ELASTIC_PASSWORD}"
      index => "romai-errors-%{+YYYY.MM.dd}"
    }
  }
  
  # High-priority alerts to external systems
  if [severity] == "error" and [log_type] == "security" {
    http {
      url => "http://alertmanager:9093/api/v1/alerts"
      http_method => "post"
      format => "json"
      mapping => {
        "alerts" => [{
          "labels" => {
            "alertname" => "SecurityError"
            "severity" => "critical"
            "service" => "%{service}"
            "instance" => "%{host}"
          }
          "annotations" => {
            "summary" => "Security error detected"
            "description" => "%{message}"
          }
        }]
      }
    }
  }
}
