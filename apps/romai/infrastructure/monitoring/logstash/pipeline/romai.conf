# ROMAI Advanced Logstash Pipeline Configuration
# Purpose: Comprehensive log processing with enrichment and correlation

input {
  # Beats input for Filebeat and Metricbeat
  beats {
    port => 5044
    type => "beats"
  }
  
  # TCP input for direct log shipping
  tcp {
    port => 5000
    type => "tcp"
    codec => json_lines
  }
  
  # HTTP input for webhook logs
  http {
    port => 8080
    type => "http"
    codec => json
  }
}

filter {
  # Parse timestamp fields
  if [timestamp] {
    date {
      match => [ "timestamp", "yyyy-MM-dd'T'HH:mm:ss.SSSZ", "yyyy-MM-dd HH:mm:ss", "ISO8601" ]
      target => "@timestamp"
    }
  }
  
  # Add correlation ID if missing
  if ![correlation_id] {
    uuid {
      target => "correlation_id"
    }
  }
  
  # Parse ROMAI application logs
  if [fields][service] == "romai-api" or [service] == "romai-api" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:level}\] %{GREEDYDATA:log_message}" 
      }
      tag_on_failure => ["_grokparsefailure_romai_api"]
    }
    
    # Extract API request details
    if [log_message] =~ /API Request/ {
      grok {
        match => { 
          "log_message" => "API Request: %{WORD:http_method} %{URIPATH:endpoint} - IP: %{IP:client_ip} - User: %{WORD:user_id}" 
        }
        tag_on_failure => ["_grokparsefailure_api_request"]
      }
    }
  }
  
  # Parse MCP server logs
  if [fields][service] == "romai-mcp" or [service] == "romai-mcp" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:timestamp} \[%{LOGLEVEL:level}\] \[%{WORD:component}\] %{GREEDYDATA:log_message}" 
      }
      tag_on_failure => ["_grokparsefailure_romai_mcp"]
    }
  }
  
  # Parse dashboard logs
  if [fields][service] == "romai-dashboard" or [service] == "romai-dashboard" {
    if [message] =~ /^\{/ {
      json {
        source => "message"
        tag_on_failure => ["_jsonparsefailure_dashboard"]
      }
    }
  }
  
  # Security analysis for authentication events
  if [log_message] =~ /(login|authentication|auth)/ {
    mutate {
      add_tag => ["security", "authentication"]
    }
    
    # Extract security details
    grok {
      match => { 
        "log_message" => "(Login|Authentication) (success|failure|attempt) for user: %{WORD:auth_user} from IP: %{IP:auth_ip}" 
      }
      tag_on_failure => ["_grokparsefailure_auth"]
    }
  }
  
  # Performance analysis
  if [log_message] =~ /response_time/ {
    grok {
      match => { 
        "log_message" => "response_time: %{NUMBER:response_time_ms:float}" 
      }
      tag_on_failure => ["_grokparsefailure_performance"]
    }
    
    mutate {
      add_tag => ["performance"]
    }
  }
  
  # Error analysis
  if [level] == "ERROR" or [level] == "error" {
    mutate {
      add_tag => ["error", "alert"]
    }
    
    # Extract error details
    grok {
      match => { 
        "log_message" => "Error: %{GREEDYDATA:error_message}" 
      }
      tag_on_failure => ["_grokparsefailure_error"]
    }
  }
  
  # Geographic enrichment for IP addresses
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
      add_tag => ["geoip"]
    }
  }
  
  if [auth_ip] {
    geoip {
      source => "auth_ip"
      target => "auth_geoip"
      add_tag => ["auth_geoip"]
    }
  }
  
  # Add processing metadata
  mutate {
    add_field => { 
      "logstash_processed_at" => "%{@timestamp}"
      "logstash_version" => "8.11.3"
      "pipeline_name" => "romai-main"
    }
  }
  
  # Clean up temporary fields
  mutate {
    remove_field => ["agent", "ecs", "host", "input"]
  }
}

output {
  # Main Elasticsearch output
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    username => "elastic"
    password => "${ELASTIC_PASSWORD:elastic_secure_2025}"
    
    # Dynamic index naming based on service and log type
    index => "romai-logs-%{[fields][service]:unknown}-%{+yyyy.MM.dd}"
    
    # Template configuration
    template_name => "romai-logs"
    template_pattern => "romai-logs-*"
    template => "/usr/share/logstash/templates/romai-template.json"
    template_overwrite => true
    
    # Document type
    document_type => "_doc"
    
    # Retry configuration
    retry_on_conflict => 3
    retry_max_interval => 5
  }
  
  # Security events to dedicated index
  if "security" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      username => "elastic"
      password => "${ELASTIC_PASSWORD:elastic_secure_2025}"
      index => "romai-security-%{+yyyy.MM.dd}"
      document_type => "_doc"
    }
  }
  
  # Performance metrics to dedicated index
  if "performance" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      username => "elastic"
      password => "${ELASTIC_PASSWORD:elastic_secure_2025}"
      index => "romai-performance-%{+yyyy.MM.dd}"
      document_type => "_doc"
    }
  }
  
  # Error logs to dedicated index
  if "error" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      username => "elastic"
      password => "${ELASTIC_PASSWORD:elastic_secure_2025}"
      index => "romai-errors-%{+yyyy.MM.dd}"
      document_type => "_doc"
    }
  }
  
  # Debug output for development
  if [@metadata][debug] {
    stdout {
      codec => rubydebug
    }
  }
}
