# Prometheus Configuration for ROMAI Enterprise Monitoring
# Comprehensive metrics collection with advanced alerting rules

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'romai-production'
    environment: 'enterprise'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Rules for alerting
rule_files:
  - "rules/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 15s
    metrics_path: /metrics

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    metrics_path: /metrics

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s
    metrics_path: /metrics

  # ROMAI API Metrics
  - job_name: 'romai-api'
    static_configs:
      - targets: ['api:3000']
    scrape_interval: 10s
    metrics_path: /metrics
    scrape_timeout: 5s

  # ROMAI MCP Server Metrics
  - job_name: 'romai-mcp'
    static_configs:
      - targets: ['mcp-server:3333']
    scrape_interval: 10s
    metrics_path: /metrics
    scrape_timeout: 5s

  # ROMAI Dashboard Metrics
  - job_name: 'romai-dashboard'
    static_configs:
      - targets: ['dashboard:3001']
    scrape_interval: 15s
    metrics_path: /metrics

  # Redis Metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  # PostgreSQL Metrics (if using postgres_exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Grafana Metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    scrape_interval: 30s
    metrics_path: /metrics

  # NGINX/Load Balancer Metrics
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']
    scrape_interval: 15s

  # Blackbox Exporter - Endpoint monitoring
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://api.romai.codai.ro/health
        - https://dashboard.romai.codai.ro
        - https://mcp.romai.codai.ro/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Custom application metrics
  - job_name: 'romai-business-metrics'
    static_configs:
      - targets: ['api:3000']
    scrape_interval: 30s
    metrics_path: /business-metrics
    honor_labels: true

# Remote write configuration for long-term storage
remote_write:
  - url: "http://thanos-receive:19291/api/v1/receive"
    queue_config:
      max_samples_per_send: 1000
      max_shards: 200
      capacity: 2500
