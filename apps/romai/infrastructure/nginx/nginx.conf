# 🚀 ROMAI Production Nginx Configuration
# Load balancing, SSL termination, and security headers
# Generated for Phase 4 Week 4 Day 24 - Production Deployment

# =============================================================================
# 🔧 MAIN CONFIGURATION
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# =============================================================================
# 📊 EVENTS AND PERFORMANCE
# =============================================================================

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

# =============================================================================
# 🌐 HTTP CONFIGURATION
# =============================================================================

http {
    # MIME Types
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # =============================================================================
    # 📝 LOGGING FORMAT
    # =============================================================================
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json_combined escape=json
        '{'
            '"timestamp":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"upstream_response_time":"$upstream_response_time",'
            '"upstream_addr":"$upstream_addr"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # =============================================================================
    # ⚡ PERFORMANCE OPTIMIZATION
    # =============================================================================
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Timeouts
    client_header_timeout 3m;
    client_body_timeout 3m;
    send_timeout 3m;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private must-revalidate;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml+rss
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # =============================================================================
    # 🔒 SECURITY HEADERS
    # =============================================================================
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # =============================================================================
    # 🔄 UPSTREAM CONFIGURATION
    # =============================================================================
    
    # ROMAI API Backend Pool
    upstream romai_api_backend {
        least_conn;
        server romai-api:8000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # ROMAI Dashboard Backend Pool  
    upstream romai_dashboard_backend {
        least_conn;
        server romai-dashboard:4000 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    # ROMAI MCP Backend Pool
    upstream romai_mcp_backend {
        least_conn;
        server romai-mcp:3001 max_fails=3 fail_timeout=30s;
        keepalive 4;
    }

    # ELK Stack Backends
    upstream elasticsearch_backend {
        server romai-elasticsearch:9200 max_fails=2 fail_timeout=30s;
    }

    upstream kibana_backend {
        server romai-kibana:5601 max_fails=2 fail_timeout=30s;
    }

    # =============================================================================
    # 🔧 RATE LIMITING
    # =============================================================================
    
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=dashboard_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # =============================================================================
    # 🌐 HTTP TO HTTPS REDIRECT
    # =============================================================================
    
    server {
        listen 80;
        server_name romai.ro www.romai.ro api.romai.ro dashboard.romai.ro;
        return 301 https://$server_name$request_uri;
    }

    # =============================================================================
    # 🔐 MAIN ROMAI WEBSITE (HTTPS)
    # =============================================================================
    
    server {
        listen 443 ssl http2;
        server_name romai.ro www.romai.ro;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/romai.crt;
        ssl_certificate_key /etc/nginx/ssl/romai.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # SSL Security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;

        # Rate limiting
        limit_req zone=dashboard_limit burst=20 nodelay;
        limit_conn conn_limit_per_ip 10;

        # Root and index
        root /var/www/romai;
        index index.html index.htm;

        # Main location - serve static content or proxy to dashboard
        location / {
            try_files $uri $uri/ @dashboard;
        }

        # Proxy to dashboard for dynamic content
        location @dashboard {
            proxy_pass http://romai_dashboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Static assets caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|pdf|txt)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # =============================================================================
    # 🔗 API SUBDOMAIN (api.romai.ro)
    # =============================================================================
    
    server {
        listen 443 ssl http2;
        server_name api.romai.ro;

        # SSL Configuration (same as main)
        ssl_certificate /etc/nginx/ssl/romai.crt;
        ssl_certificate_key /etc/nginx/ssl/romai.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Rate limiting for API
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit_per_ip 20;

        # API Proxy
        location / {
            proxy_pass http://romai_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Buffer settings
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # Health check for API
        location /health {
            proxy_pass http://romai_api_backend/health;
            access_log off;
        }

        # API documentation
        location /docs {
            proxy_pass http://romai_api_backend/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Strict login rate limiting
        location /auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://romai_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =============================================================================
    # 📊 DASHBOARD SUBDOMAIN (dashboard.romai.ro)
    # =============================================================================
    
    server {
        listen 443 ssl http2;
        server_name dashboard.romai.ro;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/romai.crt;
        ssl_certificate_key /etc/nginx/ssl/romai.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # Rate limiting
        limit_req zone=dashboard_limit burst=30 nodelay;
        limit_conn conn_limit_per_ip 15;

        # Dashboard Proxy
        location / {
            proxy_pass http://romai_dashboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Next.js specific settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Next.js static assets
        location /_next/static/ {
            proxy_pass http://romai_dashboard_backend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # WebSocket support for Next.js dev mode
        location /_next/webpack-hmr {
            proxy_pass http://romai_dashboard_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # =============================================================================
    # 📊 MONITORING ENDPOINTS
    # =============================================================================
    
    # Kibana monitoring (restricted access)
    server {
        listen 443 ssl http2;
        server_name kibana.romai.ro;

        # SSL Configuration
        ssl_certificate /etc/nginx/ssl/romai.crt;
        ssl_certificate_key /etc/nginx/ssl/romai.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Basic authentication for monitoring
        auth_basic "ROMAI Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://kibana_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =============================================================================
    # 📊 NGINX STATUS AND MONITORING
    # =============================================================================
    
    # Nginx status endpoint (internal only)
    server {
        listen 8080;
        server_name localhost;
        
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.20.0.0/16;  # Docker network
            deny all;
        }

        location /health {
            access_log off;
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }
    }
}

# =============================================================================
# 📋 CONFIGURATION NOTES
# =============================================================================

# SSL Certificate Setup:
# 1. Generate or obtain SSL certificates for your domains
# 2. Place them in /etc/nginx/ssl/ directory
# 3. Update certificate paths in server blocks above

# Basic Authentication Setup:
# 1. Create .htpasswd file: htpasswd -c /etc/nginx/.htpasswd username
# 2. Mount the file in docker-compose.yml

# Rate Limiting:
# - API: 10 requests/second with burst of 50
# - Dashboard: 20 requests/second with burst of 30  
# - Login: 1 request/second with burst of 5

# Monitoring:
# - Nginx status: http://localhost:8080/nginx_status
# - Health check: http://localhost:8080/health
# - Kibana dashboard: https://kibana.romai.ro (with auth)

# Performance Features:
# - HTTP/2 support for all HTTPS connections
# - Gzip compression for text content
# - Static asset caching with long expires headers
# - Connection keepalive and upstream keepalive
# - Optimized buffer sizes and timeouts
