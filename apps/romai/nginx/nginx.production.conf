# RomAI AGI Production Nginx Configuration
# Simple production setup for romcp.ro

events {
    worker_connections 1024;
}

http {
    # Basic Configuration
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    
    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    
    # Upstream AGI Server
    upstream romai_agi {
        server romai-agi:6101 max_fails=3 fail_timeout=30s;
    }
    
    # HTTP to HTTPS Redirect
    server {
        listen 80;
        server_name romcp.ro www.romcp.ro;
        return 301 https://$server_name$request_uri;
    }
    
    # HTTPS Production Server
    server {
        listen 443 ssl http2;
        server_name romcp.ro www.romcp.ro;
        
        # SSL Configuration (Production)
        ssl_certificate /etc/nginx/ssl/romcp.ro.crt;
        ssl_certificate_key /etc/nginx/ssl/romcp.ro.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # API Proxy to RomAI AGI
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://romai_agi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts for ML processing
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;
            
            # CORS Headers
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }
        
        # Health Check Endpoint
        location /health {
            proxy_pass http://romai_agi/health;
            access_log off;
        }
        
        # Root - Simple API documentation
        location / {
            return 200 '{"service":"RomAI AGI","status":"production","version":"2.0.0","endpoints":["/api/v1/mathematical-reasoning/solve","/api/v1/logical-reasoning/analyze","/api/v1/romanian-intelligence/chat"],"domain":"romcp.ro"}';
            add_header Content-Type application/json;
        }
    }
}