# NGINX Production Configuration for RomAI AGI System
# High-performance load balancer with SSL termination and health monitoring

worker_processes auto;
worker_rlimit_nofile 8192;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    
    # MIME Types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging Configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    log_format agi_metrics '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent rt=$request_time '
                          'uct="$upstream_connect_time" uht="$upstream_header_time" '
                          'urt="$upstream_response_time" engine="$arg_engine" '
                          'query_type="$arg_type"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml;
    
    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=agi_api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=agi_engines:10m rate=30r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # Upstream Configuration - RomAI AGI System
    upstream romai_agi_backend {
        least_conn;
        server romai-agi-system:6101 max_fails=3 fail_timeout=30s weight=1;
        # Add more instances for scaling:
        # server romai-agi-system-2:6101 max_fails=3 fail_timeout=30s weight=1;
        # server romai-agi-system-3:6101 max_fails=3 fail_timeout=30s weight=1;
        
        keepalive 32;
    }
    
    # Upstream Configuration - Health Dashboard
    upstream agi_health_dashboard {
        server romai-agi-system:8080 max_fails=2 fail_timeout=10s;
        keepalive 8;
    }
    
    # Upstream Configuration - Prometheus Metrics
    upstream prometheus_metrics {
        server romai-agi-system:9090 max_fails=2 fail_timeout=10s;
        keepalive 8;
    }
    
    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security Headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' wss: ws:; frame-ancestors 'none';" always;
    
    # Main AGI API Server (HTTPS)
    server {
        listen 443 ssl http2;
        server_name agi.romai.codai.ro;
        
        # SSL Certificates
        ssl_certificate /etc/ssl/certs/romai-agi.crt;
        ssl_certificate_key /etc/ssl/certs/romai-agi.key;
        
        # Security and Performance
        client_max_body_size 10M;
        client_body_timeout 60s;
        client_header_timeout 60s;
        
        # Rate Limiting
        limit_req zone=agi_api burst=20 nodelay;
        limit_conn addr 10;
        
        # Main AGI API Endpoints
        location / {
            # CORS Headers
            add_header Access-Control-Allow-Origin "https://romai.codai.ro" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials true always;
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "https://romai.codai.ro";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With";
                add_header Access-Control-Max-Age 3600;
                add_header Content-Type "text/plain charset=UTF-8";
                add_header Content-Length 0;
                return 204;
            }
            
            # Proxy to AGI backend
            proxy_pass http://romai_agi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }
        
        # Engine-specific endpoints with stricter rate limiting
        location ~ ^/(solve_math|reason|analyze_culture|create|process_query) {
            limit_req zone=agi_engines burst=10 nodelay;
            
            # Custom logging for engine requests
            access_log /var/log/nginx/agi_engines.log agi_metrics;
            
            proxy_pass http://romai_agi_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Extended timeouts for AI processing
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
        
        # Health check endpoint (no rate limiting)
        location /health {
            proxy_pass http://romai_agi_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
            
            # Cache health checks briefly
            proxy_cache_valid 200 10s;
        }
        
        # Engines status endpoint
        location /engines/status {
            proxy_pass http://romai_agi_backend/engines/status;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
    
    # Health Dashboard Server (HTTPS)
    server {
        listen 8443 ssl http2;
        server_name health.agi.romai.codai.ro;
        
        # SSL Certificates
        ssl_certificate /etc/ssl/certs/romai-agi.crt;
        ssl_certificate_key /etc/ssl/certs/romai-agi.key;
        
        # Basic Authentication (optional)
        # auth_basic "RomAI AGI Health Dashboard";
        # auth_basic_user_file /etc/nginx/.htpasswd;
        
        location / {
            proxy_pass http://agi_health_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    
    # Metrics Server (HTTPS)
    server {
        listen 9443 ssl http2;
        server_name metrics.agi.romai.codai.ro;
        
        # SSL Certificates
        ssl_certificate /etc/ssl/certs/romai-agi.crt;
        ssl_certificate_key /etc/ssl/certs/romai-agi.key;
        
        # Restrict access to internal networks
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        location /metrics {
            proxy_pass http://prometheus_metrics/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
    
    # HTTP to HTTPS Redirect
    server {
        listen 80;
        server_name agi.romai.codai.ro health.agi.romai.codai.ro metrics.agi.romai.codai.ro;
        return 301 https://$server_name$request_uri;
    }
    
    # Default Server (Catch-all)
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        
        # Default SSL certificate
        ssl_certificate /etc/ssl/certs/romai-agi.crt;
        ssl_certificate_key /etc/ssl/certs/romai-agi.key;
        
        return 444;
    }
    
    # Status Page for NGINX Monitoring
    server {
        listen 8080;
        server_name localhost;
        
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.20.0.0/16;
            deny all;
        }
        
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}

# Stream Configuration (TCP/UDP Load Balancing)
stream {
    # Log configuration for stream
    error_log /var/log/nginx/stream_error.log warn;
    
    # Example: TCP load balancing for custom protocols
    # upstream agi_custom_protocol {
    #     server romai-agi-system:9999;
    # }
    # 
    # server {
    #     listen 9999;
    #     proxy_pass agi_custom_protocol;
    #     proxy_timeout 10s;
    #     proxy_responses 1;
    # }
}