# ROMAI Ultimate MCP Server - Development Docker Compose
# Optimized for development workflow with hot reload and debugging

version: '3.8'

services:
  # Main ROMAI MCP Server (Development)
  romai-mcp-dev:
    build:
      context: .
      dockerfile: packages/romai-mcp/Dockerfile
      target: builder  # Use builder stage for development dependencies
    container_name: romai-mcp-dev
    restart: unless-stopped
    ports:
      - "4097:3000"
      - "9229:9229"  # Node.js debugging port
    environment:
      # Core Configuration
      - NODE_ENV=development
      - PORT=3000
      - ROMAI_ENV=development
      
      # Security Configuration (relaxed for development)
      - ROMAI_SECURITY_ENABLED=true
      - JWT_SECRET=dev-secret-key-change-for-production
      - JWT_EXPIRES_IN=7d
      - RATE_LIMIT_WINDOW=15
      - RATE_LIMIT_MAX=10000
      - BCRYPT_ROUNDS=4  # Faster for development
      
      # Monitoring Configuration
      - ROMAI_MONITORING_ENABLED=true
      - METRICS_PORT=9090
      - HEALTH_CHECK_INTERVAL=30000
      
      # Database Configuration
      - DATABASE_URL=postgresql://romai:romai@postgres-dev:5432/romai_dev
      - REDIS_URL=redis://redis-dev:6379
      
      # Logging Configuration
      - ROMAI_LOG_LEVEL=debug
      - LOG_FORMAT=pretty
      - LOG_FILE_ENABLED=true
      
      # Development Configuration
      - NODE_OPTIONS=--inspect=0.0.0.0:9229
    volumes:
      - .:/app  # Mount source code for hot reload
      - /app/node_modules  # Exclude node_modules
      - romai_dev_logs:/app/logs
      - romai_dev_data:/app/data
    depends_on:
      - postgres-dev
      - redis-dev
    networks:
      - romai-dev-network
    command: ["pnpm", "run", "dev", "--", "--inspect=0.0.0.0:9229"]

  # PostgreSQL Database (Development)
  postgres-dev:
    image: postgres:15-alpine
    container_name: romai-postgres-dev
    restart: unless-stopped
    environment:
      - POSTGRES_DB=romai_dev
      - POSTGRES_USER=romai
      - POSTGRES_PASSWORD=romai
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-dev.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    networks:
      - romai-dev-network

  # Redis Cache (Development)
  redis-dev:
    image: redis:7-alpine
    container_name: romai-redis-dev
    restart: unless-stopped
    command: redis-server --requirepass romai --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6380:6379"  # Different port to avoid conflicts
    networks:
      - romai-dev-network

  # Prometheus Monitoring (Development)
  prometheus-dev:
    image: prom/prometheus:latest
    container_name: romai-prometheus-dev
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=24h'  # Shorter retention for dev
      - '--web.enable-lifecycle'
    volumes:
      - ./infrastructure/prometheus/prometheus-dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_dev_data:/prometheus
    ports:
      - "9091:9090"  # Different port to avoid conflicts
    networks:
      - romai-dev-network

  # Grafana Dashboards (Development)
  grafana-dev:
    image: grafana/grafana:latest
    container_name: romai-grafana-dev
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=true  # Allow sign-up in development
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/romai-overview.json
    volumes:
      - grafana_dev_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "4098:3000"  # Different port to avoid conflicts
    networks:
      - romai-dev-network
    depends_on:
      - prometheus-dev

  # Mailhog for Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: romai-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - romai-dev-network

  # MinIO for S3-compatible storage testing
  minio:
    image: minio/minio:latest
    container_name: romai-minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    networks:
      - romai-dev-network
    command: server /data --console-address ":9001"

  # Adminer for Database Management
  adminer:
    image: adminer:latest
    container_name: romai-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - romai-dev-network
    depends_on:
      - postgres-dev

  # Redis Commander for Redis Management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: romai-redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis-dev:6379:0:romai
    ports:
      - "8081:8081"
    networks:
      - romai-dev-network
    depends_on:
      - redis-dev

# Volumes
volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  prometheus_dev_data:
    driver: local
  grafana_dev_data:
    driver: local
  romai_dev_logs:
    driver: local
  romai_dev_data:
    driver: local
  minio_data:
    driver: local

# Networks
networks:
  romai-dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
