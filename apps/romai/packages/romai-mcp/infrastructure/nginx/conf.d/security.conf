# Additional Security Configuration for ROMAI Ultimate MCP Server

# Security Headers Server Block
server {
    listen 443 ssl http2;
    server_name security.romai.local;
    
    # SSL Certificates
    ssl_certificate /etc/nginx/ssl/romai.crt;
    ssl_private_key /etc/nginx/ssl/romai.key;
    
    # Enhanced Security Headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    
    # Security Endpoint for Security Manager
    location /security/ {
        proxy_pass http://romai_backend/security/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Additional security for security endpoints
        limit_req zone=api burst=50 nodelay;
    }
    
    # Security Status Dashboard
    location /security-status {
        proxy_pass http://romai_backend/api/security/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
