
version: '3.8'

services:
  romai-agi-intelligence:
    image: romai/agi-intelligence:latest
    container_name: romai-agi-prod
    restart: unless-stopped
    ports:
      - "6100:6100"
      - "9090:9090"
    environment:
      - NODE_ENV=production
      - PORT=6100
      - DB_HOST=${DB_HOST}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JAEGER_ENDPOINT=${JAEGER_ENDPOINT}
      - ALERT_WEBHOOK=${ALERT_WEBHOOK}
    volumes:
      - ./data:/app/data
      - ./logs:/var/log/romai
      - ./models:/models
      - ./ssl:/etc/ssl
    networks:
      - romai-network
    depends_on:
      - postgres
      - redis
      - monitoring
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  postgres:
    image: postgres:15-alpine
    container_name: romai-postgres-prod
    restart: unless-stopped
    environment:
      - POSTGRES_DB=romai_agi_prod
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - romai-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  redis:
    image: redis:7-alpine
    container_name: romai-redis-prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - romai-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  monitoring:
    image: prom/prometheus:latest
    container_name: romai-prometheus-prod
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - romai-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'

  grafana:
    image: grafana/grafana:latest
    container_name: romai-grafana-prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    networks:
      - romai-network
    depends_on:
      - monitoring

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  romai-network:
    driver: bridge
    external: false
