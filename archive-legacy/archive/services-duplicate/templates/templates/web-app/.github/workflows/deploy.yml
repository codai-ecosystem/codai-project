name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    outputs:
      deploy-staging: ${{ steps.decision.outputs.deploy-staging }}
      deploy-production: ${{ steps.decision.outputs.deploy-production }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Run quality checks
        run: pnpm audit:all

      - name: Run tests
        run: pnpm test

      - name: Run security audit
        run: pnpm audit --audit-level=moderate

      - name: Check secrets
        run: pnpm check:secrets

      - name: Build
        run: pnpm build

      - name: Deployment decision
        id: decision
        run: |
          if [[ "${{ github.event.inputs.environment }}" == "production" ]]; then
            echo "deploy-production=true" >> $GITHUB_OUTPUT
            echo "deploy-staging=false" >> $GITHUB_OUTPUT
          else
            echo "deploy-staging=true" >> $GITHUB_OUTPUT
            echo "deploy-production=false" >> $GITHUB_OUTPUT
          fi

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: quality-gate
    if: needs.quality-gate.outputs.deploy-staging == 'true'
    environment:
      name: staging
      url: https://staging.yourdomain.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Build for staging
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_ENV: staging

      - name: Deploy to Vercel (Staging)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          alias-domains: staging.yourdomain.com

      - name: Run smoke tests
        run: |
          sleep 30
          curl -f https://staging.yourdomain.com || exit 1

      - name: Performance test on staging
        run: |
          npx lighthouse https://staging.yourdomain.com --output=json --output-path=lighthouse-staging.json
        continue-on-error: true

      - name: Upload staging artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-artifacts
          path: |
            lighthouse-staging.json
            .vercel/

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: quality-gate
    if: needs.quality-gate.outputs.deploy-production == 'true'
    environment:
      name: production
      url: https://yourdomain.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Build for production
        run: pnpm build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_ENV: production

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}
          vercel-args: '--prod'

      - name: Run production smoke tests
        run: |
          sleep 60
          curl -f https://yourdomain.com || exit 1
          curl -f https://yourdomain.com/api/health || exit 1

      - name: Performance test on production
        run: |
          npx lighthouse https://yourdomain.com --output=json --output-path=lighthouse-production.json
        continue-on-error: true

      - name: Update deployment status
        run: |
          echo "Production deployment completed successfully"
          echo "URL: https://yourdomain.com"

      - name: Upload production artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-artifacts
          path: |
            lighthouse-production.json
            .vercel/

  rollback:
    name: Rollback (Manual)
    runs-on: ubuntu-latest
    if: failure() && github.event.inputs.environment == 'production'
    environment:
      name: production-rollback
    steps:
      - name: Manual rollback approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: 'Production Rollback Required'
          issue-body: 'Production deployment failed. Approve to rollback to previous version.'

      - uses: actions/checkout@v4

      - name: Rollback to previous version
        run: |
          echo "Implementing rollback logic..."
          # Add your rollback logic here
