# CODAI Ecosystem Nginx Configuration
# Load balancer and reverse proxy for all services

upstream codai_gateway {
    server gateway:4003 max_fails=3 fail_timeout=30s;
}

upstream codai_app {
    server codai-app:3000 max_fails=3 fail_timeout=30s;
}

upstream codai_hub {
    server hub:3000 max_fails=3 fail_timeout=30s;
}

upstream codai_bancai {
    server bancai:3000 max_fails=3 fail_timeout=30s;
}

upstream codai_id_service {
    server id-service:3000 max_fails=3 fail_timeout=30s;
}

upstream codai_romai_platform {
    server romai-platform:6100 max_fails=3 fail_timeout=30s;
}

upstream codai_romai_enterprise {
    server romai-enterprise:8001 max_fails=3 fail_timeout=30s;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=100r/m;

server {
    listen 80;
    server_name localhost;
    
    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Gateway API (Main orchestrator)
    location /api/gateway/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://codai_gateway/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # CODAI Main App
    location /app/ {
        limit_req zone=web_limit burst=20 nodelay;
        proxy_pass http://codai_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Hub Service
    location /hub/ {
        limit_req zone=web_limit burst=20 nodelay;
        proxy_pass http://codai_hub/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # BancAI Banking Service
    location /banking/ {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://codai_bancai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Enhanced security for banking
        proxy_ssl_verify on;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    
    # ID Service (Authentication)
    location /auth/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://codai_id_service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # RomAI Platform API
    location /romai/platform/ {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://codai_romai_platform/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    
    # RomAI Enterprise API
    location /romai/enterprise/ {
        limit_req zone=api_limit burst=5 nodelay;
        proxy_pass http://codai_romai_enterprise/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Default route to CODAI App
    location / {
        limit_req zone=web_limit burst=20 nodelay;
        proxy_pass http://codai_app/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @proxy_codai_app;
    }
    
    location @proxy_codai_app {
        proxy_pass http://codai_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}