# NGINX Configuration for RomAI Distributed Neural Architecture
# Load balancer with health checks and failover

upstream neural_orchestrator {
    least_conn;
    server romai-neural-orchestrator:8000 max_fails=3 fail_timeout=30s;
}

upstream neural_inference {
    least_conn;
    server romai-neural-inference-1:8000 max_fails=3 fail_timeout=30s;
    server romai-neural-inference-2:8000 max_fails=3 fail_timeout=30s;
}

upstream neural_perception {
    least_conn;
    server romai-neural-perception:8000 max_fails=3 fail_timeout=30s;
}

upstream neural_consciousness {
    least_conn;
    server romai-neural-consciousness:8000 max_fails=3 fail_timeout=30s;
}

upstream neural_reasoning {
    least_conn;
    server romai-neural-reasoning:8000 max_fails=3 fail_timeout=30s;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=neural_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=neural_inference:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=neural_heavy:10m rate=2r/s;

# Main server block
server {
    listen 80;
    server_name romai-neural.local;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Client settings
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Proxy settings
    proxy_connect_timeout 30s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;

    # Health check endpoint
    location /health {
        limit_req zone=neural_general burst=20 nodelay;
        proxy_pass http://neural_orchestrator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cluster status endpoint
    location /cluster/status {
        limit_req zone=neural_general burst=10 nodelay;
        proxy_pass http://neural_orchestrator/cluster/status;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General inference endpoint (load balanced)
    location /inference {
        limit_req zone=neural_inference burst=10 nodelay;
        
        # Route based on model type
        set $upstream neural_orchestrator;
        
        # Parse JSON body to determine routing
        access_by_lua_block {
            local json = require "cjson"
            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            
            if body then
                local ok, data = pcall(json.decode, body)
                if ok and data.model_type then
                    if data.model_type == "inference" then
                        ngx.var.upstream = "neural_inference"
                    elseif data.model_type == "perception" then
                        ngx.var.upstream = "neural_perception"
                    elseif data.model_type == "consciousness" then
                        ngx.var.upstream = "neural_consciousness"
                    elseif data.model_type == "reasoning" then
                        ngx.var.upstream = "neural_reasoning"
                    end
                end
            end
        }
        
        proxy_pass http://$upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type application/json;
    }

    # Direct inference nodes
    location /inference/direct {
        limit_req zone=neural_inference burst=5 nodelay;
        rewrite ^/inference/direct(.*) /inference$1 break;
        proxy_pass http://neural_inference;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Perception endpoint
    location /perception {
        limit_req zone=neural_heavy burst=3 nodelay;
        proxy_pass http://neural_perception/inference;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Longer timeouts for heavy processing
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Consciousness endpoint
    location /consciousness {
        limit_req zone=neural_general burst=5 nodelay;
        proxy_pass http://neural_consciousness/inference;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reasoning endpoint
    location /reasoning {
        limit_req zone=neural_general burst=5 nodelay;
        proxy_pass http://neural_reasoning/inference;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Node registration endpoint
    location /nodes {
        limit_req zone=neural_general burst=5 nodelay;
        proxy_pass http://neural_orchestrator/nodes;
        proxy_set_header Host $host;
        proxy_Set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Metrics endpoint (Prometheus)
    location /metrics {
        limit_req zone=neural_general burst=10 nodelay;
        
        # Allow only monitoring systems
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        
        proxy_pass http://neural_orchestrator/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket support for streaming inference
    location /stream {
        limit_req zone=neural_inference burst=3 nodelay;
        
        proxy_pass http://neural_orchestrator/stream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket timeouts
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API documentation
    location /docs {
        limit_req zone=neural_general burst=20 nodelay;
        proxy_pass http://neural_orchestrator/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI specification
    location /openapi.json {
        limit_req zone=neural_general burst=20 nodelay;
        proxy_pass http://neural_orchestrator/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
    
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Security - deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logging
    access_log /var/log/nginx/neural_access.log combined;
    error_log /var/log/nginx/neural_error.log warn;
}

# Upstream health checks
server {
    listen 8080;
    server_name localhost;
    
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}