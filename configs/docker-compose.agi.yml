# RomAI AGI Cloud Infrastructure - Day 7 Production Ready
# Complete environment with AGI server (103M+ parameters), Redis cache, and monitoring

version: '3.8'

services:
  # RomAI AGI Model Server - Production with Real AI Models
  romai-agi:
    build:
      context: .
      dockerfile: apps/romai/Dockerfile.agi
      target: production
    container_name: romai-agi-server
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - MODEL_CACHE_DIR=/app/cache
      - LOG_LEVEL=INFO
      - ENVIRONMENT=production
      - AGI_MODE=production
      - TORCH_NUM_THREADS=4
      - OMP_NUM_THREADS=4
      - REDIS_URL=redis://redis:6379/0
      - POSTGRES_URL=postgresql://romai:romai_secure_2025@postgres:5432/romai_metrics
      - HUGGINGFACE_HUB_CACHE=/app/cache/huggingface
      - TRANSFORMERS_CACHE=/app/cache/transformers
    volumes:
      - agi_cache:/app/cache
      - agi_logs:/app/logs
      - agi_models:/app/cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 180s
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - romai-network
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
        reservations:
          memory: 4G
          cpus: '2.0'

  # Redis Cache for AI Model Responses - Production Optimized
  redis:
    image: redis:7-alpine
    container_name: romai-redis
    ports:
      - "6379:6379"
    command: |
      redis-server 
      --appendonly yes 
      --maxmemory 1gb 
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - romai-network

  # PostgreSQL for Metrics Storage
  postgres:
    image: postgres:15-alpine
    container_name: romai-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=romai_metrics
      - POSTGRES_USER=romai
      - POSTGRES_PASSWORD=romai_secure_2025
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U romai -d romai_metrics"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - romai-network

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: romai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - romai-agi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - romai-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: romai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - romai-network

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: romai-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin_romai_2025
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - romai-network

networks:
  romai-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  agi_cache:
    driver: local
  agi_logs:
    driver: local
  agi_models:
    driver: local
