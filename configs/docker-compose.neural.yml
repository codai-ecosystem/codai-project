# RomAI Distributed Neural Architecture - Docker Compose
# Production-ready distributed neural processing cluster

services:
  # Neural Orchestrator (Main coordinator)
  romai-neural-orchestrator:
    build:
      context: .
      dockerfile: apps/romai/Dockerfile.neural
      target: production
    container_name: romai-neural-orchestrator
    ports:
      - "8800:8000"  # Orchestrator API
      - "8801:8001"  # Health endpoint
      - "8802:8002"  # Metrics endpoint
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - TRANSFORMERS_CACHE=/app/cache/transformers
      - HF_HOME=/app/cache/huggingface
      - PYTHONPATH=/app/src
      - NODE_TYPE=orchestrator
      - DEPLOYMENT_MODE=docker
      - LOG_LEVEL=info
    volumes:
      - neural_models_cache:/app/cache
      - ./logs/neural:/app/logs
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - neural-network
      - codai-network

  # Neural Inference Node 1 (GPU-enabled)
  romai-neural-inference-1:
    build:
      context: .
      dockerfile: apps/romai/Dockerfile.neural
      target: production
    container_name: romai-neural-inference-1
    ports:
      - "8810:8000"
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - TRANSFORMERS_CACHE=/app/cache/transformers
      - HF_HOME=/app/cache/huggingface
      - PYTHONPATH=/app/src
      - NODE_TYPE=inference
      - ORCHESTRATOR_URL=http://romai-neural-orchestrator:8000
      - GPU_ENABLED=true
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - neural_models_cache:/app/cache
      - ./logs/neural:/app/logs
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - romai-neural-orchestrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - neural-network

  # Neural Inference Node 2 (GPU-enabled)
  romai-neural-inference-2:
    build:
      context: .
      dockerfile: apps/romai/Dockerfile.neural
      target: production
    container_name: romai-neural-inference-2
    ports:
      - "8811:8000"
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - TRANSFORMERS_CACHE=/app/cache/transformers
      - HF_HOME=/app/cache/huggingface
      - PYTHONPATH=/app/src
      - NODE_TYPE=inference
      - ORCHESTRATOR_URL=http://romai-neural-orchestrator:8000
      - GPU_ENABLED=true
      - CUDA_VISIBLE_DEVICES=1
    volumes:
      - neural_models_cache:/app/cache
      - ./logs/neural:/app/logs
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - romai-neural-orchestrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - neural-network

  # Neural Perception Node (Multimodal processing)
  romai-neural-perception:
    build:
      context: .
      dockerfile: apps/romai/Dockerfile.neural
      target: production
    container_name: romai-neural-perception
    ports:
      - "8820:8000"
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - TRANSFORMERS_CACHE=/app/cache/transformers
      - HF_HOME=/app/cache/huggingface
      - PYTHONPATH=/app/src
      - NODE_TYPE=perception
      - ORCHESTRATOR_URL=http://romai-neural-orchestrator:8000
      - GPU_ENABLED=true
      - CUDA_VISIBLE_DEVICES=2
    volumes:
      - neural_models_cache:/app/cache
      - ./logs/neural:/app/logs
    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 12G
        reservations:
          cpus: '3.0'
          memory: 6G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - romai-neural-orchestrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - neural-network

  # Neural Consciousness Node (CPU-based)
  romai-neural-consciousness:
    build:
      context: .
      dockerfile: apps/romai/Dockerfile.neural
      target: production
    container_name: romai-neural-consciousness
    ports:
      - "8830:8000"
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - TRANSFORMERS_CACHE=/app/cache/transformers
      - HF_HOME=/app/cache/huggingface
      - PYTHONPATH=/app/src
      - NODE_TYPE=consciousness
      - ORCHESTRATOR_URL=http://romai-neural-orchestrator:8000
      - GPU_ENABLED=false
    volumes:
      - neural_models_cache:/app/cache
      - ./logs/neural:/app/logs
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    depends_on:
      - romai-neural-orchestrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - neural-network

  # Neural Reasoning Node (Goal formation and decision making)
  romai-neural-reasoning:
    build:
      context: .
      dockerfile: apps/romai/Dockerfile.neural
      target: production
    container_name: romai-neural-reasoning
    ports:
      - "8840:8000"
    environment:
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - TRANSFORMERS_CACHE=/app/cache/transformers
      - HF_HOME=/app/cache/huggingface
      - PYTHONPATH=/app/src
      - NODE_TYPE=reasoning
      - ORCHESTRATOR_URL=http://romai-neural-orchestrator:8000
      - GPU_ENABLED=false
    volumes:
      - neural_models_cache:/app/cache
      - ./logs/neural:/app/logs
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    depends_on:
      - romai-neural-orchestrator
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    networks:
      - neural-network

  # Neural Load Balancer (NGINX-based)
  romai-neural-loadbalancer:
    image: nginx:1.25-alpine
    container_name: romai-neural-loadbalancer
    ports:
      - "8000:80"  # Main neural API endpoint
    volumes:
      - ./config/nginx/neural.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - romai-neural-orchestrator
      - romai-neural-inference-1
      - romai-neural-inference-2
      - romai-neural-perception
      - romai-neural-consciousness
      - romai-neural-reasoning
    restart: unless-stopped
    networks:
      - neural-network
      - codai-network

  # Neural Monitoring (Prometheus)
  romai-neural-monitoring:
    image: prom/prometheus:v2.47.0
    container_name: romai-neural-monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/neural.yml:/etc/prometheus/prometheus.yml
      - neural_monitoring_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - neural-network

  # Neural Metrics Visualization (Grafana)
  romai-neural-grafana:
    image: grafana/grafana:10.2.0
    container_name: romai-neural-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=romai_neural_2025
    volumes:
      - neural_grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - romai-neural-monitoring
    restart: unless-stopped
    networks:
      - neural-network

# Networks
networks:
  neural-network:
    driver: bridge
    name: romai-neural-network
  codai-network:
    external: true

# Volumes
volumes:
  neural_models_cache:
    driver: local
    driver_opts:
      type: none
      device: ${PWD}/cache/neural/models
      o: bind
  neural_monitoring_data:
    driver: local
  neural_grafana_data:
    driver: local