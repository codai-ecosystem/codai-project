# AIDE Web Application Service
apiVersion: v1
kind: Service
metadata:
  name: aide-web-service
  namespace: aide-production
  labels:
    app: aide-web
    tier: frontend
    environment: production
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app: aide-web
  sessionAffinity: None

---
# AIDE API Backend Service
apiVersion: v1
kind: Service
metadata:
  name: aide-api-service
  namespace: aide-production
  labels:
    app: aide-api
    tier: backend
    environment: production
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: aide-api
  sessionAffinity: None

