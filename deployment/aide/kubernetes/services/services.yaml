---
# LoadBalancer Service for External Access
apiVersion: v1
kind: Service
metadata:
  name: aide-loadbalancer
  namespace: aide-production
  labels:
    app: aide
    tier: loadbalancer
    environment: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:region:account:certificate/cert-id"
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
  selector:
    app: nginx-proxy
  loadBalancerPolicy: Local
  externalTrafficPolicy: Local

---
# Headless Service for StatefulSets
apiVersion: v1
kind: Service
metadata:
  name: aide-headless
  namespace: aide-production
  labels:
    app: aide
    environment: production
spec:
  clusterIP: None
  ports:
    - name: web
      port: 3000
      targetPort: 3000
    - name: api
      port: 8080
      targetPort: 8080
  selector:
    app: aide
