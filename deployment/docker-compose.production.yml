# CODAI Backend Services - Production Docker Compose
# For local testing and cloud deployment preparation

version: '3.8'

services:
  # CBD Universal Database Service
  cbd-database:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.cbd
    container_name: codai-cbd-database
    ports:
      - "4180:4180"
    environment:
      - NODE_ENV=production
      - PORT=4180
      - CBD_DATA_PATH=/app/cbd-data
    volumes:
      - cbd_data:/app/cbd-data
      - cbd_logs:/app/logs
    restart: unless-stopped
    networks:
      - codai-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4180/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Gateway Service
  gateway:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.gateway
    container_name: codai-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CBD_DATABASE_URL=http://cbd-database:4180
    depends_on:
      cbd-database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - codai-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # MemorAI MCP HTTP Server
  memorai-mcp:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.memorai-mcp
    container_name: codai-memorai-mcp
    ports:
      - "8002:8002"
    environment:
      - NODE_ENV=production
      - PORT=8002
      - MEMORAI_API_KEY=memorai-prod-key-2025
      - MEMORAI_DEBUG=false
      - MEMORAI_LOG_LEVEL=info
      - MEMORAI_CBD_PATH=/app/memorai-cbd-data
      - NODE_OPTIONS=--max-old-space-size=8192
    volumes:
      - memorai_data:/app/memorai-cbd-data
      - memorai_logs:/app/logs
    restart: unless-stopped
    networks:
      - codai-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 45s
      timeout: 15s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 4G

  # WebSocket Service
  websocket-service:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.websocket
    container_name: codai-websocket
    ports:
      - "4900:4900"
    environment:
      - NODE_ENV=production
      - WS_PORT=4900
      - PORT=4900
      - UV_THREADPOOL_SIZE=16
    restart: unless-stopped
    networks:
      - codai-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4900/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # SSL Proxy Server
  ssl-proxy:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.ssl-proxy
    container_name: codai-ssl-proxy
    ports:
      - "8080:8080"
      - "80:80"
      - "443:443"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - SSL_PROXY_PORT=8080
    volumes:
      - ssl_challenges:/app/ssl-challenges
      - letsencrypt_data:/app/letsencrypt
    restart: unless-stopped
    networks:
      - codai-backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ssl-proxy-health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: codai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - codai-backend
    restart: unless-stopped

  # Monitoring - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: codai-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=codai-admin-2025
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - codai-backend
    restart: unless-stopped

networks:
  codai-backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  cbd_data:
    driver: local
  cbd_logs:
    driver: local
  memorai_data:
    driver: local
  memorai_logs:
    driver: local
  ssl_challenges:
    driver: local
  letsencrypt_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
