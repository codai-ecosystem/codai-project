# Development Docker Compose for Codai Ecosystem
# Includes all services with hot reload and debugging capabilities

version: '3.8'

services:
  # Core Platform
  codai:
    build:
      context: ./apps/codai
      dockerfile: Dockerfile.dev
    ports:
      - "4030:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://codai:password@postgres:5432/codai
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_API_URL=http://localhost:4030
    volumes:
      - ./apps/codai:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - postgres
      - redis
    networks:
      - codai-network

  # Memory & Database Core
  memorai:
    build:
      context: ./apps/memorai
      dockerfile: Dockerfile.dev
    ports:
      - "4031:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://memorai:password@postgres:5432/memorai
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps/memorai:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - codai-network

  # Identity & Authentication
  logai:
    build:
      context: ./apps/logai
      dockerfile: Dockerfile.dev
    ports:
      - "4032:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://logai:password@postgres:5432/logai
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps/logai:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - codai-network

  # Financial Platform
  bancai:
    build:
      context: ./apps/bancai
      dockerfile: Dockerfile.dev
    ports:
      - "4033:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://bancai:password@postgres:5432/bancai
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./apps/bancai:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - codai-network

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=codai_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d
    networks:
      - codai-network

  # Redis Cache & Sessions
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - codai-network

  # Monitoring & Observability
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - codai-network

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "4100:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - codai-network

  # Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d
      - ./infrastructure/ssl:/etc/ssl/certs
    depends_on:
      - codai
      - memorai
      - logai
      - bancai
    networks:
      - codai-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  codai-network:
    driver: bridge
