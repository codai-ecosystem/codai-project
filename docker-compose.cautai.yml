# Cautai System Docker Compose - AI-First Search Engine
# Complete orchestration for MCP server, HTTP API, and web frontend

version: '3.8'

name: cautai-system

services:
  # Cautai PostgreSQL Database
  cautai-postgres:
    image: postgres:15-alpine
    container_name: cautai-postgresql-db
    ports:
      - "4301:5432"  # External 4301, internal 5432
    environment:
      POSTGRES_DB: cautai_db
      POSTGRES_USER: cautai_user
      POSTGRES_PASSWORD: cautai_secure_2025
      POSTGRES_MULTIPLE_DATABASES: cautai_main,cautai_search,cautai_analytics,cautai_cache
    volumes:
      - cautai_postgres_data:/var/lib/postgresql/data
      - ./scripts/init-cautai-databases.sh:/docker-entrypoint-initdb.d/init-cautai-databases.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cautai_user -d cautai_db"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cautai-network

  # Cautai Redis Cache
  cautai-redis:
    image: redis:7.2-alpine
    container_name: cautai-redis-cache
    ports:
      - "8021:6379"  # External 8021, internal 6379
    volumes:
      - cautai_redis_data:/data
    command: redis-server --appendonly yes --maxmemory 1024mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cautai-network

  # Cautai MCP HTTP Server (HTTP Transport for VS Code)
  cautai-mcp-http:
    build:
      context: .
      dockerfile: packages/cautai-mcp/Dockerfile
    container_name: cautai-mcp-http-server
    ports:
      - "4952:4952"  # HTTP MCP Server with SSE transport
    environment:
      # Core configuration
      NODE_ENV: production
      PORT: 4952
      HOST: "0.0.0.0"
      LOG_LEVEL: info
      
      # CAUTAI configuration
      CAUTAI_MAX_RESULTS: "10"
      CAUTAI_DEFAULT_LANGUAGE: "en"
      
      # CORS and security for HTTP transport
      CORS_ENABLED: "true"
      CORS_ORIGINS: "vscode://ms-vscode.copilot-chat,http://localhost:3000"
      
      # Logging and monitoring
      CAUTAI_LOG_DIR: /app/logs
      CAUTAI_CACHE_DIR: /app/cache
      
      # HTTP MCP specific - Legacy SSE transport
      SSE_ENABLED: "true"
      SSE_HEARTBEAT_INTERVAL: "30000"
      SESSION_TIMEOUT: "300000"
    volumes:
      - cautai_logs:/app/logs
      - cautai_cache:/app/cache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4952/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cautai-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'
    command: ["npm", "run", "start:http"]


  # Cautai HTTP Server (REST API Gateway)
  cautai-http-server:
    build:
      context: .
      dockerfile: apps/cautai-server/Dockerfile
      target: runtime
    container_name: cautai-http-server
    ports:
      - "4003:4003"  # HTTP API port
    environment:
      # Core configuration
      NODE_ENV: production
      PORT: 4003
      HTTP_PORT: 4003
      LOG_LEVEL: info
      
      # MCP connection
      MCP_SERVER_URL: http://cautai-mcp-http:4952
      MCP_ENABLED: "true"
      
      # Database connections
      POSTGRES_URL: postgresql://cautai_user:cautai_secure_2025@cautai-postgres:5432/cautai_main
      REDIS_URL: redis://cautai-redis:6379
      
      # API configuration
      API_VERSION: "v1"
      API_RATE_LIMIT: "100"
      API_TIMEOUT: "30000"
      
      # Authentication
      JWT_SECRET: "cautai-jwt-secret-2025"
      AUTH_ENABLED: "true"
      SESSION_TIMEOUT: "3600"
      
      # CORS and security
      CORS_ENABLED: "true"
      CORS_ORIGINS: "http://localhost:3000,https://romcp.ro,https://cautai.ro"
      HELMET_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
      
      # Logging and monitoring
      CAUTAI_LOG_DIR: /app/logs
      ENABLE_REQUEST_LOGGING: "true"
      ENABLE_PERFORMANCE_TRACKING: "true"
    volumes:
      - cautai_logs:/app/logs
      - cautai_cache:/app/cache
    depends_on:
      cautai-mcp-http:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - cautai-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.8'
        reservations:
          memory: 256M
          cpus: '0.3'
    command: ["tsx", "packages/cautai-server/src/http-server.ts"]

  # RomCP Web Frontend (Next.js Application)
  romcp-web:
    build:
      context: .
      dockerfile: apps/romcp-web/Dockerfile
      target: runtime
    container_name: romcp-web-frontend
    ports:
      - "3000:3000"  # Web frontend port
    environment:
      # Next.js configuration
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: "1"
      
      # API connections
      NEXT_PUBLIC_API_URL: http://cautai-http-server:4003
      NEXT_PUBLIC_MCP_URL: ws://cautai-mcp-server:3001
      CAUTAI_API_URL: http://cautai-http-server:4003/api/v1
      
      # App configuration
      NEXT_PUBLIC_APP_NAME: "RomCP - AI Search"
      NEXT_PUBLIC_APP_VERSION: "1.0.0"
      NEXT_PUBLIC_DEFAULT_LANGUAGE: "en"
      NEXT_PUBLIC_SUPPORTED_LANGUAGES: "en,ro"
      
      # Search configuration
      NEXT_PUBLIC_SEARCH_ENABLED: "true"
      NEXT_PUBLIC_MAX_RESULTS: "20"
      NEXT_PUBLIC_ENABLE_FILTERS: "true"
      NEXT_PUBLIC_ENABLE_SORTING: "true"
      
      # Feature flags
      NEXT_PUBLIC_AI_FEATURES_ENABLED: "true"
      NEXT_PUBLIC_DARK_MODE_ENABLED: "true"
      NEXT_PUBLIC_ANALYTICS_ENABLED: "true"
      
      # Performance
      NEXT_PUBLIC_CACHE_TTL: "300"
      NEXT_PUBLIC_ENABLE_SERVICE_WORKER: "true"
      
      # Security
      NEXTAUTH_SECRET: "romcp-nextauth-secret-2025"
      NEXTAUTH_URL: "http://localhost:3000"
    depends_on:
      cautai-http-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cautai-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.6'
        reservations:
          memory: 256M
          cpus: '0.2'

  # Nginx Load Balancer (Production Ready)
  cautai-nginx:
    image: nginx:1.25-alpine
    container_name: cautai-nginx-lb
    ports:
      - "80:80"    # HTTP
      - "443:443"  # HTTPS (if SSL certificates available)
    volumes:
      - ./docker/nginx/cautai-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - cautai_nginx_logs:/var/log/nginx
    depends_on:
      - romcp-web
      - cautai-http-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cautai-network
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.3'

  # Elasticsearch for Advanced Search (Optional)
  cautai-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: cautai-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - cautai_elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cautai-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    profiles: ["full", "search"]

# Network configuration
networks:
  cautai-network:
    driver: bridge
    name: cautai-network
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/16

# Volume definitions
volumes:
  cautai_postgres_data:
    name: cautai_postgres_data
  cautai_redis_data:
    name: cautai_redis_data
  cautai_logs:
    name: cautai_logs
  cautai_cache:
    name: cautai_cache
  cautai_data:
    name: cautai_data
  cautai_nginx_logs:
    name: cautai_nginx_logs
  cautai_mcp_logs:
    name: cautai_mcp_logs
  cautai_elasticsearch_data:
    name: cautai_elasticsearch_data