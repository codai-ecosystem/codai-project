# CBD Engine + MemoraiMCP Enterprise Integration
# Docker Compose configuration for production deployment

version: '3.8'

services:
  # CBD Engine - Enterprise Database Backend
  cbd-engine:
    build:
      context: ./packages/cbd/rust
      dockerfile: Dockerfile
    container_name: cbd-engine
    ports:
      - "8080:8080"
      - "9090:9090"  # Prometheus metrics
    volumes:
      - cbd_data:/data
      - ./config/cbd-production.toml:/data/cbd.toml:ro
      - ./logs/cbd:/var/log/cbd
    environment:
      - RUST_LOG=info
      - CBD_CONFIG_PATH=/data/cbd.toml
      - CBD_DATA_DIR=/data
      - CBD_LOG_LEVEL=info
      - CBD_METRICS_ENABLED=true
      - CBD_SECURITY_ENABLED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - cbd-memorai-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # MemoraiMCP - Enterprise Memory Management Service
  memorai-mcp:
    build:
      context: ./apps/memorai/mcp-package
      dockerfile: Dockerfile
    container_name: memorai-mcp
    ports:
      - "3000:3000"
      - "3001:3001"  # Health check port
    volumes:
      - memorai_config:/app/config
      - memorai_logs:/var/log/memorai
    environment:
      # CBD Engine Connection
      - CBD_HOST=cbd-engine
      - CBD_PORT=8080
      - CBD_DATABASE=memorai_enterprise
      - CBD_API_KEY=${CBD_API_KEY:-}
      
      # MemoraiMCP Configuration
      - NODE_ENV=production
      - LOG_LEVEL=info
      - MEMORAI_VERSION=7.1.2
      - MEMORAI_MODE=enterprise
      - MEMORAI_BACKEND=cbd-engine
      
      # Performance Configuration
      - MEMORAI_MAX_MEMORY_SIZE=1000000
      - MEMORAI_CACHE_TTL=3600
      - MEMORAI_BATCH_SIZE=100
      - MEMORAI_CONNECTION_POOL_SIZE=20
      
      # Security Configuration
      - MEMORAI_AUTH_ENABLED=true
      - MEMORAI_JWT_SECRET=${JWT_SECRET:-}
      - MEMORAI_API_KEY=${MEMORAI_API_KEY:-}
      
    depends_on:
      cbd-engine:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cbd-memorai-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Redis Cache for Enhanced Performance
  redis-cache:
    image: redis:7.2-alpine
    container_name: memorai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cbd-memorai-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.2'
          memory: 512M

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: memorai-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - cbd-memorai-network
    depends_on:
      - cbd-engine
      - memorai-mcp

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:10.1.0
    container_name: memorai-grafana
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=redis-datasource,grafana-clock-panel
    restart: unless-stopped
    networks:
      - cbd-memorai-network
    depends_on:
      - prometheus

  # NGINX Load Balancer & Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: memorai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - memorai-mcp
    restart: unless-stopped
    networks:
      - cbd-memorai-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  # Persistent storage for CBD Engine
  cbd_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${CBD_DATA_PATH:-/var/lib/cbd-memorai/cbd-data}

  # Configuration and logs for MemoraiMCP
  memorai_config:
    driver: local
  memorai_logs:
    driver: local

  # Redis cache storage
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REDIS_DATA_PATH:-/var/lib/cbd-memorai/redis-data}

  # Monitoring data
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  cbd-memorai-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

# Production Health Checks and Monitoring
x-common-healthcheck: &common-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s
