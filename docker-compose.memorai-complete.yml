# MemoraiMCP Complete Ecosystem - All Services
# Includes: MCP Server, App, GraphQL, Dashboard, Monitoring, and all dependencies

services:
  # CBD Database - Universal database service
  cbd-database:
    build:
      context: ./packages/cbd
      dockerfile: Dockerfile
    container_name: memorai-cbd-database
    ports:
      - "4180:4180"
    environment:
      - PORT=4180
      - NODE_ENV=development
      - CBD_LOG_LEVEL=info
    volumes:
      - memorai_cbd_data:/app/data
      - memorai_cbd_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4180/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - memorai-network

  # Redis Cache for performance
  redis:
    image: redis:7-alpine
    container_name: memorai-redis
    ports:
      - "6379:6379"
    volumes:
      - memorai_redis_data:/data
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - memorai-network

  # PostgreSQL Database for MemoraiMCP
  postgres:
    image: postgres:15-alpine
    container_name: memorai-postgres
    environment:
      - POSTGRES_DB=memorai_dev
      - POSTGRES_USER=memorai
      - POSTGRES_PASSWORD=memorai-dev-password
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - memorai_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorai -d memorai_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - memorai-network

  # MemoraiMCP Server - Main MCP service
  memorai-mcp:
    build:
      context: ./packages/memorai-mcp
      dockerfile: Dockerfile
    container_name: memorai-mcp-server
    ports:
      - "4950:4950"
    environment:
      - MEMORAI_API_KEY=memorai-dev-key-2025
      - MEMORAI_MCP_PORT=4950
      - PORT=4950
      - CBD_BASE_URL=http://cbd-database:4180
      - NODE_ENV=development
      - DEBUG=memorai:*
      - MEMORAI_DEBUG=true
      - MEMORAI_LOG_LEVEL=debug
      - ENABLE_VECTOR_SEARCH=true
      - ENABLE_HYBRID_SEARCH=true
      - ENABLE_FUZZY_MATCHING=true
      - ENABLE_KEYWORD_SEARCH=true
      - ENABLE_RBAC=true
      - ENABLE_REALTIME_COLLAB=true
      - ENABLE_ANALYTICS=true
      - ENABLE_TEMPORAL=true
      - ENABLE_PATTERNS=true
      - ENABLE_CLUSTERING=true
      - ENABLE_CROSS_REF=true
      - ENABLE_BACKUP=true
      - ENABLE_MONITORING=true
      - VECTOR_CACHE_TTL=3600
      - SEARCH_CACHE_TTL=300
      - AZURE_OPENAI_ENDPOINT=https://swedencentral.api.cognitive.microsoft.com/
      - AZURE_OPENAI_API_KEY=8f9d3fd033c04f5ab6b5886c15f16a2c
      - AZURE_OPENAI_DEPLOYMENT_NAME=text-embedding-3-large
      - AZURE_OPENAI_API_VERSION=2024-02-01
      - OPENAI_API_KEY=your-openai-api-key-here
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://memorai:memorai-dev-password@postgres:5432/memorai_dev
    volumes:
      - memorai_mcp_data:/app/data
      - memorai_mcp_logs:/app/logs
    depends_on:
      cbd-database:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4950/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - memorai-network

  # MemoraiMCP App - Main application
  memorai-app:
    build:
      context: ./apps/memorai
      dockerfile: Dockerfile
    container_name: memorai-app
    ports:
      - "4006:4006"
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=4096
      - DATABASE_URL=postgresql://memorai:memorai-dev-password@postgres:5432/memorai_dev
      - REDIS_URL=redis://redis:6379
      - MEMORAI_MCP_URL=http://memorai-mcp:4950
      - MEMORAI_API_KEY=memorai-dev-key-2025
      - JWT_SECRET=memorai-dev-jwt-secret-2025
      - ENCRYPTION_KEY=memorai-dev-encryption-key-2025
      - NEXT_PUBLIC_APP_URL=http://localhost:4006
      - NEXT_PUBLIC_API_URL=http://localhost:4006/api
      - NEXTAUTH_URL=http://localhost:4006
      - NEXTAUTH_SECRET=memorai-dev-nextauth-secret-2025
      - PORT=4006
    volumes:
      - memorai_app_logs:/app/logs
      - memorai_app_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      memorai-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4006/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - memorai-network

  # MemoraiMCP GraphQL Server
  memorai-graphql:
    build:
      context: ./apps/memorai/graphql
      dockerfile: Dockerfile
    container_name: memorai-graphql-server
    ports:
      - "4500:4500"
    environment:
      - NODE_ENV=development
      - MEMORAI_API_BASE_URL=http://memorai-app:4006
      - PORT=4500
      - GRAPHQL_REQUIRE_AUTH=false
      - GRAPHQL_CLIENT_API_KEY=memorai-test-token
      - GRAPHQL_SERVICE_TOKEN=Bearer memorai-test-token
      - DATABASE_URL=postgresql://memorai:memorai-dev-password@postgres:5432/memorai_dev
    volumes:
      - memorai_graphql_logs:/app/logs
    depends_on:
      memorai-app:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4500/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - memorai-network

  # MemoraiMCP API Gateway
  memorai-gateway:
    image: nginx:alpine
    container_name: memorai-gateway
    ports:
      - "4000:80"
    volumes:
      - ./config/nginx/memorai-gateway.conf:/etc/nginx/conf.d/default.conf
      - memorai_gateway_logs:/var/log/nginx
    depends_on:
      - memorai-app
      - memorai-mcp
      - memorai-graphql
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - memorai-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: memorai-prometheus
    ports:
      - "4952:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - memorai_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.enable-lifecycle'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - memorai-network

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: memorai-grafana
    ports:
      - "4951:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=memorai-admin
      - GF_SERVER_ROOT_URL=http://localhost:4951
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - memorai_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - memorai-network

networks:
  memorai-network:
    driver: bridge
    name: memorai-network

volumes:
  memorai_cbd_data:
    driver: local
  memorai_cbd_logs:
    driver: local
  memorai_redis_data:
    driver: local
  memorai_postgres_data:
    driver: local
  memorai_mcp_data:
    driver: local
  memorai_mcp_logs:
    driver: local
  memorai_app_logs:
    driver: local
  memorai_app_uploads:
    driver: local
  memorai_graphql_logs:
    driver: local
  memorai_gateway_logs:
    driver: local
  memorai_prometheus_data:
    driver: local
  memorai_grafana_data:
    driver: local