# 🐳 Docker Compose - CBD Universal Database Development Environment

version: '3.8'

services:
  # CBD Core Database Service
  cbd-core:
    build:
      context: ./packages/cbd
      dockerfile: Dockerfile
    container_name: cbd-core-database
    ports:
      - "4180:4180"
    environment:
      - NODE_ENV=development
      - PORT=4180
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://postgres:postgres@postgres:5432/cbd_db
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4180/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - cbd-network

  # Real-time Collaboration Service
  cbd-collaboration:
    build:
      context: ./packages/cbd
      dockerfile: Dockerfile.collaboration
    container_name: cbd-collaboration-service
    ports:
      - "4600:4600"
    environment:
      - NODE_ENV=development
      - PORT=4600
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-jwt-secret-key
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4600/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - cbd-network

  # AI Analytics Engine
  cbd-analytics:
    build:
      context: ./packages/cbd
      dockerfile: Dockerfile.analytics
    container_name: cbd-analytics-engine
    ports:
      - "4700:4700"
    environment:
      - NODE_ENV=development
      - PORT=4700
      - TENSORFLOW_BACKEND=cpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - cbd-network

  # GraphQL API Gateway
  cbd-graphql:
    build:
      context: ./packages/cbd
      dockerfile: Dockerfile.graphql
    container_name: cbd-graphql-gateway
    ports:
      - "4800:4800"
    environment:
      - NODE_ENV=development
      - PORT=4800
      - CBD_CORE_URL=http://cbd-core:4180
      - CBD_COLLABORATION_URL=http://cbd-collaboration:4600
      - CBD_ANALYTICS_URL=http://cbd-analytics:4700
    depends_on:
      - cbd-core
      - cbd-collaboration
      - cbd-analytics
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4800/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - cbd-network

  # Service Mesh Gateway
  cbd-mesh:
    build:
      context: ./packages/cbd
      dockerfile: Dockerfile.mesh
    container_name: cbd-service-mesh
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - SERVICE_DISCOVERY_ENABLED=true
    depends_on:
      - cbd-core
      - cbd-collaboration
      - cbd-analytics
      - cbd-graphql
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - cbd-network

  # Redis for caching and session management
  redis:
    image: redis:7.2-alpine
    container_name: cbd-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --replica-read-only no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - cbd-network

  # PostgreSQL for persistent data
  postgres:
    image: postgres:16-alpine
    container_name: cbd-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=cbd_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/cbd/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - cbd-network

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: cbd-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - cbd-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:10.0.0
    container_name: cbd-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - cbd-network

  # Nginx reverse proxy and load balancer
  nginx:
    image: nginx:1.25-alpine
    container_name: cbd-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - cbd-mesh
    restart: unless-stopped
    networks:
      - cbd-network

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  cbd-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
