# CODAI Ecosystem - Complete Docker Orchestration
# Multi-service architecture with proper networking and dependencies

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: codai-postgres
    ports:
      - "5432:5432"  # Keep PostgreSQL on standard port for compatibility
    environment:
      POSTGRES_DB: codai_ecosystem
      POSTGRES_USER: codai_user
      POSTGRES_PASSWORD: codai_secure_2025
      POSTGRES_MULTIPLE_DATABASES: codai_main,codai_auth,codai_analytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codai_user -d codai_ecosystem"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - codai-network

  # Redis Cache Service (Non-conflicting port)
  redis:
    image: redis:7.2-alpine
    container_name: codai-redis
    ports:
      - "4020:6379"  # External 4020, internal 6379
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - codai-network

  # Gateway Service (API Orchestrator)
  gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    container_name: codai-gateway
    ports:
      - "4010:4003"  # External 4010, internal 4003
    environment:
      NODE_ENV: production
      PORT: "4003"
      GATEWAY_NAME: "CODAI Ecosystem Gateway"
      DATABASE_URL: "postgresql://codai_user:codai_secure_2025@postgres:5432/codai_main"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - codai-network

  # ID Service (Identity Management)
  id-service:
    build:
      context: ./apps/id
      dockerfile: Dockerfile
    container_name: codai-id-service
    ports:
      - "4100:3000"  # External 4100, internal 3000 (Next.js default)
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://codai_user:codai_secure_2025@postgres:5432/codai_auth"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "codai_id_jwt_secret_2025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - codai-network

  # Hub Service (Central Coordination)
  hub-service:
    build:
      context: ./apps/hub
      dockerfile: Dockerfile
    container_name: codai-hub-service
    ports:
      - "4110:3000"  # External 4110, internal 3000
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://codai_user:codai_secure_2025@postgres:5432/codai_main"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - codai-network

  # BancAI Service (Banking AI)
  bancai-service:
    build:
      context: ./apps/bancai
      dockerfile: Dockerfile
    container_name: codai-bancai-service
    ports:
      - "4120:3000"  # External 4120, internal 3000
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://codai_user:codai_secure_2025@postgres:5432/codai_main"
      REDIS_URL: "redis://redis:6379"
      BANCAI_API_KEY: "bancai_secure_key_2025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - codai-network

  # RomAI Service (Roman AI)
  romai-service:
    build:
      context: ./apps/romai
      dockerfile: Dockerfile
    container_name: codai-romai-service
    ports:
      - "4130:3000"  # External 4130, internal 3000
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://codai_user:codai_secure_2025@postgres:5432/codai_main"
      REDIS_URL: "redis://redis:6379"
      ROMAI_API_KEY: "romai_secure_key_2025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - codai-network

  # Admin Service (Administration)
  admin-service:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: codai-admin-service
    ports:
      - "4140:3000"  # External 4140, internal 3000
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://codai_user:codai_secure_2025@postgres:5432/codai_main"
      REDIS_URL: "redis://redis:6379"
      ADMIN_SECRET: "admin_secret_key_2025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - codai-network

  # Nginx Load Balancer & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: codai-nginx
    ports:
      - "4000:80"  # External 4000, internal 80
    volumes:
      - ./config/nginx/codai-updated.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
      - id-service
      - hub-service
      - bancai-service
      - romai-service
      - admin-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - codai-network

networks:
  codai-network:
    driver: bridge
    name: codai-ecosystem

volumes:
  postgres_data:
    driver: local
    name: codai_postgres_data
  redis_data:
    driver: local
    name: codai_redis_data