# CODAI Ecosystem - Compl  # Redis Cache Service  
  redis:
    image: redis:7.2-alpine
    container_name: codai-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - codai-network
# Multi-service architecture with proper networking and dependencies

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: codai-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: codai_ecosystem
      POSTGRES_USER: codai_user
      POSTGRES_PASSWORD: codai_secure_2025
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codai_user -d codai_ecosystem"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - codai-network

  # Redis Cache Service  
  redis:
    image: redis:7.2-alpine
    container_name: codai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - codai-network

  # Gateway Service (API Orchestrator)
  gateway:
    build:
      context: ./apps/gateway
      dockerfile: Dockerfile
    container_name: codai-gateway
    ports:
      - "4003:4003"
    environment:
      NODE_ENV: production
      PORT: "4003"
      GATEWAY_NAME: "CODAI Ecosystem Gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - codai-network

  # Nginx Load Balancer & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: codai-nginx
    ports:
      - "4000:80"
    volumes:
      - ./config/nginx/codai.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - codai-network

networks:
  codai-network:
    driver: bridge
    name: codai-ecosystem

volumes:
  postgres_data:
    driver: local
    name: codai_postgres_data
  redis_data:
    driver: local
    name: codai_redis_data