# RomAI AGI Day 8 - Enhanced Prometheus Configuration
# GPU monitoring, advanced metrics, and global scale monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'romai-agi-gpu'
    region: 'primary'
    environment: 'production'

# Alert rules configuration
rule_files:
  - "rules/*.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Enhanced scrape configurations for Day 8
scrape_configs:
  # RomAI AGI GPU Server - Primary monitoring
  - job_name: 'romai-agi-gpu'
    static_configs:
      - targets: ['romai-agi-gpu:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true
    params:
      format: ['prometheus']

  # GPU-specific metrics endpoint
  - job_name: 'romai-agi-gpu-metrics'
    static_configs:
      - targets: ['romai-agi-gpu:8001']
    metrics_path: '/gpu-metrics'
    scrape_interval: 5s
    scrape_timeout: 3s

  # NVIDIA DCGM GPU metrics
  - job_name: 'gpu-metrics-exporter'
    static_configs:
      - targets: ['gpu-metrics-exporter:9400']
    scrape_interval: 10s
    scrape_timeout: 5s
    honor_labels: true

  # System metrics via Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: node-exporter:9100

  # Redis Cluster monitoring
  - job_name: 'redis-cluster'
    static_configs:
      - targets: ['redis-cluster:6379']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # PostgreSQL monitoring
  - job_name: 'postgres-primary'
    static_configs:
      - targets: ['postgres-primary:5432']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # NGINX Load Balancer
  - job_name: 'nginx-gpu-lb'
    static_configs:
      - targets: ['nginx-gpu-lb:8080']
    metrics_path: '/nginx_status'
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # Grafana monitoring
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana-gpu:3000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # AlertManager monitoring
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Jaeger tracing metrics
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Elasticsearch cluster
  - job_name: 'elasticsearch'
    static_configs:
      - targets: ['elasticsearch:9200']
    metrics_path: '/_prometheus/metrics'
    scrape_interval: 30s

  # Vector log collector
  - job_name: 'vector'
    static_configs:
      - targets: ['vector:9598']
    metrics_path: '/metrics'
    scrape_interval: 30s

# Advanced recording rules for performance optimization
recording_rules:
  # GPU utilization aggregations
  - record: romai:gpu_utilization_avg
    expr: avg(DCGM_FI_DEV_GPU_UTIL) by (instance)
    labels:
      component: gpu
      
  - record: romai:gpu_memory_utilization_avg
    expr: avg(DCGM_FI_DEV_MEM_COPY_UTIL) by (instance)
    labels:
      component: gpu_memory

  # AGI model performance metrics
  - record: romai:inference_latency_p95
    expr: histogram_quantile(0.95, rate(romai_inference_duration_seconds_bucket[5m]))
    labels:
      component: agi_model
      
  - record: romai:inference_throughput
    expr: rate(romai_inference_total[5m])
    labels:
      component: agi_model

  # Cache performance
  - record: romai:cache_hit_rate
    expr: rate(romai_cache_hits_total[5m]) / rate(romai_cache_requests_total[5m])
    labels:
      component: cache

  # System resource aggregations
  - record: romai:cpu_usage_avg
    expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
    labels:
      component: system

  - record: romai:memory_usage_percent
    expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100
    labels:
      component: system

# Remote write configuration for multi-region setup
remote_write:
  - url: "http://prometheus-remote:9090/api/v1/write"
    queue_config:
      max_samples_per_send: 10000
      batch_send_deadline: 5s
      max_shards: 200
      capacity: 100000
    write_relabel_configs:
      - source_labels: [__name__]
        regex: 'romai_.*'
        action: keep

# Remote read for federated queries
remote_read:
  - url: "http://prometheus-remote:9090/api/v1/read"
    read_recent: true

# Storage configuration for long-term retention
storage:
  tsdb:
    retention_time: 30d
    retention_size: 50GB
    wal_compression: true
