apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config-simple
  namespace: codai-infrastructure
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    
    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;
        
        # Basic settings
        sendfile on;
        keepalive_timeout 65;
        
        # DNS resolver for service discovery
        resolver 10.100.0.10;
        
        server {
            listen 80;
            server_name _;
            
            # Security headers
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            
            # Handle preflight requests
            location ~* \.(OPTIONS)$ {
                add_header Access-Control-Allow-Origin "*";
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization";
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type "text/plain; charset=utf-8";
                add_header Content-Length 0;
                return 204;
            }
            
            # Health check endpoint
            location /health {
                access_log off;
                return 200 '{"status":"healthy","gateway":"CODAI Gateway","services":{"bancai":"available","hub":"available","id":"available"},"timestamp":"$time_iso8601"}';
                add_header Content-Type application/json;
            }
            
            # Root endpoint
            location = / {
                return 200 '{"message":"CODAI Ecosystem Gateway","version":"1.0.0","services":["/api/v1/bancai","/api/v1/hub","/api/v1/id"],"health":"/health"}';
                add_header Content-Type application/json;
            }
            
            # BancAI Service routing
            location /api/v1/bancai/ {
                set $backend "bancai.codai-services.svc.cluster.local:4120";
                proxy_pass http://$backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }
            
            # Hub Service routing
            location /api/v1/hub/ {
                set $backend "codai-hub.codai-services.svc.cluster.local:4110";
                proxy_pass http://$backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }
            
            # ID Service routing
            location /api/v1/id/ {
                set $backend "codai-id.codai-services.svc.cluster.local:4100";
                proxy_pass http://$backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }
            
            # Fallback for unmatched routes
            location / {
                return 404 '{"error":"Route not found","available_routes":["/health","/api/v1/bancai","/api/v1/hub","/api/v1/id"]}';
                add_header Content-Type application/json;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-simple
  namespace: codai-infrastructure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-simple
  template:
    metadata:
      labels:
        app: gateway-simple
    spec:
      containers:
      - name: gateway
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: nginx-config
        configMap:
          name: gateway-config-simple
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-simple
  namespace: codai-infrastructure
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: gateway-simple