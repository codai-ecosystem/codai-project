version: '3.8'

services:
  # Production Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - codai-platform
      - api-gateway
    networks:
      - codai-network
    restart: unless-stopped
    
  # CODAI Platform
  codai-platform:
    build:
      context: ..
      dockerfile: docker/Dockerfile.codai-platform
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/codai
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - NEXT_PUBLIC_API_URL=https://api.codai.ro
    depends_on:
      - mongodb
      - redis
    networks:
      - codai-network
    restart: unless-stopped
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MEMORAI Service
  memorai-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.memorai-service
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/memorai
      - REDIS_URL=redis://redis:6379
      - ML_MODEL_PATH=/app/models
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - memorai-models:/app/models
      - memorai-data:/app/data
    depends_on:
      - mongodb
      - redis
    networks:
      - codai-network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4031/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  # BANCAI Service
  bancai-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bancai-service
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/bancai
      - REDIS_URL=redis://redis:6379
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - PCI_COMPLIANCE_LEVEL=enterprise
      - SOX_COMPLIANCE_ENABLED=true
    depends_on:
      - mongodb
      - redis
    networks:
      - codai-network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4032/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # API Gateway
  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api-gateway
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - RATE_LIMIT_REQUESTS=1000
      - RATE_LIMIT_WINDOW=900000
      - AUTH_SERVICE_URL=http://codai-platform:3000
    depends_on:
      - redis
      - codai-platform
    networks:
      - codai-network
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    environment:
      - MONGO_INITDB_ROOT_USERNAME=codai
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
    volumes:
      - mongodb-data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d
    networks:
      - codai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - codai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Monitoring and Logging
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - codai-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "4091:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - codai-network
    restart: unless-stopped

  # Log aggregation
  fluentd:
    build:
      context: ./monitoring/fluentd
      dockerfile: Dockerfile
    volumes:
      - ./monitoring/fluentd/conf:/fluentd/etc
      - /var/log:/var/log:ro
    networks:
      - codai-network
    restart: unless-stopped

volumes:
  mongodb-data:
    driver: local
  redis-data:
    driver: local
  memorai-models:
    driver: local
  memorai-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  codai-network:
    driver: overlay
    attachable: true
    ipam:
      config:
        - subnet: 10.0.1.0/24
