# Horizontal Pod Autoscalers for ControlAI and RomAI
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: controlai-dashboard-hpa
  namespace: codai-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: controlai-dashboard
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: controlai-backend-hpa
  namespace: codai-apis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: controlai-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
