# Ingress Configuration for All CODAI Ecosystem Domains

# AWS Load Balancer Controller for external traffic
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codai-core-ingress
  namespace: codai-core
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: ${aws_acm_certificate.codai_domains.arn}
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS-1-2-2017-01
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/group.name: codai-core
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
spec:
  rules:
    # Identity Service
    - host: id.codai.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: id-service
                port:
                  number: 80
    # Gateway API
    - host: api.codai.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 80
    # Hub Service
    - host: hub.codai.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hub-service
                port:
                  number: 80
    # Admin Service
    - host: admin.codai.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 80
    # Auth redirect to ID service
    - host: auth.codai.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: id-service
                port:
                  number: 80
---
# MemorAI Ecosystem Ingress
