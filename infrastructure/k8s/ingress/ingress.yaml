apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cbd-memorai-ingress
  namespace: cbd-memorai-prod
  labels:
    app: cbd-memorai
    component: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://codai.app,https://memorai.codai.app"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - memorai-api.codai.app
    - cbd-engine.codai.app
    secretName: cbd-memorai-tls
  rules:
  - host: memorai-api.codai.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: memorai-mcp-service
            port:
              number: 3000
      - path: /health
        pathType: Exact
        backend:
          service:
            name: memorai-mcp-service
            port:
              number: 3000
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: memorai-mcp-service
            port:
              number: 9091
  - host: cbd-engine.codai.app
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cbd-engine-service
            port:
              number: 8080
      - path: /health
        pathType: Exact
        backend:
          service:
            name: cbd-engine-service
            port:
              number: 8080
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: cbd-engine-service
            port:
              number: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cbd-memorai-netpol
  namespace: cbd-memorai-prod
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app: memorai-mcp
    - podSelector:
        matchLabels:
          app: cbd-engine
    - podSelector:
        matchLabels:
          app: redis
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: memorai-mcp
    - podSelector:
        matchLabels:
          app: cbd-engine
    - podSelector:
        matchLabels:
          app: redis
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
