# MemorAI Ecosystem Services Kubernetes Manifests

# MemorAI Frontend (memorai.ro)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memorai-frontend
  namespace: codai-services
  labels:
    app: memorai-frontend
    component: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: memorai-frontend
  template:
    metadata:
      labels:
        app: memorai-frontend
        component: frontend
    spec:
      containers:
        - name: memorai-frontend
          image: ${aws_ecr_repository.memorai_frontend.repository_url}:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: codai-config
                  key: NODE_ENV
            - name: PORT
              value: '3000'
            - name: NEXT_PUBLIC_API_URL
              value: 'https://api.memorai.ro'
            - name: NEXT_PUBLIC_MCP_URL
              value: 'https://mcp.memorai.ro'
            - name: NEXT_PUBLIC_CBD_URL
              value: 'https://cbd.memorai.ro'
            - name: NEXT_PUBLIC_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: codai-domains
                  key: MEMORAI_DOMAIN
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: memorai-frontend
  namespace: codai-services
  labels:
    app: memorai-frontend
spec:
  selector:
    app: memorai-frontend
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
---
# MemorAI Backend API (api.memorai.ro)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memorai-backend
  namespace: codai-services
  labels:
    app: memorai-backend
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: memorai-backend
  template:
    metadata:
      labels:
        app: memorai-backend
        component: backend
    spec:
      containers:
        - name: memorai-backend
          image: ${aws_ecr_repository.memorai_backend.repository_url}:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: codai-config
                  key: NODE_ENV
            - name: PORT
              value: '3000'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: codai-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: codai-config
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: codai-secrets
                  key: JWT_SECRET
            - name: CBD_SERVICE_URL
              value: 'http://cbd-service.codai-services.svc.cluster.local'
            - name: MCP_SERVICE_URL
              value: 'http://memorai-mcp.codai-mcps.svc.cluster.local'
          resources:
            requests:
              memory: '512Mi'
              cpu: '500m'
            limits:
              memory: '1Gi'
              cpu: '1000m'
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: memorai-backend
  namespace: codai-services
  labels:
    app: memorai-backend
spec:
  selector:
    app: memorai-backend
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
---
# CBD Service (cbd.memorai.ro) - High-Performance Vector Database
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cbd-service
  namespace: codai-services
  labels:
    app: cbd-service
    component: vector-database
spec:
  serviceName: cbd-service
  replicas: 3
  selector:
    matchLabels:
      app: cbd-service
  template:
    metadata:
      labels:
        app: cbd-service
        component: vector-database
    spec:
      containers:
        - name: cbd-service
          image: ${aws_ecr_repository.cbd_service.repository_url}:latest
          ports:
            - containerPort: 4180
              name: api
            - containerPort: 8080
              name: metrics
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: codai-config
                  key: NODE_ENV
            - name: PORT
              value: '4180'
            - name: METRICS_PORT
              value: '8080'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: codai-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: codai-config
                  key: REDIS_URL
            - name: VECTOR_DIMENSIONS
              value: '1536'
            - name: INDEX_TYPE
              value: 'HNSW'
            - name: SIMILARITY_METRIC
              value: 'cosine'
            - name: MAX_CONNECTIONS
              value: '200'
            - name: QUERY_TIMEOUT
              value: '5000'
            - name: BATCH_SIZE
              value: '1000'
            - name: CACHE_TTL
              value: '3600'
          volumeMounts:
            - name: cbd-storage
              mountPath: /data
            - name: cbd-config
              mountPath: /config
          resources:
            requests:
              memory: '2Gi'
              cpu: '1000m'
            limits:
              memory: '4Gi'
              cpu: '2000m'
          livenessProbe:
            httpGet:
              path: /health
              port: 4180
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: 4180
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: cbd-config
          configMap:
            name: cbd-config
  volumeClaimTemplates:
    - metadata:
        name: cbd-storage
      spec:
        accessModes: ['ReadWriteOnce']
        storageClassName: 'gp3-fast'
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cbd-service
  namespace: codai-services
  labels:
    app: cbd-service
spec:
  selector:
    app: cbd-service
  ports:
    - port: 80
      targetPort: 4180
      protocol: TCP
      name: api
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: metrics
  type: ClusterIP
---
# CBD Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: cbd-config
  namespace: codai-services
data:
  cbd.conf: |
    # CBD Vector Database Configuration
    server:
      port: 4180
      max_connections: 200
      timeout: 5000
      
    vector:
      dimensions: 1536
      index_type: "HNSW"
      similarity_metric: "cosine"
      m: 16
      ef_construction: 200
      ef_search: 50
      
    performance:
      batch_size: 1000
      cache_size: "1GB"
      cache_ttl: 3600
      parallel_queries: 8
      
    storage:
      data_path: "/data"
      backup_path: "/data/backups"
      compression: true
      
    logging:
      level: "info"
      format: "json"
      file: "/data/logs/cbd.log"
      
    metrics:
      enabled: true
      port: 8080
      path: "/metrics"
---
# MemorAI MCP Server (mcp.memorai.ro)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memorai-mcp
  namespace: codai-mcps
  labels:
    app: memorai-mcp
    component: mcp-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: memorai-mcp
  template:
    metadata:
      labels:
        app: memorai-mcp
        component: mcp-server
    spec:
      containers:
        - name: memorai-mcp
          image: ${aws_ecr_repository.memorai_mcp.repository_url}:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: codai-config
                  key: NODE_ENV
            - name: PORT
              value: '3000'
            - name: MCP_SERVER_NAME
              value: 'memorai-mcp'
            - name: MCP_SERVER_VERSION
              value: '9.5.0'
            - name: CBD_SERVICE_URL
              value: 'http://cbd-service.codai-services.svc.cluster.local'
            - name: BACKEND_SERVICE_URL
              value: 'http://memorai-backend.codai-services.svc.cluster.local'
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: codai-config
                  key: REDIS_URL
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: codai-secrets
                  key: MCP_API_KEY
            - name: RATE_LIMIT_ENABLED
              value: 'true'
            - name: RATE_LIMIT_WINDOW
              value: '60000'
            - name: RATE_LIMIT_MAX
              value: '1000'
          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: memorai-mcp
  namespace: codai-mcps
  labels:
    app: memorai-mcp
spec:
  selector:
    app: memorai-mcp
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
---
# Horizontal Pod Autoscaler for MemorAI Services
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memorai-frontend-hpa
  namespace: codai-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memorai-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memorai-backend-hpa
  namespace: codai-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memorai-backend
  minReplicas: 2
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memorai-mcp-hpa
  namespace: codai-mcps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memorai-mcp
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
