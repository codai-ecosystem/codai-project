apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cbd-engine-network-policy
  namespace: cbd-system
spec:
  podSelector:
    matchLabels:
      app: cbd-engine
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: cbd-system
    - podSelector:
        matchLabels:
          app: cbd-client
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: cbd-database
    ports:
    - protocol: TCP
      port: 5432
