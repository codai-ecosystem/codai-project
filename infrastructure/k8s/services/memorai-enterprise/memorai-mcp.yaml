apiVersion: v1
kind: Service
metadata:
  name: memorai-mcp-service
  namespace: memorai-production
  labels:
    app: memorai-mcp
    component: protocol-server
    tier: integration
spec:
  type: ClusterIP
  selector:
    app: memorai-mcp
  ports:
    - name: mcp
      port: 8000
      targetPort: 8000
      protocol: TCP
    - name: metrics
      port: 9092
      targetPort: 9092
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memorai-mcp
  namespace: memorai-production
  labels:
    app: memorai-mcp
    component: protocol-server
    tier: integration
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: memorai-mcp
  template:
    metadata:
      labels:
        app: memorai-mcp
        component: protocol-server
        tier: integration
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9092'
        prometheus.io/path: '/metrics'
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - memorai-mcp
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-services
          image: busybox:1.35
          command: ['sh', '-c']
          args:
            - |
              until nc -z memorai-backend-service 4007 && nc -z cbd-service 4180; do
                echo "Waiting for backend services to be ready..."
                sleep 2
              done
              echo "Backend services are ready!"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: memorai-mcp
          image: codai/memorai-mcp:latest
          imagePullPolicy: Always
          ports:
            - name: mcp
              containerPort: 8000
              protocol: TCP
            - name: metrics
              containerPort: 9092
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          envFrom:
            - configMapRef:
                name: memorai-mcp-config
            - secretRef:
                name: memorai-secrets
          resources:
            requests:
              memory: '512Mi'
              cpu: '250m'
              ephemeral-storage: '1Gi'
            limits:
              memory: '1Gi'
              cpu: '500m'
              ephemeral-storage: '2Gi'
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: mcp-cache
              mountPath: /app/cache
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /startup
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 30
      volumes:
        - name: tmp
          emptyDir: {}
        - name: mcp-cache
          emptyDir:
            sizeLimit: 500Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memorai-mcp-hpa
  namespace: memorai-production
  labels:
    app: memorai-mcp
    component: protocol-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memorai-mcp
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
