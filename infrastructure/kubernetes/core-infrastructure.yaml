kind: Deployment
metadata:
  name: glass
  namespace: codai-infrastructure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: glass
  template:
    metadata:
      labels:
        app: glass
    spec:
      containers:
        - name: glass
          image: node:20-alpine
          workingDir: /app
          command: ['sh', '-c']
          args: ['npm install && npm run build && npm start']
          ports:
            - containerPort: 7700
          env:
            - name: NODE_ENV
              value: 'production'
            - name: PORT
              value: '7700'
          volumeMounts:
            - name: glass-code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /health
              port: 7700
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: glass-code
          hostPath:
            path: E:\GitHub\codai-project\apps\glass
---
apiVersion: v1
kind: Service
metadata:
  name: glass
  namespace: codai-infrastructure
spec:
  selector:
    app: glass
  ports:
    - port: 7700
      targetPort: 7700
