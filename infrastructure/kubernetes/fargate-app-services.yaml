apiVersion: v1
kind: Namespace
metadata:
  name: codai-infrastructure
---
# Gateway Service (API router) - Using NGINX placeholder
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: codai-infrastructure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '256Mi'
              cpu: '250m'
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: codai-infrastructure
spec:
  selector:
    app: gateway
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer
---
