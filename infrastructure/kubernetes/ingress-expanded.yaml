apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codai-ecosystem-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    nginx.ingress.kubernetes.io/proxy-body-size: '50m'
    nginx.ingress.kubernetes.io/proxy-connect-timeout: '600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '600'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '600'
spec:
  ingressClassName: nginx
  tls:
    # Core Platform Certificates
    - hosts:
        - 'codai.ro'
        - '*.codai.ro'
      secretName: codai-tls
    - hosts:
        - 'memorai.ro'
        - '*.memorai.ro'
      secretName: memorai-tls
    - hosts:
        - 'controlai.ro'
        - '*.controlai.ro'
      secretName: controlai-tls
    - hosts:
        - 'romai.ro'
        - '*.romai.ro'
      secretName: romai-tls

    # Phase 1: Core Business AI Services
    - hosts:
        - 'bancai.ro'
        - '*.bancai.ro'
      secretName: bancai-tls
    - hosts:
        - 'studiai.ro'
        - '*.studiai.ro'
      secretName: studiai-tls
    - hosts:
        - 'talentai.ro'
        - '*.talentai.ro'
      secretName: talentai-tls
    - hosts:
        - 'marketai.ro'
        - '*.marketai.ro'
      secretName: marketai-tls
    - hosts:
        - 'legalizai.ro'
        - '*.legalizai.ro'
      secretName: legalizai-tls
    - hosts:
        - 'conversai.ro'
        - '*.conversai.ro'
      secretName: conversai-tls
    - hosts:
        - 'muzicai.ro'
