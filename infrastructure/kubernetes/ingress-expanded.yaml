    - host: codai.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codai-main
                port:
                  number: 3000
    - host: api.codai.ro
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
