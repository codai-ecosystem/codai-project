      secretName: muzicai-tls
    - hosts:
        - 'stocai.ro'
        - '*.stocai.ro'
      secretName: stocai-tls

    # Phase 2: Platform Services
    - hosts:
        - 'kodex.ro'
        - '*.kodex.ro'
      secretName: kodex-tls
    - hosts:
        - 'metu.ro'
        - '*.metu.ro'
      secretName: metu-tls

    # Phase 3: Extended AI Services
    - hosts:
        - 'acasai.ro'
        - '*.acasai.ro'
      secretName: acasai-tls
    - hosts:
        - 'adoptai.ro'
        - '*.adoptai.ro'
      secretName: adoptai-tls
    - hosts:
        - 'aide.ro'
        - '*.aide.ro'
      secretName: aide-tls
    - hosts:
        - 'ajutai.ro'
        - '*.ajutai.ro'
      secretName: ajutai-tls
    - hosts:
