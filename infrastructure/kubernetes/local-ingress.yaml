# Local Ingress Configuration for Phase 1

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: phase1-ingress
  namespace: phase1-apps
  annotations:
    kubernetes.io/ingress.class: 'nginx'
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
spec:
  rules:
    # BancAI
    - host: bancai.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bancai
                port:
                  number: 80
    - host: www.bancai.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bancai
                port:
                  number: 80
