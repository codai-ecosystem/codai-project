# 🚀 Phase 1 Applications - Local Deployment

apiVersion: v1
kind: Namespace
metadata:
  name: phase1-apps
---
# BancAI - Banking AI Platform
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bancai
  namespace: phase1-apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bancai
  template:
    metadata:
      labels:
        app: bancai
    spec:
      containers:
        - name: bancai
          image: node:20-alpine
          command: ['sh', '-c', 'cd /app && npm install && npm start']
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: 'postgresql://codai:codai123@postgresql.codai-system:5432/codai'
            - name: REDIS_URL
              value: 'redis://redis.codai-system:6379'
            - name: NODE_ENV
              value: 'production'
          volumeMounts:
            - name: app-code
              mountPath: /app
      volumes:
        - name: app-code
          hostPath:
            path: E:\GitHub\codai-project\apps\bancai
---
apiVersion: v1
kind: Service
metadata:
  name: bancai
  namespace: phase1-apps
spec:
  selector:
    app: bancai
  ports:
    - port: 80
      targetPort: 3000
