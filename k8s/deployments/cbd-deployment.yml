apiVersion: apps/v1
kind: Deployment
metadata:
  name: cbd-database
  namespace: codai-ecosystem
  labels:
    app: cbd-database
    component: backend
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cbd-database
  template:
    metadata:
      labels:
        app: cbd-database
        component: backend
    spec:
      containers:
      - name: cbd-database
        image: codai/cbd-database:latest
        ports:
        - containerPort: 4180
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "4180"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: DATABASE_URL
          value: "postgresql://cbd_user:cbd_password@postgres-service:5432/cbd_database"
        livenessProbe:
          httpGet:
            path: /health
            port: 4180
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4180
          initialDelaySeconds: 15
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
