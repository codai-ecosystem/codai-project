apiVersion: apps/v1
kind: Deployment
metadata:
  name: codai-app
  namespace: codai-ecosystem
  labels:
    app: codai-app
    component: frontend
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codai-app
  template:
    metadata:
      labels:
        app: codai-app
        component: frontend
    spec:
      containers:
      - name: codai-app
        image: codai/codai-app:latest
        ports:
        - containerPort: 4001
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "4001"
        - name: NEXT_PUBLIC_API_URL
          value: "http://gateway-service:4003"
        - name: NEXT_PUBLIC_WS_URL
          value: "ws://websocket-service:4900"
        livenessProbe:
          httpGet:
            path: /
            port: 4001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 4001
          initialDelaySeconds: 15
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
