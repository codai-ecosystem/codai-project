apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: codai-ecosystem
  labels:
    app: gateway-service
    component: backend
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
        component: backend
    spec:
      containers:
      - name: gateway-service
        image: codai/gateway-service:latest
        ports:
        - containerPort: 4003
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "4003"
        - name: CBD_DATABASE_URL
          value: "http://cbd-database-service:4180"
        - name: WEBSOCKET_SERVICE_URL
          value: "http://websocket-service:4900"
        livenessProbe:
          httpGet:
            path: /health
            port: 4003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4003
          initialDelaySeconds: 15
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "125m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-service
  namespace: codai-ecosystem
  labels:
    app: websocket-service
    component: backend
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: websocket-service
  template:
    metadata:
      labels:
        app: websocket-service
        component: backend
    spec:
      containers:
      - name: websocket-service
        image: codai/websocket-service:latest
        ports:
        - containerPort: 4900
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: WS_PORT
          value: "4900"
        livenessProbe:
          httpGet:
            path: /health
            port: 4900
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 4900
          initialDelaySeconds: 15
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "125m"
          limits:
            memory: "256Mi"
            cpu: "250m"
