apiVersion: v1
kind: Namespace
metadata:
  name: codai-ecosystem
  labels:
    name: codai-ecosystem
    environment: production
    version: v1.0.0
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: codai-ecosystem-config
  namespace: codai-ecosystem
data:
  NODE_ENV: "production"
  
  # CBD Database Configuration
  CBD_DATABASE_URL: "http://cbd-database-service:4180"
  CBD_PORT: "4180"
  
  # Gateway Configuration
  GATEWAY_PORT: "4003"
  GATEWAY_URL: "http://gateway-service:4003"
  
  # WebSocket Configuration
  WEBSOCKET_PORT: "4900"
  WEBSOCKET_URL: "http://websocket-service:4900"
  
  # Collaboration Service
  COLLABORATION_PORT: "4600"
  COLLABORATION_URL: "http://cbd-collaboration-service:4600"
  
  # AI Analytics Service
  AI_ANALYTICS_PORT: "4700"
  AI_ANALYTICS_URL: "http://cbd-ai-analytics-service:4700"
  
  # GraphQL Gateway
  GRAPHQL_PORT: "4800"
  GRAPHQL_URL: "http://cbd-graphql-service:4800"
  
  # Redis Configuration
  REDIS_URL: "redis://redis-service:6379"
  
  # PostgreSQL Configuration
  DATABASE_URL: "postgresql://cbd_user:cbd_password@postgres-service:5432/cbd_database"
  
  # External URLs for Frontend Apps
  NEXT_PUBLIC_API_URL: "https://api.codai.app"
  NEXT_PUBLIC_WS_URL: "wss://api.codai.app/ws"
  NEXT_PUBLIC_GATEWAY_URL: "https://gateway.codai.app"
  
  # Monitoring Configuration
  PROMETHEUS_URL: "http://prometheus-service:9090"
  GRAFANA_URL: "http://grafana-service:3000"
  
  # Security Configuration
  SECURE_MODE: "true"
  ENABLE_CORS: "true"
  ENABLE_RATE_LIMITING: "true"
  
  # Performance Configuration
  MAX_CONNECTIONS: "1000"
  CONNECTION_TIMEOUT: "30000"
  KEEP_ALIVE_TIMEOUT: "5000"
  
  # Logging Configuration
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  ENABLE_ACCESS_LOGS: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: codai-ecosystem-secrets
  namespace: codai-ecosystem
type: Opaque
data:
  # Base64 encoded secrets (replace with actual values)
  database-password: Y2JkX3Bhc3N3b3Jk  # cbd_password
  database-username: Y2JkX3VzZXI=        # cbd_user
  jwt-secret: c3VwZXJfc2VjcmV0X2p3dF9rZXk=  # super_secret_jwt_key
  redis-password: cmVkaXNfcGFzc3dvcmQ=     # redis_password
  encryption-key: ZW5jcnlwdGlvbl9rZXlfMzJfY2hhcnM=  # encryption_key_32_chars
