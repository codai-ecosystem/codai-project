apiVersion: v1
kind: Namespace
metadata:
  name: cbd-memorai-prod
  labels:
    name: cbd-memorai-prod
    environment: production
    project: codai
    tier: backend
  annotations:
    description: "Production namespace for CBD-MemoraiMCP integration system"
    owner: "codai-ecosystem"
    compliance: "soc2-type2,gdpr"
spec: {}
---
apiVersion: v1
kind: Namespace
metadata:
  name: cbd-memorai-staging
  labels:
    name: cbd-memorai-staging
