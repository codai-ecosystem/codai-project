# RomAI AGI Docker Infrastructure - Kubernetes Deployment
# Production-ready Kubernetes manifests for RomAI AGI

apiVersion: v1
kind: Namespace
metadata:
  name: romai-agi
  labels:
    name: romai-agi
    environment: production

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: romai-agi-config
  namespace: romai-agi
data:
  PYTHONPATH: "/app"
  LOG_LEVEL: "INFO"
  WORKERS: "1"
  MODEL_CACHE_SIZE: "1000"
  MAX_SEQUENCE_LENGTH: "512"
  BATCH_SIZE: "8"

---
apiVersion: v1
kind: Secret
metadata:
  name: romai-agi-secrets
  namespace: romai-agi
type: Opaque
stringData:
  HF_TOKEN: "your-huggingface-token"
  OPENAI_API_KEY: "your-openai-key"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romai-agi-deployment
  namespace: romai-agi
  labels:
    app: romai-agi
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: romai-agi
  template:
    metadata:
      labels:
        app: romai-agi
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: romai-agi-server
        image: codai/romai-agi:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: romai-agi-config
        - secretRef:
            name: romai-agi-secrets
        resources:
          requests:
            memory: "4Gi"
            cpu: "2000m"
          limits:
            memory: "8Gi"
            cpu: "4000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: model-cache
          mountPath: /root/.cache
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: model-cache
        emptyDir:
          sizeLimit: 10Gi
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
      - key: "ml-workload"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

---
apiVersion: v1
kind: Service
metadata:
  name: romai-agi-service
  namespace: romai-agi
  labels:
    app: romai-agi
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: romai-agi

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: romai-agi-ingress
  namespace: romai-agi
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - agi.romai.ai
    secretName: romai-agi-tls
  rules:
  - host: agi.romai.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: romai-agi-service
            port:
              number: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: romai-agi-hpa
  namespace: romai-agi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: romai-agi-deployment
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60

---
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: romai-agi-metrics
  namespace: romai-agi
  labels:
    app: romai-agi
spec:
  selector:
    matchLabels:
      app: romai-agi
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: romai-agi-pdb
  namespace: romai-agi
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: romai-agi

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: romai-agi-network-policy
  namespace: romai-agi
spec:
  podSelector:
    matchLabels:
      app: romai-agi
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: nginx-ingress
    ports:
    - protocol: TCP
      port: 8000
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: UDP
      port: 53
