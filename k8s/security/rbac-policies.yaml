apiVersion: v1
kind: ServiceAccount
metadata:
  name: romai-ml-api
  namespace: romai-production
  labels:
    app: romai-ml-api
    security.role: "service"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: memorai-mcp-service
  namespace: romai-production
  labels:
    app: memorai-mcp-service
    security.role: "service"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql
  namespace: romai-production
  labels:
    app: postgresql
    security.role: "database"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis
  namespace: romai-production
  labels:
    app: redis
    security.role: "cache"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nginx-load-balancer
  namespace: romai-production
  labels:
    app: nginx-load-balancer
    security.role: "loadbalancer"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: romai-app-role
  namespace: romai-production
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: romai-database-role
  namespace: romai-production
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "configmaps", "secrets", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: ["apps"]
  resources: ["statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: romai-ml-api-binding
  namespace: romai-production
subjects:
- kind: ServiceAccount
  name: romai-ml-api
  namespace: romai-production
roleRef:
  kind: Role
  name: romai-app-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memorai-mcp-binding
  namespace: romai-production
subjects:
- kind: ServiceAccount
  name: memorai-mcp-service
  namespace: romai-production
roleRef:
  kind: Role
  name: romai-app-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgresql-binding
  namespace: romai-production
subjects:
- kind: ServiceAccount
  name: postgresql
  namespace: romai-production
roleRef:
  kind: Role
  name: romai-database-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redis-binding
  namespace: romai-production
subjects:
- kind: ServiceAccount
  name: redis
  namespace: romai-production
roleRef:
  kind: Role
  name: romai-database-role
  apiGroup: rbac.authorization.k8s.io
---
# Monitoring RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-monitoring
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["extensions"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-monitoring
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-role
  namespace: monitoring
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-binding
  namespace: monitoring
subjects:
- kind: ServiceAccount
  name: grafana
  namespace: monitoring
roleRef:
  kind: Role
  name: grafana-role
  apiGroup: rbac.authorization.k8s.io
---
# Node exporter requires special permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-exporter
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/metrics"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-exporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-exporter
subjects:
- kind: ServiceAccount
  name: node-exporter
  namespace: monitoring