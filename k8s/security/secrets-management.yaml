# External secrets configuration for production
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: romai-production
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        secretRef:
          accessKeyID:
            name: aws-credentials
            key: access-key-id
          secretAccessKey:
            name: aws-credentials
            key: secret-access-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials-external
  namespace: romai-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: romai-database-credentials-external
    creationPolicy: Owner
  data:
  - secretKey: POSTGRES_USER
    remoteRef:
      key: romai/prod/database
      property: username
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: romai/prod/database
      property: password
  - secretKey: POSTGRES_DB
    remoteRef:
      key: romai/prod/database
      property: database
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets-external
  namespace: romai-production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: romai-api-secrets-external
    creationPolicy: Owner
  data:
  - secretKey: JWT_SECRET_KEY
    remoteRef:
      key: romai/prod/api
      property: jwt_secret
  - secretKey: API_KEY_ENCRYPTION_KEY
    remoteRef:
      key: romai/prod/api
      property: encryption_key
  - secretKey: AZURE_OPENAI_API_KEY
    remoteRef:
      key: romai/prod/azure
      property: openai_api_key