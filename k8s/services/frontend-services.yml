apiVersion: v1
kind: Service
metadata:
  name: codai-app-service
  namespace: codai-ecosystem
  labels:
    app: codai-app
    component: frontend
spec:
  selector:
    app: codai-app
  ports:
  - name: http
    port: 4001
    targetPort: 4001
    protocol: TCP
  type: ClusterIP
