  name: redis-cluster-secrets
  namespace: codai-production
type: Opaque
data:
  password: Y29kYWktcmVkaXMtY2x1c3Rlci1wYXNzd29yZC0yMDI1  # codai-redis-cluster-password-2025

---
# Cache Performance Monitoring
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: codai-production
  labels:
    app: redis-exporter
    component: performance-monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
        component: performance-monitoring
    spec:
      containers:
      - name: redis-exporter
        image: oliver006/redis_exporter:latest
        ports:
        - containerPort: 9121
          name: metrics
        env:
        - name: REDIS_ADDR
          value: "redis://redis-cluster.codai-production.svc.cluster.local:6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-cluster-secrets
              key: password
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: codai-production
  labels:
    app: redis-exporter
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9121"
spec:
  ports:
  - port: 9121
    targetPort: 9121
    name: metrics
  selector:
    app: redis-exporter

---
# Horizontal Pod Autoscaler for Cache Services
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codai-cache-warmer-hpa
  namespace: codai-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codai-cache-warmer
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codai-cache-invalidator-hpa
  namespace: codai-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codai-cache-invalidator
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80