spec:
  ports:
  - port: 3002
    targetPort: 3002
    name: http
    protocol: TCP
  selector:
    app: codai-rbac-audit

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codai-rbac-audit
  namespace: codai-production
  labels:
    app: codai-rbac-audit

---
# Horizontal Pod Autoscaler for RBAC Services
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codai-rbac-service-hpa
  namespace: codai-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codai-rbac-service
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codai-rbac-audit-hpa
  namespace: codai-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codai-rbac-audit
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80