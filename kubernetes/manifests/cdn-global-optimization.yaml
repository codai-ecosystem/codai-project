# Asset Optimization Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codai-asset-optimizer
  namespace: codai-production
  labels:
    app: codai-asset-optimizer
    component: performance-optimization
spec:
  replicas: 3
  selector:
    matchLabels:
      app: codai-asset-optimizer
  template:
    metadata:
      labels:
        app: codai-asset-optimizer
        component: performance-optimization
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: codai-asset-optimizer
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
      - name: asset-optimizer
        image: node:18-alpine
        ports:
        - containerPort: 4000
          name: http
        command: ["/bin/sh"]
        args:
        - -c
        - |
          apk add --no-cache imagemagick vips-dev
          
          cat > /app/optimizer.js << 'EOF'
          const express = require('express');
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          const app = express();
          const port = 4000;
          
          app.use(express.json({ limit: '50mb' }));
          app.use(express.raw({ limit: '50mb', type: 'application/octet-stream' }));
          
          // Image Optimization Endpoint
          app.post('/optimize-image', async (req, res) => {
            try {
              const { buffer, format, quality, width, height } = req.body;
              const imageBuffer = Buffer.from(buffer, 'base64');
              
              let optimizer = sharp(imageBuffer);
              
              if (width || height) {
                optimizer = optimizer.resize(width, height, {
                  fit: 'inside',
                  withoutEnlargement: true
                });
              }
              
              let optimizedBuffer;
              switch (format) {
                case 'webp':
                  optimizedBuffer = await optimizer.webp({ quality: quality || 85 }).toBuffer();
                  break;
                case 'avif':
                  optimizedBuffer = await optimizer.avif({ quality: quality || 80 }).toBuffer();
                  break;
                case 'jpeg':
                  optimizedBuffer = await optimizer.jpeg({ quality: quality || 85, progressive: true }).toBuffer();
                  break;
                case 'png':
                  optimizedBuffer = await optimizer.png({ compressionLevel: 9 }).toBuffer();
                  break;
                default:
                  optimizedBuffer = await optimizer.toBuffer();
              }
              
              res.json({
                success: true,
                buffer: optimizedBuffer.toString('base64'),
                originalSize: imageBuffer.length,
                optimizedSize: optimizedBuffer.length,
                compressionRatio: ((imageBuffer.length - optimizedBuffer.length) / imageBuffer.length * 100).toFixed(2)
              });
            } catch (error) {
              console.error('Image optimization error:', error);
              res.status(500).json({ success: false, error: error.message });
            }
          });
          
          // CSS Optimization Endpoint
          app.post('/optimize-css', async (req, res) => {
            try {
              const { css, minify, removeUnused, criticalCss } = req.body;
              
              let optimizedCss = css;
              
              if (minify) {
                // Simple CSS minification
                optimizedCss = optimizedCss
                  .replace(/\s+/g, ' ')
                  .replace(/;\s*}/g, '}')
                  .replace(/:\s*/g, ':')
                  .replace(/,\s*/g, ',')
                  .replace(/{\s*/g, '{')
                  .replace(/}\s*/g, '}')
                  .trim();
              }
              
              if (removeUnused) {
                // Remove unused CSS selectors (simplified)
                optimizedCss = optimizedCss.replace(/\/\*[\s\S]*?\*\//g, '');
              }
              
              res.json({
                success: true,
                css: optimizedCss,
                originalSize: css.length,
                optimizedSize: optimizedCss.length,
                compressionRatio: ((css.length - optimizedCss.length) / css.length * 100).toFixed(2)
              });
            } catch (error) {
              console.error('CSS optimization error:', error);
              res.status(500).json({ success: false, error: error.message });
            }
          });
          
          // JavaScript Optimization Endpoint
          app.post('/optimize-js', async (req, res) => {
            try {
              const { javascript, minify, treeshaking } = req.body;
              
              let optimizedJs = javascript;
              
              if (minify) {
                // Simple JS minification (in production, use proper tools like Terser)
                optimizedJs = optimizedJs
                  .replace(/\s+/g, ' ')
                  .replace(/;\s*\n/g, ';')
                  .replace(/{\s*/g, '{')
                  .replace(/}\s*/g, '}')
                  .trim();
              }
              
              res.json({
                success: true,
                javascript: optimizedJs,
                originalSize: javascript.length,
                optimizedSize: optimizedJs.length,
                compressionRatio: ((javascript.length - optimizedJs.length) / javascript.length * 100).toFixed(2)
              });
            } catch (error) {
              console.error('JavaScript optimization error:', error);
              res.status(500).json({ success: false, error: error.message });
            }
          });
          
          // Health Check
          app.get('/health', (req, res) => {
            res.json({ status: 'healthy', service: 'codai-asset-optimizer', timestamp: new Date() });
          });
          
          app.listen(port, '0.0.0.0', () => {
            console.log(`Asset Optimizer listening on port ${port}`);
          });
          EOF
          
          cd /app && npm init -y && npm install express sharp
          node optimizer.js
        workingDir: /app
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

