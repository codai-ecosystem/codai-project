# Global Edge Cache Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codai-edge-cache
  namespace: codai-production
  labels:
    app: codai-edge-cache
    component: performance-optimization
spec:
  replicas: 4
  selector:
    matchLabels:
      app: codai-edge-cache
  template:
    metadata:
      labels:
        app: codai-edge-cache
        component: performance-optimization
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: codai-edge-cache
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
      containers:
      - name: varnish
        image: varnish:stable
        ports:
        - containerPort: 80
          name: http
        - containerPort: 6082
          name: admin
        env:
        - name: VARNISH_SIZE
          value: "512m"
        volumeMounts:
        - name: varnish-config
          mountPath: /etc/varnish
        command: ["varnishd"]
        args:
        - -F
        - -f
        - /etc/varnish/default.vcl
        - -s
        - malloc,512m
        - -a
        - 0.0.0.0:80
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: varnish-config
        configMap:
          name: varnish-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: varnish-config
  namespace: codai-production
data:
  default.vcl: |
    vcl 4.1;
    
    backend default {
        .host = "nginx-load-balancer.codai-production.svc.cluster.local";
        .port = "80";
        .probe = {
            .url = "/health";
            .interval = 5s;
            .timeout = 3s;
            .window = 5;
            .threshold = 3;
        }
    }
    
    sub vcl_recv {
        # Remove cookies for static assets
        if (req.url ~ "\.(css|js|png|gif|jp(e)?g|swf|ico|woff|woff2)(\?.*)?$") {
            unset req.http.Cookie;
        }
        
        # Cache API responses for short periods
        if (req.url ~ "^/api/") {
            if (req.method != "GET" && req.method != "HEAD") {
                return (pass);
            }
            set req.http.Cache-Control = "public, max-age=300";
        }
        
        # Health check
        if (req.url == "/health") {
            return (synth(200, "Healthy"));
        }
    }
    
    sub vcl_backend_response {
        # Cache static assets for 1 year
        if (bereq.url ~ "\.(css|js|png|gif|jp(e)?g|swf|ico|woff|woff2)(\?.*)?$") {
            set beresp.ttl = 365d;
            set beresp.http.Cache-Control = "public, max-age=31536000, immutable";
        }
        
        # Cache HTML for 1 hour
        if (beresp.http.Content-Type ~ "text/html") {
            set beresp.ttl = 1h;
            set beresp.http.Cache-Control = "public, max-age=3600";
        }
        
        # Cache API responses for 5 minutes
        if (bereq.url ~ "^/api/") {
            set beresp.ttl = 5m;
            set beresp.http.Cache-Control = "public, max-age=300";
        }
    }
    
    sub vcl_deliver {
        # Add cache hit/miss headers
        if (obj.hits > 0) {
            set resp.http.X-Cache = "HIT";
        } else {
            set resp.http.X-Cache = "MISS";
        }
        
        # Add cache age
        set resp.http.X-Cache-Age = obj.age;
        
        # Security headers
        set resp.http.X-Frame-Options = "SAMEORIGIN";
        set resp.http.X-Content-Type-Options = "nosniff";
        set resp.http.X-XSS-Protection = "1; mode=block";
    }

