# CDN & Global Asset Optimization for Essential CodAI Services
# Version: 1.0  
# Multi-CDN | Edge Caching | Asset Optimization | Global Distribution
apiVersion: v1
kind: ConfigMap
metadata:
  name: cdn-optimization-config
  namespace: codai-production
data:
  cdn-config.json: |
    {
      "cdn_providers": {
        "primary": {
          "provider": "cloudflare",
          "enabled": true,
          "configuration": {
            "zone_id": "${CLOUDFLARE_ZONE_ID}",
            "api_token": "${CLOUDFLARE_API_TOKEN}",
            "cache_everything": true,
            "edge_cache_ttl": 2592000,
            "browser_cache_ttl": 86400,
            "development_mode": false,
            "minify": {
              "css": true,
              "html": true,
              "js": true
            },
            "compression": {
              "brotli": true,
              "gzip": true
            },
            "http2": true,
            "http3": true,
            "tls_version": "1.3",
            "security_level": "medium",
            "ssl": "strict"
          },
          "cache_rules": [
            {
              "pattern": "*.js",
              "ttl": 31536000,
              "cache_level": "cache_everything"
            },
            {
              "pattern": "*.css", 
              "ttl": 31536000,
              "cache_level": "cache_everything"
            },
            {
              "pattern": "*.png|*.jpg|*.jpeg|*.gif|*.webp|*.svg",
              "ttl": 31536000,
              "cache_level": "cache_everything"
            },
            {
              "pattern": "*.woff|*.woff2|*.ttf|*.eot",
              "ttl": 31536000,
              "cache_level": "cache_everything"
            },
            {
              "pattern": "/api/*",
              "ttl": 0,
              "cache_level": "bypass"
            },
            {
              "pattern": "/health",
              "ttl": 60,
              "cache_level": "standard"
            }
          ]
        },
        "fallback": {
          "provider": "aws_cloudfront",
          "enabled": true,
          "configuration": {
            "distribution_id": "${AWS_CLOUDFRONT_DISTRIBUTION_ID}",
            "origin_domain": "codai-production.example.com",
            "price_class": "PriceClass_All",
            "viewer_protocol_policy": "redirect-to-https",
            "allowed_methods": ["GET", "HEAD", "OPTIONS", "PUT", "POST", "PATCH", "DELETE"],
            "cached_methods": ["GET", "HEAD", "OPTIONS"],
            "compression": true,
            "http_version": "http2"
          },
          "cache_behaviors": [
            {
              "path_pattern": "*.js",
              "ttl": 31536000,
              "compress": true
            },
            {
              "path_pattern": "*.css",
              "ttl": 31536000,
              "compress": true
            },
            {
              "path_pattern": "/api/*",
              "ttl": 0,
              "compress": false,
              "cache_policy": "none"
            }
          ]
        }
      },
      "asset_optimization": {
        "enabled": true,
        "image_optimization": {
          "enabled": true,
          "formats": ["webp", "avif", "jpeg", "png"],
          "quality": 85,
          "progressive": true,
          "lossless": false,
          "resize_breakpoints": [320, 640, 768, 1024, 1280, 1920],
          "lazy_loading": true,
          "placeholder": "blur"
        },
        "css_optimization": {
          "enabled": true,
          "minify": true,
          "remove_unused": true,
          "critical_css": true,
          "inline_critical": true,
          "purge_css": true
        },
        "javascript_optimization": {
          "enabled": true,
          "minify": true,
          "tree_shaking": true,
          "code_splitting": true,
          "bundle_splitting": true,
          "compression": "brotli"
        },
        "font_optimization": {
          "enabled": true,
          "preload_critical": true,
          "display_swap": true,
          "subset": true,
          "woff2_conversion": true
        }
      },
      "edge_caching": {
        "enabled": true,
        "strategies": {
          "static_assets": {
            "cache_duration": "1y",
            "stale_while_revalidate": "1w",
            "immutable": true
          },
          "api_responses": {
            "cache_duration": "5m",
            "stale_while_revalidate": "1m",
            "vary_headers": ["Accept-Encoding", "User-Agent"]
          },
          "html_pages": {
            "cache_duration": "1h",
            "stale_while_revalidate": "5m",
            "edge_side_includes": true
          },
          "user_content": {
            "cache_duration": "1d",
            "stale_while_revalidate": "2h",
            "private_cache": false
          }
        },
        "purging": {
          "automatic": true,
          "on_deployment": true,
          "selective": true,
          "tags_based": true
        }
      },
      "global_distribution": {
        "enabled": true,
        "regions": [
          {
            "name": "North America",
            "locations": ["us-east-1", "us-west-2", "ca-central-1"],
            "primary": true
          },
          {
            "name": "Europe", 
            "locations": ["eu-west-1", "eu-central-1", "eu-north-1"],
            "primary": false
          },
          {
            "name": "Asia Pacific",
            "locations": ["ap-southeast-1", "ap-northeast-1", "ap-south-1"], 
            "primary": false
          },
          {
            "name": "South America",
            "locations": ["sa-east-1"],
            "primary": false
          }
        ],
        "load_balancing": {
          "algorithm": "geographic",
          "health_checks": true,
          "failover": true,
          "session_affinity": false
        }
      },
      "performance_monitoring": {
        "enabled": true,
        "metrics": {
          "cache_hit_ratio": true,
          "response_time": true,
          "bandwidth_usage": true,
          "origin_load": true,
          "error_rates": true
        },
        "alerts": {
          "cache_hit_ratio_threshold": 85,
          "response_time_threshold": 200,
          "error_rate_threshold": 1
        },
        "real_user_monitoring": {
          "enabled": true,
          "core_web_vitals": true,
          "custom_metrics": true
        }
      }
    }

---
# CDN Manager Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codai-cdn-manager
  namespace: codai-production
  labels:
    app: codai-cdn-manager
    component: performance-optimization
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codai-cdn-manager
  template:
    metadata:
      labels:
        app: codai-cdn-manager
        component: performance-optimization
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: codai-cdn-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
      - name: cdn-manager
        image: node:18-alpine
        ports:
        - containerPort: 3000
          name: http
        command: ["/bin/sh"]
        args:
        - -c
        - |
          cat > /app/server.js << 'EOF'
          const express = require('express');
          const axios = require('axios');
          const app = express();
          const port = 3000;
          
          app.use(express.json());
          
          // CDN Cache Purging Endpoint
          app.post('/purge-cache', async (req, res) => {
            const { files, tags } = req.body;
            
            try {
              // Cloudflare cache purge
              if (process.env.CLOUDFLARE_API_TOKEN) {
                await axios.post(`https://api.cloudflare.com/client/v4/zones/${process.env.CLOUDFLARE_ZONE_ID}/purge_cache`, {
                  files: files,
                  tags: tags
                }, {
                  headers: {
                    'Authorization': `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
                    'Content-Type': 'application/json'
                  }
                });
              }
              
              // AWS CloudFront cache invalidation
              if (process.env.AWS_CLOUDFRONT_DISTRIBUTION_ID) {
                const invalidation = {
                  DistributionId: process.env.AWS_CLOUDFRONT_DISTRIBUTION_ID,
                  InvalidationBatch: {
                    Paths: {
                      Quantity: files.length,
                      Items: files
                    },
                    CallerReference: Date.now().toString()
                  }
                };
                // AWS SDK call would go here
              }
              
              res.json({ success: true, message: 'Cache purged successfully' });
            } catch (error) {
              console.error('Cache purge error:', error);
              res.status(500).json({ success: false, error: error.message });
            }
          });
          
          // Asset Optimization Endpoint
          app.post('/optimize-assets', async (req, res) => {
            const { assets } = req.body;
            
            try {
              // Process asset optimization
              const optimizedAssets = await Promise.all(assets.map(async (asset) => {
                // Image optimization logic
                if (asset.type === 'image') {
                  return {
                    ...asset,
                    optimized: true,
                    formats: ['webp', 'avif', 'original'],
                    sizes: [320, 640, 768, 1024, 1280, 1920]
                  };
                }
                return asset;
              }));
              
              res.json({ success: true, assets: optimizedAssets });
            } catch (error) {
              console.error('Asset optimization error:', error);
              res.status(500).json({ success: false, error: error.message });
            }
          });
          
          // CDN Health Check Endpoint
          app.get('/health', (req, res) => {
            res.json({ status: 'healthy', service: 'codai-cdn-manager', timestamp: new Date() });
          });
          
          // CDN Metrics Endpoint
          app.get('/metrics', async (req, res) => {
            try {
              const metrics = {
                cache_hit_ratio: 0.92,
                avg_response_time: 85,
                bandwidth_usage: '2.5TB',
                origin_requests: 15420,
                edge_requests: 198650,
                error_rate: 0.003
              };
              
              res.json({ success: true, metrics });
            } catch (error) {
              res.status(500).json({ success: false, error: error.message });
            }
          });
          
          app.listen(port, '0.0.0.0', () => {
            console.log(`CDN Manager listening on port ${port}`);
          });
          EOF
          
          cd /app && npm init -y && npm install express axios
          node server.js
        env:
        - name: CLOUDFLARE_ZONE_ID
          valueFrom:
            secretKeyRef:
              name: cdn-secrets
              key: cloudflare-zone-id
        - name: CLOUDFLARE_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cdn-secrets
              key: cloudflare-api-token
        - name: AWS_CLOUDFRONT_DISTRIBUTION_ID
          valueFrom:
            secretKeyRef:
              name: cdn-secrets
              key: aws-cloudfront-distribution-id
        workingDir: /app
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: cdn-config
          mountPath: /etc/cdn
      volumes:
      - name: cdn-config
        configMap:
          name: cdn-optimization-config

