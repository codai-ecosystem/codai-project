apiVersion: apps/v1
kind: Deployment
metadata:
  name: codai-gateway-api
  namespace: codai-production
  labels:
    app: codai-gateway-api
    component: gateway
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app: codai-gateway-api
  template:
    metadata:
      labels:
        app: codai-gateway-api
        component: gateway
        tier: backend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - codai-gateway-api
              topologyKey: kubernetes.io/hostname
      containers:
      - name: gateway-api
        image: codai/gateway-api:latest
        ports:
        - containerPort: 8010
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8010"
        - name: GATEWAY_SECRET
          valueFrom:
            secretKeyRef:
              name: codai-gateway-secrets
              key: gateway-secret
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: codai-redis-secrets
              key: host
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: codai-redis-secrets
              key: password
        - name: AUTH_SERVICE_URL
          value: "http://codai-auth-api-service:8100"
        - name: HUB_SERVICE_URL
          value: "http://codai-hub-api-service:8110"
        - name: MEMORAI_SERVICE_URL
          value: "http://codai-memorai-mcp-service:4950"
        - name: CBD_SERVICE_URL
          value: "http://codai-cbd-database-service:8180"
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: codai-gateway-api-service
  namespace: codai-production
  labels:
    app: codai-gateway-api
    component: gateway
spec:
  type: ClusterIP
  ports:
  - port: 8010
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: codai-gateway-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codai-gateway-api-hpa
  namespace: codai-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codai-gateway-api
  minReplicas: 3
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15