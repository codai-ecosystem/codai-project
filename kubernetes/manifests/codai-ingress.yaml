apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codai-production-ingress
  namespace: codai-production
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://codai.ro,https://app.codai.ro"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET,POST,PUT,DELETE,OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.codai.ro
    - app.codai.ro
    secretName: codai-tls-secret
  rules:
  - host: api.codai.ro
    http:
      paths:
      - path: /auth/(.*)
        pathType: Prefix
        backend:
          service:
            name: codai-auth-api-service
            port:
              number: 8100
      - path: /gateway/(.*)
        pathType: Prefix
        backend:
          service:
            name: codai-gateway-api-service
            port:
              number: 8010
      - path: /hub/(.*)
        pathType: Prefix
        backend:
          service:
            name: codai-hub-api-service
            port:
              number: 8110
      - path: /memorai/(.*)
        pathType: Prefix
        backend:
          service:
            name: codai-memorai-mcp-service
            port:
              number: 4950
      - path: /database/(.*)
        pathType: Prefix
        backend:
          service:
            name: codai-cbd-database-service
            port:
              number: 8180
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: codai-gateway-api-service
            port:
              number: 8010
  - host: app.codai.ro
    http:
      paths:
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: codai-memorai-frontend-service
            port:
              number: 8006
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-custom-config
  namespace: codai-production
data:
  nginx.conf: |
    upstream backend {
        least_conn;
        server codai-gateway-api-service:8010 max_fails=3 fail_timeout=30s;
    }
    
    server {
        listen 80;
        server_name api.codai.ro app.codai.ro;
        return 301 https://$server_name$request_uri;
    }
    
    server {
        listen 443 ssl http2;
        server_name api.codai.ro app.codai.ro;
        
        ssl_certificate /etc/ssl/certs/codai-tls.crt;
        ssl_certificate_key /etc/ssl/private/codai-tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;
        limit_req zone=api burst=20 nodelay;
        
        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
        
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Health check
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 30s;
        }
        
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codai-production-network-policy
  namespace: codai-production
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: nginx-ingress
  - from:
    - podSelector:
        matchLabels:
          component: gateway
    ports:
    - protocol: TCP
      port: 8100
    - protocol: TCP
      port: 8110
    - protocol: TCP
      port: 4950
    - protocol: TCP
      port: 8180
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80