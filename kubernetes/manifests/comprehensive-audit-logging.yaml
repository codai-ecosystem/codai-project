# Horizontal Pod Autoscaler for Audit Services
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codai-audit-logger-hpa
  namespace: codai-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codai-audit-logger
  minReplicas: 3
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

