# Audit Event Processing Pipeline
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codai-audit-processor
  namespace: codai-production
  labels:
    app: codai-audit-processor
    component: enterprise-compliance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codai-audit-processor
  template:
    metadata:
      labels:
        app: codai-audit-processor
        component: enterprise-compliance
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: codai-audit-processor
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
      - name: audit-processor
        image: codai/audit-processor:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3009
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3009"
        - name: KAFKA_BROKERS
          value: "kafka.codai-production.svc.cluster.local:9092"
        - name: ELASTICSEARCH_URL
          value: "http://elasticsearch.observability.svc.cluster.local:9200"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: codai-database-secrets
              key: audit-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-event-secrets
              key: url
        - name: ENABLE_ANOMALY_DETECTION
          value: "true"
        - name: ENABLE_COMPLIANCE_CHECKING
          value: "true"
        - name: PROCESSING_THREADS
          value: "4"
        - name: BATCH_PROCESSING_SIZE
          value: "500"
        resources:
          requests:
            cpu: 300m
            memory: 1Gi
          limits:
            cpu: 1500m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 3009
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3009
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

