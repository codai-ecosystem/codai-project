---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init-scripts
  namespace: codai-production
data:
  01-create-databases.sql: |
    -- Create optimized databases for CodAI services
    CREATE DATABASE codai_auth;
    CREATE DATABASE codai_hub;
    CREATE DATABASE codai_memorai;
    CREATE DATABASE codai_tenants;
    CREATE DATABASE codai_audit;
    CREATE DATABASE codai_analytics;
    
    -- Create users with appropriate permissions
    CREATE USER codai_auth_user WITH ENCRYPTED PASSWORD 'codai_auth_password_2025';
    CREATE USER codai_hub_user WITH ENCRYPTED PASSWORD 'codai_hub_password_2025';
    CREATE USER codai_memorai_user WITH ENCRYPTED PASSWORD 'codai_memorai_password_2025';
    CREATE USER codai_tenant_user WITH ENCRYPTED PASSWORD 'codai_tenant_password_2025';
    CREATE USER codai_audit_user WITH ENCRYPTED PASSWORD 'codai_audit_password_2025';
    CREATE USER codai_analytics_user WITH ENCRYPTED PASSWORD 'codai_analytics_password_2025';
    
    -- Grant permissions
    GRANT ALL PRIVILEGES ON DATABASE codai_auth TO codai_auth_user;
    GRANT ALL PRIVILEGES ON DATABASE codai_hub TO codai_hub_user;
    GRANT ALL PRIVILEGES ON DATABASE codai_memorai TO codai_memorai_user;
    GRANT ALL PRIVILEGES ON DATABASE codai_tenants TO codai_tenant_user;
    GRANT ALL PRIVILEGES ON DATABASE codai_audit TO codai_audit_user;
    GRANT ALL PRIVILEGES ON DATABASE codai_analytics TO codai_analytics_user;

  02-create-extensions.sql: |
    -- Enable required extensions for performance
    \c codai_auth;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "btree_gin";
    CREATE EXTENSION IF NOT EXISTS "btree_gist";
    CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";
    
    \c codai_hub;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "btree_gin";
    CREATE EXTENSION IF NOT EXISTS "pg_trgm";
    CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";
    
    \c codai_memorai;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "vector";
    CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";
    
    \c codai_tenants;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "btree_gin";
    CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";
    
    \c codai_audit;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "btree_gin";
    CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";
    
    \c codai_analytics;
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "btree_gin";
    CREATE EXTENSION IF NOT EXISTS "btree_gist";
    CREATE EXTENSION IF NOT EXISTS "pg_stat_statements";

  03-create-indexes.sql: |
    -- Create performance-optimized indexes
    \c codai_auth;
    -- User authentication indexes
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_users_email_hash ON users USING hash(email);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_users_created_at_btree ON users(created_at);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_sessions_user_id ON sessions(user_id);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_sessions_expires_at ON sessions(expires_at) WHERE expires_at > NOW();
    
    \c codai_hub;
    -- Hub service indexes
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_projects_tenant_id ON projects(tenant_id);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_projects_status ON projects(status) WHERE status = 'active';
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_tasks_project_id ON tasks(project_id);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_tasks_assignee_id ON tasks(assignee_id);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_tasks_status_priority ON tasks(status, priority);
    
    \c codai_memorai;
    -- MemorAI indexes
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_memories_agent_id ON memories(agent_id);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_memories_importance ON memories(importance) WHERE importance >= 7;
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_memories_created_at ON memories(created_at);
    CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_memories_content_gin ON memories USING gin(to_tsvector('english', content));

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-replica-init
  namespace: codai-production
data:
  setup-replica.sh: |
    #!/bin/bash
    set -e
    
    # Wait for primary to be ready
    echo "Waiting for primary database to be ready..."
    until pg_isready -h $POSTGRES_PRIMARY_HOST -p $POSTGRES_PRIMARY_PORT -U postgres; do
      sleep 2
    done
    
    echo "Primary database is ready. Setting up replica..."
    
    # Create base backup from primary
    pg_basebackup -h $POSTGRES_PRIMARY_HOST -p $POSTGRES_PRIMARY_PORT -U postgres -D $PGDATA -P -W -R
    
    echo "Replica setup completed."

---
# Database Connection Pool Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codai-database-pool
  namespace: codai-production
  labels:
    app: codai-database-pool
    component: database-optimization
spec:
  replicas: 3
  selector:
    matchLabels:
      app: codai-database-pool
  template:
    metadata:
      labels:
        app: codai-database-pool
        component: database-optimization
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: codai-database-pool
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
      - name: pgbouncer
        image: pgbouncer/pgbouncer:latest
        ports:
        - containerPort: 5432
          name: pgbouncer
        env:
        - name: DATABASES_HOST
          value: "postgresql-primary.codai-production.svc.cluster.local"
        - name: DATABASES_PORT
          value: "5432"
        - name: DATABASES_USER
          value: "codai_admin"
        - name: DATABASES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secrets
              key: admin-password
        - name: POOL_MODE
          value: "transaction"
        - name: MAX_CLIENT_CONN
          value: "1000"
        - name: DEFAULT_POOL_SIZE
          value: "25"
        - name: SERVER_RESET_QUERY
          value: "DISCARD ALL"
        volumeMounts:
        - name: pgbouncer-config
          mountPath: /etc/pgbouncer
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: pgbouncer-config
        configMap:
          name: pgbouncer-config

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: codai-production
data:
  pgbouncer.ini: |
    [databases]
    codai_auth = host=postgresql-primary.codai-production.svc.cluster.local port=5432 dbname=codai_auth
    codai_hub = host=postgresql-primary.codai-production.svc.cluster.local port=5432 dbname=codai_hub  
    codai_memorai = host=postgresql-primary.codai-production.svc.cluster.local port=5432 dbname=codai_memorai
    codai_tenants = host=postgresql-primary.codai-production.svc.cluster.local port=5432 dbname=codai_tenants
    codai_audit = host=postgresql-primary.codai-production.svc.cluster.local port=5432 dbname=codai_audit
    codai_analytics = host=postgresql-primary.codai-production.svc.cluster.local port=5432 dbname=codai_analytics
    
    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = md5
    auth_file = /etc/pgbouncer/userlist.txt
    admin_users = postgres
    stats_users = stats, postgres
    pool_mode = transaction
    server_reset_query = DISCARD ALL
    max_client_conn = 1000
    default_pool_size = 25
    max_db_connections = 100
    max_user_connections = 100
    server_round_robin = 1
    ignore_startup_parameters = extra_float_digits
    server_check_delay = 30
    server_check_query = select 1
    server_lifetime = 3600
    server_idle_timeout = 600
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1

  userlist.txt: |
    "codai_admin" "md5..." 
    "codai_auth_user" "md5..."
    "codai_hub_user" "md5..."
    "codai_memorai_user" "md5..."
    "codai_tenant_user" "md5..."
    "codai_audit_user" "md5..."
    "codai_analytics_user" "md5..."

