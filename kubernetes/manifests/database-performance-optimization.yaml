# Database Performance Optimization for Essential CodAI Services  
# Version: 1.0
# Query Optimization | Connection Pooling | Read Replicas | Intelligent Indexing
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-optimization-config
  namespace: codai-production
data:
  database-config.json: |
    {
      "connection_pooling": {
        "enabled": true,
        "primary_pool": {
          "max_connections": 100,
          "min_connections": 10,
          "idle_timeout": 300,
          "connection_lifetime": 3600,
          "validation_query": "SELECT 1",
          "validation_interval": 30
        },
        "read_replica_pool": {
          "max_connections": 200,
          "min_connections": 20,
          "idle_timeout": 300,
          "connection_lifetime": 3600,
          "load_balance_strategy": "round_robin",
          "failover_enabled": true
        },
        "connection_monitoring": {
          "enabled": true,
          "metrics": ["active_connections", "idle_connections", "wait_time", "query_time"],
          "alert_thresholds": {
            "connection_utilization": 85,
            "average_wait_time": 100,
            "slow_query_threshold": 1000
          }
        }
      },
      "query_optimization": {
        "enabled": true,
        "auto_explain": {
          "enabled": true,
          "log_min_duration": 1000,
          "log_analyze": true,
          "log_buffers": true,
          "log_timing": true
        },
        "query_cache": {
          "enabled": true,
          "cache_size": "256mb",
          "cache_ttl": 600,
          "invalidation_strategy": "tag_based"
        },
        "prepared_statements": {
          "enabled": true,
          "max_prepared_statements": 1000,
          "auto_prepare": true
        },
        "batch_operations": {
          "enabled": true,
          "batch_size": 1000,
          "batch_timeout": 5000
        }
      },
      "indexing_strategy": {
        "auto_indexing": {
          "enabled": true,
          "analysis_frequency": "daily",
          "suggestion_threshold": 10,
          "auto_create": false
        },
        "index_monitoring": {
          "enabled": true,
          "unused_index_threshold": 30,
          "duplicate_detection": true,
          "fragmentation_monitoring": true
        },
        "composite_indexes": {
          "optimization": true,
          "covering_indexes": true,
          "partial_indexes": true
        }
      },
      "read_replica_config": {
        "enabled": true,
        "replica_count": 3,
        "replication_lag_threshold": 100,
        "auto_failover": true,
        "read_preference": "secondary_preferred",
        "routing_rules": {
          "analytics_queries": "read_replica",
          "reporting_queries": "read_replica",
          "user_sessions": "primary",
          "real_time_data": "primary"
        }
      },
      "performance_monitoring": {
        "enabled": true,
        "metrics_collection": {
          "query_performance": true,
          "connection_stats": true,
          "lock_monitoring": true,
          "deadlock_detection": true,
          "table_stats": true
        },
        "slow_query_log": {
          "enabled": true,
          "threshold": 1000,
          "log_queries_not_using_indexes": true,
          "log_slow_admin_statements": true
        },
        "performance_insights": {
          "enabled": true,
          "retention_period": 7,
          "feature_status": "enabled"
        }
      },
      "optimization_rules": {
        "table_partitioning": {
          "enabled": true,
          "strategies": ["range", "hash", "list"],
          "auto_partition": false,
          "partition_pruning": true
        },
        "vacuum_settings": {
          "autovacuum": true,
          "autovacuum_scale_factor": 0.1,
          "autovacuum_analyze_scale_factor": 0.05,
          "vacuum_cost_limit": 200
        },
        "memory_optimization": {
          "shared_buffers": "256MB",
          "effective_cache_size": "1GB",
          "work_mem": "4MB",
          "maintenance_work_mem": "64MB"
        }
      }
    }

  postgresql-performance.conf: |
    # PostgreSQL Performance Configuration for CodAI Services
    
    # Memory Settings
    shared_buffers = 256MB
    effective_cache_size = 1GB
    work_mem = 4MB
    maintenance_work_mem = 64MB
    
    # Checkpoint Settings
    checkpoint_completion_target = 0.9
    wal_buffers = 16MB
    default_statistics_target = 100
    
    # Connection Settings
    max_connections = 300
    superuser_reserved_connections = 3
    
    # Query Planner
    random_page_cost = 1.1
    effective_io_concurrency = 200
    
    # Write Ahead Logging
    wal_level = replica
    max_wal_senders = 10
    max_replication_slots = 10
    
    # Logging
    log_min_duration_statement = 1000
    log_checkpoints = on
    log_connections = on
    log_disconnections = on
    log_lock_waits = on
    log_temp_files = 0
    log_autovacuum_min_duration = 0
    
    # Auto Vacuum
    autovacuum = on
    autovacuum_max_workers = 3
    autovacuum_naptime = 1min
    autovacuum_vacuum_threshold = 50
    autovacuum_analyze_threshold = 50
    autovacuum_vacuum_scale_factor = 0.1
    autovacuum_analyze_scale_factor = 0.05
    autovacuum_freeze_max_age = 200000000
    autovacuum_multixact_freeze_max_age = 400000000
    
    # Background Writer
    bgwriter_delay = 200ms
    bgwriter_lru_maxpages = 100
    bgwriter_lru_multiplier = 2.0

---
# PostgreSQL Primary Database with Optimization
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-primary-optimized
  namespace: codai-production
  labels:
    app: postgresql-primary
    component: database-optimization
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql-primary
  template:
    metadata:
      labels:
        app: postgresql-primary
        component: database-optimization
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
      containers:
      - name: postgresql
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgresql
        env:
        - name: POSTGRES_DB
          value: "codai_primary"
        - name: POSTGRES_USER
          value: "codai_admin"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secrets
              key: admin-password
        - name: POSTGRES_INITDB_ARGS
          value: "--auth-host=md5"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        command:
        - postgres
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        volumeMounts:
        - name: postgresql-config
          mountPath: /etc/postgresql
        - name: postgresql-data
          mountPath: /var/lib/postgresql/data
        - name: postgresql-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 4000m
            memory: 8Gi
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - localhost
            - -U
            - codai_admin
            - -d
            - codai_primary
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - localhost
            - -U
            - codai_admin
            - -d
            - codai_primary
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: postgresql-config
        configMap:
          name: postgresql-performance-config
      - name: postgresql-init
        configMap:
          name: postgresql-init-scripts
      - name: postgresql-data
        persistentVolumeClaim:
          claimName: postgresql-primary-pvc

---
# PostgreSQL Read Replica Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql-read-replica
  namespace: codai-production
  labels:
    app: postgresql-read-replica
    component: database-optimization
spec:
  replicas: 3
  selector:
    matchLabels:
      app: postgresql-read-replica
  template:
    metadata:
      labels:
        app: postgresql-read-replica
        component: database-optimization
    spec:
      securityContext:
        fsGroup: 999
        runAsUser: 999
        runAsGroup: 999
      containers:
      - name: postgresql
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgresql
        env:
        - name: POSTGRES_DB
          value: "codai_primary"
        - name: POSTGRES_USER
          value: "codai_replica"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secrets
              key: replica-password
        - name: POSTGRES_PRIMARY_HOST
          value: "postgresql-primary.codai-production.svc.cluster.local"
        - name: POSTGRES_PRIMARY_PORT
          value: "5432"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        command:
        - postgres
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        volumeMounts:
        - name: postgresql-config
          mountPath: /etc/postgresql
        - name: postgresql-data
          mountPath: /var/lib/postgresql/data
        - name: replica-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - localhost
            - -U
            - codai_replica
            - -d
            - codai_primary
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - localhost
            - -U
            - codai_replica
            - -d
            - codai_primary
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: postgresql-config
        configMap:
          name: postgresql-performance-config
      - name: replica-init
        configMap:
          name: postgresql-replica-init
      - name: postgresql-data
        emptyDir: {}

