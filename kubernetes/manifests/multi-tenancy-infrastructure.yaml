# Multi-Tenancy Infrastructure for Essential CodAI Services
# Version: 1.0
apiVersion: v1
kind: ConfigMap
metadata:
  name: multi-tenant-config
  namespace: codai-production
data:
  tenancy.json: |
    {
      "tenantIsolation": {
        "strategy": "database-per-tenant",
        "fallbackStrategy": "schema-per-tenant",
        "enableRowLevelSecurity": true,
        "tenantContextInjection": true
      },
      "resourceQuotas": {
        "cpu": "2000m",
        "memory": "4Gi",
        "storage": "100Gi",
        "maxConnections": 100,
        "maxApiCalls": 10000
      },
      "tenantProvisioning": {
        "autoProvision": true,
        "provisioningTimeout": "300s",
        "databaseTemplate": "tenant-db-template",
        "schemaTemplate": "tenant-schema-template"
      },
      "tenantRouting": {
        "routingStrategy": "subdomain",
        "customDomainSupport": true,
        "sslCertificateManagement": "automatic"
      }
    }

  database.json: |
    {
      "masterDatabase": {
        "host": "postgresql-master.codai-production.svc.cluster.local",
        "port": 5432,
        "database": "codai_master",
        "maxConnections": 200
      },
      "tenantDatabases": {
        "templateDatabase": "template_tenant_db",
        "connectionPooling": {
          "enabled": true,
          "maxPoolSize": 10,
          "minPoolSize": 2,
          "idleTimeout": "300s"
        },
        "encryption": {
          "enabled": true,
          "keyRotation": "monthly",
          "algorithm": "AES-256-GCM"
        }
      }
    }

---
# Tenant Management Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codai-tenant-manager
  namespace: codai-production
  labels:
    app: codai-tenant-manager
    component: multi-tenancy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: codai-tenant-manager
  template:
    metadata:
      labels:
        app: codai-tenant-manager
        component: multi-tenancy
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: codai-tenant-manager
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
      - name: tenant-manager
        image: codai/tenant-manager:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: codai-database-secrets
              key: master-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-event-secrets
              key: url
        - name: TENANT_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: tenant-secrets
              key: encryption-key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: tenant-secrets
              key: jwt-secret
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: tenant-templates
          mountPath: /app/templates
          readOnly: true
        resources:
          requests:
            cpu: 300m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: multi-tenant-config
      - name: tenant-templates
        configMap:
          name: tenant-templates

---
apiVersion: v1
kind: Service
metadata:
  name: codai-tenant-manager
  namespace: codai-production
  labels:
    app: codai-tenant-manager
    component: multi-tenancy
spec:
  ports:
  - port: 3000
    targetPort: 3000
    name: http
    protocol: TCP
  selector:
    app: codai-tenant-manager

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codai-tenant-manager
  namespace: codai-production
  labels:
    app: codai-tenant-manager

---
# Tenant Templates ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-templates
  namespace: codai-production
data:
  tenant-db-schema.sql: |
    -- Tenant Database Schema Template
    CREATE SCHEMA IF NOT EXISTS tenant_data;
    
    -- Users table with tenant isolation
    CREATE TABLE tenant_data.users (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id UUID NOT NULL,
        email VARCHAR(255) UNIQUE NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        first_name VARCHAR(100),
        last_name VARCHAR(100),
        role VARCHAR(50) DEFAULT 'user',
        is_active BOOLEAN DEFAULT true,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        metadata JSONB DEFAULT '{}'
    );
    
    -- Row Level Security
    ALTER TABLE tenant_data.users ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_users_policy ON tenant_data.users
        FOR ALL USING (tenant_id = current_setting('app.current_tenant')::uuid);
    
    -- Organizations table
    CREATE TABLE tenant_data.organizations (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id UUID NOT NULL,
        name VARCHAR(255) NOT NULL,
        description TEXT,
        settings JSONB DEFAULT '{}',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    ALTER TABLE tenant_data.organizations ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_orgs_policy ON tenant_data.organizations
        FOR ALL USING (tenant_id = current_setting('app.current_tenant')::uuid);
    
    -- Projects table
    CREATE TABLE tenant_data.projects (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id UUID NOT NULL,
        organization_id UUID REFERENCES tenant_data.organizations(id),
        name VARCHAR(255) NOT NULL,
        description TEXT,
        status VARCHAR(50) DEFAULT 'active',
        settings JSONB DEFAULT '{}',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    ALTER TABLE tenant_data.projects ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_projects_policy ON tenant_data.projects
        FOR ALL USING (tenant_id = current_setting('app.current_tenant')::uuid);
    
    -- Audit log table
    CREATE TABLE tenant_data.audit_logs (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id UUID NOT NULL,
        user_id UUID,
        event_type VARCHAR(100) NOT NULL,
        event_category VARCHAR(50) NOT NULL,
        resource_type VARCHAR(100),
        resource_id UUID,
        action VARCHAR(50) NOT NULL,
        result VARCHAR(20) NOT NULL,
        ip_address INET,
        user_agent TEXT,
        metadata JSONB DEFAULT '{}',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );
    
    ALTER TABLE tenant_data.audit_logs ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_audit_policy ON tenant_data.audit_logs
        FOR ALL USING (tenant_id = current_setting('app.current_tenant')::uuid);
    
    -- Indexes for performance
    CREATE INDEX idx_users_tenant_id ON tenant_data.users(tenant_id);
    CREATE INDEX idx_users_email ON tenant_data.users(email);
    CREATE INDEX idx_organizations_tenant_id ON tenant_data.organizations(tenant_id);
    CREATE INDEX idx_projects_tenant_id ON tenant_data.projects(tenant_id);
    CREATE INDEX idx_projects_org_id ON tenant_data.projects(organization_id);
    CREATE INDEX idx_audit_logs_tenant_id ON tenant_data.audit_logs(tenant_id);
    CREATE INDEX idx_audit_logs_created_at ON tenant_data.audit_logs(created_at);

  tenant-rbac-schema.sql: |
    -- RBAC Schema for Tenant
    CREATE SCHEMA IF NOT EXISTS tenant_rbac;
    
    -- Roles table
    CREATE TABLE tenant_rbac.roles (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id UUID NOT NULL,
        name VARCHAR(100) NOT NULL,
        description TEXT,
        is_system BOOLEAN DEFAULT false,
        permissions JSONB DEFAULT '[]',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(tenant_id, name)
    );
    
    ALTER TABLE tenant_rbac.roles ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_roles_policy ON tenant_rbac.roles
        FOR ALL USING (tenant_id = current_setting('app.current_tenant')::uuid);
    
    -- User roles assignment
    CREATE TABLE tenant_rbac.user_roles (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id UUID NOT NULL,
        user_id UUID NOT NULL,
        role_id UUID REFERENCES tenant_rbac.roles(id) ON DELETE CASCADE,
        assigned_by UUID,
        assigned_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        expires_at TIMESTAMP,
        is_active BOOLEAN DEFAULT true
    );
    
    ALTER TABLE tenant_rbac.user_roles ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_user_roles_policy ON tenant_rbac.user_roles
        FOR ALL USING (tenant_id = current_setting('app.current_tenant')::uuid);
    
    -- Permissions table
    CREATE TABLE tenant_rbac.permissions (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id UUID NOT NULL,
        resource VARCHAR(100) NOT NULL,
        action VARCHAR(50) NOT NULL,
        conditions JSONB DEFAULT '{}',
        effect VARCHAR(10) DEFAULT 'allow' CHECK (effect IN ('allow', 'deny')),
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(tenant_id, resource, action)
    );
    
    ALTER TABLE tenant_rbac.permissions ENABLE ROW LEVEL SECURITY;
    CREATE POLICY tenant_permissions_policy ON tenant_rbac.permissions
        FOR ALL USING (tenant_id = current_setting('app.current_tenant')::uuid);
    
    -- Default system roles
    INSERT INTO tenant_rbac.roles (tenant_id, name, description, is_system, permissions) VALUES
    (current_setting('app.current_tenant')::uuid, 'admin', 'Tenant Administrator', true, 
     '["*:*", "users:*", "roles:*", "projects:*", "organizations:*"]'),
    (current_setting('app.current_tenant')::uuid, 'manager', 'Manager Role', true,
     '["projects:read", "projects:write", "users:read", "organizations:read"]'),
    (current_setting('app.current_tenant')::uuid, 'user', 'Standard User', true,
     '["projects:read", "users:read"]'),
    (current_setting('app.current_tenant')::uuid, 'readonly', 'Read Only User', true,
     '["*:read"]');

