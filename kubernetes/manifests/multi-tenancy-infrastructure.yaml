# Tenant Context Middleware Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codai-tenant-middleware
  namespace: codai-production
  labels:
    app: codai-tenant-middleware
    component: multi-tenancy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codai-tenant-middleware
  template:
    metadata:
      labels:
        app: codai-tenant-middleware
        component: multi-tenancy
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: codai-tenant-middleware
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
      - name: tenant-middleware
        image: codai/tenant-middleware:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8080"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-event-secrets
              key: url
        - name: TENANT_CACHE_TTL
          value: "300"
        - name: TENANT_RESOLUTION_TIMEOUT
          value: "5000"
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: multi-tenant-config

