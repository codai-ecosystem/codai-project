    component: multi-tenancy
spec:
  ports:
  - port: 8080
    targetPort: 8080
    name: http
    protocol: TCP
  selector:
    app: codai-tenant-middleware

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codai-tenant-middleware
  namespace: codai-production
  labels:
    app: codai-tenant-middleware

---
# PostgreSQL Master Database for Tenant Management
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql-master
  namespace: codai-production
  labels:
    app: postgresql-master
    component: database
spec:
  serviceName: postgresql-master-headless
  replicas: 1
  selector:
    matchLabels:
      app: postgresql-master
  template:
    metadata:
      labels:
        app: postgresql-master
        component: database
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: postgresql
        image: postgres:15.4-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: "codai_master"
        - name: POSTGRES_USER
          value: "codai_admin"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: codai-database-secrets
              key: password
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: postgres-config
          mountPath: /etc/postgresql
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - codai_admin
            - -d
            - codai_master
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - codai_admin
            - -d
            - codai_master
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: postgres-config
        configMap:
          name: postgresql-config
      - name: init-scripts
        configMap:
          name: postgresql-init-scripts
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 50Gi

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-master-headless
  namespace: codai-production
  labels:
    app: postgresql-master
spec:
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  clusterIP: None
  selector:
    app: postgresql-master

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-master
  namespace: codai-production
  labels:
    app: postgresql-master
    component: database
spec:
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
  selector:
    app: postgresql-master

---
# PostgreSQL Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-config
  namespace: codai-production
data:
  postgresql.conf: |
    # PostgreSQL Configuration for Multi-Tenant Setup
    listen_addresses = '*'
    port = 5432
    max_connections = 200
    shared_buffers = 1GB
    effective_cache_size = 3GB
    work_mem = 16MB
    maintenance_work_mem = 256MB
    
    # Write Ahead Log
    wal_level = replica
    max_wal_size = 2GB
    min_wal_size = 1GB
    checkpoint_completion_target = 0.9
    
    # Row Level Security
    row_security = on
    
    # Logging
    log_destination = 'stderr'
    logging_collector = on
    log_directory = '/var/log/postgresql'
    log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
    log_statement = 'all'
    log_min_duration_statement = 1000
    
    # Security
    ssl = off
    password_encryption = scram-sha-256

  pg_hba.conf: |
    # PostgreSQL Client Authentication Configuration
    local   all             all                                     trust
    host    all             all             127.0.0.1/32            scram-sha-256
    host    all             all             ::1/128                 scram-sha-256
    host    all             all             10.0.0.0/8              scram-sha-256
    host    all             all             172.16.0.0/12           scram-sha-256
    host    all             all             192.168.0.0/16          scram-sha-256

---
# PostgreSQL Initialization Scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init-scripts
  namespace: codai-production
data:
  01-extensions.sql: |
    -- Create required extensions
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";
    CREATE EXTENSION IF NOT EXISTS "citext";
    
  02-master-schema.sql: |
    -- Master tenant management schema
    CREATE SCHEMA IF NOT EXISTS tenant_master;
    
    -- Tenants registry
    CREATE TABLE tenant_master.tenants (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        name VARCHAR(255) NOT NULL UNIQUE,
        subdomain VARCHAR(100) NOT NULL UNIQUE,
        custom_domain VARCHAR(255),
        status VARCHAR(20) DEFAULT 'active' CHECK (status IN ('active', 'suspended', 'deleted')),
        database_name VARCHAR(100) NOT NULL,
        database_host VARCHAR(255) NOT NULL DEFAULT 'postgresql-master.codai-production.svc.cluster.local',
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        metadata JSONB DEFAULT '{}'
    );
    
    -- Tenant configurations
    CREATE TABLE tenant_master.tenant_configs (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id UUID REFERENCES tenant_master.tenants(id) ON DELETE CASCADE,
        config_key VARCHAR(100) NOT NULL,
        config_value JSONB NOT NULL,
        created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        UNIQUE(tenant_id, config_key)
    );
    
    -- Tenant resource usage tracking
    CREATE TABLE tenant_master.tenant_usage (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        tenant_id UUID REFERENCES tenant_master.tenants(id) ON DELETE CASCADE,
        metric_name VARCHAR(100) NOT NULL,
        metric_value NUMERIC NOT NULL,
        recorded_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP,
        metadata JSONB DEFAULT '{}'
    );
    
    -- Indexes
    CREATE INDEX idx_tenants_subdomain ON tenant_master.tenants(subdomain);
    CREATE INDEX idx_tenants_custom_domain ON tenant_master.tenants(custom_domain);
    CREATE INDEX idx_tenant_configs_tenant_id ON tenant_master.tenant_configs(tenant_id);
    CREATE INDEX idx_tenant_usage_tenant_id ON tenant_master.tenant_usage(tenant_id);
    CREATE INDEX idx_tenant_usage_recorded_at ON tenant_master.tenant_usage(recorded_at);

---
# Horizontal Pod Autoscaler for Tenant Services
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codai-tenant-manager-hpa
  namespace: codai-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codai-tenant-manager
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codai-tenant-middleware-hpa
  namespace: codai-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codai-tenant-middleware
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80