# Redis Event Streaming Configuration for Essential CodAI Services
# Version: 1.0
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-event-config
  namespace: codai-production
data:
  redis.conf: |
    # Redis Event Streaming Configuration
    maxmemory 2gb
    maxmemory-policy allkeys-lru
    
    # Persistence configuration
    save 900 1
    save 300 10
    save 60 10000
    
    # Network configuration
    bind 0.0.0.0
    port 6379
    timeout 300
    tcp-keepalive 300
    
    # Security
    requirepass codai-redis-password
    
    # Logging
    loglevel notice
    logfile /var/log/redis/redis.log
    
    # Stream configuration
    stream-node-max-bytes 4096
    stream-node-max-entries 100

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-event-cluster
  namespace: codai-production
  labels:
    app: redis-event-cluster
    component: event-streaming
spec:
  serviceName: redis-event-cluster-headless
  replicas: 3
  selector:
    matchLabels:
      app: redis-event-cluster
  template:
    metadata:
      labels:
        app: redis-event-cluster
        component: event-streaming
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: redis
        image: redis:7.2-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - /etc/redis/redis.conf
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-event-secrets
              key: password
        volumeMounts:
        - name: config
          mountPath: /etc/redis
        - name: data
          mountPath: /data
        - name: logs
          mountPath: /var/log/redis
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          exec:
            command:
            - redis-cli
            - --no-auth-warning
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - --no-auth-warning
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: redis-event-config
      - name: logs
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: redis-event-cluster-headless
  namespace: codai-production
  labels:
    app: redis-event-cluster
spec:
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  clusterIP: None
  selector:
    app: redis-event-cluster

---
apiVersion: v1
kind: Service
metadata:
  name: redis-event-cluster
  namespace: codai-production
  labels:
    app: redis-event-cluster
    component: event-streaming
spec:
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app: redis-event-cluster

---
# Redis Event Secrets
apiVersion: v1
kind: Secret
metadata:
  name: redis-event-secrets
  namespace: codai-production
type: Opaque
data:
  password: Y29kYWktcmVkaXMtcGFzc3dvcmQ=  # codai-redis-password

---
# Event Hub Service Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-hub-config
  namespace: codai-production
data:
  config.json: |
    {
      "redis": {
        "host": "redis-event-cluster.codai-production.svc.cluster.local",
        "port": 6379,
        "password": "codai-redis-password",
        "maxRetryAttempts": 3,
        "retryDelayOnFailover": 100
      },
      "streams": {
        "systemEvents": "codai:system:events",
        "businessEvents": "codai:business:events", 
        "integrationEvents": "codai:integration:events",
        "analyticsEvents": "codai:analytics:events"
      },
      "consumerGroups": {
        "auth-service": "auth-consumers",
        "gateway-service": "gateway-consumers",
        "hub-service": "hub-consumers",
        "memorai-mcp": "memorai-consumers",
        "cbd-database": "database-consumers",
        "memorai-frontend": "frontend-consumers"
      },
      "eventSchema": {
        "validation": true,
        "schemaRegistry": "http://schema-registry:8081"
      },
      "monitoring": {
        "metricsEnabled": true,
        "tracingEnabled": true,
        "loggingLevel": "info"
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codai-event-hub
  namespace: codai-production
  labels:
    app: codai-event-hub
    component: event-processing
spec:
  replicas: 3
  selector:
    matchLabels:
      app: codai-event-hub
  template:
    metadata:
      labels:
        app: codai-event-hub
        component: event-processing
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: codai-event-hub
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
      - name: event-hub
        image: codai/event-hub:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        - containerPort: 8080
          name: websocket
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: WEBSOCKET_PORT
          value: "8080"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-event-secrets
              key: password
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: event-hub-config

---
apiVersion: v1
kind: Service
metadata:
  name: codai-event-hub
  namespace: codai-production
  labels:
    app: codai-event-hub
    component: event-processing
spec:
  ports:
  - port: 3000
    targetPort: 3000
    name: http
    protocol: TCP
  - port: 8080
    targetPort: 8080
    name: websocket
    protocol: TCP
  selector:
    app: codai-event-hub

---
# Service Account for Event Hub
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codai-event-hub
  namespace: codai-production
  labels:
    app: codai-event-hub

---
# WebSocket Hub for Real-time Communication
apiVersion: v1
kind: ConfigMap
metadata:
  name: websocket-hub-config
  namespace: codai-production
data:
  config.json: |
    {
      "server": {
        "port": 9090,
        "cors": {
          "origin": ["http://localhost:4006", "https://*.codai.local"],
          "credentials": true
        }
      },
      "redis": {
        "host": "redis-event-cluster.codai-production.svc.cluster.local",
        "port": 6379,
        "password": "codai-redis-password"
      },
      "authentication": {
        "jwtSecret": "codai-websocket-jwt-secret",
        "tokenExpiration": "24h"
      },
      "rooms": {
        "memorai": "memorai-sessions",
        "system": "system-notifications",
        "user": "user-communications"
      },
      "rateLimit": {
        "windowMs": 60000,
        "maxRequests": 100
      }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codai-websocket-hub
  namespace: codai-production
  labels:
    app: codai-websocket-hub
    component: realtime-communication
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codai-websocket-hub
  template:
    metadata:
      labels:
        app: codai-websocket-hub
        component: realtime-communication
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: codai-websocket-hub
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
      - name: websocket-hub
        image: codai/websocket-hub:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9090
          name: websocket
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "9090"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-event-secrets
              key: password
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: 400m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: websocket-hub-config

---
apiVersion: v1
kind: Service
metadata:
  name: codai-websocket-hub
  namespace: codai-production
  labels:
    app: codai-websocket-hub
    component: realtime-communication
spec:
  ports:
  - port: 9090
    targetPort: 9090
    name: websocket
    protocol: TCP
  selector:
    app: codai-websocket-hub

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: codai-websocket-hub
  namespace: codai-production
  labels:
    app: codai-websocket-hub

---
# Horizontal Pod Autoscaler for Event Components
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codai-event-hub-hpa
  namespace: codai-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codai-event-hub
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: codai-websocket-hub-hpa
  namespace: codai-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: codai-websocket-hub
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80