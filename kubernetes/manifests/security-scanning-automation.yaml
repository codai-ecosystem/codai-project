# Vulnerability Scanner - Trivy
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trivy-vulnerability-scan
  namespace: codai-production
  labels:
    app: trivy-scanner
    component: security
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: trivy-scanner
            image: aquasec/trivy:0.47.0
            command:
            - /bin/sh
            - -c
            - |
              set -e
              
              echo "Starting vulnerability scan for CodAI services..."
              
              # Scan container images
              IMAGES=(
                "codai/auth-api:latest"
                "codai/gateway-api:latest"
                "codai/hub-memorai:latest"
                "codai/database-frontend:latest"
                "postgres:15-alpine"
                "redis:7.2-alpine"
                "nginx:1.25-alpine"
                "grafana/grafana:10.0.0"
                "prom/prometheus:v2.45.0"
              )
              
              SCAN_DATE=$(date +%Y%m%d_%H%M%S)
              REPORT_DIR="/reports/${SCAN_DATE}"
              mkdir -p "$REPORT_DIR"
              
              for image in "${IMAGES[@]}"; do
                echo "Scanning image: $image"
                
                # Vulnerability scan
                trivy image --format json --output "${REPORT_DIR}/vuln_${image//\//_}_${SCAN_DATE}.json" "$image"
                
                # Configuration scan
                trivy config --format json --output "${REPORT_DIR}/config_${image//\//_}_${SCAN_DATE}.json" "$image" || true
                
                # Secret scan
                trivy fs --scanners secret --format json --output "${REPORT_DIR}/secrets_${image//\//_}_${SCAN_DATE}.json" "$image" || true
                
                echo "Completed scan for: $image"
              done
              
              # Scan Kubernetes manifests
              echo "Scanning Kubernetes manifests..."
              trivy config --format json --output "${REPORT_DIR}/k8s_manifests_${SCAN_DATE}.json" /manifests/ || true
              
              # Generate summary report
              echo "Generating summary report..."
              python3 /scripts/generate_security_report.py "$REPORT_DIR"
              
              # Upload reports to storage
              az storage blob upload-batch \
                --destination codai-security-reports \
                --source "$REPORT_DIR" \
                --destination-path "vulnerability-scans/${SCAN_DATE}/" \
                --account-name codaisecurityreports \
                --account-key "$AZURE_STORAGE_ACCOUNT_ACCESS_KEY"
              
              echo "Vulnerability scan completed successfully"
            env:
            - name: AZURE_STORAGE_ACCOUNT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: security-credentials
                  key: azure-storage-account-access-key
            volumeMounts:
            - name: reports-storage
              mountPath: /reports
            - name: manifests
              mountPath: /manifests
              readOnly: true
            - name: scripts
              mountPath: /scripts
              readOnly: true
            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
              limits:
                cpu: 4000m
                memory: 8Gi
          volumes:
          - name: reports-storage
            persistentVolumeClaim:
              claimName: security-reports-pvc
          - name: manifests
            configMap:
              name: k8s-manifests
          - name: scripts
            configMap:
              name: security-scripts

---
# Web Application Security Testing - OWASP ZAP
apiVersion: batch/v1
kind: CronJob
metadata:
  name: owasp-zap-security-scan
  namespace: codai-production
  labels:
    app: owasp-zap-scanner
    component: security
spec:
  schedule: "0 4 * * 0"  # Weekly on Sunday at 4 AM
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: zap-scanner
            image: owasp/zap2docker-stable:2.14.0
            command:
            - /bin/bash
            - -c
            - |
              set -e
              
              echo "Starting OWASP ZAP security scan..."
              
              SCAN_DATE=$(date +%Y%m%d_%H%M%S)
              REPORT_DIR="/zap/reports/${SCAN_DATE}"
              mkdir -p "$REPORT_DIR"
              
              # Define target applications
              TARGETS=(
                "https://api.codai.ro"
                "https://app.codai.ro"
                "https://memorai.codai.ro"
                "https://bancai.codai.ro"
                "https://romai.codai.ro"
              )
              
              for target in "${TARGETS[@]}"; do
                echo "Scanning target: $target"
                
                # Passive scan
                zap-baseline.py \
                  -t "$target" \
                  -J "${REPORT_DIR}/passive_$(echo $target | sed 's/https:\/\///g' | sed 's/\./_/g')_${SCAN_DATE}.json" \
                  -r "${REPORT_DIR}/passive_$(echo $target | sed 's/https:\/\///g' | sed 's/\./_/g')_${SCAN_DATE}.html" \
                  -x "${REPORT_DIR}/passive_$(echo $target | sed 's/https:\/\///g' | sed 's/\./_/g')_${SCAN_DATE}.xml" \
                  --hook=/zap/scripts/auth_hook.py || true
                
                # Active scan (more intensive)
                zap-full-scan.py \
                  -t "$target" \
                  -J "${REPORT_DIR}/active_$(echo $target | sed 's/https:\/\///g' | sed 's/\./_/g')_${SCAN_DATE}.json" \
                  -r "${REPORT_DIR}/active_$(echo $target | sed 's/https:\/\///g' | sed 's/\./_/g')_${SCAN_DATE}.html" \
                  -x "${REPORT_DIR}/active_$(echo $target | sed 's/https:\/\///g' | sed 's/\./_/g')_${SCAN_DATE}.xml" \
                  --hook=/zap/scripts/auth_hook.py || true
                
                # API scan
                if [[ "$target" == *"api"* ]]; then
                  zap-api-scan.py \
                    -t "$target/openapi.json" \
                    -J "${REPORT_DIR}/api_$(echo $target | sed 's/https:\/\///g' | sed 's/\./_/g')_${SCAN_DATE}.json" \
                    -r "${REPORT_DIR}/api_$(echo $target | sed 's/https:\/\///g' | sed 's/\./_/g')_${SCAN_DATE}.html" \
                    -x "${REPORT_DIR}/api_$(echo $target | sed 's/https:\/\///g' | sed 's/\./_/g')_${SCAN_DATE}.xml" || true
                fi
                
                echo "Completed scan for: $target"
              done
              
              # Generate consolidated report
              python3 /zap/scripts/consolidate_reports.py "$REPORT_DIR"
              
              # Upload reports to storage
              az storage blob upload-batch \
                --destination codai-security-reports \
                --source "$REPORT_DIR" \
                --destination-path "web-app-scans/${SCAN_DATE}/" \
                --account-name codaisecurityreports \
                --account-key "$AZURE_STORAGE_ACCOUNT_ACCESS_KEY"
              
              echo "OWASP ZAP security scan completed successfully"
            env:
            - name: AZURE_STORAGE_ACCOUNT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: security-credentials
                  key: azure-storage-account-access-key
            volumeMounts:
            - name: reports-storage
              mountPath: /zap/reports
            - name: zap-scripts
              mountPath: /zap/scripts
              readOnly: true
            resources:
              requests:
                cpu: 2000m
                memory: 4Gi
              limits:
                cpu: 8000m
                memory: 16Gi
          volumes:
          - name: reports-storage
            persistentVolumeClaim:
              claimName: security-reports-pvc
          - name: zap-scripts
            configMap:
              name: zap-scripts

---
# Security Dashboard & Reporting
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-dashboard
  namespace: codai-production
  labels:
    app: security-dashboard
    component: security
spec:
  replicas: 2
  selector:
    matchLabels:
      app: security-dashboard
  template:
    metadata:
      labels:
        app: security-dashboard
        component: security
    spec:
      serviceAccountName: security-dashboard
      containers:
      - name: dashboard
        image: codai/security-dashboard:v1.0.0
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: security-credentials
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: security-credentials
              key: redis-url
        - name: AZURE_STORAGE_ACCOUNT_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: security-credentials
              key: azure-storage-account-access-key
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: reports-storage
          mountPath: /app/reports
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: security-scanning-config
      - name: reports-storage
        persistentVolumeClaim:
          claimName: security-reports-pvc

---
# Compliance Monitoring
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-monitor
  namespace: codai-production
  labels:
    app: compliance-monitor
    component: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compliance-monitor
  template:
    metadata:
      labels:
        app: compliance-monitor
        component: security
    spec:
      serviceAccountName: compliance-monitor
      containers:
      - name: monitor
        image: codai/compliance-monitor:v1.0.0
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: COMPLIANCE_FRAMEWORKS
          value: "SOC2,GDPR,HIPAA,PCI-DSS"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: security-credentials
              key: database-url
        - name: AUDIT_LOG_RETENTION
          value: "2555d"  # 7 years
        command:
        - /app/compliance-monitor
        args:
        - --config-file=/etc/config/security-policy.json
        - --log-level=info
        - --metrics-addr=0.0.0.0:8080
        - --audit-enabled=true
        volumeMounts:
        - name: config
          mountPath: /etc/config
        - name: audit-logs
          mountPath: /var/log/audit
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: security-scanning-config
      - name: audit-logs
        persistentVolumeClaim:
          claimName: audit-logs-pvc

