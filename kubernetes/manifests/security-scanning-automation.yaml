# Security Scanning Automation for Essential CodAI Services
# Version: 1.0
# Falco | Trivy | OWASP ZAP | Vulnerability Management | Compliance Monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: security-scanning-config
  namespace: codai-production
data:
  security-policy.json: |
    {
      "security_scanning": {
        "architecture": {
          "runtime_security": {
            "engine": "falco",
            "rule_engine": "custom",
            "threat_detection": "behavioral_analysis",
            "incident_response": "automated",
            "compliance_frameworks": ["SOC2", "GDPR", "HIPAA", "PCI-DSS"]
          },
          "vulnerability_management": {
            "scanner": "trivy",
            "scan_frequency": {
              "containers": "daily",
              "images": "on_build",
              "infrastructure": "weekly",
              "dependencies": "daily"
            },
            "severity_thresholds": {
              "critical": "block_deployment",
              "high": "require_approval",
              "medium": "warn",
              "low": "track"
            }
          },
          "web_application_security": {
            "scanner": "owasp_zap",
            "scan_types": ["active", "passive", "api"],
            "scan_frequency": "on_deployment",
            "owasp_top10_coverage": true
          }
        },
        "automation": {
          "continuous_monitoring": {
            "enabled": true,
            "real_time_alerts": true,
            "threat_intelligence": true,
            "behavioral_analytics": true
          },
          "remediation": {
            "automatic_patching": {
              "enabled": true,
              "severity_threshold": "critical",
              "approval_required": false
            },
            "quarantine": {
              "enabled": true,
              "suspicious_containers": true,
              "malicious_processes": true
            }
          },
          "reporting": {
            "dashboards": true,
            "compliance_reports": true,
            "executive_summaries": true,
            "detailed_findings": true
          }
        },
        "compliance": {
          "frameworks": {
            "soc2_type2": {
              "enabled": true,
              "automated_controls": true,
              "audit_logging": true,
              "evidence_collection": true
            },
            "gdpr": {
              "enabled": true,
              "data_protection_monitoring": true,
              "breach_detection": true,
              "privacy_compliance": true
            },
            "hipaa": {
              "enabled": true,
              "healthcare_compliance": true,
              "phi_protection": true,
              "audit_trails": true
            },
            "pci_dss": {
              "enabled": true,
              "payment_security": true,
              "cardholder_data_protection": true,
              "network_security": true
            }
          },
          "reporting": {
            "automated_compliance_reports": true,
            "real_time_compliance_monitoring": true,
            "compliance_dashboard": true,
            "audit_trail_management": true
          }
        }
      },
      "security_rules": {
        "runtime_security": {
          "process_monitoring": {
            "unauthorized_processes": "block",
            "privilege_escalation": "block",
            "container_breakout": "block",
            "suspicious_network_activity": "alert"
          },
          "file_system_monitoring": {
            "unauthorized_file_access": "alert",
            "configuration_changes": "alert",
            "sensitive_data_access": "block",
            "malware_detection": "block"
          },
          "network_monitoring": {
            "unauthorized_connections": "block",
            "data_exfiltration": "block",
            "port_scanning": "alert",
            "ddos_attacks": "block"
          }
        },
        "vulnerability_management": {
          "image_scanning": {
            "base_image_vulnerabilities": "fail_build",
            "dependency_vulnerabilities": "warn",
            "configuration_issues": "warn",
            "secrets_in_images": "fail_build"
          },
          "runtime_scanning": {
            "active_vulnerabilities": "alert",
            "exposed_services": "alert",
            "misconfigurations": "warn",
            "compliance_violations": "block"
          }
        }
      }
    }

  falco-rules.yaml: |
    # Falco Custom Rules for CodAI Production Environment
    - rule: Unauthorized Process in Container
      desc: Detect unauthorized processes running in containers
      condition: >
        spawned_process and container and
        not proc.name in (node, nginx, postgres, redis, grafana, prometheus) and
        not proc.args contains "npm start" and
        not proc.args contains "node server.js"
      output: >
        Unauthorized process spawned in container
        (user=%user.name container=%container.name process=%proc.cmdline)
      priority: WARNING
      tags: [container, process, security]

    - rule: Container Privilege Escalation
      desc: Detect privilege escalation attempts in containers
      condition: >
        spawned_process and container and
        (proc.name=sudo or proc.name=su or
         proc.args contains "chmod +s" or
         proc.args contains "setuid")
      output: >
        Privilege escalation attempt detected
        (user=%user.name container=%container.name process=%proc.cmdline)
      priority: CRITICAL
      tags: [container, privilege_escalation, security]

    - rule: Sensitive File Access
      desc: Monitor access to sensitive configuration files
      condition: >
        open_read and container and
        (fd.name contains "/etc/passwd" or
         fd.name contains "/etc/shadow" or
         fd.name contains ".env" or
         fd.name contains "credentials" or
         fd.name contains "secrets")
      output: >
        Sensitive file access detected
        (user=%user.name container=%container.name file=%fd.name)
      priority: WARNING
      tags: [file, sensitive, security]

    - rule: Network Port Scanning
      desc: Detect network port scanning activities
      condition: >
        outbound and
        fd.type=socket and
        (fd.sport_range in (1,100) or
         fd.dport_range in (1,100)) and
        not proc.name in (nmap, masscan, zmap)
      output: >
        Potential port scanning detected
        (user=%user.name process=%proc.cmdline connection=%fd.name)
      priority: WARNING
      tags: [network, scanning, security]

    - rule: Container Breakout Attempt
      desc: Detect container escape attempts
      condition: >
        spawned_process and container and
        (proc.args contains "nsenter" or
         proc.args contains "docker" or
         proc.args contains "crictl" or
         proc.args contains "runc")
      output: >
        Container breakout attempt detected
        (user=%user.name container=%container.name process=%proc.cmdline)
      priority: CRITICAL
      tags: [container, escape, security]

---
# Falco Runtime Security
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  namespace: codai-production
  labels:
    app: falco
    component: security
spec:
  selector:
    matchLabels:
      app: falco
  template:
    metadata:
      labels:
        app: falco
        component: security
    spec:
      serviceAccount: falco
      hostNetwork: true
      hostPID: true
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      containers:
      - name: falco
        image: falcosecurity/falco:0.36.0
        args:
        - /usr/bin/falco
        - --cri=/run/containerd/containerd.sock
        - --k8s-api
        - --k8s-api-cert=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        - --k8s-api-token=/var/run/secrets/kubernetes.io/serviceaccount/token
        - --config=/etc/falco/falco.yaml
        env:
        - name: FALCO_HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /host/var/run/docker.sock
          name: docker-socket
          readOnly: true
        - mountPath: /host/run/containerd/containerd.sock
          name: containerd-socket
          readOnly: true
        - mountPath: /host/dev
          name: dev-fs
          readOnly: true
        - mountPath: /host/proc
          name: proc-fs
          readOnly: true
        - mountPath: /host/boot
          name: boot-fs
          readOnly: true
        - mountPath: /host/lib/modules
          name: lib-modules
          readOnly: true
        - mountPath: /host/usr
          name: usr-fs
          readOnly: true
        - mountPath: /host/etc
          name: etc-fs
          readOnly: true
        - mountPath: /etc/falco
          name: falco-config
        - mountPath: /etc/falco/rules.d
          name: falco-rules
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8765
          initialDelaySeconds: 60
          timeoutSeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8765
          initialDelaySeconds: 30
          timeoutSeconds: 5
          periodSeconds: 15
      volumes:
      - name: docker-socket
        hostPath:
          path: /var/run/docker.sock
      - name: containerd-socket
        hostPath:
          path: /run/containerd/containerd.sock
      - name: dev-fs
        hostPath:
          path: /dev
      - name: proc-fs
        hostPath:
          path: /proc
      - name: boot-fs
        hostPath:
          path: /boot
      - name: lib-modules
        hostPath:
          path: /lib/modules
      - name: usr-fs
        hostPath:
          path: /usr
      - name: etc-fs
        hostPath:
          path: /etc
      - name: falco-config
        configMap:
          name: falco-config
      - name: falco-rules
        configMap:
          name: security-scanning-config
          items:
          - key: falco-rules.yaml
            path: custom_rules.yaml

