          value: "image/svg+xml,image/png,image/jpeg,image/webp,image/x-icon"
        volumeMounts:
        - name: temp-storage
          mountPath: /app/temp
        - name: processed-assets
          mountPath: /app/processed
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 800m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 3006
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
