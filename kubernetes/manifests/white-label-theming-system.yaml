      labels:
        app: codai-theme-compiler
        component: enterprise-theming
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: codai-theme-compiler
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
      - name: theme-compiler
        image: codai/theme-compiler:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3007
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3007"
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-event-secrets
              key: url
        - name: S3_BUCKET
          value: "codai-compiled-themes"
        - name: S3_REGION
          value: "us-east-1"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-s3-secrets
              key: access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
