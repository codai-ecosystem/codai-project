---
# White-Label Theming Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codai-white-label-service
  namespace: codai-production
  labels:
    app: codai-white-label-service
    component: enterprise-theming
spec:
  replicas: 3
  selector:
    matchLabels:
      app: codai-white-label-service
  template:
    metadata:
      labels:
        app: codai-white-label-service
        component: enterprise-theming
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: codai-white-label-service
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
      - name: white-label-service
        image: codai/white-label-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3005
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3005"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: codai-database-secrets
              key: theming-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: redis-event-secrets
              key: url
        - name: S3_BUCKET
          value: "codai-themes-assets"
        - name: S3_REGION
          value: "us-east-1"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-s3-secrets
              key: access-key-id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-s3-secrets
              key: secret-access-key
        - name: CDN_BASE_URL
          value: "https://cdn.codai.app"
        - name: MAX_THEME_SIZE
          value: "10MB"
        - name: ENABLE_CUSTOM_CSS
          value: "true"
        - name: ENABLE_THEME_VALIDATION
          value: "true"
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: theme-cache
          mountPath: /app/cache
        - name: temp-uploads
          mountPath: /app/temp
        resources:
          requests:
            cpu: 300m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 3005
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 3005
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: white-label-config
      - name: theme-cache
        emptyDir:
          sizeLimit: 2Gi
      - name: temp-uploads
        emptyDir:
          sizeLimit: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: codai-white-label-service
  namespace: codai-production
  labels:
    app: codai-white-label-service
    component: enterprise-theming
spec:
  ports:
  - port: 3005
    targetPort: 3005
    name: http
    protocol: TCP
  selector:
    app: codai-white-label-service

---
apiVersion: v1
kind: ServiceAccount
metadata:
