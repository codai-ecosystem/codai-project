# AWS S3 Secrets for Asset Storage
apiVersion: v1
kind: Secret
metadata:
  name: aws-s3-secrets
  namespace: codai-production
type: Opaque
data:
  access-key-id: WU9VUl9BV1NfQUNDRVNTX0tFWV9JRA==  # YOUR_AWS_ACCESS_KEY_ID
  secret-access-key: WU9VUl9BV1NfU0VDUkVUX0FDQ0VTU19LRVk=  # YOUR_AWS_SECRET_ACCESS_KEY

---
# Theme Cache Service (Redis)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codai-theme-cache
  namespace: codai-production
  labels:
    app: codai-theme-cache
    component: enterprise-theming
spec:
  replicas: 2
  selector:
    matchLabels:
      app: codai-theme-cache
  template:
    metadata:
      labels:
        app: codai-theme-cache
        component: enterprise-theming
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
      - name: redis
        image: redis:7.2-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - /etc/redis/redis.conf
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-event-secrets
              key: password
        volumeMounts:
        - name: config
          mountPath: /etc/redis
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command:
            - redis-cli
            - --no-auth-warning
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - redis-cli
            - --no-auth-warning
            - -a
            - $(REDIS_PASSWORD)
            - ping
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: theme-cache-config
      - name: data
        emptyDir: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: theme-cache-config
  namespace: codai-production
data:
  redis.conf: |
    # Redis Theme Cache Configuration
    maxmemory 256mb
    maxmemory-policy allkeys-lru
    
    # Network configuration
    bind 0.0.0.0
    port 6379
    timeout 300
    tcp-keepalive 300
    
    # Security
    requirepass codai-theme-cache-password
    
    # Logging
    loglevel notice
    
    # Theme-specific settings
    save 300 10
    appendonly yes
    appendfsync everysec

---
apiVersion: v1
kind: Service
metadata:
  name: codai-theme-cache
  namespace: codai-production
  labels:
    app: codai-theme-cache
    component: enterprise-theming
spec:
  ports:
  - port: 6379
    targetPort: 6379
    name: redis
  selector:
    app: codai-theme-cache

