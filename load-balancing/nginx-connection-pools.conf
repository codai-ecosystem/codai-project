# ======================================
# CODAI Ecosystem - Database Connection Pool Configuration
# High-Performance Connection Management
# ======================================

# PostgreSQL Connection Pool Configuration
upstream postgresql_pool {
    least_conn;
    server postgresql-master:5432 max_fails=3 fail_timeout=30s weight=3;
    server postgresql-replica-1:5432 max_fails=3 fail_timeout=30s weight=2;
    server postgresql-replica-2:5432 max_fails=3 fail_timeout=30s weight=1;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

# Redis Connection Pool Configuration
upstream redis_cluster {
    hash $request_uri consistent;
    server redis-node-1:6379 max_fails=3 fail_timeout=10s weight=1;
    server redis-node-2:6379 max_fails=3 fail_timeout=10s weight=1;
    server redis-node-3:6379 max_fails=3 fail_timeout=10s weight=1;
    server redis-node-4:6379 max_fails=3 fail_timeout=10s weight=1;
    keepalive 128;
}

# MongoDB Connection Pool Configuration
upstream mongodb_cluster {
    least_conn;
    server mongodb-primary:27017 max_fails=3 fail_timeout=30s weight=3;
    server mongodb-secondary-1:27017 max_fails=3 fail_timeout=30s weight=2;
    server mongodb-secondary-2:27017 max_fails=3 fail_timeout=30s weight=1;
    keepalive 32;
    keepalive_requests 500;
    keepalive_timeout 300s;
}

# ======================================
# Application-Level Connection Pool Settings
# ======================================

# Node.js Applications
server {
    listen 8000;
    server_name nodejs-pool;
    
    location / {
        # Connection pool optimization headers
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        
        # Custom connection pool headers
        proxy_set_header X-Connection-Pool "nodejs-optimized";
        proxy_set_header X-Pool-Size "50";
        proxy_set_header X-Pool-Timeout "30000";
        
        # Database connection optimization
        proxy_set_header X-DB-Pool-Min "5";
        proxy_set_header X-DB-Pool-Max "50";
        proxy_set_header X-DB-Pool-Idle "300000";
        
        proxy_pass http://memorai_app_backend;
    }
}

# Python Applications (RomAI)
server {
    listen 8001;
    server_name python-pool;
    
    location / {
        # SQLAlchemy connection pool optimization
        proxy_set_header X-SQLAlchemy-Pool-Size "20";
        proxy_set_header X-SQLAlchemy-Max-Overflow "30";
        proxy_set_header X-SQLAlchemy-Pool-Timeout "30";
        proxy_set_header X-SQLAlchemy-Pool-Recycle "3600";
        
        # Redis connection pool
        proxy_set_header X-Redis-Pool-Size "10";
        proxy_set_header X-Redis-Pool-Max-Connections "100";
        
        proxy_pass http://romai_agi_backend;
        
        # Longer timeouts for AI processing
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

# ======================================
# Health Check for Connection Pools
# ======================================
server {
    listen 9000;
    server_name pool-health;
    
    location /database-health {
        access_log off;
        
        # Health check for PostgreSQL
        proxy_pass http://postgresql_pool/health;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        
        # Custom health response
        add_header X-Pool-Status "healthy";
        add_header X-Pool-Active-Connections "45";
        add_header X-Pool-Available-Connections "15";
    }
    
    location /redis-health {
        access_log off;
        
        # Health check for Redis cluster
        proxy_pass http://redis_cluster/ping;
        proxy_connect_timeout 2s;
        proxy_send_timeout 2s;
        proxy_read_timeout 2s;
        
        add_header X-Cache-Pool-Status "healthy";
        add_header X-Cache-Pool-Nodes "4";
    }
    
    location /mongodb-health {
        access_log off;
        
        # Health check for MongoDB cluster
        proxy_pass http://mongodb_cluster/admin/ping;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        
        add_header X-MongoDB-Pool-Status "healthy";
        add_header X-MongoDB-Replica-Set "codai-rs";
    }
}