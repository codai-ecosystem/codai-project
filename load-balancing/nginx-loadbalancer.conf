# ======================================
# CODAI Ecosystem - Advanced Load Balancing Configuration
# High-Performance Nginx Configuration with Auto-Scaling Support
# ======================================

# Main context configuration
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

# Events block - connection handling
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

# HTTP context
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ======================================
    # Logging Configuration
    # ======================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json_analytics escape=json
    '{'
        '"timestamp": "$time_iso8601",'
        '"remote_addr": "$remote_addr",'
        '"request_method": "$request_method",'
        '"request_uri": "$request_uri",'
        '"status": $status,'
        '"body_bytes_sent": $body_bytes_sent,'
        '"request_time": $request_time,'
        '"upstream_response_time": "$upstream_response_time",'
        '"upstream_connect_time": "$upstream_connect_time",'
        '"upstream_header_time": "$upstream_header_time",'
        '"http_referer": "$http_referer",'
        '"http_user_agent": "$http_user_agent",'
        '"server_name": "$server_name",'
        '"upstream_addr": "$upstream_addr"'
    '}';

    access_log /var/log/nginx/access.log json_analytics;

    # ======================================
    # Performance Optimization
    # ======================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_buffer_size 3m;
    large_client_header_buffers 4 256k;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ======================================
    # Rate Limiting Zones
    # ======================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=300r/m;
    limit_req_zone $binary_remote_addr zone=websocket_limit:10m rate=50r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=10r/m;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # ======================================
    # Upstream Definitions with Auto-Scaling Support
    # ======================================

    # Core Services Upstreams
    upstream cbd_database_backend {
        least_conn;
        server cbd-database-1:4180 max_fails=3 fail_timeout=30s weight=1;
        server cbd-database-2:4180 max_fails=3 fail_timeout=30s weight=1 backup;
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    upstream memorai_mcp_backend {
        ip_hash; # Session persistence for MCP connections
        server memorai-mcp-1:4950 max_fails=3 fail_timeout=30s weight=1;
        server memorai-mcp-2:4950 max_fails=3 fail_timeout=30s weight=1;
        server memorai-mcp-3:4950 max_fails=3 fail_timeout=30s weight=1;
        keepalive 64;
    }

    upstream memorai_app_backend {
        least_conn;
        server memorai-app-1:4006 max_fails=3 fail_timeout=30s weight=3;
        server memorai-app-2:4006 max_fails=3 fail_timeout=30s weight=3;
        server memorai-app-3:4006 max_fails=3 fail_timeout=30s weight=2;
        server memorai-app-4:4006 max_fails=3 fail_timeout=30s weight=1 backup;
        keepalive 128;
    }

    upstream memorai_graphql_backend {
        least_conn;
        server memorai-graphql-1:4500 max_fails=3 fail_timeout=30s weight=2;
        server memorai-graphql-2:4500 max_fails=3 fail_timeout=30s weight=2;
        server memorai-graphql-3:4500 max_fails=3 fail_timeout=30s weight=1;
        keepalive 64;
    }

    upstream romai_agi_backend {
        least_conn; # AI requests need fair distribution
        server romai-agi-1:6101 max_fails=2 fail_timeout=60s weight=3;
        server romai-agi-2:6101 max_fails=2 fail_timeout=60s weight=3;
        server romai-agi-3:6101 max_fails=2 fail_timeout=60s weight=2;
        keepalive 32;
        keepalive_timeout 300s; # Longer timeout for AI processing
    }

    upstream romai_enterprise_backend {
        least_conn;
        server romai-enterprise-1:8001 max_fails=3 fail_timeout=30s weight=2;
        server romai-enterprise-2:8001 max_fails=3 fail_timeout=30s weight=2;
        keepalive 64;
    }

    upstream romai_app_backend {
        round_robin;
        server romai-app-1:3000 max_fails=3 fail_timeout=30s weight=2;
        server romai-app-2:3000 max_fails=3 fail_timeout=30s weight=2;
        server romai-app-3:3000 max_fails=3 fail_timeout=30s weight=1;
        keepalive 96;
    }

    # Application Services Upstreams
    upstream bancai_app_backend {
        least_conn;
        server bancai-app-1:4005 max_fails=3 fail_timeout=30s weight=2;
        server bancai-app-2:4005 max_fails=3 fail_timeout=30s weight=2;
        keepalive 64;
    }

    upstream controlai_dashboard_backend {
        round_robin;
        server controlai-dashboard-1:3001 max_fails=3 fail_timeout=30s weight=1;
        server controlai-dashboard-2:3001 max_fails=3 fail_timeout=30s weight=1;
        keepalive 32;
    }

    upstream hub_app_backend {
        round_robin;
        server hub-app-1:3002 max_fails=3 fail_timeout=30s weight=1;
        server hub-app-2:3002 max_fails=3 fail_timeout=30s weight=1;
        keepalive 32;
    }

    upstream admin_app_backend {
        round_robin;
        server admin-app-1:3003 max_fails=3 fail_timeout=30s weight=1;
        server admin-app-2:3003 max_fails=3 fail_timeout=30s weight=1;
        keepalive 16;
    }

    upstream id_app_backend {
        ip_hash; # Session persistence for auth
        server id-app-1:3004 max_fails=3 fail_timeout=30s weight=2;
        server id-app-2:3004 max_fails=3 fail_timeout=30s weight=2;
        keepalive 32;
    }

    # ======================================
    # SSL Configuration
    # ======================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparam.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ======================================
    # Health Check Configuration
    # ======================================
    server {
        listen 8080;
        server_name localhost;
        
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }

    # ======================================
    # Main Load Balancer Server
    # ======================================
    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        
        server_name codai.ro www.codai.ro *.codai.ro;
        
        # SSL Certificate Configuration
        ssl_certificate /etc/nginx/ssl/codai.crt;
        ssl_certificate_key /etc/nginx/ssl/codai.key;
        
        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Connection limits
        limit_conn conn_limit_per_ip 50;

        # Redirect HTTP to HTTPS
        if ($scheme != "https") {
            return 301 https://$host$request_uri;
        }

        # ======================================
        # Core Services Routes
        # ======================================
        
        # CBD Database Service
        location /api/v1/database/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://cbd_database_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # MemorAI MCP Server
        location /api/v1/mcp/ {
            limit_req zone=api_limit burst=30 nodelay;
            
            proxy_pass http://memorai_mcp_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # MemorAI Application
        location /memorai/ {
            limit_req zone=general_limit burst=50 nodelay;
            
            proxy_pass http://memorai_app_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Caching for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
            }
        }

        # MemorAI GraphQL API
        location /graphql {
            limit_req zone=api_limit burst=25 nodelay;
            
            proxy_pass http://memorai_graphql_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Content-Type application/json;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }

        # RomAI AGI Server (Long timeouts for AI processing)
        location /api/v1/agi/ {
            limit_req zone=api_limit burst=15 nodelay;
            
            proxy_pass http://romai_agi_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # RomAI Enterprise API
        location /api/v1/enterprise/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://romai_enterprise_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }

        # RomAI Application
        location /romai/ {
            limit_req zone=general_limit burst=40 nodelay;
            
            proxy_pass http://romai_app_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ======================================
        # Application Services Routes
        # ======================================

        # BancAI Application
        location /bancai/ {
            limit_req zone=api_limit burst=30 nodelay;
            
            proxy_pass http://bancai_app_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ControlAI Dashboard
        location /controlai/ {
            limit_req zone=general_limit burst=25 nodelay;
            
            proxy_pass http://controlai_dashboard_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Hub Application
        location /hub/ {
            limit_req zone=general_limit burst=25 nodelay;
            
            proxy_pass http://hub_app_backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Admin Application (Restricted access)
        location /admin/ {
            limit_req zone=auth_limit burst=10 nodelay;
            
            # IP whitelist for admin access (adjust as needed)
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            
            proxy_pass http://admin_app_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ID Application (Authentication service)
        location /auth/ {
            limit_req zone=auth_limit burst=15 nodelay;
            
            proxy_pass http://id_app_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # ======================================
        # WebSocket Support
        # ======================================
        location /ws/ {
            limit_req zone=websocket_limit burst=20 nodelay;
            
            # Route to appropriate backend based on path
            proxy_pass http://memorai_app_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 5s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            
            # WebSocket specific headers
            proxy_buffering off;
            proxy_cache off;
        }

        # ======================================
        # File Upload Routes
        # ======================================
        location /upload/ {
            limit_req zone=upload_limit burst=5 nodelay;
            
            client_max_body_size 500M;
            client_body_timeout 300s;
            
            proxy_pass http://memorai_app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            proxy_request_buffering off;
        }

        # ======================================
        # Static Assets and Caching
        # ======================================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 90d;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options nosniff;
            
            # Try to serve from multiple backends
            proxy_pass http://memorai_app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_valid 200 90d;
        }

        # Default route - redirect to MemorAI
        location / {
            limit_req zone=general_limit burst=30 nodelay;
            return 301 https://$host/memorai/;
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # ======================================
    # Monitoring and Metrics Server
    # ======================================
    server {
        listen 9113;
        server_name localhost;
        
        location /metrics {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }

    # Include additional configuration files
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}