# Logstash Pipeline Configuration

input {
  # Beats input for service logs
  beats {
    port => 5044
  }
  
  # TCP input for direct log shipping
  tcp {
    port => 5000
    codec => json_lines
  }
  
  # UDP input for syslog
  udp {
    port => 5000
    codec => json_lines
  }
  
  # HTTP input for webhook logs
  http {
    port => 8080
    codec => json
  }
}

filter {
  # Parse timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
  
  # Add service identification
  if [fields][service] {
    mutate {
      add_field => { "service_name" => "%{[fields][service]}" }
    }
  }
  
  # Parse CODAI service logs
  if [service_name] == "cbd-database" {
    grok {
      match => { 
        "message" => "%{TIMESTAMP_ISO8601:log_timestamp} \[%{LOGLEVEL:level}\] %{GREEDYDATA:log_message}" 
      }
    }
    
    # Extract operation metrics
    if [log_message] =~ /operation/ {
      grok {
        match => { 
          "log_message" => "operation: %{WORD:operation} duration: %{NUMBER:duration:float}ms status: %{WORD:status}" 
        }
      }
    }
  }
  
  # Parse Gateway service logs
  if [service_name] == "gateway-service" {
    grok {
      match => { 
        "message" => "%{IPORHOST:client_ip} \[%{HTTPDATE:request_timestamp}\] \"%{WORD:method} %{URIPATHPARAM:request} HTTP/%{NUMBER:http_version}\" %{NUMBER:response_code:int} %{NUMBER:response_size:int} %{NUMBER:response_time:float}" 
      }
    }
    
    # Categorize response codes
    if [response_code] >= 500 {
      mutate {
        add_field => { "response_category" => "server_error" }
      }
    } else if [response_code] >= 400 {
      mutate {
        add_field => { "response_category" => "client_error" }
      }
    } else if [response_code] >= 300 {
      mutate {
        add_field => { "response_category" => "redirect" }
      }
    } else if [response_code] >= 200 {
      mutate {
        add_field => { "response_category" => "success" }
      }
    }
  }
  
  # Parse MemorAI MCP logs
  if [service_name] == "memorai-mcp" {
    json {
      source => "message"
    }
    
    # Extract memory operation metrics
    if [operation] {
      mutate {
        add_field => { "memory_operation" => "%{operation}" }
      }
    }
  }
  
  # Add geographic information based on IP
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geoip"
    }
  }
  
  # Extract user agent information
  if [user_agent] {
    useragent {
      source => "user_agent"
      target => "ua"
    }
  }
  
  # Add processing timestamp
  mutate {
    add_field => { "processed_at" => "%{@timestamp}" }
  }
  
  # Remove unnecessary fields
  mutate {
    remove_field => [ "host", "agent", "ecs", "input", "log" ]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "codai-logs-%{+YYYY.MM.dd}"
    template_name => "codai-template"
    template => "/usr/share/logstash/templates/codai-template.json"
    template_overwrite => true
  }
  
  # Debug output (remove in production)
  stdout {
    codec => rubydebug
  }
  
  # Send critical errors to dead letter queue
  if [level] == "ERROR" or [level] == "FATAL" {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "codai-errors-%{+YYYY.MM.dd}"
    }
  }
  
  # Send performance metrics to separate index
  if [response_time] or [duration] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "codai-metrics-%{+YYYY.MM.dd}"
    }
  }
}
