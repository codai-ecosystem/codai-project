global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    cluster: 'codai-main'

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # Node Exporter - System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # cAdvisor - Container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    scrape_interval: 15s

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 15s

  # PostgreSQL metrics
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # CODAI Production API Services
  - job_name: 'codai-api'
    static_configs:
      - targets: 
        - 'api.codai.ro:443'
        - 'gateway.codai.ro:443'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scheme: https
    tls_config:
      insecure_skip_verify: false

  # CODAI Production Frontend Applications
  - job_name: 'codai-frontend'
    static_configs:
      - targets:
        - 'memorai.codai.ro:443'
        - 'admin.codai.ro:443'
        - 'hub.codai.ro:443'
        - 'control.codai.ro:443'
        - 'romai.codai.ro:443'
        - 'bancai.codai.ro:443'
        - 'id.codai.ro:443'
        - 'apps.codai.ro:443'
    metrics_path: '/api/metrics'
    scrape_interval: 30s
    scheme: https
    tls_config:
      insecure_skip_verify: false

  # Application Health Checks
  - job_name: 'health-checks'
    static_configs:
      - targets:
        - 'api.codai.ro:443'
        - 'gateway.codai.ro:443'
    metrics_path: '/health'
    scrape_interval: 30s
    scheme: https
    tls_config:
      insecure_skip_verify: false

  # Blackbox Exporter - External monitoring
  - job_name: 'blackbox'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - https://codai.ro
        - https://memorai.codai.ro
        - https://admin.codai.ro
        - https://hub.codai.ro
        - https://control.codai.ro
        - https://romai.codai.ro
        - https://bancai.codai.ro
        - https://id.codai.ro
        - https://apps.codai.ro
        - https://api.codai.ro/health
        - https://gateway.codai.ro/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # SSL Certificate monitoring
  - job_name: 'ssl-expiry'
    metrics_path: /probe
    params:
      module: [ssl_expiry]
    static_configs:
      - targets:
        - codai.ro:443
        - memorai.codai.ro:443
        - admin.codai.ro:443
        - hub.codai.ro:443
        - control.codai.ro:443
        - romai.codai.ro:443
        - bancai.codai.ro:443
        - id.codai.ro:443
        - apps.codai.ro:443
        - api.codai.ro:443
        - gateway.codai.ro:443
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
    scrape_interval: 60s

