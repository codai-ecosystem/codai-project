# ======================================
# CODAI Ecosystem - Production Nginx Configuration
# ======================================
# Load balancing, SSL termination, and security headers for production

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    # ======================================
    # Basic Configuration
    # ======================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /var/log/nginx/access.log main;
    
    # ======================================
    # Performance Optimization
    # ======================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;
    
    # Client settings
    client_max_body_size 50M;
    client_body_buffer_size 1m;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 8k;
    
    # ======================================
    # Security Headers (Global)
    # ======================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data: https:; connect-src 'self' wss:; media-src 'self'; object-src 'none'; child-src 'none'; worker-src 'self'; frame-ancestors 'self';" always;
    
    # ======================================
    # Rate Limiting
    # ======================================
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=50r/s;
    
    # ======================================
    # Upstream Backend Services
    # ======================================
    upstream memorai_app {
        least_conn;
        server memorai-app:4006 weight=3 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream romai_app {
        least_conn;
        server romai-app:3000 weight=3 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream bancai_app {
        least_conn;
        server bancai-app:4005 weight=3 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream controlai_dashboard {
        least_conn;
        server controlai-dashboard:3001 weight=3 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream hub_app {
        least_conn;
        server hub-app:3002 weight=3 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream admin_app {
        least_conn;
        server admin-app:3003 weight=3 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    upstream id_app {
        least_conn;
        server id-app:3004 weight=3 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # ======================================
    # Main Hub Application (Default)
    # ======================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        # Main Hub Application
        location / {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://hub_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300;
            proxy_connect_timeout 60;
            proxy_send_timeout 300;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy";
        }
    }
}