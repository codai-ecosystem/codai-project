events {
    worker_connections 1024;
}

http {
    upstream hub_backend {
        server hub-app:4008;
    }

    upstream api_backend {
        server cbd-database:4180;
    }

    upstream gateway_backend {
        server gateway:4003;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;

    # SSL Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Hub Frontend (hub.codai.ro)
    server {
        listen 80;
        server_name hub.codai.ro;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name hub.codai.ro;

        ssl_certificate /etc/nginx/ssl/codai.ro.crt;
        ssl_certificate_key /etc/nginx/ssl/codai.ro.key;

        location / {
            limit_req zone=general burst=20 nodelay;
            proxy_pass http://hub_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # API Backend (api.codai.ro)
    server {
        listen 80;
        server_name api.codai.ro;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.codai.ro;

        ssl_certificate /etc/nginx/ssl/codai.ro.crt;
        ssl_certificate_key /etc/nginx/ssl/codai.ro.key;

        location / {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CORS for API
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
        }
    }

    # Main Domain (codai.ro) - Redirect to hub
    server {
        listen 80;
        server_name codai.ro www.codai.ro;
        return 301 https://hub.codai.ro$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name codai.ro www.codai.ro;

        ssl_certificate /etc/nginx/ssl/codai.ro.crt;
        ssl_certificate_key /etc/nginx/ssl/codai.ro.key;

        return 301 https://hub.codai.ro$request_uri;
    }
}
