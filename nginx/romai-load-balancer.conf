# RomAI AGI Advanced Load Balancer Configuration
# Phase 3E: Load Balancing & Scalability Implementation
#
# High-performance Nginx configuration with load balancing, auto-scaling,
# health checks, and distributed architecture support

# Main configuration context
user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

# Error log configuration
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Event processing
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
    accept_mutex off;
}

# HTTP configuration
http {
    # MIME types and default settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;
    
    # Buffer sizes
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 100m;
    large_client_header_buffers 4 8k;

    # Timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Upstream server groups with health checks and load balancing
    
    # RomAI AGI Application Servers
    upstream romai_agi_backend {
        least_conn;
        
        # Primary instances
        server romai-agi-1:6101 weight=3 max_fails=3 fail_timeout=30s;
        server romai-agi-2:6101 weight=3 max_fails=3 fail_timeout=30s;
        server romai-agi-3:6101 weight=2 max_fails=3 fail_timeout=30s;
        
        # Auto-scaling instances (can be dynamically added)
        server romai-agi-4:6101 weight=1 max_fails=3 fail_timeout=30s backup;
        server romai-agi-5:6101 weight=1 max_fails=3 fail_timeout=30s backup;
        
        # Connection pooling
        keepalive 32;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }
    
    # RomAI Enterprise API Servers
    upstream romai_enterprise_backend {
        ip_hash;  # Session affinity for enterprise users
        
        server romai-enterprise-1:8001 weight=2 max_fails=3 fail_timeout=30s;
        server romai-enterprise-2:8001 weight=2 max_fails=3 fail_timeout=30s;
        
        keepalive 16;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }
    
    # Static Content Servers
    upstream static_content_backend {
        server static-1:80 weight=1 max_fails=2 fail_timeout=10s;
        server static-2:80 weight=1 max_fails=2 fail_timeout=10s;
    }

    # Health check configuration
    map $request_uri $health_check {
        ~^/health$ 1;
        ~^/api/v1/health$ 1;
        default 0;
    }

    # Security headers
    map $sent_http_content_type $security_headers {
        default "nosniff";
    }

    # Main server configuration
    server {
        listen 80;
        listen [::]:80;
        server_name romai.codai.ro localhost;
        
        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; child-src 'none'; worker-src 'none'; frame-ancestors 'none'; form-action 'self'; base-uri 'self';" always;
        
        # Rate limiting
        limit_req zone=api burst=20 nodelay;
        limit_conn conn_limit_per_ip 20;

        # Health check endpoint (bypass rate limiting)
        location = /health {
            access_log off;
            return 200 '{"status":"healthy","service":"romai-load-balancer","timestamp":"$time_iso8601"}';
            add_header Content-Type application/json;
        }

        # RomAI AGI API endpoints
        location ~ ^/api/(v1/)?(math|logic|advanced|reasoning)/ {
            # Enhanced rate limiting for AI endpoints
            limit_req zone=api burst=10 nodelay;
            
            # Proxy configuration
            proxy_pass http://romai_agi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Load-Balancer "romai-nginx";
            
            # Buffering configuration
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Caching for certain endpoints
            proxy_cache_bypass $http_pragma;
            proxy_cache_revalidate on;
            proxy_cache_min_uses 3;
            proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_lock on;
            
            # Health check integration
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 30s;
        }

        # Enterprise API endpoints
        location /enterprise/ {
            limit_req zone=auth burst=5 nodelay;
            
            proxy_pass http://romai_enterprise_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_Set_header X-Forwarded-Proto $scheme;
            
            # Session persistence
            proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Strict";
        }

        # Static content with caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://static_content_backend;
            
            # Aggressive caching for static content
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Static-Cache "HIT";
            
            # Compression
            gzip_static on;
        }

        # WebSocket support for real-time features
        location /ws/ {
            proxy_pass http://romai_agi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket specific settings
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Default location
        location / {
            proxy_pass http://romai_agi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_Set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_cache_bypass $http_upgrade;
        }

        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            return 404 '{"error":"Not Found","status":404,"message":"The requested resource was not found"}';
            add_header Content-Type application/json;
        }
        
        location = /50x.html {
            return 500 '{"error":"Internal Server Error","status":500,"message":"The server encountered an internal error"}';
            add_header Content-Type application/json;
        }
    }

    # SSL/HTTPS server configuration
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name romai.codai.ro;

        # SSL configuration
        ssl_certificate /etc/ssl/certs/romai.codai.ro.crt;
        ssl_certificate_key /etc/ssl/private/romai.codai.ro.key;
        ssl_dhparam /etc/ssl/certs/dhparam.pem;

        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA:!aNULL:!eNULL:!EXPORT:!DES:!RC4:!3DES:!MD5:!PSK;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # HSTS
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Include the same location blocks as HTTP server
        include /etc/nginx/conf.d/romai-locations.conf;
    }

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name romai.codai.ro;
        return 301 https://$server_name$request_uri;
    }

    # Load balancer status page
    server {
        listen 8080;
        server_name localhost;
        
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
        
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"nginx-load-balancer","upstreams":{"romai_agi":"active","romai_enterprise":"active"}}';
            add_header Content-Type application/json;
        }
    }
}