# Static Content Server Configuration for RomAI Load Balancer

server {
    listen 80;
    server_name static-content;
    
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    
    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;
    
    # Static file caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Static-Server "static-content";
        
        # CORS headers for cross-origin requests
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";
        
        try_files $uri =404;
    }
    
    # Health check
    location = /health {
        access_log off;
        return 200 '{"status":"healthy","service":"static-content","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }
    
    # Default location
    location / {
        try_files $uri $uri/ =404;
        
        # Default caching for HTML files
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        return 404 '{"error":"Not Found","status":404,"message":"Static resource not found"}';
        add_header Content-Type application/json;
    }
    
    location = /50x.html {
        return 500 '{"error":"Server Error","status":500,"message":"Static content server error"}';
        add_header Content-Type application/json;
    }
}