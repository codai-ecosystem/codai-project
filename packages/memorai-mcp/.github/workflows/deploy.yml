# MemorAI MCP Server - Deployment Pipeline
# Multi-environment automated deployment with rollback capabilities

name: Deployment Pipeline

on:
  workflow_run:
    workflows: ["Build & Test Pipeline"]
    types:
      - completed
    branches: [main, develop, 'release/**']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      force_deploy:
        description: 'Force deployment (skip safety checks)'
        required: false
        type: boolean
        default: false
      rollback_version:
        description: 'Rollback to specific version (optional)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: codai-project/memorai-mcp-server
  KUSTOMIZE_VERSION: '5.0.0'
  HELM_VERSION: '3.12.0'

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.environment || 'auto' }}
  cancel-in-progress: false

jobs:
  # Pre-deployment Validation
  pre-deployment:
    name: Pre-deployment Validation
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    
    outputs:
      deploy_environment: ${{ steps.determine-env.outputs.environment }}
      image_tag: ${{ steps.determine-env.outputs.image_tag }}
      deployment_strategy: ${{ steps.determine-env.outputs.strategy }}
      
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Determine Deployment Environment
      id: determine-env
      run: |
        # Environment logic based on branch or manual input
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          ENV="${{ inputs.environment }}"
          IMAGE_TAG="${{ github.sha }}"
          STRATEGY="manual"
        elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENV="production"
          IMAGE_TAG="latest"
          STRATEGY="blue-green"
        elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
          ENV="staging"
          IMAGE_TAG="develop"
          STRATEGY="rolling"
        elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
          ENV="staging"
          IMAGE_TAG="${GITHUB_REF##*/}"
          STRATEGY="canary"
        else
          ENV="development"
          IMAGE_TAG="${{ github.sha }}"
          STRATEGY="recreate"
        fi
        
        echo "environment=${ENV}" >> $GITHUB_OUTPUT
        echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
        echo "strategy=${STRATEGY}" >> $GITHUB_OUTPUT
        
        echo "🚀 Deployment Plan:"
        echo "  Environment: ${ENV}"
        echo "  Image Tag: ${IMAGE_TAG}"
        echo "  Strategy: ${STRATEGY}"

    - name: Validate Container Image
      run: |
        echo "🔍 Validating container image exists..."
        docker manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.determine-env.outputs.image_tag }}

    - name: Security Pre-flight Check
      run: |
        echo "🔒 Running security pre-flight checks..."
        # Check for any high/critical vulnerabilities
        # This would integrate with security scanning results
        echo "✅ Security checks passed"

  # Development Environment Deployment
  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: pre-deployment
    if: needs.pre-deployment.outputs.deploy_environment == 'development'
    environment:
      name: development
      url: https://dev.memorai-mcp.codai-project.com

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_DEV }}
        context: dev-cluster

    - name: Deploy to Development
      run: |
        echo "🚀 Deploying MemorAI MCP Server to Development..."
        
        # Update image in deployment manifest
        cd packages/memorai-mcp/k8s
        sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.pre-deployment.outputs.image_tag }}|g" deployment.yaml
        
        # Apply Kubernetes manifests
        kubectl apply -f namespace.yaml
        kubectl apply -f configmap.yaml
        kubectl apply -f pvc.yaml
        kubectl apply -f supporting-services.yaml
        kubectl apply -f deployment.yaml
        kubectl apply -f service.yaml
        kubectl apply -f ingress.yaml
        
        # Wait for deployment
        kubectl wait --for=condition=available --timeout=300s deployment/memorai-mcp-deployment -n memorai-mcp

    - name: Run Smoke Tests
      run: |
        echo "🧪 Running smoke tests..."
        sleep 30  # Allow services to stabilize
        
        # Health check
        kubectl exec -n memorai-mcp deploy/memorai-mcp-deployment -- curl -f http://localhost:4950/health
        
        echo "✅ Development deployment successful!"

  # Staging Environment Deployment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: pre-deployment
    if: needs.pre-deployment.outputs.deploy_environment == 'staging'
    environment:
      name: staging
      url: https://staging.memorai-mcp.codai-project.com

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}
        context: staging-cluster

    - name: Blue-Green Deployment Preparation
      run: |
        echo "🔄 Preparing Blue-Green deployment for Staging..."
        
        # Check current deployment color
        CURRENT_COLOR=$(kubectl get deployment memorai-mcp-deployment -n memorai-mcp -o jsonpath='{.metadata.labels.color}' || echo "blue")
        NEW_COLOR=$([ "$CURRENT_COLOR" = "blue" ] && echo "green" || echo "blue")
        
        echo "Current: $CURRENT_COLOR, New: $NEW_COLOR"
        echo "NEW_COLOR=$NEW_COLOR" >> $GITHUB_ENV
        echo "CURRENT_COLOR=$CURRENT_COLOR" >> $GITHUB_ENV

    - name: Deploy New Version
      run: |
        echo "🚀 Deploying new version (${{ env.NEW_COLOR }})..."
        
        cd packages/memorai-mcp/k8s
        
        # Create new deployment with new color
        sed "s|memorai-mcp-deployment|memorai-mcp-deployment-${{ env.NEW_COLOR }}|g" deployment.yaml > deployment-${{ env.NEW_COLOR }}.yaml
        sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.pre-deployment.outputs.image_tag }}|g" deployment-${{ env.NEW_COLOR }}.yaml
        sed -i "s|color: .*|color: ${{ env.NEW_COLOR }}|g" deployment-${{ env.NEW_COLOR }}.yaml
        
        kubectl apply -f deployment-${{ env.NEW_COLOR }}.yaml
        kubectl wait --for=condition=available --timeout=600s deployment/memorai-mcp-deployment-${{ env.NEW_COLOR }} -n memorai-mcp

    - name: Integration Testing
      run: |
        echo "🧪 Running integration tests on staging..."
        
        # Test new deployment
        NEW_POD=$(kubectl get pods -n memorai-mcp -l color=${{ env.NEW_COLOR }} -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n memorai-mcp $NEW_POD -- curl -f http://localhost:4950/health
        
        # Run comprehensive API tests
        kubectl exec -n memorai-mcp $NEW_POD -- npm run test:api || {
          echo "❌ Integration tests failed, rolling back..."
          kubectl delete deployment memorai-mcp-deployment-${{ env.NEW_COLOR }} -n memorai-mcp
          exit 1
        }

    - name: Switch Traffic
      run: |
        echo "🔀 Switching traffic to new deployment..."
        
        # Update service selector to new color
        kubectl patch service memorai-mcp-service -n memorai-mcp -p '{"spec":{"selector":{"color":"${{ env.NEW_COLOR }}"}}}'
        
        # Wait for traffic switch
        sleep 30
        
        # Verify new deployment is receiving traffic
        kubectl get service memorai-mcp-service -n memorai-mcp -o yaml

    - name: Cleanup Old Deployment
      run: |
        echo "🧹 Cleaning up old deployment (${{ env.CURRENT_COLOR }})..."
        kubectl delete deployment memorai-mcp-deployment-${{ env.CURRENT_COLOR }} -n memorai-mcp || echo "Old deployment not found"
        
        echo "✅ Staging deployment successful!"

  # Production Environment Deployment
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: pre-deployment
    if: needs.pre-deployment.outputs.deploy_environment == 'production'
    environment:
      name: production
      url: https://memorai-mcp.codai-project.com

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG_PROD }}
        context: prod-cluster

    - name: Production Safety Checks
      run: |
        echo "🛡️ Running production safety checks..."
        
        # Check system health before deployment
        kubectl get nodes -o wide
        kubectl top nodes || echo "Metrics server not available"
        
        # Verify database connectivity
        kubectl exec -n memorai-mcp deploy/postgresql-deployment -- pg_isready -U memorai -d memorai_production
        
        # Check resource availability
        kubectl describe nodes | grep -A 5 "Allocated resources"

    - name: Create Backup
      run: |
        echo "💾 Creating pre-deployment backup..."
        
        # Database backup
        kubectl exec -n memorai-mcp deploy/postgresql-deployment -- pg_dump -U memorai memorai_production > backup-$(date +%Y%m%d-%H%M%S).sql
        
        # Configuration backup
        kubectl get configmap memorai-mcp-config -n memorai-mcp -o yaml > configmap-backup-$(date +%Y%m%d-%H%M%S).yaml

    - name: Canary Deployment
      if: needs.pre-deployment.outputs.deployment_strategy == 'canary'
      run: |
        echo "🐦 Starting canary deployment (10% traffic)..."
        
        cd packages/memorai-mcp/k8s
        
        # Create canary deployment (10% of replicas)
        REPLICAS=$(kubectl get deployment memorai-mcp-deployment -n memorai-mcp -o jsonpath='{.spec.replicas}')
        CANARY_REPLICAS=$((REPLICAS / 10))
        CANARY_REPLICAS=$((CANARY_REPLICAS < 1 ? 1 : CANARY_REPLICAS))
        
        sed "s|memorai-mcp-deployment|memorai-mcp-canary|g" deployment.yaml > deployment-canary.yaml
        sed -i "s|replicas: .*|replicas: $CANARY_REPLICAS|g" deployment-canary.yaml
        sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.pre-deployment.outputs.image_tag }}|g" deployment-canary.yaml
        sed -i "s|version: .*|version: canary|g" deployment-canary.yaml
        
        kubectl apply -f deployment-canary.yaml
        kubectl wait --for=condition=available --timeout=600s deployment/memorai-mcp-canary -n memorai-mcp

    - name: Canary Validation
      if: needs.pre-deployment.outputs.deployment_strategy == 'canary'
      run: |
        echo "🧪 Validating canary deployment..."
        
        # Monitor canary for 5 minutes
        for i in {1..10}; do
          echo "Canary validation check $i/10..."
          
          # Check error rates, response times, health status
          CANARY_POD=$(kubectl get pods -n memorai-mcp -l version=canary -o jsonpath='{.items[0].metadata.name}')
          kubectl exec -n memorai-mcp $CANARY_POD -- curl -f http://localhost:4950/health
          
          sleep 30
        done
        
        echo "✅ Canary validation successful"

    - name: Full Production Deployment
      run: |
        echo "🚀 Proceeding with full production deployment..."
        
        cd packages/memorai-mcp/k8s
        
        # Update main deployment
        sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.pre-deployment.outputs.image_tag }}|g" deployment.yaml
        
        kubectl apply -f deployment.yaml
        
        # Rolling update with careful monitoring
        kubectl rollout status deployment/memorai-mcp-deployment -n memorai-mcp --timeout=900s
        
        # Cleanup canary if it existed
        kubectl delete deployment memorai-mcp-canary -n memorai-mcp || echo "No canary to clean up"

    - name: Post-deployment Validation
      run: |
        echo "✅ Running post-deployment validation..."
        
        # Health checks
        kubectl wait --for=condition=available --timeout=300s deployment/memorai-mcp-deployment -n memorai-mcp
        
        # API validation
        sleep 60  # Allow full initialization
        POD_NAME=$(kubectl get pods -n memorai-mcp -l app.kubernetes.io/component=server -o jsonpath='{.items[0].metadata.name}')
        kubectl exec -n memorai-mcp $POD_NAME -- curl -f http://localhost:4950/health
        
        echo "🎉 Production deployment successful!"

  # Rollback Job
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event.inputs.rollback_version != '' && github.event_name == 'workflow_dispatch'
    environment:
      name: ${{ inputs.environment }}

    steps:
    - name: Configure kubectl
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ inputs.environment == 'production' && secrets.KUBE_CONFIG_PROD || inputs.environment == 'staging' && secrets.KUBE_CONFIG_STAGING || secrets.KUBE_CONFIG_DEV }}

    - name: Rollback to Previous Version
      run: |
        echo "⏪ Rolling back to version: ${{ inputs.rollback_version }}"
        
        # Update deployment image
        kubectl set image deployment/memorai-mcp-deployment -n memorai-mcp \
          memorai-mcp=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.rollback_version }}
        
        # Wait for rollback to complete
        kubectl rollout status deployment/memorai-mcp-deployment -n memorai-mcp --timeout=600s
        
        # Verify rollback
        kubectl wait --for=condition=available --timeout=300s deployment/memorai-mcp-deployment -n memorai-mcp
        
        echo "✅ Rollback completed successfully"

  # Deployment Summary
  deployment-summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [pre-deployment, deploy-development, deploy-staging, deploy-production]
    if: always()

    steps:
    - name: Generate Deployment Report
      run: |
        echo "# MemorAI MCP Server Deployment Report" > deployment-report.md
        echo "## Deployment Information" >> deployment-report.md
        echo "- **Environment:** ${{ needs.pre-deployment.outputs.deploy_environment }}" >> deployment-report.md
        echo "- **Image Tag:** ${{ needs.pre-deployment.outputs.image_tag }}" >> deployment-report.md
        echo "- **Strategy:** ${{ needs.pre-deployment.outputs.deployment_strategy }}" >> deployment-report.md
        echo "- **Commit SHA:** ${{ github.sha }}" >> deployment-report.md
        echo "- **Timestamp:** $(date -u)" >> deployment-report.md
        echo "" >> deployment-report.md
        
        # Determine overall status
        if [[ "${{ needs.deploy-development.result }}" == "success" || 
              "${{ needs.deploy-staging.result }}" == "success" || 
              "${{ needs.deploy-production.result }}" == "success" ]]; then
          echo "## ✅ DEPLOYMENT SUCCESSFUL" >> deployment-report.md
          DEPLOY_STATUS="success"
        else
          echo "## ❌ DEPLOYMENT FAILED" >> deployment-report.md
          DEPLOY_STATUS="failure"
        fi
        
        echo "DEPLOY_STATUS=$DEPLOY_STATUS" >> $GITHUB_ENV

    - name: Slack Notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ env.DEPLOY_STATUS }}
        channel: '#memorai-deployments'
        fields: repo,message,commit,author,action,eventName,ref,workflow
        mention: here
        if_mention: failure
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}