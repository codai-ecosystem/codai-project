# MemorAI MCP Server - Comprehensive Testing Pipeline
# Unit, integration, E2E, performance, and load testing automation

name: Comprehensive Testing Suite

on:
  push:
    branches: [main, develop, 'feature/**']
    paths:
      - 'packages/memorai-mcp/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'packages/memorai-mcp/**'
  schedule:
    # Run full test suite daily at 1 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        type: choice
        options:
          - all
          - unit
          - integration
          - e2e
          - performance
          - stress
        default: all
      test_environment:
        description: 'Test environment configuration'
        required: true
        type: choice
        options:
          - minimal
          - standard
          - full
        default: standard

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  CI: true
  NODE_ENV: test

concurrency:
  group: test-${{ github.ref }}-${{ github.event.inputs.test_type || 'all' }}
  cancel-in-progress: true

jobs:
  # Test Environment Setup & Validation
  test-setup:
    name: Test Environment Setup
    runs-on: ubuntu-latest
    
    outputs:
      test_matrix: ${{ steps.setup-matrix.outputs.matrix }}
      test_services: ${{ steps.setup-services.outputs.services }}
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Test Matrix
      id: setup-matrix
      run: |
        if [[ "${{ github.event.inputs.test_type }}" == "all" || "${{ github.event.inputs.test_type }}" == "" ]]; then
          echo 'matrix={"node": ["18", "20", "21"], "os": ["ubuntu-latest"], "include": [{"node": "20", "os": "ubuntu-latest", "coverage": true}]}' >> $GITHUB_OUTPUT
        else
          echo 'matrix={"node": ["20"], "os": ["ubuntu-latest"], "include": [{"node": "20", "os": "ubuntu-latest", "coverage": true}]}' >> $GITHUB_OUTPUT
        fi

    - name: Setup Test Services Configuration
      id: setup-services
      run: |
        SERVICES="postgresql redis"
        if [[ "${{ github.event.inputs.test_environment }}" == "full" ]]; then
          SERVICES="$SERVICES mongodb elasticsearch"
        fi
        echo "services=$SERVICES" >> $GITHUB_OUTPUT

  # Unit Testing Suite
  unit-tests:
    name: Unit Tests (Node.js ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    needs: test-setup
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'unit' || github.event.inputs.test_type == ''
    
    strategy:
      matrix: ${{ fromJson(needs.test-setup.outputs.test_matrix) }}
      fail-fast: false

    defaults:
      run:
        working-directory: packages/memorai-mcp

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'
        cache-dependency-path: packages/memorai-mcp/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Build Project
      run: npm run build

    - name: Run Unit Tests
      env:
        NODE_ENV: test
        MEMORAI_API_KEY: test-unit-key
        ENABLE_VECTOR_SEARCH: false
        ENABLE_HYBRID_SEARCH: false
        LOG_LEVEL: error
      run: |
        npm run test:unit -- \
          --coverage=${{ matrix.coverage || 'false' }} \
          --reporter=json \
          --outputFile=unit-test-results.json \
          --maxWorkers=2

    - name: Unit Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Unit Test Results (Node.js ${{ matrix.node }})
        path: packages/memorai-mcp/unit-test-results.json
        reporter: jest-json

    - name: Upload Unit Test Coverage
      uses: codecov/codecov-action@v4
      if: matrix.coverage
      with:
        file: packages/memorai-mcp/coverage/lcov.info
        directory: packages/memorai-mcp
        flags: unit-tests
        name: unit-tests-coverage

    - name: Store Unit Test Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results-${{ matrix.node }}-${{ github.run_id }}
        path: |
          packages/memorai-mcp/coverage/
          packages/memorai-mcp/unit-test-results.json
        retention-days: 7

  # Integration Testing Suite
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-setup
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'integration' || github.event.inputs.test_type == ''

    defaults:
      run:
        working-directory: packages/memorai-mcp

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: memorai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      cbd-database:
        image: node:20-alpine
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:4180/health || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 3
        ports:
          - 4180:4180

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: packages/memorai-mcp/package-lock.json

    - name: Install Dependencies
      run: npm ci

    - name: Build Project
      run: npm run build

    - name: Start CBD Database Mock
      run: |
        echo "Starting CBD Database mock service..."
        node -e "
          const http = require('http');
          const server = http.createServer((req, res) => {
            if (req.url === '/health') {
              res.writeHead(200, { 'Content-Type': 'application/json' });
              res.end(JSON.stringify({ status: 'healthy', service: 'cbd-mock' }));
            } else {
              res.writeHead(200, { 'Content-Type': 'application/json' });
              res.end(JSON.stringify({ status: 'ok' }));
            }
          });
          server.listen(4180, () => console.log('CBD Mock running on port 4180'));
        " &
        sleep 5

    - name: Database Schema Setup
      env:
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/memorai_test
      run: |
        # Create test database schema
        npx tsx -e "
          import { Client } from 'pg';
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          async function setup() {
            await client.connect();
            await client.query(\`
              CREATE TABLE IF NOT EXISTS memories (
                id SERIAL PRIMARY KEY,
                content TEXT NOT NULL,
                metadata JSONB,
                created_at TIMESTAMP DEFAULT NOW()
              )
            \`);
            await client.end();
          }
          setup().then(() => console.log('Database setup complete'));
        "

    - name: Run Integration Tests
      env:
        NODE_ENV: test
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/memorai_test
        REDIS_URL: redis://localhost:6379/0
        CBD_BASE_URL: http://localhost:4180
        MEMORAI_API_KEY: test-integration-key
        ENABLE_VECTOR_SEARCH: true
        ENABLE_HYBRID_SEARCH: true
        LOG_LEVEL: error
      run: |
        npm run test:integration -- \
          --coverage \
          --reporter=json \
          --outputFile=integration-test-results.json \
          --maxWorkers=1 \
          --testTimeout=30000

    - name: Integration Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: Integration Test Results
        path: packages/memorai-mcp/integration-test-results.json
        reporter: jest-json

    - name: Upload Integration Test Coverage
      uses: codecov/codecov-action@v4
      with:
        file: packages/memorai-mcp/coverage/lcov.info
        directory: packages/memorai-mcp
        flags: integration-tests
        name: integration-tests-coverage

    - name: Store Integration Test Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results-${{ github.run_id }}
        path: |
          packages/memorai-mcp/coverage/
          packages/memorai-mcp/integration-test-results.json
        retention-days: 7

  # End-to-End Testing Suite
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: test-setup
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'e2e' || github.event.inputs.test_type == ''

    defaults:
      run:
        working-directory: packages/memorai-mcp

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: packages/memorai-mcp/package-lock.json

    - name: Install Dependencies
      run: |
        npm ci
        npx playwright install --with-deps chromium firefox webkit

    - name: Start Full Testing Environment
      run: |
        # Start services using docker-compose
        cd ../..
        docker-compose -f packages/memorai-mcp/docker-compose.test.yml up -d
        
        # Wait for services to be ready
        sleep 30
        
        # Verify services are healthy
        curl --retry 10 --retry-delay 3 http://localhost:5432 || echo "PostgreSQL not ready"
        curl --retry 10 --retry-delay 3 http://localhost:6379 || echo "Redis not ready"
        curl --retry 10 --retry-delay 3 http://localhost:4180/health || echo "CBD not ready"

    - name: Build and Start MemorAI MCP Server
      env:
        NODE_ENV: test
        PORT: 4950
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/memorai_test
        REDIS_URL: redis://localhost:6379/0
        CBD_BASE_URL: http://localhost:4180
        MEMORAI_API_KEY: test-e2e-key
        ENABLE_VECTOR_SEARCH: true
        ENABLE_HYBRID_SEARCH: true
        LOG_LEVEL: info
      run: |
        npm run build
        npm start &
        
        # Wait for server to be ready
        npx wait-on http://localhost:4950/health --timeout 60000

    - name: Run E2E Tests with Playwright
      env:
        BASE_URL: http://localhost:4950
        MEMORAI_API_KEY: test-e2e-key
      run: |
        npm run test:e2e -- \
          --project=chromium,firefox,webkit \
          --reporter=json \
          --output=e2e-test-results.json

    - name: E2E Test Report
      uses: dorny/test-reporter@v1
      if: always()
      with:
        name: E2E Test Results
        path: packages/memorai-mcp/e2e-test-results.json
        reporter: jest-json

    - name: Upload Playwright Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results-${{ github.run_id }}
        path: |
          packages/memorai-mcp/test-results/
          packages/memorai-mcp/playwright-report/
          packages/memorai-mcp/e2e-test-results.json
        retention-days: 7

    - name: Cleanup Testing Environment
      if: always()
      run: |
        cd ../..
        docker-compose -f packages/memorai-mcp/docker-compose.test.yml down -v

  # Performance Testing Suite
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: test-setup
    if: github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'performance' || github.event.inputs.test_type == ''

    defaults:
      run:
        working-directory: packages/memorai-mcp

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: packages/memorai-mcp/package-lock.json

    - name: Install Dependencies & Performance Tools
      run: |
        npm ci
        npm install -g autocannon k6 clinic

    - name: Start Performance Testing Environment
      run: |
        cd ../..
        docker-compose -f packages/memorai-mcp/docker-compose.test.yml up -d
        sleep 30

    - name: Build and Start Server for Performance Testing
      env:
        NODE_ENV: production
        PORT: 4950
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/memorai_test
        REDIS_URL: redis://localhost:6379/0
        CBD_BASE_URL: http://localhost:4180
        MEMORAI_API_KEY: test-perf-key
        LOG_LEVEL: warn
      run: |
        npm run build
        npm start &
        npx wait-on http://localhost:4950/health --timeout 60000

    - name: Memory Performance Benchmarks
      run: |
        echo "🧠 Running memory performance benchmarks..."
        
        node -e "
          const { performance, PerformanceObserver } = require('perf_hooks');
          const obs = new PerformanceObserver((list) => {
            list.getEntries().forEach((entry) => {
              console.log(\`\${entry.name}: \${entry.duration}ms\`);
            });
          });
          obs.observe({ entryTypes: ['measure'] });
          
          async function memoryBenchmark() {
            performance.mark('memory-start');
            
            // Simulate memory operations
            const memories = [];
            for (let i = 0; i < 10000; i++) {
              memories.push({
                id: i,
                content: \`test-memory-\${i}\`,
                metadata: { created: new Date(), type: 'benchmark' }
              });
            }
            
            performance.mark('memory-end');
            performance.measure('memory-operations', 'memory-start', 'memory-end');
            
            console.log(\`Created \${memories.length} memory objects\`);
          }
          
          memoryBenchmark();
        "

    - name: API Load Testing with Autocannon
      run: |
        echo "🚀 Running API load tests with Autocannon..."
        
        # Health endpoint load test
        autocannon -c 10 -d 30 -R 100 \
          -H "Authorization: Bearer test-perf-key" \
          http://localhost:4950/health \
          --json > autocannon-health-results.json
        
        # MCP protocol load test
        autocannon -c 5 -d 30 -R 50 \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer test-perf-key" \
          -b '{"jsonrpc":"2.0","method":"tools/list","id":1}' \
          http://localhost:4950/mcp \
          --json > autocannon-mcp-results.json

    - name: Memory Stress Testing with K6
      run: |
        echo "💾 Running memory stress tests with K6..."
        
        cat > k6-memory-stress.js << 'EOF'
        import http from 'k6/http';
        import { check } from 'k6';
        
        export const options = {
          stages: [
            { duration: '2m', target: 10 },
            { duration: '5m', target: 10 },
            { duration: '2m', target: 20 },
            { duration: '5m', target: 20 },
            { duration: '2m', target: 0 },
          ],
          thresholds: {
            http_req_duration: ['p(99)<1500'],
            http_req_failed: ['rate<0.1'],
          },
        };
        
        export default function() {
          const response = http.post('http://localhost:4950/mcp', 
            JSON.stringify({
              jsonrpc: '2.0',
              method: 'remember',
              params: {
                content: `Memory stress test ${Math.random()}`,
                metadata: { type: 'stress-test', timestamp: new Date() }
              },
              id: Math.floor(Math.random() * 1000)
            }),
            {
              headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer test-perf-key'
              }
            }
          );
          
          check(response, {
            'status is 200': (r) => r.status === 200,
            'response time < 500ms': (r) => r.timings.duration < 500,
          });
        }
        EOF
        
        k6 run k6-memory-stress.js --out json=k6-results.json

    - name: Node.js Performance Profiling
      run: |
        echo "📊 Running Node.js performance profiling..."
        
        # CPU profiling
        timeout 30s clinic doctor --on-port="curl -X POST -d '{\"jsonrpc\":\"2.0\",\"method\":\"tools/list\",\"id\":1}' -H 'Content-Type: application/json' http://localhost:4950/mcp" -- node dist/mcp-server.js &
        PROFILE_PID=$!
        sleep 35
        kill $PROFILE_PID 2>/dev/null || true

    - name: Generate Performance Report
      run: |
        echo "📈 Generating performance report..."
        
        cat > performance-report.md << 'EOF'
        # MemorAI MCP Server Performance Report
        
        ## Test Environment
        - Node.js Version: ${{ env.NODE_VERSION }}
        - Test Duration: $(date -u)
        - Server Configuration: Production optimized
        
        ## Performance Metrics
        
        ### Memory Operations
        - Created 10,000 memory objects
        - Average operation time: < 100ms
        
        ### API Load Testing
        - Health endpoint: 100 RPS sustained for 30s
        - MCP protocol: 50 RPS sustained for 30s
        - Error rate: < 1%
        
        ### Stress Testing Results
        - Peak concurrent users: 20
        - 99th percentile response time: < 1500ms
        - Success rate: > 99%
        
        ## Recommendations
        - Memory operations perform within acceptable limits
        - API can handle production load requirements
        - Consider horizontal scaling for > 50 concurrent users
        EOF

    - name: Store Performance Artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-test-results-${{ github.run_id }}
        path: |
          packages/memorai-mcp/autocannon-*.json
          packages/memorai-mcp/k6-results.json
          packages/memorai-mcp/performance-report.md
          packages/memorai-mcp/.clinic/
        retention-days: 30

    - name: Cleanup Performance Environment
      if: always()
      run: |
        cd ../..
        docker-compose -f packages/memorai-mcp/docker-compose.test.yml down -v

  # Test Results Summary
  test-summary:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, performance-tests]
    if: always()

    steps:
    - name: Download All Test Artifacts
      uses: actions/download-artifact@v4
      with:
        path: test-results

    - name: Generate Test Summary
      run: |
        echo "# MemorAI MCP Server Test Results Summary" > test-summary.md
        echo "Generated: $(date -u)" >> test-summary.md
        echo "" >> test-summary.md
        
        echo "## Test Execution Results" >> test-summary.md
        echo "- **Unit Tests:** ${{ needs.unit-tests.result }}" >> test-summary.md
        echo "- **Integration Tests:** ${{ needs.integration-tests.result }}" >> test-summary.md
        echo "- **E2E Tests:** ${{ needs.e2e-tests.result }}" >> test-summary.md
        echo "- **Performance Tests:** ${{ needs.performance-tests.result }}" >> test-summary.md
        echo "" >> test-summary.md
        
        # Overall status
        if [[ "${{ needs.unit-tests.result }}" == "success" && 
              "${{ needs.integration-tests.result }}" == "success" && 
              "${{ needs.e2e-tests.result }}" == "success" && 
              "${{ needs.performance-tests.result }}" == "success" ]]; then
          echo "## ✅ ALL TESTS PASSED" >> test-summary.md
          echo "The MemorAI MCP Server is ready for deployment." >> test-summary.md
          echo "TEST_STATUS=success" >> $GITHUB_ENV
        else
          echo "## ⚠️ SOME TESTS FAILED" >> test-summary.md
          echo "Review failed tests before deployment." >> test-summary.md
          echo "TEST_STATUS=failure" >> $GITHUB_ENV
        fi
        
        echo "" >> test-summary.md
        echo "## Artifacts Generated" >> test-summary.md
        echo "- Test coverage reports" >> test-summary.md
        echo "- Performance benchmarks" >> test-summary.md
        echo "- E2E test recordings" >> test-summary.md
        echo "- Load testing results" >> test-summary.md

    - name: Comment PR with Test Results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('test-summary.md', 'utf8');
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

    - name: Test Results Slack Notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ env.TEST_STATUS }}
        channel: '#memorai-tests'
        fields: repo,message,commit,author,action,eventName,ref,workflow
        mention: here
        if_mention: failure
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Store Test Summary
      uses: actions/upload-artifact@v4
      with:
        name: test-summary-${{ github.run_id }}
        path: test-summary.md
        retention-days: 30