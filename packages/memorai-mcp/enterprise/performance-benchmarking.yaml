  labels:
    app: memorai-mcp
    component: performance
    environment: production
    version: v9.5.0
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: ssd-retain

---
apiVersion: v1
kind: ServiceAccount
metadata:
