# Enterprise SSO Integration Configuration
# MemorAI MCP Server v9.5.0 - Phase 6 Task 11: Enterprise Integration

apiVersion: v1
kind: ConfigMap
metadata:
  name: memorai-sso-config
  namespace: memorai-production
  labels:
    app: memorai-mcp
    component: sso
    environment: production
    version: v9.5.0
data:
  # SAML Configuration
  SAML_ENABLED: "true"
  SAML_ISSUER: "https://sso.enterprise.com/saml/memorai"
  SAML_CALLBACK_URL: "https://api.memorai.com/auth/saml/callback"
  SAML_SIGN_REQUESTS: "true"
  SAML_ENCRYPT_ASSERTIONS: "true"
  SAML_SIGNATURE_ALGORITHM: "http://www.w3.org/2001/04/xmldsig-more#rsa-sha256"
  
  # OAuth2/OIDC Configuration
  OAUTH2_ENABLED: "true"
  OAUTH2_PROVIDER: "https://oauth.enterprise.com"
  OAUTH2_CLIENT_ID: "memorai-enterprise-app"
  OAUTH2_REDIRECT_URI: "https://api.memorai.com/auth/oauth2/callback"
  OAUTH2_SCOPE: "openid profile email groups"
  OAUTH2_RESPONSE_TYPE: "code"
  OAUTH2_GRANT_TYPE: "authorization_code"
  
  # Azure AD Integration
  AZURE_AD_ENABLED: "true"
  AZURE_AD_TENANT_ID: "enterprise-tenant-id"
  AZURE_AD_CLIENT_ID: "memorai-azure-app-id"
  AZURE_AD_AUTHORITY: "https://login.microsoftonline.com/enterprise-tenant-id"
  AZURE_AD_REDIRECT_URI: "https://api.memorai.com/auth/azure/callback"
  
  # LDAP Integration
  LDAP_ENABLED: "true"
  LDAP_URL: "ldaps://ldap.enterprise.com:636"
  LDAP_BASE_DN: "dc=enterprise,dc=com"
  LDAP_USER_DN: "ou=users,dc=enterprise,dc=com"
  LDAP_GROUP_DN: "ou=groups,dc=enterprise,dc=com"
  LDAP_USER_FILTER: "(uid={{username}})"
  LDAP_GROUP_FILTER: "(member={{dn}})"
  LDAP_BIND_DN: "cn=memorai-service,ou=services,dc=enterprise,dc=com"
  
  # Role Mapping Configuration
  ROLE_MAPPING_ENABLED: "true"
  ADMIN_GROUPS: "memorai-admins,enterprise-it-admins"
  USER_GROUPS: "memorai-users,enterprise-employees"
  READONLY_GROUPS: "memorai-viewers,enterprise-guests"
  
  # Session Management
  SESSION_TIMEOUT: "28800"  # 8 hours
  SESSION_RENEWAL_THRESHOLD: "1800"  # 30 minutes
  MAX_CONCURRENT_SESSIONS: "5"
  SESSION_STORAGE: "redis"
  
  # Security Settings
  FORCE_MFA: "true"
  MFA_PROVIDERS: "totp,sms,email"
  PASSWORD_POLICY_ENABLED: "true"
  MIN_PASSWORD_LENGTH: "12"
  REQUIRE_PASSWORD_COMPLEXITY: "true"
  ACCOUNT_LOCKOUT_THRESHOLD: "5"
  ACCOUNT_LOCKOUT_DURATION: "900"  # 15 minutes

---
