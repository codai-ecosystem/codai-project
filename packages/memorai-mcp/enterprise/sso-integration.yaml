---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memorai-sso-service
  namespace: memorai-production
  labels:
    app: memorai-mcp
    component: sso
    environment: production
    version: v9.5.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: memorai-mcp
      component: sso
  template:
    metadata:
      labels:
        app: memorai-mcp
        component: sso
        environment: production
        version: v9.5.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: memorai-sso-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
      containers:
      - name: sso-service
        image: memorai/sso-service:v9.5.0
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: metrics
        envFrom:
        - configMapRef:
            name: memorai-sso-config
        - secretRef:
            name: memorai-sso-secrets
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: temp-storage
          mountPath: /tmp
        - name: certificates
          mountPath: /etc/ssl/certs
          readOnly: true
      volumes:
      - name: temp-storage
        emptyDir: {}
      - name: certificates
        secret:
          secretName: memorai-ssl-certificates

---
apiVersion: v1
kind: Service
metadata:
  name: memorai-sso-service
  namespace: memorai-production
  labels:
    app: memorai-mcp
    component: sso
    environment: production
    version: v9.5.0
spec:
  selector:
    app: memorai-mcp
    component: sso
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 8081
    targetPort: 8081
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: memorai-sso-service-account
  namespace: memorai-production
  labels:
    app: memorai-mcp
    component: sso
    environment: production
    version: v9.5.0

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: memorai-production
  name: memorai-sso-role
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: memorai-sso-rolebinding
  namespace: memorai-production
subjects:
- kind: ServiceAccount
  name: memorai-sso-service-account
  namespace: memorai-production
roleRef:
  kind: Role
  name: memorai-sso-role
  apiGroup: rbac.authorization.k8s.io