    environment: staging
spec:
  type: ClusterIP
  ports:
  - port: 4950
    targetPort: 4950
    protocol: TCP
    name: http
  selector:
    app: memorai-mcp
    environment: staging

---
# Production Service
apiVersion: v1
kind: Service
metadata:
  name: memorai-mcp-service-prod
  namespace: memorai-production
  labels:
    app: memorai-mcp
    environment: production
spec:
  type: ClusterIP
