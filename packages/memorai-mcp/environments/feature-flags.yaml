---
# Feature Flag Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memorai-feature-flag-service
  namespace: memorai-production
  labels:
    app: memorai-feature-flags
    component: feature-flag-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: memorai-feature-flags
      component: feature-flag-service
  template:
    metadata:
      labels:
        app: memorai-feature-flags
        component: feature-flag-service
    spec:
      containers:
      - name: feature-flag-service
        image: memorai/feature-flag-service:v1.0.0
        ports:
        - containerPort: 8080
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: memorai-env-config-production
              key: REDIS_URL
        volumeMounts:
        - name: feature-flags
          mountPath: /app/config/feature-flags.json
          subPath: feature-flags.json
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      volumes:
      - name: feature-flags
        configMap:
          name: memorai-feature-flags-production

---
# Feature Flag Service
apiVersion: v1
kind: Service
metadata:
  name: memorai-feature-flag-service
  namespace: memorai-production
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: memorai-feature-flags
    component: feature-flag-service