---
apiVersion: v1
kind: Secret
metadata:
  name: memorai-secrets-production
  namespace: memorai-production
  labels:
    app: memorai-mcp
    environment: production
    version: v9.5.0
  annotations:
    # Production secrets should be managed via external secret management
    secret-management: "vault"
    vault-path: "memorai/production/secrets"
type: Opaque
stringData:
  # NOTE: In production, these should be managed by HashiCorp Vault
  # or similar secret management system. These are placeholders.
  
  # API Keys (Production) - MANAGED BY VAULT
  MEMORAI_API_KEY: "VAULT:memorai/production/api-key"
  
  # Database Credentials - MANAGED BY VAULT
  CBD_DATABASE_USERNAME: "VAULT:memorai/production/db-username"
  CBD_DATABASE_PASSWORD: "VAULT:memorai/production/db-password"
  
  # Cache Credentials - MANAGED BY VAULT
  REDIS_PASSWORD: "VAULT:memorai/production/redis-password"
  
  # Azure OpenAI Credentials (Production) - MANAGED BY VAULT
  AZURE_OPENAI_API_KEY: "VAULT:memorai/production/azure-openai-key"
  
  # JWT Secrets - MANAGED BY VAULT
  JWT_SECRET_KEY: "VAULT:memorai/production/jwt-secret"
  JWT_REFRESH_SECRET: "VAULT:memorai/production/jwt-refresh-secret"
  
  # Encryption Keys - MANAGED BY VAULT
  ENCRYPTION_KEY: "VAULT:memorai/production/encryption-key"
  API_KEY_ENCRYPTION_KEY: "VAULT:memorai/production/api-key-encryption"
  
  # External Service Credentials - MANAGED BY VAULT
  WEBHOOK_SECRET: "VAULT:memorai/production/webhook-secret"
  
  # Database Connection String - MANAGED BY VAULT
  DATABASE_URL: "VAULT:memorai/production/database-url"

---
# HashiCorp Vault Secret Store Configuration
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: memorai-production
spec:
  provider:
    vault:
      server: "https://vault.memorai.com"
      path: "memorai"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "memorai-production"
          serviceAccountRef:
            name: "memorai-vault-auth"

---
# External Secret for Production Environment
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: memorai-production-secrets
  namespace: memorai-production
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: memorai-secrets-production
    creationPolicy: Owner
  data:
  - secretKey: MEMORAI_API_KEY
    remoteRef:
      key: memorai/production
      property: api-key
  - secretKey: CBD_DATABASE_PASSWORD
    remoteRef:
      key: memorai/production
      property: db-password
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: memorai/production
      property: redis-password
  - secretKey: AZURE_OPENAI_API_KEY
    remoteRef:
      key: memorai/production
      property: azure-openai-key
  - secretKey: JWT_SECRET_KEY
    remoteRef:
      key: memorai/production
      property: jwt-secret
  - secretKey: ENCRYPTION_KEY
    remoteRef:
      key: memorai/production
      property: encryption-key