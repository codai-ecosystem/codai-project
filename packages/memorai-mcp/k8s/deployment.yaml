# MemorAI MCP Server - Main Application Deployment
# Production-ready deployment with enterprise features

apiVersion: apps/v1
kind: Deployment
metadata:
  name: memorai-mcp-server
  namespace: memorai-mcp
  labels:
    app.kubernetes.io/name: memorai-mcp
    app.kubernetes.io/component: server
    app.kubernetes.io/version: "9.5.0"
    app.kubernetes.io/managed-by: kubernetes
  annotations:
    deployment.kubernetes.io/revision: "1"
    description: "MemorAI MCP Server production deployment"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: memorai-mcp
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memorai-mcp
        app.kubernetes.io/component: server
        app.kubernetes.io/version: "9.5.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      
      # Service account for RBAC
      serviceAccountName: memorai-mcp-service-account
      
      # Init containers for setup
      initContainers:
      - name: wait-for-db
        image: busybox:1.35
        command: ['sh', '-c']
        args:
        - |
          until nc -z postgresql-service 5432; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          echo "PostgreSQL is ready!"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
      
      containers:
      - name: memorai-mcp-server
        image: codai/memorai-mcp-server:9.5.0
        imagePullPolicy: Always
        
        # Security context
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # App needs to write to cache/logs
          runAsNonRoot: true
          runAsUser: 1001
          capabilities:
            drop:
            - ALL
            add:
            - NET_BIND_SERVICE
        
        # Ports
        ports:
        - name: http
          containerPort: 4950
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        
        # Environment from ConfigMap and Secret
        envFrom:
        - configMapRef:
            name: memorai-mcp-config
        - secretRef:
            name: memorai-mcp-secrets
        
        # Resource limits and requests
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
            ephemeral-storage: 1Gi
          limits:
            cpu: 4000m
            memory: 4Gi
            ephemeral-storage: 10Gi
        
        # Volume mounts
        volumeMounts:
        - name: memorai-data
          mountPath: /app/data
        - name: memorai-logs
          mountPath: /app/logs
        - name: memorai-cache
          mountPath: /app/.cache
        - name: tmp-volume
          mountPath: /tmp
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 15
          successThreshold: 1
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        
        startupProbe:
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 12
        
        # Graceful shutdown
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
        
        # Environment variables for debugging
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      
      # Volumes
      volumes:
      - name: memorai-data
        persistentVolumeClaim:
          claimName: memorai-data-pvc
      - name: memorai-logs
        persistentVolumeClaim:
          claimName: memorai-logs-pvc
      - name: memorai-cache
        persistentVolumeClaim:
          claimName: memorai-cache-pvc
      - name: tmp-volume
        emptyDir:
          sizeLimit: 1Gi
      
      # Pod scheduling
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: memorai-mcp
                  app.kubernetes.io/component: server
              topologyKey: kubernetes.io/hostname
      
      # Tolerations for dedicated nodes
      tolerations:
      - key: "memorai-mcp"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      
      # Termination grace period
      terminationGracePeriodSeconds: 30
      
      # DNS policy
      dnsPolicy: ClusterFirst
      
      # Restart policy
      restartPolicy: Always