# MemorAI MCP Server - Horizontal Pod Autoscaler
# Automatic scaling based on CPU, memory, and custom metrics

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memorai-mcp-hpa
  namespace: memorai-mcp
  labels:
    app.kubernetes.io/name: memorai-mcp
    app.kubernetes.io/component: autoscaler
    app.kubernetes.io/version: "9.5.0"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memorai-mcp-server
  minReplicas: 3
  maxReplicas: 20
  metrics:
  # CPU utilization
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  
  # Memory utilization
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  
  # Custom metrics (if available)
  - type: Pods
    pods:
      metric:
        name: memory_requests_per_second
      target:
        type: AverageValue
        averageValue: "100"
  
  # Scaling behavior
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max

---
# Vertical Pod Autoscaler (if VPA is available)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: memorai-mcp-vpa
  namespace: memorai-mcp
  labels:
    app.kubernetes.io/name: memorai-mcp
    app.kubernetes.io/component: vpa
    app.kubernetes.io/version: "9.5.0"
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memorai-mcp-server
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: memorai-mcp-server
      minAllowed:
        cpu: 500m
        memory: 1Gi
      maxAllowed:
        cpu: 8000m
        memory: 8Gi
      controlledResources: ["cpu", "memory"]

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: memorai-mcp-pdb
  namespace: memorai-mcp
  labels:
    app.kubernetes.io/name: memorai-mcp
    app.kubernetes.io/component: pdb
    app.kubernetes.io/version: "9.5.0"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: memorai-mcp
      app.kubernetes.io/component: server
  minAvailable: 2