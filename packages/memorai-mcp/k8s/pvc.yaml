# MemorAI MCP Server - Persistent Volume Claims
# Storage resources for production deployment

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memorai-data-pvc
  namespace: memorai-mcp
  labels:
    app.kubernetes.io/name: memorai-mcp
    app.kubernetes.io/component: storage
    app.kubernetes.io/version: "9.5.0"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: fast-ssd  # Use appropriate storage class
  
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memorai-logs-pvc
  namespace: memorai-mcp
  labels:
    app.kubernetes.io/name: memorai-mcp
    app.kubernetes.io/component: logging
    app.kubernetes.io/version: "9.5.0"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
  
---
