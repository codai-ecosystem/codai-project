# MemorAI MCP Server - Service Definitions
# LoadBalancer and ClusterIP services for internal and external access

apiVersion: v1
kind: Service
metadata:
  name: memorai-mcp-service
  namespace: memorai-mcp
  labels:
    app.kubernetes.io/name: memorai-mcp
    app.kubernetes.io/component: service
    app.kubernetes.io/version: "9.5.0"
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    service.beta.kubernetes.io/azure-load-balancer-health-probe-request-path: "/health"
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours
  selector:
    app.kubernetes.io/name: memorai-mcp
    app.kubernetes.io/component: server
  ports:
  - name: http
    port: 4950
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP

---
# Internal service for cluster communication
apiVersion: v1
kind: Service
metadata:
  name: memorai-mcp-internal
  namespace: memorai-mcp
  labels:
    app.kubernetes.io/name: memorai-mcp
    app.kubernetes.io/component: internal-service
    app.kubernetes.io/version: "9.5.0"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: memorai-mcp
    app.kubernetes.io/component: server
  ports:
  - name: http
    port: 4950
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP

---
# Headless service for StatefulSet-like discovery
apiVersion: v1
kind: Service
metadata:
  name: memorai-mcp-headless
  namespace: memorai-mcp
  labels:
    app.kubernetes.io/name: memorai-mcp
    app.kubernetes.io/component: headless-service
    app.kubernetes.io/version: "9.5.0"
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: memorai-mcp
    app.kubernetes.io/component: server
  ports:
  - name: http
    port: 4950
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP

---
