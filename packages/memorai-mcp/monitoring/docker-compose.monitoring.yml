# MemorAI MCP Server - Monitoring Stack Docker Compose
# Complete observability infrastructure for production deployment

version: '3.8'

services:
  # Prometheus - Metrics collection and storage
  prometheus:
    image: prom/prometheus:latest
    container_name: memorai-mcp-prometheus
    hostname: prometheus
    restart: unless-stopped
    
    ports:
      - "9090:9090"
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--log.level=info'
    
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      - prometheus-data:/prometheus
    
    networks:
      - memorai-monitoring
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    labels:
      - "com.memorai.service=prometheus"
      - "com.memorai.environment=production"

  # AlertManager - Alert routing and notifications
  alertmanager:
    image: prom/alertmanager:latest
    container_name: memorai-mcp-alertmanager
    hostname: alertmanager
    restart: unless-stopped
    
    ports:
      - "9093:9093"
    
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
      - '--log.level=info'
    
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    
    networks:
      - memorai-monitoring
    
    depends_on:
      - prometheus
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    labels:
      - "com.memorai.service=alertmanager"
      - "com.memorai.environment=production"

  # Grafana - Visualization and dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: memorai-mcp-grafana
    hostname: grafana
    restart: unless-stopped
    
    ports:
      - "3000:3000"
    
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_USERS_AUTO_ASSIGN_ORG=true
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_LOG_LEVEL=info
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_ALERTING_ENABLED=true
    
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/memorai-mcp.json:ro
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    
    networks:
      - memorai-monitoring
    
    depends_on:
      - prometheus
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    labels:
      - "com.memorai.service=grafana"
      - "com.memorai.environment=production"

  # Node Exporter - System metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: memorai-mcp-node-exporter
    hostname: node-exporter
    restart: unless-stopped
    
    ports:
      - "9100:9100"
    
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile_collector'
    
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - node-exporter-textfiles:/var/lib/node_exporter/textfile_collector
    
    networks:
      - memorai-monitoring
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    labels:
      - "com.memorai.service=node-exporter"
      - "com.memorai.environment=production"

  # cAdvisor - Container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: memorai-mcp-cadvisor
    hostname: cadvisor
    restart: unless-stopped
    
    ports:
      - "8080:8080"
    
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    
    privileged: true
    devices:
      - /dev/kmsg
    
    networks:
      - memorai-monitoring
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    labels:
      - "com.memorai.service=cadvisor"
      - "com.memorai.environment=production"

  # Loki - Log aggregation
  loki:
    image: grafana/loki:latest
    container_name: memorai-mcp-loki
    hostname: loki
    restart: unless-stopped
    
    ports:
      - "3100:3100"
    
    command:
      - -config.file=/etc/loki/local-config.yaml
    
    volumes:
      - loki-data:/loki
      - ./loki-config.yaml:/etc/loki/local-config.yaml:ro
    
    networks:
      - memorai-monitoring
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    labels:
      - "com.memorai.service=loki"
      - "com.memorai.environment=production"

  # Promtail - Log shipper
  promtail:
    image: grafana/promtail:latest
    container_name: memorai-mcp-promtail
    hostname: promtail
    restart: unless-stopped
    
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
    
    command:
      - -config.file=/etc/promtail/config.yaml
    
    networks:
      - memorai-monitoring
    
    depends_on:
      - loki
    
    labels:
      - "com.memorai.service=promtail"
      - "com.memorai.environment=production"

  # Jaeger - Distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: memorai-mcp-jaeger
    hostname: jaeger
    restart: unless-stopped
    
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # HTTP collector
      - "6831:6831/udp"  # UDP collector
      - "6832:6832/udp"  # UDP collector
    
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - QUERY_BASE_PATH=/jaeger
      - SPAN_STORAGE_TYPE=memory
    
    networks:
      - memorai-monitoring
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:16686/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    labels:
      - "com.memorai.service=jaeger"
      - "com.memorai.environment=production"

  # PostgreSQL Exporter - Database metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: memorai-mcp-postgres-exporter
    hostname: postgres-exporter
    restart: unless-stopped
    
    ports:
      - "9187:9187"
    
    environment:
      - DATA_SOURCE_NAME=postgresql://memorai:password@postgresql:5432/memorai_production?sslmode=disable
    
    networks:
      - memorai-monitoring
      - memorai-mcp  # Connect to main app network
    
    depends_on:
      - prometheus
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    labels:
      - "com.memorai.service=postgres-exporter"
      - "com.memorai.environment=production"

  # Redis Exporter - Cache metrics
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: memorai-mcp-redis-exporter
    hostname: redis-exporter
    restart: unless-stopped
    
    ports:
      - "9121:9121"
    
    environment:
      - REDIS_ADDR=redis://redis:6379
    
    networks:
      - memorai-monitoring
      - memorai-mcp  # Connect to main app network
    
    depends_on:
      - prometheus
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9121/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    labels:
      - "com.memorai.service=redis-exporter"
      - "com.memorai.environment=production"

# Networks
networks:
  memorai-monitoring:
    driver: bridge
    name: memorai-monitoring
    labels:
      - "com.memorai.network=monitoring"
  
  memorai-mcp:
    external: true
    name: memorai-mcp

# Volumes
volumes:
  prometheus-data:
    driver: local
    name: memorai-prometheus-data
    labels:
      - "com.memorai.volume=prometheus"
  
  alertmanager-data:
    driver: local
    name: memorai-alertmanager-data
    labels:
      - "com.memorai.volume=alertmanager"
  
  grafana-data:
    driver: local
    name: memorai-grafana-data
    labels:
      - "com.memorai.volume=grafana"
  
  loki-data:
    driver: local
    name: memorai-loki-data
    labels:
      - "com.memorai.volume=loki"
  
  node-exporter-textfiles:
    driver: local
    name: memorai-node-exporter-textfiles
    labels:
      - "com.memorai.volume=node-exporter"