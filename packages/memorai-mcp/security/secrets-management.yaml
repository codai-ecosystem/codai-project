# =================================================================
# MemorAI MCP Server - Secrets Management Configuration
# Version: 1.0.0
# Purpose: Enterprise secrets management with Vault integration
# =================================================================

apiVersion: v1
kind: Secret
metadata:
  name: memorai-mcp-secrets
  namespace: memorai-mcp
  labels:
    app: memorai-mcp-server
    component: security
    secret-type: application
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "memorai-mcp-server"
    vault.hashicorp.com/agent-inject-secret-database: "secret/data/memorai-mcp/database"
    vault.hashicorp.com/agent-inject-secret-jwt: "secret/data/memorai-mcp/jwt"
    vault.hashicorp.com/agent-inject-secret-oauth: "secret/data/memorai-mcp/oauth"
type: Opaque
data:
  # These will be populated by Vault Agent or external secret operators
  # In production, never store actual secrets in Git
  DATABASE_URL: ""
  DATABASE_PASSWORD: ""
  REDIS_PASSWORD: ""
  JWT_SECRET_KEY: ""
  JWT_PRIVATE_KEY: ""
  JWT_PUBLIC_KEY: ""
  ENCRYPTION_KEY: ""
  OAUTH_AZURE_CLIENT_ID: ""
  OAUTH_AZURE_CLIENT_SECRET: ""
  OAUTH_GOOGLE_CLIENT_ID: ""
  OAUTH_GOOGLE_CLIENT_SECRET: ""
  API_KEY_ENCRYPTION_KEY: ""
  AUDIT_SIGNING_KEY: ""
  WEBHOOK_SECRET: ""
  MONITORING_API_KEY: ""

---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: memorai-mcp
  labels:
    app: memorai-mcp-server
    component: security
spec:
  provider:
    vault:
      server: "https://vault.company.com"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "memorai-mcp-server"
          serviceAccountRef:
            name: memorai-mcp-vault-auth

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: memorai-mcp-external-secrets
  namespace: memorai-mcp
  labels:
    app: memorai-mcp-server
    component: security
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: memorai-mcp-secrets
    creationPolicy: Owner
  data:
  - secretKey: DATABASE_URL
    remoteRef:
      key: memorai-mcp/database
      property: url
  - secretKey: DATABASE_PASSWORD
    remoteRef:
      key: memorai-mcp/database
      property: password
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: memorai-mcp/redis
      property: password
  - secretKey: JWT_SECRET_KEY
    remoteRef:
      key: memorai-mcp/jwt
      property: secret_key
  - secretKey: JWT_PRIVATE_KEY
    remoteRef:
      key: memorai-mcp/jwt
      property: private_key
  - secretKey: JWT_PUBLIC_KEY
    remoteRef:
      key: memorai-mcp/jwt
      property: public_key
  - secretKey: ENCRYPTION_KEY
    remoteRef:
      key: memorai-mcp/encryption
      property: master_key
  - secretKey: OAUTH_AZURE_CLIENT_ID
    remoteRef:
      key: memorai-mcp/oauth/azure
      property: client_id
  - secretKey: OAUTH_AZURE_CLIENT_SECRET
    remoteRef:
      key: memorai-mcp/oauth/azure
      property: client_secret
  - secretKey: OAUTH_GOOGLE_CLIENT_ID
    remoteRef:
      key: memorai-mcp/oauth/google
      property: client_id
  - secretKey: OAUTH_GOOGLE_CLIENT_SECRET
    remoteRef:
      key: memorai-mcp/oauth/google
      property: client_secret
  - secretKey: API_KEY_ENCRYPTION_KEY
    remoteRef:
      key: memorai-mcp/api-keys
      property: encryption_key
  - secretKey: AUDIT_SIGNING_KEY
    remoteRef:
      key: memorai-mcp/audit
      property: signing_key
  - secretKey: WEBHOOK_SECRET
    remoteRef:
      key: memorai-mcp/webhooks
      property: secret
  - secretKey: MONITORING_API_KEY
    remoteRef:
      key: memorai-mcp/monitoring
      property: api_key

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: memorai-mcp-vault-auth
  namespace: memorai-mcp
  labels:
    app: memorai-mcp-server
    component: security
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/role: "memorai-mcp-server"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: memorai-mcp-vault-auth
  labels:
    app: memorai-mcp-server
    component: security
rules:
- apiGroups: [""]
  resources: ["serviceaccounts/token"]
  verbs: ["create"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: memorai-mcp-vault-auth
  labels:
    app: memorai-mcp-server
    component: security
subjects:
- kind: ServiceAccount
  name: memorai-mcp-vault-auth
  namespace: memorai-mcp
roleRef:
  kind: ClusterRole
  name: memorai-mcp-vault-auth
  apiGroup: rbac.authorization.k8s.io

---
# Secrets Rotation CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secrets-rotation
  namespace: memorai-mcp
  labels:
    app: memorai-mcp-server
    component: security
    job-type: secrets-rotation
spec:
  schedule: "0 2 1 * *"  # Monthly on the 1st at 2 AM
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: memorai-mcp-server
            component: security
            job-type: secrets-rotation
        spec:
          serviceAccountName: memorai-mcp-vault-auth
          restartPolicy: OnFailure
          containers:
          - name: secrets-rotator
            image: vault:1.15.2
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting secrets rotation process..."
              
              # Authenticate with Vault
              VAULT_TOKEN=$(vault write -field=token auth/kubernetes/login role=memorai-mcp-server jwt=$(/var/run/secrets/kubernetes.io/serviceaccount/token))
              export VAULT_TOKEN
              
              # Rotate JWT keys
              echo "Rotating JWT keys..."
              openssl genrsa -out /tmp/jwt_private.pem 4096
              openssl rsa -in /tmp/jwt_private.pem -pubout -out /tmp/jwt_public.pem
              
              vault kv put secret/memorai-mcp/jwt \
                private_key="$(cat /tmp/jwt_private.pem)" \
                public_key="$(cat /tmp/jwt_public.pem)" \
                secret_key="$(openssl rand -base64 64)"
              
              # Rotate encryption keys
              echo "Rotating encryption keys..."
              vault kv put secret/memorai-mcp/encryption \
                master_key="$(openssl rand -base64 32)"
              
              # Rotate API key encryption
              echo "Rotating API key encryption..."
              vault kv put secret/memorai-mcp/api-keys \
                encryption_key="$(openssl rand -base64 32)"
              
              # Rotate audit signing key
              echo "Rotating audit signing key..."
              vault kv put secret/memorai-mcp/audit \
                signing_key="$(openssl rand -base64 64)"
              
              # Rotate webhook secret
              echo "Rotating webhook secret..."
              vault kv put secret/memorai-mcp/webhooks \
                secret="$(openssl rand -base64 32)"
              
              echo "Secrets rotation completed successfully"
            env:
            - name: VAULT_ADDR
              value: "https://vault.company.com"
            resources:
              requests:
                memory: "64Mi"
                cpu: "100m"
              limits:
                memory: "128Mi"
                cpu: "200m"
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL

---
# Secret Scanning CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: secret-scanning
  namespace: memorai-mcp
  labels:
    app: memorai-mcp-server
    component: security
    job-type: secret-scanning
spec:
  schedule: "0 4 * * *"  # Daily at 4 AM
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: memorai-mcp-server
            component: security
            job-type: secret-scanning
        spec:
          serviceAccountName: memorai-mcp-vault-auth
          restartPolicy: OnFailure
          containers:
          - name: secret-scanner
            image: trufflesecurity/trufflehog:3.67.4
            command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Starting secret scanning process..."
              
              # Scan filesystem for secrets
              trufflehog filesystem /app --only-verified --json > /tmp/secrets-scan.json
              
              # Check if any secrets were found
              if [ -s /tmp/secrets-scan.json ]; then
                echo "WARNING: Secrets detected in filesystem"
                cat /tmp/secrets-scan.json
                
                # Send alert (implement your alerting mechanism)
                # curl -X POST "$WEBHOOK_URL" -d @/tmp/secrets-scan.json
                
                exit 1
              else
                echo "No secrets detected - scan passed"
              fi
            env:
            - name: WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: memorai-mcp-secrets
                  key: WEBHOOK_SECRET
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "200m"
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL