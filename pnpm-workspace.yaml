packages:
  # Core applications (active development)
  - 'apps/*'

  # AIDE ecosystem
  - 'apps/aide/apps/*'
  - 'apps/aide/packages/*'
  - 'packages/aide-*'

  # Memorai subpackages
  - 'apps/memorai/apps/*'
  - 'apps/memorai/packages/*'

  # Shared packages and libraries
  - 'packages/*'
  - 'packages/config-consolidated/*'
  - 'libs/*'
  - '!libs/ai-intelligence'
  - '!libs/service-stability'
  - '!libs/microservice-orchestration'
  - '!libs/advanced-visualizations'
  - '!libs/advanced-analytics'
  - '!libs/advanced-service-integrations'
  - '!libs/project-orchestration'
  - '!libs/code-analysis'

  # Analytics and monitoring
  - 'analytics'
  - 'monitoring'
  - 'security'

  # Archived applications (inactive)
  - 'archive/apps/*'
