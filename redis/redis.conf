# CODAI Essential Services Redis Configuration  
# Date: 2025-08-27
# Version: 1.0.0

# Network settings
port 8020
bind 127.0.0.1
protected-mode yes
timeout 300
tcp-keepalive 300

# Logging
loglevel notice
logfile "e:/GitHub/codai-project/redis/redis.log"
databases 16

# Persistence settings
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename codai-dump.rdb
dir "e:/GitHub/codai-project/redis"

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# AOF settings
appendonly yes
appendfilename "codai-appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Performance
lua-time-limit 5000
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Security  
requirepass codai_redis_2025

# Keyspace notifications for cache invalidation
notify-keyspace-events "Ex"

# Namespace configuration for CODAI services:
# auth:sessions:*          - JWT session storage (TTL: 24h)
# gateway:routes:*         - Dynamic routing configuration (TTL: 1h) 
# hub:health:*            - Service health status (TTL: 5min)
# memorai:contexts:*      - Memory contexts cache (TTL: 2h)
# memorai:search:*        - Search results cache (TTL: 30min)
# bancai:balances:*       - Wallet balance cache (TTL: 5min)
# bancai:transactions:*   - Transaction status cache (TTL: 1h)
# system:metrics:*        - System metrics (TTL: 15min)

# Performance monitoring
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

# Client limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Advanced settings
hz 10
dynamic-hz yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
