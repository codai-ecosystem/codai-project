# RomAI AGI Redis Configuration
port 6379
bind 127.0.0.1
protected-mode yes
timeout 300
tcp-keepalive 300
loglevel notice
logfile "e:/GitHub/codai-project/redis/redis.log"
databases 16
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir "e:/GitHub/codai-project/redis"
maxmemory 256mb
maxmemory-policy allkeys-lru
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
lua-time-limit 5000
